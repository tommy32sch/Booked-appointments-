gar so the brain can adjust breathing and circulation."},{"t":"O₂, CO₂, pH, sugar — chemistry the brain uses to adjust breathing and circulation","ok":true,"why":"Chemoreceptors are chemistry sensors. They monitor O₂, CO₂, pH, and sugar so the brain can adjust breathing and circulation."},{"t":"Personality and judgment in the frontal lobe","ok":false,"why":"Chemoreceptors are chemistry sensors. They monitor O₂, CO₂, pH, and sugar so the brain can adjust breathing and circulation."},{"t":"Only whether the EpiPen is expired","ok":false,"why":"Chemoreceptors are chemistry sensors. They monitor O₂, CO₂, pH, and sugar so the brain can adjust breathing and circulation."}]},{"ch":"univ","q":"Low BP from bleeding, heart failure, anaphylaxis, or massive vasodilation. First body move?","opts":[{"t":"Parasympathetic rest-and-digest until CT is done","ok":false,"why":"The first response is the same: alpha vasoconstriction, beta-1 ↑ HR and squeeze, beta-2 bronchodilation."},{"t":"Same fight-or-flight package: alpha, beta-1, and beta-2","ok":true,"why":"The first response is the same: alpha vasoconstriction, beta-1 ↑ HR and squeeze, beta-2 bronchodilation."},{"t":"Only occipital vision loss until pressure returns","ok":false,"why":"The first response is the same: alpha vasoconstriction, beta-1 ↑ HR and squeeze, beta-2 bronchodilation."},{"t":"Somatic shutdown of all skeletal muscle","ok":false,"why":"The first response is the same: alpha vasoconstriction, beta-1 ↑ HR and squeeze, beta-2 bronchodilation."}]},{"ch":"shock","q":"Universal shock look this recap wants you to lock?","opts":[{"t":"Warm, flushed, bradycardic, high BP from the start","ok":false,"why":"Cool, pale, clammy, tachycardic, and possibly low BP — and low BP is a late sign."},{"t":"Cool, pale, clammy, tachycardic, possibly low BP (late)","ok":true,"why":"Cool, pale, clammy, tachycardic, and possibly low BP — and low BP is a late sign."},{"t":"Only slurred speech from left frontal Broca","ok":false,"why":"Cool, pale, clammy, tachycardic, and possibly low BP — and low BP is a late sign."},{"t":"Clear dry skin with a slow strong pulse","ok":false,"why":"Cool, pale, clammy, tachycardic, and possibly low BP — and low BP is a late sign."}]},{"ch":"sns","q":"Sympathetic fight or flight — which cluster is yours?","opts":[{"t":"Slow HR, more gut flow, no vessel squeeze","ok":false,"why":"SNS: ↑ HR, ↑ contractility, bronchodilation, vasoconstriction, and less blood flow to GI and reproductive systems."},{"t":"↑ HR, harder squeeze, bronchodilation, vasoconstriction, less GI/repro flow","ok":true,"why":"SNS: ↑ HR, ↑ contractility, bronchodilation, vasoconstriction, and less blood flow to GI and reproductive systems."},{"t":"Vision only, from the occipital lobe","ok":false,"why":"SNS: ↑ HR, ↑ contractility, bronchodilation, vasoconstriction, and less blood flow to GI and reproductive systems."},{"t":"Voluntary control of skeletal muscle","ok":false,"why":"SNS: ↑ HR, ↑ contractility, bronchodilation, vasoconstriction, and less blood flow to GI and reproductive systems."}]},{"ch":"pnsans","q":"Parasympathetic rest and digest — what does it do after the stress?","opts":[{"t":"Keeps epinephrine high and clamps every vessel","ok":false,"why":"PNS brings the body back down: slows HR, promotes digestion, restores blood flow to GI and reproductive systems."},{"t":"Brings the body back down — slows HR, restores GI and reproductive flow","ok":true,"why":"PNS brings the body back down: slows HR, promotes digestion, restores blood flow to GI and reproductive systems."},{"t":"Opens Broca’s area so you can speak during shock","ok":false,"why":"PNS brings the body back down: slows HR, promotes digestion, restores blood flow to GI and reproductive systems."},{"t":"Turns baroreceptors off so BP is ignored","ok":false,"why":"PNS brings the body back down: slows HR, promotes digestion, restores blood flow to GI and reproductive systems."}]},{"ch":"auto","q":"Autonomic nervous system in this recap — voluntary or not, and what does it run?","opts":[{"t":"Voluntary skeletal muscle only","ok":false,"why":"Autonomic is involuntary control of heart, smooth muscle, and glands — sympathetic and parasympathetic."},{"t":"Involuntary — heart, smooth muscle, glands (SNS and PNS)","ok":true,"why":"Autonomic is involuntary control of heart, smooth muscle, and glands — sympathetic and parasympathetic."},{"t":"Only the cerebrum’s language centers","ok":false,"why":"Autonomic is involuntary control of heart, smooth muscle, and glands — sympathetic and parasympathetic."},{"t":"CNS only — brain plus spinal cord, no organs","ok":false,"why":"Autonomic is involuntary control of heart, smooth muscle, and glands — sympathetic and parasympathetic."}]},{"ch":"cns","q":"CNS versus PNS — your split?","opts":[{"t":"CNS is all motor nerves; PNS is only the brainstem","ok":false,"why":"CNS is brain plus spinal cord. PNS is all the other nerves."},{"t":"CNS is brain + spinal cord; PNS is all other nerves","ok":true,"why":"CNS is brain plus spinal cord. PNS is all the other nerves."},{"t":"CNS is adrenals; PNS is alpha receptors","ok":false,"why":"CNS is brain plus spinal cord. PNS is all the other nerves."},{"t":"They are the same name for fight or flight","ok":false,"why":"CNS is brain plus spinal cord. PNS is all the other nerves."}]},{"ch":"ms","q":"Motor nerves versus sensory nerves in the PNS?","opts":[{"t":"Motor brings data in; sensory sends movement out","ok":false,"why":"Motor nerves send signals out to muscles (movement). Sensory nerves send information in to the brain (data input)."},{"t":"Motor sends signals out to muscles; sensory sends information in to the brain","ok":true,"why":"Motor nerves send signals out to muscles (movement). Sensory nerves send information in to the brain (data input)."},{"t":"Both only live in the occipital lobe","ok":false,"why":"Motor nerves send signals out to muscles (movement). Sensory nerves send information in to the brain (data input)."},{"t":"Motor function shuffle(arr) {

  return a;
}

    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sat 10:19 endocrine-and-nervous recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · endocrine-and-nervous recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
</body>
</html>
