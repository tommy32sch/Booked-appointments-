e is a narcotic receptor antagonist and reverses opioid overdose. Registry wants the generic name naloxone."}, {"t": "Narcotic receptor antagonist — reverses opioid overdose", "ok": true, "why": "An antagonist binds and blocks the receptor, often the opposite effect. Naloxone is a narcotic receptor antagonist and reverses opioid overdose. Registry wants the generic name naloxone."}, {"t": "A sugar gel for blood sugar under 80", "ok": false, "why": "An antagonist binds and blocks the receptor, often the opposite effect. Naloxone is a narcotic receptor antagonist and reverses opioid overdose. Registry wants the generic name naloxone."}, {"t": "A vasodilator you put under the tongue for chest pain", "ok": false, "why": "An antagonist binds and blocks the receptor, often the opposite effect. Naloxone is a narcotic receptor antagonist and reverses opioid overdose. Registry wants the generic name naloxone."}]}, {"ch": "pk", "q": "Pharmacokinetics — which set is the life cycle this recap wants, and why does onset matter to you?", "opts": [{"t": "Only brand versus generic names", "ok": false, "why": "Pharmacokinetics is the life cycle: onset (admin → starts working — drives reassessment timing), peak (max effect), duration (how long it lasts), elimination (out of the system)."}, {"t": "Onset, peak, duration, elimination — onset tells you when to reassess", "ok": true, "why": "Pharmacokinetics is the life cycle: onset (admin → starts working — drives reassessment timing), peak (max effect), duration (how long it lasts), elimination (out of the system)."}, {"t": "Only the five rights of administration", "ok": false, "why": "Pharmacokinetics is the life cycle: onset (admin → starts working — drives reassessment timing), peak (max effect), duration (how long it lasts), elimination (out of the system)."}, {"t": "Indication, then you skip timing", "ok": false, "why": "Pharmacokinetics is the life cycle: onset (admin → starts working — drives reassessment timing), peak (max effect), duration (how long it lasts), elimination (out of the system)."}]}, {"ch": "route-time", "q": "Route and timing from this recap — which pair is correct?", "opts": [{"t": "PO pill is immediate; IV takes 20–30 minutes", "ok": false, "why": "Most emergency meds start fast, but route matters. IV is immediate. A PO pill is about 20–30 minutes. SL and IN are rapid because the tissue is very vascular."}, {"t": "IV is immediate; a swallowed PO pill is about 20–30 minutes", "ok": true, "why": "Most emergency meds start fast, but route matters. IV is immediate. A PO pill is about 20–30 minutes. SL and IN are rapid because the tissue is very vascular."}, {"t": "Transdermal patches are your fastest emergency route", "ok": false, "why": "Most emergency meds start fast, but route matters. IV is immediate. A PO pill is about 20–30 minutes. SL and IN are rapid because the tissue is very vascular."}, {"t": "Sublingual nitro is slower than a swallowed aspirin tablet", "ok": false, "why": "Most emergency meds start fast, but route matters. IV is immediate. A PO pill is about 20–30 minutes. SL and IN are rapid because the tissue is very vascular."}]}, {"ch": "ind", "q": "Indication versus contraindication on your patient — this recap’s meanings?", "opts": [{"t": "Indication is a side effect; contraindication is the generic name", "ok": false, "why": "Indication is the reason to give a drug or do an intervention (suction, OPA, NPA, Epi). Contraindication is a reason not to. EMTs treat med contraindications as absolute unless a doctor overrides."}, {"t": "Indication = reason to give or do it; contraindication = reason not to", "ok": true, "why": "Indication is the reason to give a drug or do an intervention (suction, OPA, NPA, Epi). Contraindication is a reason not to. EMTs treat med contraindications as absolute unless a doctor overrides."}, {"t": "They only apply to pills, never to suction or an OPA", "ok": false, "why": "Indication is the reason to give a drug or do an intervention apid — nitro), and PR (not an EMT route here). Nitro stays under the tongue; do not swallow it right away."}, {"t": "Rectal (PR) — the EMT standard in this system", "ok": false, "why": "Enteral includes PO (slow, 20–30 min), SL (vascular, rapid — nitro), and PR (not an EMT route here). Nitro stays under the tongue; do not swallow it right away."}, {"t": "Transdermal patch — fastest emergency option", "ok": false, "why": "Enteral includes PO (slow, 20–30 min), SL (vascular, rapid — nitro), and PR (not an EMT route here). Nitro stays under the tongue; do not swallow it right away."}]}, {"ch": "parent", "q": "Parenteral routes from this recap — which line is yours?", "opts": [{"t": "SC is your main EMT emergency route", "ok": false, "why": "Parenteral is any non-gut route. IV immediate (paramedic). IO into marrow acts like IV in critical cases. IN (naloxone) is vascular and rapid. IM (EpiPen, lateral thigh) is moderate/fast. SC and transdermal are too slow / not current EMT emergency meds."}, {"t": "IV immediate (paramedic); IO like IV in arrest; IN naloxone rapid; IM EpiPen lateral thigh", "ok": true, "why": "Parenteral is any non-gut route. IV immediate (paramedic). IO into marrow acts like IV in critical cases. IN (naloxone) is vascular and rapid. IM (EpiPen, lateral thigh) is moderate/fast. SC and transdermal are too slow / not current EMT emergency meds."}, {"t": "Transdermal patches are faster than IV", "ok": false, "why": "Parenteral is any non-gut route. IV immediate (paramedic). IO into marrow acts like IV in critical cases. IN (naloxone) is vascular and rapid. IM (EpiPen, lateral thigh) is moderate/fast. SC and transdermal are too slow / not current EMT emergency meds."}, {"t": "IN is only for aspirin tablets", "ok": false, "why": "Parenteral is any non-gut route. IV immediate (paramedic). IO into marrow acts like IV in critical cases. IN (naloxone) is vascular and rapid. IM (EpiPen, lateral thigh) is moderate/fast. SC and transdermal are too slow / not current EMT emergency meds."}]}, {"ch": "forms", "q": "Medication forms you actually see in this recap?", "opts": [{"t": "Only suspensions — charcoal is your main EMT carry", "ok": false, "why": "Tablets = compressed powder (aspirin). Solutions = fully dissolved (EpiPen fluid). MDI = same dose each spray (albuterol). Gels = oral glucose. Suspensions (old charcoal) are mostly gone. Capsules are not a big EMT carry."}, {"t": "Aspirin tablets, EpiPen solution, albuterol MDI, oral glucose gel", "ok": true, "why": "Tablets = compressed powder (aspirin). Solutions = fully dissolved (EpiPen fluid). MDI = same dose each spray (albuterol). Gels = oral glucose. Suspensions (old charcoal) are mostly gone. Capsules are not a big EMT carry."}, {"t": "Only capsules; you never see tablets or gels", "ok": false, "why": "Tablets = compressed powder (aspirin). Solutions = fully dissolved (EpiPen fluid). MDI = same dose each spray (albuterol). Gels = oral glucose. Suspensions (old charcoal) are mostly gone. Capsules are not a big EMT carry."}, {"t": "Only transdermal creams for chest pain", "ok": false, "why": "Tablets = compressed powder (aspirin). Solutions = fully dissolved (EpiPen fluid). MDI = same dose each spray (albuterol). Gels = oral glucose. Suspensions (old charcoal) are mostly gone. Capsules are not a big EMT carry."}]}, {"ch": "rights", "q": "The original five rights this recap says really matter?", "opts": [{"t": "Right brand name, right color, right syringe only", "ok": false, "why": "Original five: right patient (prescribed to them, or box drug on the approved list and allowed), right medication, right dose, right route, right time (expiration, EpiPen hold, nitro repeat). Other rights sit on these."}, {"t": "Right patient, medication, dose, route, and time (expiration / hold / repeat)", "ok": true, "why": "Original five: right patient (prescribed to them, or box drug on the approved list and allowed), right medication, right dose, right route, right time (expiration, EpiPen hold, nitro repeat). Other rights sit on these."}, {"t": "Right hospital, right bed, right lunch break", "ok": false, "why": "Original five: right patient (prescribed to them, or box drug on the approved list and allowed), right medication, right dose, right route, right time (expiration, EpiPen hold, nitro repeat). Other rights sit on these."}, {"t": "Only right documentation — skip dose and route", "ok": false, "why": "Original five: right patient (prescribed to them, or box drug on the approved list and allowed), right medication, right dose, right route, right time (expiration, EpiPen hold, nitro repeat). Other rights sit on these."}]}, {"ch": "doc", "q": "What must you document after you give a med in this recap?", "opts": [{"t": "Only the brand name and nothing else", "ok": false, "why": "Always record medication name, dose, route, time, and how they responded. Class lines: aspirin 324 mg PO chewed; nitro 0.4 mg SL with pain from 8/10 to 4/10."}, {"t": "Name, dose, route, time, and patient response", "ok": true, "why": "Always record medication name, dose, route, time, and how they responded. Class lines: aspirin 324 mg PO chewed; nitro 0.4 mg SL with pain from 8/10 to 4/10."}, {"t": "Only that medical control exists", "ok": false, "why": "Always record medication name, dose, route, time, and how they responded. Class lines: aspirin 324 mg PO chewed; nitro 0.4 mg SL with pain from 8/10 to 4/10."}, {"t": "Only the generic spelling, skip the response", "ok": false, "why": "Always record medication name, dose, route, time, and how they responded. Class lines: aspirin 324 mg PO chewed; nitro 0.4 mg SL with pain from 8/10 to 4/10."}]}, {"ch": "gluc-go", "q": "Your patient’s sugar is 68 mg/dL. They follow commands and can swallow. Oral glucose?", "opts": [{"t": "No — any sugar under 80 is an automatic IV-only problem for you", "ok": false, "why": "Indication is blood sugar < 80 mg/dL AND they are conscious and can protect the airway. Dose is one tube PO/buccal (of function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"scope": "Scope", "pdyn": "Pharmacodynamics", "ago": "Agonist", "ant": "Antagonist", "pk": "Pharmacokinetics", "route-time": "Route timing", "ind": "Indication", "names": "Names", "enteral": "Enteral / SL", "parent": "Parenteral", "forms": "Forms", "rights": "Five rights", "doc": "Document", "gluc-go": "Glucose go", "gluc-no": "Glucose no", "asa-mech": "Aspirin action", "asa-dose": "Aspirin dose", "nitro-dose": "Nitro dose", "nitro-no": "Nitro no", "nitro-se": "Nitro effects", "nitro-rpt": "Nitro repeat", "ana": "Anaphylaxis", "epi-dose": "Epi dose", "epi-how": "Epi how"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sun 3:15 pharmacology fundamentals recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;

    btn.querySelector(".ot").textContent=q.opts[idx].t;

  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");

}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
