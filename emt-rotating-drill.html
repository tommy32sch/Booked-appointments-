.opt.locked { cursor: default; }

.opt.chosen.right, .opt.show-correct { background: var(--chosen-right); border-color: var(--correct-outline); }

.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }

<script>
(function () {
  var CH_NAME = {
    1: "Ch 1 · EMS Systems",
    2: "Ch 2 · Workplace Safety & Wellness",
    3: "Ch 3 · Medical, Legal & Ethical",
    4: "Ch 4 · Communication & Documentation",
    5: "Ch 5 · Medical Terminology",
    6: "Ch 6 · The Human Body",
    9: "Ch 9 · Patient assessment"
  };
  var SUN_LABEL = "Sunday 8:02 — Assess overview";
  var LETTERS = ["A", "B", "C", "D"];
  var answered = 0;
  var correct = 0;
  var total = 0;

  function $(id) { return document.getElementById(id); }

  function utcHourSeed() {
    var d = new Date();
    function p(n) { return n < 10 ? "0" + n : String(n); }
    return String(d.getUTCFullYear()) + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) + p(d.getUTCHours());
  }

  function hashToUint32(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function mulberry32(a) {
    return function () {
      var t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function pickN(arr, n, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a.slice(0, Math.min(n, a.length));
  }

  function shuffleOpts(opts, seed, stem) {
    var rng = mulberry32(hashToUint32(String(seed) + "\n" + String(stem)));
    var a = opts.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function readBank(id) {
    var el = $(id);
    return JSON.parse(el.textContent);
  }

  function currentSeedFromUrl() {
    var params = new URLSearchParams(location.search);
    var s = params.get("seed");
    if (s == null) return null;
    s = String(s);
    if (!s) return null;
    return s;
  }

  function writeSeedToUrl(seed, replace) {
    var url = new URL(location.href);
    url.searchParams.set("seed", seed);
    var next = url.pathname + url.search + url.hash;
    if (replace) history.replaceState({ seed: seed }, "", next);
    else history.pushState({ seed: seed }, "", next);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function updateScore() {
    $("score").textContent = correct + " / " + answered;
    $("progLabel").textContent = answered >= total
      ? ("Done · " + total + " questions")
      : (answered + " of " + total + " answered");
    $("progBar").style.width = (total ? Math.round((answered / total) * 100) : 0) + "%";
  }

  function renderQuestion(card, item, qIndex) {
    var qnum = el("div", "qnum", "Question " + qIndex);
    if (item.topic) {
      qnum.appendChild(el("span", "topic", item.topic));
    }
    card.appendChild(qnum);
    card.appendChild(el("p", "qtext", item.q));
    var optsWrap = el("div", "opts");
    var whyBox = el("div", "why");
    var locked = false;
    item.opts.forEach(function (opt, idx) {
      var btn = el("button", "opt");
      btn.type = "button";
      btn.appendChild(el("span", "letter", LETTERS[idx] || String(idx + 1)));
      btn.appendChild(el("span", "ot", opt.t));
      btn.addEventListener("click", function () {
        if (locked) return;
        locked = true;
        answered += 1;
        if (opt.ok) correct += 1;
        var correctOpt = null;
        item.opts.forEach(function (o) { if (o.ok) correctOpt = o; });
        Array.prototype.forEach.call(optsWrap.children, function (b, j) {
          b.classList.add("locked");
          b.disabled = true;
          var o = item.opts[j];
          if (j === idx && o.ok) b.classList.add("chosen", "right");
          else if (j === idx && !o.ok) b.classList.add("chosen", "wrong");
          else if (o.ok) b.classList.add("show-correct");
          else b.classList.add("dim");
        });
        whyBox.appendChild(el("div", "verdict " + (opt.ok ? "ok" : "bad"), opt.ok ? "Correct" : "Incorrect"));
        if (opt.why) whyBox.appendChild(el("div", "why-body", opt.why));
        if (!opt.ok && correctOpt) {
          whyBox.appendChild(el("div", "correct-line", "Correct: " + correctOpt.t));
        }
        whyBox.classList.add("visible");
        updateScore();
        whyBox.scrollIntoView({ block: "nearest", behavior: "smooth" });
      });
      optsWrap.appendChild(btn);
    });
    card.appendChild(optsWrap);
    card.appendChild(whyBox);
  }

  function build(seed) {
    answered = 0;
    correct = 0;
    var ch16 = readBank("bank-ch16");
    var ch9 = readBank("bank-ch9");
    var sun = readBank("bank-0802");
    var rng = mulberry32(hashToUint32(seed));
    var sections = [];
    [1, 2, 3, 4, 5, 6].forEach(function (ch) {
      var pool = ch16.filter(function (q) { return q.ch === ch; });
      sections.push({
        id: "ch" + ch,
        title: CH_NAME[ch],
        items: pickN(pool, 5, rng).map(function (q) {
          return { q: q.q, opts: shuffleOpts(q.opts, seed, q.q) };
        })
      });
    });
    sections.push({
      id: "ch9",
      title: CH_NAME[9],
      items: pickN(ch9, 5, rng).map(function (q) {
        var topic = (q.ch === 9 || q.ch === "9") ? "" : String(q.ch);
        return { q: q.q, opts: shuffleOpts(q.opts, seed, q.q), topic: topic };
      })
    });
    sections.push({
      id: "sun0802",
      title: SUN_LABEL,
      items: pickN(sun, 5, rng).map(function (q) {
        return { q: q.q, opts: shuffleOpts(q.opts, seed, q.q) };
      })
    });
    total = 0;
    sections.forEach(function (s) { total += s.items.length; });

    $("seedInput").value = seed;
    $("seedSummary").textContent = seed;
    $("seedBox").open = false;
    var jump = $("jump");
    jump.textContent = "";
    var main = $("main");
    main.textContent = "";
    var qIndex = 0;
    sections.forEach(function (sec) {
      var a = el("a", "", sec.id === "sun0802" ? "8:02" : sec.id === "ch9" ? "9" : String(sec.id.replace("ch", "")));
      a.href = "#" + sec.id;
      jump.appendChild(a);
      var wrap = el("section", "sec");
      wrap.id = sec.id;
      wrap.appendChild(el("h2", "", sec.title));
      sec.items.forEach(function (item) {
        qIndex += 1;
        var card = el("article", "card");
        renderQuestion(card, item, qIndex);
        wrap.appendChild(card);
      });
      main.appendChild(wrap);
    });
    var note = el("p", "note", "Same seed → same set. Add ?seed=YYYYMMDDHH to the URL to share this mix (any other seed string also works). Tap a choice for the bank’s why — nothing extra is invented.");
    main.appendChild(note);
    var end = el("div", "end");
    end.id = "endBox";
    end.appendChild(el("h2", "", "How this mix works"));
    end.appendChild(el("p", "note", "40 questions: 5 each from Chapters 1, 2, 3, 4, 5, 6, and 9, then 5 from Sunday 8:02 — Assess overview."));
    var actions = el("div", "end-actions");
    var again = el("button", "", "New mix");
    again.type = "button";
    again.addEventListener("click", function () { applySeed(newMixSeed(), false); });
    actions.appendChild(again);
    end.appendChild(actions);
    main.appendChild(end);
    updateScore();
    var bar = document.querySelector(".sticky-bar");
    var pad = (bar ? bar.offsetHeight : 96) + 8;
    document.documentElement.style.scrollPaddingTop = pad + "px";
    window.scrollTo(0, 0);
  }

  function newMixSeed() {
    return "mix-" + Date.now().toString(36);
  }

  function applySeed(seed, replace) {
    writeSeedToUrl(seed, replace);
    build(seed);
  }

  function boot() {
    try {
      var seed = currentSeedFromUrl();
      if (!seed) {
        seed = utcHourSeed();
        writeSeedToUrl(seed, true);
      }
      build(seed);
    } catch (err) {
      $("main").textContent = "";
      $("main").appendChild(el("p", "err", "Could not load the locked question banks."));
    }
  }

  $("loadBtn").addEventListener("click", function () {
    var seed = $("seedInput").value.replace(/^\s+|\s+$/g, "");
    if (!seed) seed = utcHourSeed();
    applySeed(seed, false);
  });
  $("seedInput").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") $("loadBtn").click();
  });
  $("hourBtn").addEventListener("click", function () {
    applySeed(utcHourSeed(), false);
  });
  $("mixBtn").addEventListener("click", function () {
    applySeed(newMixSeed(), false);
  });
  $("copyBtn").addEventListener("click", function () {
    var url = location.href;
    function done(ok) {
      $("copyBtn").textContent = ok ? "Copied" : "Copy failed";
      setTimeout(function () { $("copyBtn").textContent = "Copy link"; }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { done(true); }).catch(function () { fallback(); });
    } else {
      fallback();
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = url;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done(ok);
    }
  });
  window.addEventListener("popstate", boot);
  boot();
})();
</script>
