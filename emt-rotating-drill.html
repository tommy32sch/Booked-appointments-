header {

main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }

.qtext { font-size: 1.08rem; font-weight: 650; margin: 0 0 12px; }
.opts { display: flex; flex-direction: column; gap: 10px; }

  background: #fff; color: var(--ink);

.opt:active { transform: scale(.995); }

.opt.locked { cursor: default; }
.opt.chosen.wrong { background: var(--chosen-wrong); border-color: var(--red); }
.opt.chosen.right, .opt.show-correct { background: var(--chosen-right); border-color: var(--correct-outline); }
.opt.dim { opacity: .55; }

.end {

.end-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.end-actions button { background: var(--navy); color: #fff; min-height: 48px; flex: 1; }
.err { padding: 16px; color: var(--red); }
</style>

p → drive away."}]}, {"ch": "hx", "q": "OPQRST: which pair keeps onset and timing from collapsing?", "opts": [{"t": "Onset is what you were doing; timing is when it started", "ok": true, "why": "People blur O and T. Onset = what were you doing. Timing = when did it start."}, {"t": "Onset is when it started; timing is what you were doing", "ok": false, "why": "He split those on purpose the other way."}, {"t": "Onset is the 0–10 number; timing is what you were doing", "ok": false, "why": "0–10 is severity. Onset = what you were doing."}, {"t": "Onset is what you were doing; timing is the 0–10 number", "ok": false, "why": "Timing is when it started."}]}, {"ch": "hx", "q": "Pain word. How did he want quality asked?", "opts": [{"t": "Let them pick a word; do not plant “left arm” or a single leading label", "ok": true, "why": "No leading questions. Their word. Too many options if they stall. Do not ask if it radiates down the left arm."}, {"t": "Plant “left arm” first; then force a single leading label", "ok": false, "why": "He banned planting left-arm radiation and leading quality words."}, {"t": "Let them pick a word; then plant “left arm” before they answer where", "ok": false, "why": "Do not plant left arm."}, {"t": "Skip quality; SAMPLE already covers the pain word", "ok": false, "why": "Q is OPQRST. SAMPLE is the broader PMH set."}]}, {"ch": "hx", "q": "Nobody knows the unresponsive park patient. History next?", "opts": [{"t": "Empty history is allowed; move to the secondary exam", "ok": true, "why": "No family, jewelry, wallet, or phone data → history is out the window → secondary."}, {"t": "Empty history is not allowed; invent SAMPLE before you move", "ok": false, "why": "He said you can have nothing and still move to secondary."}, {"t": "Empty history is allowed; move back to scene size-up only", "ok": false, "why": "Next is secondary, not a restart of scene."}, {"t": "Empty history is not allowed; strip them for a home medical scan", "ok": false, "why": "Unresponsive park ≠ home chest-pain strip. Go to secondary."}]}, {"ch": "hx", "q": "They deny drugs. You still think they used. Sunday move?", "opts": [{"t": "Ask once more with no judgment; second deny → drop it and chart they deny", "ok": true, "why": "Sunday: may ask a second time (no judgment, not the cops). Deny again → drop it. Chart patient denies."}, {"t": "Ask once more with no judgment; second deny → keep pressing until they confess", "ok": false, "why": "Second deny → drop it, even if you do not believe them."}, {"t": "Skip the second ask; EMT meds change if they have alcohol", "ok": false, "why": "He said EMT meds are not directly impacted. You may ask twice."}, {"t": "Call them a liar in the PCR so law enforcement has a quote", "ok": false, "why": "Chart denies or what they state. LE has their own pathway."}]}, {"ch": "ops", "q": "You suspect abuse. Report vs defamation, as he said Sunday?", "opts": [{"t": "Report the suspicion and what you saw; that is not defamation if later false", "ok": true, "why": "Mandatory report of suspicion. Not defamation if untrue. Walking around naming them an abuser is defamation."}, {"t": "Stay quiet; a false suspicion is automatically defamation", "ok": false, "why": "He said reporting a suspicion is not a defamation problem."}, {"t": "Walk the hallway saying they are a child abuser so staff hears", "ok": false, "why": "That public accusation is the defamation example he banned."}, {"t": "Write in the PCR who did it and skip law enforcement", "ok": false, "why": "Objective observations + quoted statements. Get LE if needed. Don’t accuse."}]}, {"ch": "hx", "q": "Childbearing-age woman, lower belly pain. Sunday questions?", "opts": [{"t": "Any chance you are pregnant, and when was your last period", "ok": true, "why": "Consider all childbearing-age females with lower abdominal pain possibly pregnant. Ask pregnancy chance + LMP."}, {"t": "Skip pregnancy; only ask if dispatch said OB", "ok": false, "why": "He said consider them possibly pregnant on that complaint."}, {"t": "Any chance you are pregnant, and skip bowel and bladder on all belly pain", "ok": false, "why": "Any abdominal pain: also N/V/D and bowel/bladder changes."}, {"t": "Ask STD questions on every headache so you do not miss one", "ok": false, "why": "STDs only if the call fits. Headache is his counter-example."}]}, {"ch": "sec", "q": "Awake, medical chest pain. Detailed head-to-toe or focused?", "opts": [{"t": "Focused on the chest; a talking medical can point to the part", "ok": true, "why": "Focused if you know the part — conscious medical. Detailed if unconscious or significant MOI."}, {"t": "Detailed head-to-toe; every medical gets a full strip", "ok": false, "why": "Talking medical chest pain = focus the chest. Do not need to palpate the whole body."}, {"t": "Focused on the chest; also used for the ejected wreck with arm pain", "ok": false, "why": "Ejected / significant MOI = detailed even if they are awake."}, {"t": "Skip the exam; vitals already happened in the primary", "ok": false, "why": "Full vitals and the physical sit in the secondary. Primary does not replace it."}]}, {"ch": "sec", "q": "Stepped-on-leg snap, no fall, vs ejected and talking. Which exam pair?", "opts": [{"t": "Isolated step = focused leg; ejected = full detailed even if they talk", "ok": true, "why": "Low-MOI isolated complaint can focus. Significant MOI (ejected) = head-to-toe."}, {"t": "Isolated step = full detailed; ejected = focused arm only", "ok": false, "why": "Opposite of the two examples he gave."}, {"t": "Both get a 60-second primary rapid scan only and no secondary", "ok": false, "why": "Rapid scan is primary trauma. This is the secondary focused vs detailed choice."}, {"t": "Both skip exam if they can still talk", "ok": false, "why": "Talking only lets you focus when the MOI is isolated."}]}, {"ch": "sec", "q": "DCAP-BTLS letters he actually listed?", "opts": [{"t": "Deformity, contusions, abrasions, punctures, burns, tenderness, lacerations, swelling", "ok": true, "why": "DCAP-BTLS = those eight injury signs. Joint deformity: assume broken."}, {"t": "Deformity, cyanosis, AVPU, pulse, burns, tenderness, lacerations, SAMPLE", "ok": false, "why": "Those mix primary/history letters. DCAP-BTLS is the injury mnemonic."}, {"t": "Deformity, contusions, airway, pupils, blood pressure, GCS, lungs, sugar", "ok": false, "why": "Vitals are not DCAP-BTLS."}, {"t": "Only lacerations and swelling; the rest wait for X-ray", "ok": false, "why": "He listed all eight and said assume a deformed joint is broken."}]}, {"ch": "breathe", "q": "Which breath-sound split did he teach Sunday?", "opts": [{"t": "Snore, gurgle, stridor are upper (heard standing); wheeze, crackles, rhonchi are lower (scope)", "ok": true, "why": "Upper heard in front of you. Lower need a stethoscope on the chest."}, {"t": "Snore, gurgle, stridor are lower (scope); wheeze, crackles, rhonchi are upper (heard standing)", "ok": false, "why": "He put snore/gurgle/stridor up top and the other three down in the chest."}, {"t": "All six are upper; EMTs do not auscultate", "ok": false, "why": "He said EMTs still auscultate. Lower sounds need the scope."}, {"t": "Crackles are upper tongue; snore is pulmonary edema", "ok": false, "why": "Snore = tongue. Crackles = fluid in the lower airway / pulmonary edema."}]}, {"ch": "breathe", "q": "Crackles vs rhonchi, as he paired them?", "opts": [{"t": "Crackles = fluid / pulmonary edema (straw bubbles); rhonchi = mucus / pneumonia (low rattle)", "ok": true, "why": "Crackles = edema or drown fluid. Rhonchi = junky mucus, classic pneumonia. EMT does not treat the infection."}, {"t": "Crackles = mucus / pneumonia; rhonchi = tongue in the throat", "ok": false, "why": "Tongue is snoring. Pneumonia was his rhonchi example."}, {"t": "Crackles = high-pitched exhalation asthma; rhonchi = upper stridor", "ok": false, "why": "Asthma wheeze is high-pitched mostly on exhalation. Stridor is upper."}, {"t": "Both are upper sounds ell you."}, {"t": "Pinpoint pupils mean cocaine; dilated pupils mean fentanyl", "ok": false, "why": "Opposite pairing. Opiates → pinpoint. Stimulants → often dilated."}, {"t": "Skip pupils; they are only for the medic capnography adapter", "ok": false, "why": "Pupils are a standard vital. Capnography is the medic CO2 tool."}]}, {"ch": "treat", "q": "Looks like an OD and they are not breathing well. Test order?", "opts": [{"t": "Open and breathe for them first; Narcan sits after the field impression", "ok": true, "why": "Sunday trap: ABC / oxygen before the condition med (Narcan or Epi). Meds are the bottom of the sheet."}, {"t": "Give Narcan first; breathing waits for the reversal to work", "ok": false, "why": "He said people jump at Narcan and miss open/ventilate."}, {"t": "Give the EpiPen first; OD and anaphylaxis share one drug", "ok": false, "why": "Epi is anaphylaxis. Still after ABCs / oxygen."}, {"t": "Skip ABCs; field impression always unlocks meds in the primary", "ok": false, "why": "Impression and meds come after secondary on the skill sheet."}]}, {"ch": "reassess", "q": "Reassess clocks, and a major change in the back?", "opts": [{"t": "Critical every 5 minutes; stable every 15; major change → restart primary", "ok": true, "why": "Unstable q5 (almost nonstop). Stable q15. Collapse or ROSC → back to LOC / A / B / C. Pulse back ≠ breathing back."}, {"t": "Critical every 15 minutes; stable every 5; major change → start SAMPLE", "ok": false, "why": "He had 5 for critical and 15 for stable. Major change returns to primary, not history."}, {"t": "Critical every 5 minutes; skip vitals the second time; one set is a trend", "ok": false, "why": "One set is a snapshot. Another full set shows trend."}, {"t": "Only reassess after hospital handoff; the ride is nap time", "ok": false, "why": "He said do not nap. Recheck TQ, splint, pain, BGL, SpO2, restraints until handoff."}]}, {"ch": "treat", "q": "NREMT medication permission, unless the stem already says you have or     });
    sections.push({
      id: "ch9",
      title: CH_NAME[9],
      items: pickN(ch9, 5, rng).map(function (q) {
        return { q: q.q, opts: q.opts, topic: q.ch };
      })
    });
    sections.push({
      id: "sun0802",
      title: SUN_LABEL,
      items: pickN(sun, 5, rng).map(function (q) {
        return { q: q.q, opts: q.opts };
      })
    });
    total = 0;
    sections.forEach(function (s) { total += s.items.length; });

    $("seedInput").value = seed;
    var jump = $("jump");
    jump.textContent = "";
    var main = $("main");
    main.textContent = "";
    var qIndex = 0;
    sections.forEach(function (sec) {
      var a = el("a", "", sec.id === "sun0802" ? "8:02" : sec.id === "ch9" ? "9" : String(sec.id.replace("ch", "")));
      a.href = "#" + sec.id;
      jump.appendChild(a);
      var wrap = el("section", "sec");
      wrap.id = sec.id;
      wrap.appendChild(el("h2", "", sec.title));
      sec.items.forEach(function (item) {
        qIndex += 1;
        var card = el("article", "card");
        renderQuestion(card, item, qIndex);
        wrap.appendChild(card);
      });
      main.appendChild(wrap);
    });
    var note = el("p", "note", "Same seed → same set. Add ?seed=YYYYMMDDHH to the URL to share this mix (any other seed string also works). Tap a choice for the bank’s why — nothing extra is invented.");
    main.appendChild(note);
    var end = el("div", "end");
    end.id = "endBox";
    end.appendChild(el("h2", "", "How this mix works"));
    end.appendChild(el("p", "note", "40 questions: 5 each from Chapters 1, 2, 3, 4, 5, 6, and 9, then 5 from Sunday 8:02 — Assess overview."));
    var actions = el("div", "end-actions");
    var again = el("button", "", "New mix");
    again.type = "button";
    again.addEventListener("click", function () { applySeed(newMixSeed(), false); });
    actions.appendChild(again);
    end.appendChild(actions);
    main.appendChild(end);
    updateScore();
    var header = document.querySelector("header");
    var pad = (header ? header.offsetHeight : 200) + 8;
    document.documentElement.style.scrollPaddingTop = pad + "px";
    Array.prototype.forEach.call(document.querySelectorAll(".sec"), function (s) {
      s.style.scrollMarginTop = pad + "px";
    });
    window.scrollTo(0, 0);
  }

  function newMixSeed() {
    return "mix-" + Date.now().toString(36);
  }

  function applySeed(seed, replace) {
    writeSeedToUrl(seed, replace);
    build(seed);
  }

  function boot() {
    try {
      var seed = currentSeedFromUrl();
      if (!seed) {
        seed = utcHourSeed();
        writeSeedToUrl(seed, true);
      }
      build(seed);
    } catch (err) {
      $("main").textContent = "";
      $("main").appendChild(el("p", "err", "Could not load the locked question banks."));
    }
  }

  $("loadBtn").addEventListener("click", function () {
    var seed = $("seedInput").value.replace(/^\s+|\s+$/g, "");
    if (!seed) seed = utcHourSeed();
    applySeed(seed, false);
  });
  $("seedInput").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") $("loadBtn").click();
  });
  $("hourBtn").addEventListener("click", function () {
    applySeed(utcHourSeed(), false);
  });
  $("mixBtn").addEventListener("click", function () {
    applySeed(newMixSeed(), false);
  });
  $("copyBtn").addEventListener("click", function () {
    var url = location.href;
    function done(ok) {
      $("copyBtn").textContent = ok ? "Copied" : "Copy failed";
      setTimeout(function () { $("copyBtn").textContent = "Copy link"; }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { done(true); }).catch(function () { fallback(); });
    } else {
      fallback();
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = url;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done(ok);
    }
  });
  window.addEventListener("popstate", boot);
  boot();
})();
</script>
</body>
</html>
