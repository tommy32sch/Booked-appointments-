ipes = lower pressure. Anaphylaxis: widespread vasodilation. EpiPen one job named: massive vasoconstriction."},{"t":"Higher pressure","ok":false,"why":"Vasodilation = bigger pipes = lower pressure. Anaphylaxis: widespread vasodilation. EpiPen one job named: massive vasoconstriction."},{"t":"Increased stroke volume only","ok":false,"why":"Vasodilation = bigger pipes = lower pressure. Anaphylaxis: widespread vasodilation. EpiPen one job named: massive vasoconstriction."}]},{"ch":"circ","q":"Which abdominal organs are described as solid and blood-saturated, making damage likely to cause major internal bleeding?","opts":[{"t":"Alveoli, bronchioles, trachea","ok":false,"why":"Solid (blood-saturated / “the bleeders”): spleen, liver, pancreas, kidneys. Lots of blood in them. Damage → major internal bleed. Hollow → major internal infection."},{"t":"Spleen, liver, pancreas, kidneys","ok":true,"why":"Solid (blood-saturated / “the bleeders”): spleen, liver, pancreas, kidneys. Lots of blood in them. Damage → major internal bleed. Hollow → major internal infection."},{"t":"Stomach, intestines, bladder, gallbladder","ok":false,"why":"Solid (blood-saturated / “the bleeders”): spleen, liver, pancreas, kidneys. Lots of blood in them. Damage → major internal bleed. Hollow → major internal infection."},{"t":"Aorta, vena cava, mesentery only","ok":false,"why":"Solid (blood-saturated / “the bleeders”): spleen, liver, pancreas, kidneys. Lots of blood in them. Damage → major internal bleed. Hollow → major internal infection."}]},{"ch":"circ","q":"Where does gas exchange between blood and body cells (or alveoli) actually occur?","opts":[{"t":"Inside the left ventricle chambers","ok":false,"why":"Gas exchange on the blood side happens only at capillaries. Not in the aorta, not in other arteries."},{"t":"Throughout the aorta and large arteries","ok":false,"why":"Gas exchange on the blood side happens only at capillaries. Not in the aorta, not in other arteries."},{"t":"Only at the capillary :"Which node holds the electrical impulse for a split second so the ventricles can fill before they contract?","opts":[{"t":"AV node","ok":true,"why":"AV node: holds the impulse a split second so ventricles fill, then fires through ventricles. SA node is the primary pacemaker."},{"t":"SA node","ok":false,"why":"AV node: holds the impulse a split second so ventricles fill, then fires through ventricles. SA node is the primary pacemaker."},{"t":"Pulmonic node","ok":false,"why":"AV node: holds the impulse a split second so ventricles fill, then fires through ventricles. SA node is the primary pacemaker."},{"t":"Coronary node","ok":false,"why":"AV node: holds the impulse a split second so ventricles fill, then fires through ventricles. SA node is the primary pacemaker."}]},{"ch":"circ","q":"Coronary arteries arise immediately off which vessel and supply the heart muscle itself?","opts":[{"t":"Pulmonary artery","ok":false,"why":"Coronary arteries on the surface of the heart. Off the aorta immediately. Chamber blood does not feed the heart muscle cells."},{"t":"Superior vena cava","ok":false,"why":"Coronary arteries on the surface of the heart. Off the aorta immediately. Chamber blood does not feed the heart muscle cells."},{"t":"Aorta","ok":true,"why":"Coronary arteries on the surface of the heart. Off the aorta immediately. Chamber blood does not feed the heart muscle cells."},{"t":"Inferior vena cava","ok":false,"why":"Coronary arteries on the surface of the heart. Off the aorta immediately. Chamber blood does not feed the heart muscle cells."}]},{"ch":"circ","q":"A patient on blood thinners (anticoagulants) is at greater risk in trauma primarily because of what effect?","opts":[{"t":"Their stroke volume doubles","ok":false,"why":"Blood thinners take away the body’s ability to form clots. Worse in trauma — uncontrolled bleed because they can’t clot."},{"t":"They cannot form clots, so bleeding is harder to control","ok":true,"why":"Blood thinners take away the body’s ab min for inadequate or not breathing."}]},{"ch":"airway","q":"Nasal cannula flow rate range from the lecture?","opts":[{"t":"1–4 L/min","ok":false,"why":"Nasal cannula 2–6 L/min."},{"t":"2–6 L/min","ok":true,"why":"Nasal cannula 2–6 L/min."},{"t":"10–15 L/min","ok":false,"why":"Nasal cannula 2–6 L/min."},{"t":"6–10 L/min","ok":false,"why":"Nasal cannula 2–6 L/min."}]},{"ch":"airway","q":"When suctioning, when should suction be applied?","opts":[{"t":"On the way out only","ok":true,"why":"Suction only on the way out; do not suction on the way in because that pushes stuff down into the lungs."},{"t":"On the way in only","ok":false,"why":"Suction only on the way out; do not suction on the way in because that pushes stuff down into the lungs."},{"t":"Both in and out","ok":false,"why":"Suction only on the way out; do not suction on the way in because that pushes stuff down into the lungs."},{"t":"Continuously once inserted","ok":false,"why":"Suction only on the way out; do not suction on the way in because that pushes stuff down into the lungs."}]},{"ch":"airway","q":"Maximum continuous suction time for an adult?","opts":[{"t":"20 seconds","ok":false,"why":"Adult: up to 15 seconds."},{"t":"10 seconds","ok":false,"why":"Adult: up to 15 seconds."},{"t":"5 seconds","ok":false,"why":"Adult: up to 15 seconds."},{"t":"15 seconds","ok":true,"why":"Adult: up to 15 seconds."}]},{"ch":"airway","q":"Maximum continuous suction time for a child?","opts":[{"t":"10 seconds","ok":true,"why":"Child: up to 10 seconds."},{"t":"15 seconds","ok":false,"why":"Child: up to 10 seconds."},{"t":"30 seconds","ok":false,"why":"Child: up to 10 seconds."},{"t":"5 seconds","ok":false,"why":"Child: up to 10 seconds."}]},{"ch":"airway","q":"Maximum continuous suction time for an infant?","opts":[{"t":"10 seconds","ok":false,"why":"Infant: up to 5 seconds."},{"t":"5 seconds","ok":true,"why":"Infant: up to 5 seconds."},{"t":"3 seconds","ok":false,"why":"Infant: up to 5 seconds."},{"t":"15 seconds","ok":false,"why":"Infant: up to 5 seconds."}]},{"ch":"airway","q":"What is the recovery position used for?","opts":[{"t":"Unconscious but breathing on their own","ok":true,"why":"Unconscious but breathing on their own; put on their side so secretions can drool out."},{"t":"Trauma patient with spinal injury","ok":false,"why":"Unconscious but breathing on their own; put on their side so secretions can drool out."},{"t":"Unconscious patient not breathing","ok":false,"why":"Unconscious but breathing on their own; put on their side so secretions can drool out."},{"t":"Conscious patient in distress","ok":false,"why":"Unconscious but breathing on their own; put on their side so secretions can drool out."}]},{"ch":"airway","q":"Respiratory distress is defined in the lecture as which condition?","opts":[{"t":"Stopped breathing completely","ok":false,"why":"Respiratory distress: Trouble breathing, still moving air. Respiratory arrest: Stopped breathing completely."},{"t":"Trouble breathing while still moving air","ok":true,"why":"Respiratory distress: Trouble breathing, still moving air. Respiratory arrest: Stopped breathing completely."},{"t":"Complete airway obstruction only","ok":false,"why":"Respiratory distress: Trouble breathing, still moving air. Respiratory arrest: Stopped breathing completely."},{"t":"Need for immediate CPR","ok":false,"why":"Respiratory distress: Trouble breathing, still moving air. Respiratory arrest: Stopped breathing completely."}]},{"ch":"airway","q":"Which sign is specifically called out as a good one to look for in respiratory distress?","opts":[{"t":"Absent pulse","ok":false,"why":"Sitting upright, leaning forward — tripod (he called this a good one to look for)."},{"t":"Pale skin without cyanosis","ok":false,"why":"Sitting upright, leaning forward — tripod (he called this a good one to look for)."},{"t":"Tripod position (sitting upright, leaning forward)","ok":true,"why":"Sitting upright, leaning forward — tripod (he called this a good one to look for)."},{"t":"Slow breathing only","ok":false,"why":"Sitting upright, leaning forward — tripod (he called this a good one to look for)."}]},{"ch":"airway","q":"What is the rigid suction catheter named in the lecture?","opts":[{"t":"NPA","ok":false,"why":"Rigid suction catheter = Yankauer. Flexible = French."},{"t":"French","ok":false,"why":"Rigid suction catheter = Yankauer. Flexible = French."},{"t":"OPA","ok":false,"why":"Rigid suction catheter = Yankauer. Flexible = French."},{"t":"Yankauer","ok":true,"why":"Rigid suction catheter = Yankauer. Flexible = French."}]},{"ch":"airway","q":"Treatment for respiratory distress signs listed in class includes which actions?","opts":[{"t":"Open airway, give oxygen, assist ventilations, watch SpO2, listen to breath sounds","ok":true,"why":"Treat all of these the same: Open the airway; give oxygen; assist ventilations; watch oxygen saturation; listen to breath sounds; help them with that."},{"t":"Use only nasal cannula at 1 L/min","ok":false,"why":"Treat all of these the same: Open the airway; give oxygen; assist ventilations; watch oxygen saturation; listen to breath sounds; help them with that."},{"t":"Ignore oxygen and go straight to transport","ok":false,"why":"Treat all of these the same: Open the airway; give oxygen; assist ventilations; watch oxygen saturation; listen to breath sounds; help them with that."},{"t":"Only start CPR immediately","ok":false,"why":"Treat all of these the same: Open the airway; give oxygen; assist ventilations; watch oxygen saturation; listen to breath sounds; help them with that."}]}];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

const CH_NAME = {
  circ: "Circulatory · Ch 6",
  airway: "Airway · Ch 7"
};

let queue = [];
let i = 0;
let correct = 0;
let answered = 0;
let locked = false;
let missed = [];

function $(id) { return document.getElementById(id); }

function start() {
  queue = shuffle(BANK).map(function(q) {
    return { ch: q.ch, q: q.q, opts: shuffle(q.opts) };
  });
  i = 0; correct = 0; answered = 0; locked = false; missed = [];
  $("nextBtn").textContent = "Next";
  render();
}

function updateScore() {
  $("score").textContent = correct + " / " + answered;
  const n = queue.length;
  $("progLabel").textContent = (i < n) ? ("Question " + (i + 1) + " of " + n) : ("Done · " + n + " questions");
  $("progBar").style.width = (n ? Math.round(((i + (locked ? 1 : 0)) / n) * 100) : 0) + "%";
}

function render() {
  locked = false;
  $("nextBtn").classList.remove("visible");
  if (i >= queue.length) { return endScreen(); }
  const q = queue[i];
  const letters = ["A", "B", "C", "D"];
  let optsHtml = "";
  q.opts.forEach(function(o, idx) {
    optsHtml += '<button type="button" class="opt" data-idx="' + idx + '">'
      + '<span class="letter">' + letters[idx] + '</span>'
      + '<span class="ot"></span></button>';
  });
  $("main").innerHTML =
    '<div class="card">'
    + '<div class="ch-tag">' + (CH_NAME[q.ch] || q.ch) + '</div>'
    + '<p class="qtext"></p>'
    + '<div class="opts">' + optsHtml + '</div>'
    + '<div class="why" id="whyBox"></div>'
    + '</div>'
    + '<p id="start-note">Answers lock on the first tap. Explanations come from Saturday lecture only.</p>';
  $("main").querySelector(".qtext").textContent = q.q;
  const buttons = $("main").querySelectorAll(".opt");
  buttons.forEach(function(btn, idx) {
    btn.querySelector(".ot").textContent = q.opts[idx].t;
    btn.addEventListener("click", function() { pick(idx); });
  });
  updateScore();
  window.scrollTo(0, 0);
}

function pick(idx) {
  if (locked) return;
  locked = true;
  const q = queue[i];
  const chosen = q.opts[idx];
  const correctOpt = q.opts.find(function(o) { return o.ok; });
  answered += 1;
  if (chosen.ok) correct += 1;
  else {
    missed.push({
      ch: q.ch,
      q: q.q,
      chosen: chosen.t,
      why: chosen.why,
      right: correctOpt.t
    });
  }
  const buttons = $("main").querySelectorAll(".opt");
  buttons.forEach(function(btn, j) {
    btn.classList.add("locked");
    btn.disabled = true;
    const o = q.opts[j];
    if (j === idx && o.ok) btn.classList.add("chosen", "right");
    else if (j === idx && !o.ok) btn.classList.add("chosen", "wrong");
    else if (o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box = $("whyBox");
  const verdict = chosen.ok
    ? '<div class="verdict ok">Correct</div>'
    : '<div class="verdict bad">Incorrect</div>';
  const extra = chosen.ok ? "" :
    '<div class="correct-line">Correct answer: ' + escapeHtml(correctOpt.t) + '</div>';
  box.innerHTML = verdict + '<div class="why-body"></div>' + extra;
  box.querySelector(".why-body").textContent = chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent = (i + 1 >= queue.length) ? "See results" : "Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function endScreen() {
  locked = true;
  $("nextBtn").classList.remove("visible");
  const n = queue.length;
  const pct = n ? Math.round((correct / n) * 100) : 0;
  let missHtml = "";
  if (missed.length === 0) {
    missHtml = '<p>No missed questions. Nice work.</p>';
  } else {
    missHtml = '<div class="miss"><h3>Missed questions (' + missed.length + ')</h3>';
    missed.forEach(function(m) {
      missHtml += '<div class="miss-item">'
        + '<div class="ch-tag">' + (CH_NAME[m.ch] || m.ch) + '</div>'
        + '<div class="mq"></div>'
        + '<div class="mwhy"></div>'
        + '</div>';
    });
    missHtml += '</div>';
  }
  $("main").innerHTML =
    '<div class="card end">'
    + '<h2>Quiz complete</h2>'
    + '<div class="big">' + correct + ' / ' + n + '</div>'
    + '<div class="pct">' + pct + '% · Saturday lecture only</div>'
    + missHtml
    + '<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button>'
    + '</div>';
  if (missed.length) {
    const items = $("main").querySelectorAll(".miss-item");
    missed.forEach(function(m, idx) {
      items[idx].querySelector(".mq").textContent = m.q;
      items[idx].querySelector(".mwhy").textContent =
        "You chose: " + m.chosen + " — " + m.why + "  Correct: " + m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore();
  window.scrollTo(0, 0);
}

$("nextBtn").addEventListener("click", function() {
  if (!locked) return;
  i += 1;
  render();
});

start();
</script>
