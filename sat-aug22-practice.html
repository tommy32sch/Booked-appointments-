<script>

const BANK = [{"ch":"circ","q":"Cells need oxygen and sugar delivered. Which three-part set is the circulatory system he taught?","opts":[{"t":"Pump (heart), pipes (vessels), fluid (blood)","ok":true,"why":"Circulatory / cardiovascular system = three parts: Pump = heart, Pipes = vessels (veins and arteries), Fluid = blood."},{"t":"Pump (lungs), pipes (vessels), fluid (blood)","ok":false,"why":"Circulatory / cardiovascular system = three parts: Pump = heart, Pipes = vessels (veins and arteries), Fluid = blood."},{"t":"Pump (heart), pipes (nerves), fluid (blood)","ok":false,"why":"Circulatory / cardiovascular system = three parts: Pump = heart, Pipes = vessels (veins and arteries), Fluid = blood."},{"t":"Pump (heart), pipes (vessels), fluid (lymph)","ok":false,"why":"Circulatory / cardiovascular system = three parts: Pump = heart, Pipes = vessels (veins and arteries), Fluid = blood."}]},{"ch":"circ","q":"Blood leaves the heart to pick up oxygen in the lungs. Which loop is that?","opts":[{"t":"Pulmonary circulation","ok":true,"why":"Pulmonary circulation: heart → lungs to pick up O2. Systemic: O2 blood out through the body and back."},{"t":"Systemic circulation","ok":false,"why":"Pulmonary circulation: heart → lungs to pick up O2. Systemic: O2 blood out through the body and back."},{"t":"Coronary circulation","ok":false,"why":"Pulmonary circulation: heart → lungs to pick up O2. Systemic: O2 blood out through the body and back."},{"t":"Venous circulation only","ok":false,"why":"Pulmonary circulation: heart → lungs to pick up O2. Systemic: O2 blood out through the body and back."}]},{"ch":"circ","q":"A cross-section shows a much thicker left ventricular wall. Why, in his comparison?","opts":[{"t":"That chamber must reach the head, fingers, and toes","ok":true,"why":"RV only has to reach the lungs and back. LV has to reach fingertips, toes, head. Cross-section: LV wall much thicker."},{"t":"That chamber must reach only the lungs and return","ok":false,"why":"RV only has to reach the lungs and back. LV has to reach fingertips, toes, head. Cross-section: LV wall much thicker."},{"t":"That chamber must fire the SA node each beat","ok":false,"why":"RV only has to reach the lungs and back. LV has to reach fingertips, toes, head. Cross-section: LV wall much thicker."},{"t":"That chamber must catch the vena cava return","ok":false,"why":"RV only has to reach the lungs and back. LV has to reach fingertips, toes, head. Cross-section: LV wall much thicker."}]},{"ch":"circ","q":"Deoxygenated blood is coming home from the body. First chamber it enters?","opts":[{"t":"Right atrium","ok":true,"why":"Deoxygenated back from body → RA → RV → lungs."},{"t":"Right ventricle","ok":false,"why":"Deoxygenated back from body → RA → RV → lungs."},{"t":"Left atrium","ok":false,"why":"Deoxygenated back from body → RA → RV → lungs."},{"t":"Left ventricle","ok":false,"why":"Deoxygenated back from body → RA → RV → lungs."}]},{"ch":"circ","q":"You are naming the valve between the right atrium and right ventricle. Which one?","opts":[{"t":"Tricuspid (right AV)","ok":true,"why":"Right AV valve: tricuspid (3 flaps). Left: bicuspid = mitral."},{"t":"Mitral / bicuspid (left AV)","ok":false,"why":"Right AV valve: tricuspid (3 flaps). Left: bicuspid = mitral."},{"t":"Pulmonic (to the lungs)","ok":false,"why":"Right AV valve: tricuspid (3 flaps). Left: bicuspid = mitral."},{"t":"Aortic (to the aorta)","ok":false,"why":"Right AV valve: tricuspid (3 flaps). Left: bicuspid = mitral."}]},{"ch":"circ","q":"In normal forward flow, which valve order did he drill (try-before-you-buy / TPMA)?","opts":[{"t":"Tricuspid, then pulmonic, then mitral, then aortic","ok":true,"why":"Sequence of valves: tricuspid → pulmonic → bicuspid/mitral → aortic. Mnemonics: try before you buy; TPMA."},{"t":"Mitral, then aortic, then tricuspid, then pulmonic","ok":false,"why":"Sequence of valves: tricuspid → pulmonic → bicuspid/mitral → aortic. Mnemonics: try before you buy; TPMA."},{"t":"Pulmonic, then aortic, then tricuspid, then mitral","ok":false,"why":"Sequence of valves: tricuspid → pulmonic → bicuspid/mitral → aortic. Mnemonics: try before you buy; TPMA."},{"t":"Aortic, then tricuspid, then pulmonic, then mitral","ok":false,"why":"Sequence of valves: tricuspid → pulmonic → bicuspid/mitral → aortic. Mnemonics: try before you buy; TPMA."}]},{"ch":"circ","q":"Which vessels take blood away from the heart toward the lungs still low on oxygen?","opts":[{"t":"Pulmonary arteries","ok":true,"why":"RV → pulmonary arteries (away from heart, deoxygenated to lungs). Every artery oxygenated except pulmonary arteries."},{"t":"Pulmonary veins","ok":false,"why":"RV → pulmonary arteries (away from heart, deoxygenated to lungs). Every artery oxygenated except pulmonary arteries."},{"t":"Superior vena cava","ok":false,"why":"RV → pulmonary arteries (away from heart, deoxygenated to lungs). Every artery oxygenated except pulmonary arteries."},{"t":"Ascending aorta","ok":false,"why":"RV → pulmonary arteries (away from heart, deoxygenated to lungs). Every artery oxygenated except pulmonary arteries."}]},{"ch":"circ","q":"A normal pulse starts as electricity from which structure?","opts":[{"t":"SA node (primary pacemaker)","ok":true,"why":"SA node (sinoatrial): primary pacemaker. Every normal pulse starts here. Sinus rhythm = electricity from the SA node. EMT-level emphasis: SA node = primary pacemaker."},{"t":"AV node (fill-then-fire pause)","ok":false,"why":"SA node (sinoatrial): primary pacemaker. Every normal pulse starts here. Sinus rhythm = electricity from the SA node. EMT-level emphasis: SA node = primary pacemaker."},{"t":"Left ventricle muscle wall","ok":false,"why":"SA node (sinoatrial): primary pacemaker. Every normal pulse starts here. Sinus rhythm = electricity from the SA node. EMT-level emphasis: SA node = primary pacemaker."},{"t":"Coronary artery on the surface","ok":false,"why":"SA node (sinoatrial): primary pacemaker. Every normal pulse starts here. Sinus rhythm = electricity from the SA node. EMT-level emphasis: SA node = primary pacemaker."}]},{"ch":"circ","q":"Cardiac output is the blood moved in one minute. Which product is it?","opts":[{"t":"Stroke volume times heart rate","ok":true,"why":"Cardiac output = blood moved in one minute = SV × HR. Example: SV 80 mL, HR 70 → 5600 mL = 5.6 L/min."},{"t":"Preload times afterload","ok":false,"why":"Cardiac output = blood moved in one minute = SV × HR. Example: SV 80 mL, HR 70 → 5600 mL = 5.6 L/min."},{"t":"Tidal volume times respiratory rate","ok":false,"why":"Cardiac output = blood moved in one minute = SV × HR. Example: SV 80 mL, HR 70 → 5600 mL = 5.6 L/min."},{"t":"Systolic pressure times pulse pressure","ok":false,"why":"Cardiac output = blood moved in one minute = SV × HR. Example: SV 80 mL, HR 70 → 5600 mL = 5.6 L/min."}]},{"ch":"circ","q":"More blood fills the heart, stretching the muscle like a rubber band. What snap did he teach?","opts":[{"t":"A stronger contraction","ok":true,"why":"Frank-Starling / Starling’s law: heart like a rubber band — stretch more (more fill) → stronger snap; little fill → weak snap. Preload = how much blood is returning to / filling the heart."},{"t":"A weaker contraction","ok":false,"why":"Frank-Starling / Starling’s law: heart like a rubber band — stretch more (more fill) → stronger snap; little fill → weak snap. Preload = how much blood is returning to / filling the heart."},{"t":"A slower heart rate","ok":false,"why":"Frank-Starling / Starling’s law: heart like a rubber band — stretch more (more fill) → stronger snap; little fill → weak snap. Preload = how much blood is returning to / filling the heart."},{"t":"A wider aortic pipe","ok":false,"why":"Frank-Starling / Starling’s law: heart like a rubber band — stretch more (more fill) → stronger snap; little fill → weak snap. Preload = how much blood is returning to / filling the heart."}]},{"ch":"circ","q":"Anaphylaxis opens the pipes wide. What happens to pressure in that story?","opts":[{"t":"Pressure falls as the vessels dilate","ok":true,"why":"Vasodilation = bigger pipes = lower pressure. Anaphylaxis: widespread vasodilation. EpiPen one job named: massive vasoconstriction."},{"t":"Pressure rises as the vessels dilate","ok":false,"why":"Vasodilation = bigger pipes = lower pressure. Anaphylaxis: widespread vasodilation. EpiPen one job named: massive vasoconstriction."},{"t":"Pressure falls as the vessels constrict","ok":false,"why":"Vasodilation = bigger pipes = lower pressure. Anaphylaxis: widespread vasodilation. EpiPen one job named: massive vasoconstriction."},{"t":"Pressure stays flat as stroke volume rises","ok":false,"why":"Vasodilation = bigger pipes = lower pressure. Anaphylaxis: widespread vasodilation. EpiPen one job named: massive vasoconstriction."}]},{"ch":"circ","q":"Which abdominal set did he call the solid, blood-saturated bleeders?","opts":[{"t":"Spleen, liver, pancreas, kidneys","ok":true,"why":"Solid (blood-saturated / “the bleeders”): spleen, liver, pancreas, kidneys. Lots of blood in them. Damage → major internal bleed. Hollow → major internal infection."},{"t":"Stomach, intestines, bladder, gallbladder","ok":false,"why":"Solid (blood-saturated / “the bleeders”): spleen, liver, pancreas, kidneys. Lots of blood in them. Damage → major internal bleed. Hollow → major internal infection."},{"t":"Alveoli, bronchioles, trachea, larynx","ok":false,"why":"Solid (blood-saturated / “the bleeders”): spleen, liver, pancreas, kidneys. Lots of blood in them. Damage → major internal bleed. Hollow → major internal infection."},{"t":"Aorta, vena cava, and the heart chambers","ok":false,"why":"Solid (blood-saturated / “the bleeders”): spleen, liver, pancreas, kidneys. Lots of blood in them. Damage → major internal bleed. Hollow → major internal infection."}]},{"ch":"circ","q":"Where on the vessel tree does gas actually move between blood and cells (or alveoli)?","opts":[{"t":"Only at the capillaries","ok":true,"why":"Gas exchange on the blood side happens only at capillaries. Not in the aorta, not in other arteries."},{"t":"Only in the left ventricle","ok":false,"why":"Gas exchange on the blood side happens only at capillaries. Not in the aorta, not in other arteries."},{"t":"All along the aorta","ok":false,"why":"Gas exchange on the blood side happens only at capillaries. Not in the aorta, not in other arteries."},{"t":"All along every vein","ok":false,"why":"Gas exchange on the blood side happens only at capillaries. Not in the aorta, not in other arteries."}]},{"ch":"circ","q":"About how long does a red cell last before the spleen pulls it?","opts":[{"t":"About 120 days","ok":true,"why":"RBC lifespan: about 120 days. Spleen removes old RBCs. Bones produce new RBCs."},{"t":"About 30 days","ok":false,"why":"RBC lifespan: about 120 days. Spleen removes old RBCs. Bones produce new RBCs."},{"t":"About 7 days","ok":false,"why":"RBC lifespan: about 120 days. Spleen removes old RBCs. Bones produce new RBCs."},{"t":"Until the first injury","ok":false,"why":"RBC lifespan: about 120 days. Spleen removes old RBCs. Bones produce new RBCs."}]},{"ch":"circ","q":"A wound pulses bright red with each beat. Which bleed matches his pair?","opts":[{"t":"Arterial: bright and spurting with the left ventricle","ok":true,"why":"Arterial bleed: bright red (high O2) + spurting (pressure, each LV pump). Venous bleed: darker red + flowing / oozing."},{"t":"Venous: darker and flowing or oozing steadily","ok":false,"why":"Arterial bleed: bright red (high O2) + spurting (pressure, each LV pump). Venous bleed: darker red + flowing / oozing."},{"t":"Capillary: bright and spurting with the right atrium","ok":false,"why":"Arterial bleed: bright red (high O2) + spurting (pressure, each LV pump). Venous bleed: darker red + flowing / oozing."},{"t":"Solid-organ: darker and flowing without pressure","ok":false,"why":"Arterial bleed: bright red (high O2) + spurting (pressure, each LV pump). Venous bleed: darker red + flowing / oozing."}]},{"ch":"circ","q":"The superior vena cava is emptying. From where, and into which part of the right atrium?","opts":[{"t":"Head and arms into the top of the RA","ok":true,"why":"Superior vena cava: upper body (head, arms) into top of RA. Inferior vena cava: lower body into bottom of RA."},{"t":"Legs and pelvis into the bottom of the RA","ok":false,"why":"Superior vena cava: upper body (head, arms) into top of RA. Inferior vena cava: lower body into bottom of RA."},{"t":"Lungs into the top of the left atrium","ok":false,"why":"Superior vena cava: upper body (head, arms) into top of RA. Inferior vena cava: lower body into bottom of RA."},{"t":"Coronary surface into the left ventricle","ok":false,"why":"Superior vena cava: upper body (head, arms) into top of RA. Inferior vena cava: lower body into bottom of RA."}]},{"ch":"circ","q":"Stroke volume 80 mL and heart rate 70. What cardiac output did he work?","opts":[{"t":"5.6 L/min","ok":true,"why":"SV 80 mL, HR 70 → 5600 mL = 5.6 L/min. Adult blood volume about five to six liters."},{"t":"8.0 L/min","ok":false,"why":"SV 80 mL, HR 70 → 5600 mL = 5.6 L/min. Adult blood volume about five to six liters."},{"t":"2.5 L/min","ok":false,"why":"SV 80 mL, HR 70 → 5600 mL = 5.6 L/min. Adult blood volume about five to six liters."},{"t":"12 L/min","ok":false,"why":"SV 80 mL, HR 70 → 5600 mL = 5.6 L/min. Adult blood volume about five to six liters."}]},{"ch":"circ","q":"Bleeding drops how much blood is coming back to fill the heart. Which term is that fill?","opts":[{"t":"Preload — return volume filling the chambers","ok":true,"why":"Preload = how much blood is returning to / filling the heart. More in → more out. Bleeding = decreased preload."},{"t":"Afterload — how tight the arteries are ahead","ok":false,"why":"Preload = how much blood is returning to / filling the heart. More in → more out. Bleeding = decreased preload."},{"t":"AV delay — the pause so ventricles can fill","ok":false,"why":"Preload = how much blood is returning to / filling the heart. More in → more out. Bleeding = decreased preload."},{"t":"Wall mass — how thick the left ventricle is","ok":false,"why":"Preload = how much blood is returning to / filling the heart. More in → more out. Bleeding = decreased preload."}]},{"ch":"circ","q":"Which node parks the impulse for a split second so the ventricles can fill, then fires?","opts":[{"t":"AV node","ok":true,"why":"AV node: holds the impulse a split second so ventricles fill, then fires through ventricles. SA node is the primary pacemaker."},{"t":"SA node","ok":false,"why":"AV node: holds the impulse a split second so ventricles fill, then fires through ventricles. SA node is the primary pacemaker."},{"t":"Pulmonic node","ok":false,"why":"AV node: holds the impulse a split second so ventricles fill, then fires through ventricles. SA node is the primary pacemaker."},{"t":"Coronary node","ok":false,"why":"AV node: holds the impulse a split second so ventricles fill, then fires through ventricles. SA node is the primary pacemaker."}]},{"ch":"circ","q":"Heart-muscle cells are not fed by blood sitting in the chambers. Which vessel do the coronaries come off?","opts":[{"t":"Aorta, right as it leaves the heart","ok":true,"why":"Coronary arteries on the surface of the heart. Off the aorta immediately. Chamber blood does not feed the heart muscle cells."},{"t":"Pulmonary artery, right as it leaves the heart","ok":false,"why":"Coronary arteries on the surface of the heart. Off the aorta immediately. Chamber blood does not feed the heart muscle cells."},{"t":"Superior vena cava, as it enters the RA","ok":false,"why":"Coronary arteries on the surface of the heart. Off the aorta immediately. Chamber blood does not feed the heart muscle cells."},{"t":"Inferior vena cava, as it enters the RA","ok":false,"why":"Coronary arteries on the surface of the heart. Off the aorta immediately. Chamber blood does not feed the heart muscle cells."}]},{"ch":"circ","q":"Trauma patient takes anticoagulants. Why did he say bleeding is worse?","opts":[{"t":"They cannot form clots, so the bleed is hard to stop","ok":true,"why":"Blood thinners take away the body’s ability to form clots. Worse in trauma — uncontrolled bleed because they can’t clot."},{"t":"They cannot form pulses, so the SA node is hard to find","ok":false,"why":"Blood thinners take away the body’s ability to form clots. Worse in trauma — uncontrolled bleed because they can’t clot."},{"t":"They cannot drop preload, so stroke volume doubles","ok":false,"why":"Blood thinners take away the body’s ability to form clots. Worse in trauma — uncontrolled bleed because they can’t clot."},{"t":"They cannot slow the rate, so tachycardia always starts first","ok":false,"why":"Blood thinners take away the body’s ability to form clots. Worse in trauma — uncontrolled bleed because they can’t clot."}]},{"ch":"circ","q":"You tuck fingers under the biceps and press against the humerus. Which pulse is that?","opts":[{"t":"Brachial (under biceps / humerus)","ok":true,"why":"Brachial (tucked under the bicep; squeeze against the humerus). Radial = wrist; carotid = neck; femoral = just inside the groin."},{"t":"Radial (at the wrist)","ok":false,"why":"Brachial (tucked under the bicep; squeeze against the humerus). Radial = wrist; carotid = neck; femoral = just inside the groin."},{"t":"Carotid (in the neck)","ok":false,"why":"Brachial (tucked under the bicep; squeeze against the humerus). Radial = wrist; carotid = neck; femoral = just inside the groin."},{"t":"Femoral (inside the groin)","ok":false,"why":"Brachial (tucked under the bicep; squeeze against the humerus). Radial = wrist; carotid = neck; femoral = just inside the groin."}]},{"ch":"circ","q":"The top number of a blood pressure is the bigger one. Which event is it?","opts":[{"t":"Left ventricle pumping","ok":true,"why":"Top number (always bigger): pressure when the left ventricle pumps (example 120). Bottom: when the LV relaxes and fills (example 80)."},{"t":"Left ventricle filling","ok":false,"why":"Top number (always bigger): pressure when the left ventricle pumps (example 120). Bottom: when the LV relaxes and fills (example 80)."},{"t":"Right atrium filling","ok":false,"why":"Top number (always bigger): pressure when the left ventricle pumps (example 120). Bottom: when the LV relaxes and fills (example 80)."},{"t":"SA node firing only","ok":false,"why":"Top number (always bigger): pressure when the left ventricle pumps (example 120). Bottom: when the LV relaxes and fills (example 80)."}]},{"ch":"circ","q":"A damaged spleen is a bleeder. On the patient’s body, which quadrant?","opts":[{"t":"LUQ — patient’s left upper","ok":true,"why":"Spleen = LUQ, patient’s left. Solid / blood-saturated. Damaged spleen = major internal bleed."},{"t":"RUQ — patient’s right upper","ok":false,"why":"Spleen = LUQ, patient’s left. Solid / blood-saturated. Damaged spleen = major internal bleed."},{"t":"RLQ — patient’s right lower","ok":false,"why":"Spleen = LUQ, patient’s left. Solid / blood-saturated. Damaged spleen = major internal bleed."},{"t":"LLQ — only if the spleen is enlarged","ok":false,"why":"Spleen = LUQ, patient’s left. Solid / blood-saturated. Damaged spleen = major internal bleed."}]},{"ch":"circ","q":"Stomach acid leaks after a puncture. What main problem did he hang on hollow organs?","opts":[{"t":"Major internal infection","ok":true,"why":"Hollow (example stomach has acid) → acid leaks → major internal infection. Solid = bleed; hollow = infection."},{"t":"Major internal bleeding","ok":false,"why":"Hollow (example stomach has acid) → acid leaks → major internal infection. Solid = bleed; hollow = infection."},{"t":"Sudden high blood pressure","ok":false,"why":"Hollow (example stomach has acid) → acid leaks → major internal infection. Solid = bleed; hollow = infection."},{"t":"Sudden rapid clotting","ok":false,"why":"Hollow (example stomach has acid) → acid leaks → major internal infection. Solid = bleed; hollow = infection."}]},{"ch":"airway","q":"Unresponsive patient’s muscles go slack. What is the most common airway block he named?","opts":[{"t":"The tongue falling back","ok":true,"why":"Most common block is the tongue; muscles relax in unresponsive patients and the tongue falls back blocking the airway."},{"t":"A foreign body lodging","ok":false,"why":"Most common block is the tongue; muscles relax in unresponsive patients and the tongue falls back blocking the airway."},{"t":"The larynx clamping shut","ok":false,"why":"Most common block is the tongue; muscles relax in unresponsive patients and the tongue falls back blocking the airway."},{"t":"The airway swelling from infection","ok":false,"why":"Most common block is the tongue; muscles relax in unresponsive patients and the tongue falls back blocking the airway."}]},{"ch":"airway","q":"You suspect head, neck, or spine trauma. Which opener did he want — and which move is off the table?","opts":[{"t":"Jaw thrust; do not tilt the head","ok":true,"why":"Jaw thrust for suspected trauma to head/neck/spine; no head tilt."},{"t":"Head-tilt chin-lift; do not thrust the jaw","ok":false,"why":"Jaw thrust for suspected trauma to head/neck/spine; no head tilt."},{"t":"Recovery roll first; do not open the airway","ok":false,"why":"Jaw thrust for suspected trauma to head/neck/spine; no head tilt."},{"t":"NPA first; do not use any manual opener","ok":false,"why":"Jaw thrust for suspected trauma to head/neck/spine; no head tilt."}]},{"ch":"airway","q":"No trauma story. Which patient is the head-tilt chin-lift for?","opts":[{"t":"A medical patient without trauma","ok":true,"why":"Head-tilt chin-lift is for medical patients / no trauma."},{"t":"A trauma patient with spine risk","ok":false,"why":"Head-tilt chin-lift is for medical patients / no trauma."},{"t":"Only a child, never an adult","ok":false,"why":"Head-tilt chin-lift is for medical patients / no trauma."},{"t":"Every unresponsive patient, trauma or not","ok":false,"why":"Head-tilt chin-lift is for medical patients / no trauma."}]},{"ch":"airway","q":"You reach for an OPA. Which patient is the indication he taught?","opts":[{"t":"Unresponsive and no gag reflex","ok":true,"why":"OPA for patients who do not have a gag reflex; unresponsive + no gag."},{"t":"Awake, snoring, gag still present","ok":false,"why":"OPA for patients who do not have a gag reflex; unresponsive + no gag."},{"t":"Conscious and protecting the airway","ok":false,"why":"OPA for patients who do not have a gag reflex; unresponsive + no gag."},{"t":"Anyone who might need oxygen later","ok":false,"why":"OPA for patients who do not have a gag reflex; unresponsive + no gag."}]},{"ch":"airway","q":"Gag reflex is still there but they cannot keep the airway open. Which adjunct?","opts":[{"t":"NPA (nose adjunct)","ok":true,"why":"Gag reflex present = NPA; for patients who still have a gag but cannot keep airway open."},{"t":"OPA (mouth adjunct)","ok":false,"why":"Gag reflex present = NPA; for patients who still have a gag but cannot keep airway open."},{"t":"BVM with no adjunct","ok":false,"why":"Gag reflex present = NPA; for patients who still have a gag but cannot keep airway open."},{"t":"Simple face mask only","ok":false,"why":"Gag reflex present = NPA; for patients who still have a gag but cannot keep airway open."}]},{"ch":"airway","q":"You size a nasopharyngeal airway. Which measure did he give?","opts":[{"t":"Nose to the earlobe","ok":true,"why":"Measure: nose to earlobe."},{"t":"Nose to the chin tip","ok":false,"why":"Measure: nose to earlobe."},{"t":"Mouth corner to the earlobe","ok":false,"why":"Measure: nose to earlobe."},{"t":"Nose tip to the jaw angle","ok":false,"why":"Measure: nose to earlobe."}]},{"ch":"airway","q":"Pulse ox is the target he stated in class. Which floor?","opts":[{"t":"94% or higher","ok":true,"why":"SpO2 goal: 94% or above."},{"t":"92% or higher","ok":false,"why":"SpO2 goal: 94% or above."},{"t":"90% or higher","ok":false,"why":"SpO2 goal: 94% or above."},{"t":"100% only","ok":false,"why":"SpO2 goal: 94% or above."}]},{"ch":"airway","q":"Most patients get a non-rebreather. Which flow did he assign it?","opts":[{"t":"10–15 L/min","ok":true,"why":"NRB 10–15 L/min; most patients get NRB."},{"t":"2–6 L/min","ok":false,"why":"NRB 10–15 L/min; most patients get NRB."},{"t":"6–10 L/min","ok":false,"why":"NRB 10–15 L/min; most patients get NRB."},{"t":"15–25 L/min","ok":false,"why":"NRB 10–15 L/min; most patients get NRB."}]},{"ch":"airway","q":"Breathing is inadequate or absent. What BVM flow did he give?","opts":[{"t":"15 L/min","ok":true,"why":"BVM at 15 L/min for inadequate or not breathing."},{"t":"10–15 L/min","ok":false,"why":"BVM at 15 L/min for inadequate or not breathing."},{"t":"2–6 L/min","ok":false,"why":"BVM at 15 L/min for inadequate or not breathing."},{"t":"5–10 L/min","ok":false,"why":"BVM at 15 L/min for inadequate or not breathing."}]},{"ch":"airway","q":"You choose a nasal cannula. Which liter range is from this lecture?","opts":[{"t":"2–6 L/min","ok":true,"why":"Nasal cannula 2–6 L/min."},{"t":"1–4 L/min","ok":false,"why":"Nasal cannula 2–6 L/min."},{"t":"6–10 L/min","ok":false,"why":"Nasal cannula 2–6 L/min."},{"t":"10–15 L/min","ok":false,"why":"Nasal cannula 2–6 L/min."}]},{"ch":"airway","q":"Catheter is going in to clear the mouth. When is suction on?","opts":[{"t":"Only while withdrawing","ok":true,"why":"Suction only on the way out; do not suction on the way in because that pushes stuff down into the lungs."},{"t":"Only while inserting","ok":false,"why":"Suction only on the way out; do not suction on the way in because that pushes stuff down into the lungs."},{"t":"The whole time it is in","ok":false,"why":"Suction only on the way out; do not suction on the way in because that pushes stuff down into the lungs."},{"t":"On the way in and the way out","ok":false,"why":"Suction only on the way out; do not suction on the way in because that pushes stuff down into the lungs."}]},{"ch":"airway","q":"Adult suction run — ll moving air. Respiratory arrest: Stopped breathing completely."},{"t":"Complete airway obstruction","ok":false,"why":"Respiratory distress: Trouble breathing, still moving air. Respiratory arrest: Stopped breathing completely."},{"t":"Need for immediate CPR","ok":false,"why":"Respiratory distress: Trouble breathing, still moving air. Respiratory arrest: Stopped breathing completely."}]},{"ch":"airway","q":"He called one distress posture a good one to look for. Which is it?","opts":[{"t":"Tripod: sitting up and leaning forward","ok":true,"why":"Sitting upright, leaning forward — tripod (he called this a good one to look for)."},{"t":"Supine: flat with no pulse at all","ok":false,"why":"Sitting upright, leaning forward — tripod (he called this a good one to look for)."},{"t":"Pale: skin color change without cyanosis","ok":false,"why":"Sitting upright, leaning forward — tripod (he called this a good one to look for)."},{"t":"Bradypnea: only a slow breathing rate","ok":false,"why":"Sitting upright, leaning forward — tripod (he called this a good one to look for)."}]},{"ch":"airway","q":"You want the rigid suction tip, not the flexible one. Which name?","opts":[{"t":"Yankauer (rigid)","ok":true,"why":"Rigid suction catheter = Yankauer. Flexible = French."},{"t":"French (flexible)","ok":false,"why":"Rigid suction catheter = Yankauer. Flexible = French."},{"t":"NPA (nasal airway)","ok":false,"why":"Rigid suction catheter = Yankauer. Flexible = French."},{"t":"OPA (oral airway)","ok":false,"why":"Rigid suction catheter = Yankauer. Flexible = French."}]},{"ch":"airway","q":"Distress signs he listed get the same package. Which set?","opts":[{"t":"Open the airway, give O2, assist breaths, watch SpO2, listen","ok":true,"why":"Treat all of these the same: Open the airway; give oxygen; assist ventilations; watch oxygen saturation; listen to breath sounds; help them with that."},{"t":"Leave the airway, give O2, skip breaths, watch SpO2, listen","ok":false,"why":"Treat all of these the same: Open the airway; give oxygen; assist ventilations; watch oxygen saturation; listen to breath sounds; help them with that."},{"t":"Open the airway, skip O2, assist breaths, ignore SpO2, listen","ok":false,"why":"Treat all of these the same: Open the airway; give oxygen; assist ventilations; watch oxygen saturation; listen to breath sounds; help them with that."},{"t":"Skip the airway, skip O2, start CPR, ignore SpO2, skip sounds","ok":false,"why":"Treat all of these the same: Open the airway; give oxygen; assist ventilations; watch oxygen saturation; listen to breath sounds; help them with that."}]}];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

const CH_NAME = {
  circ: "Circulatory · Ch 6",
  airway: "Airway · Ch 7"
};

let queue = [];
let i = 0;
let correct = 0;
let answered = 0;
let locked = false;
let missed = [];

function $(id) { return document.getElementById(id); }

function start() {
  queue = shuffle(BANK).map(function(q) {
    return { ch: q.ch, q: q.q, opts: shuffle(q.opts) };
  });
  i = 0; correct = 0; answered = 0; locked = false; missed = [];
  $("nextBtn").textContent = "Next";
  render();
}

function updateScore() {
  $("score").textContent = correct + " / " + answered;
  const n = queue.length;
  $("progLabel").textContent = (i < n) ? ("Question " + (i + 1) + " of " + n) : ("Done · " + n + " questions");
  $("progBar").style.width = (n ? Math.round(((i + (locked ? 1 : 0)) / n) * 100) : 0) + "%";
}

function render() {
  locked = false;
  $("nextBtn").classList.remove("visible");
  if (i >= queue.length) { return endScreen(); }
  const q = queue[i];
  const letters = ["A", "B", "C", "D"];
  let optsHtml = "";
  q.opts.forEach(function(o, idx) {
    optsHtml += '<button type="button" class="opt" data-idx="' + idx + '">'
      + '<span class="letter">' + letters[idx] + '</span>'
      + '<span class="ot"></span></button>';
  });
  $("main").innerHTML =
    '<div class="card">'
    + '<div class="ch-tag">' + (CH_NAME[q.ch] || q.ch) + '</div>'
    + '<p class="qtext"></p>'
    + '<div class="opts">' + optsHtml + '</div>'
    + '<div class="why" id="whyBox"></div>'
    + '</div>'
    + '<p id="start-note">Answers lock on the first tap. Explanations come from Saturday lecture only.</p>';
  $("main").querySelector(".qtext").textContent = q.q;
  const buttons = $("main").querySelectorAll(".opt");
  buttons.forEach(function(btn, idx) {
    btn.querySelector(".ot").textContent = q.opts[idx].t;
    btn.addEventListener("click", function() { pick(idx); });
  });
  updateScore();
  window.scrollTo(0, 0);
}

function pick(idx) {
  if (locked) return;
  locked = true;
  const q = queue[i];
  const chosen = q.opts[idx];
  const correctOpt = q.opts.find(function(o) { return o.ok; });
  answered += 1;
  if (chosen.ok) correct += 1;
  else {
    missed.push({
      ch: q.ch,
      q: q.q,
      chosen: chosen.t,
      why: chosen.why,
      right: correctOpt.t
    });
  }
  const buttons = $("main").querySelectorAll(".opt");
  buttons.forEach(function(btn, j) {
    btn.classList.add("locked");
    btn.disabled = true;
    const o = q.opts[j];
    if (j === idx && o.ok) btn.classList.add("chosen", "right");
    else if (j === idx && !o.ok) btn.classList.add("chosen", "wrong");
    else if (o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box = $("whyBox");
  const verdict = chosen.ok
    ? '<div class="verdict ok">Correct</div>'
    : '<div class="verdict bad">Incorrect</div>';
  const extra = chosen.ok ? "" :
    '<div class="correct-line">Correct answer: ' + escapeHtml(correctOpt.t) + '</div>';
  box.innerHTML = verdict + '<div class="why-body"></div>' + extra;
  box.querySelector(".why-body").textContent = chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent = (i + 1 >= queue.length) ? "See results" : "Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function endScreen() {
  locked = true;
  $("nextBtn").classList.remove("visible");
  const n = queue.length;
  const pct = n ? Math.round((correct / n) * 100) : 0;
  let missHtml = "";
  if (missed.length === 0) {
    missHtml = '<p>No missed questions. Nice work.</p>';
  } else {
    missHtml = '<div class="miss"><h3>Missed questions (' + missed.length + ')</h3>';
    missed.forEach(function(m) {
      missHtml += '<div class="miss-item">'
        + '<div class="ch-tag">' + (CH_NAME[m.ch] || m.ch) + '</div>'
        + '<div class="mq"></div>'
        + '<div class="mwhy"></div>'
        + '</div>';
    });
    missHtml += '</div>';
  }
  $("main").innerHTML =
    '<div class="card end">'
    + '<h2>Quiz complete</h2>'
    + '<div class="big">' + correct + ' / ' + n + '</div>'
    + '<div class="pct">' + pct + '% · Saturday lecture only</div>'
    + missHtml
    + '<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button>'
    + '</div>';
  if (missed.length) {
    const items = $("main").querySelectorAll(".miss-item");
    missed.forEach(function(m, idx) {
      items[idx].querySelector(".mq").textContent = m.q;
      items[idx].querySelector(".mwhy").textContent =
        "You chose: " + m.chosen + " — " + m.why + "  Correct: " + m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore();
  window.scrollTo(0, 0);
}

$("nextBtn").addEventListener("click", function() {
  if (!locked) return;
  i += 1;
  render();
});

start();
</script>
