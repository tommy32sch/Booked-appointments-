<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Sun 0931 — reassessment</title>
<style>
:root {
  --bg: #f4efe6;
  --paper: #fffdf8;
  --ink: #1c2430;
  --muted: #5a6573;
  --navy: #1e3a5f;
  --navy-2: #16304d;
  --red: #b42318;
  --red-soft: #fde8e6;
  --green: #1b7a46;
  --green-soft: #e5f6ec;
  --line: #d8d0c4;
  --chosen-wrong: #f8d7d4;
  --chosen-right: #c8edd4;
  --correct-outline: #1b7a46;
  --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; font-weight: 400; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.ch-tag {
  display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: #e8eef6; color: var(--navy); padding: 4px 8px; border-radius: 6px; margin-bottom: 10px;
}
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: block; width: 100%; text-align: left;
  min-height: 48px; padding: 12px 14px;
  font-size: 1rem; line-height: 1.35;
  border: 2px solid var(--line); border-radius: 12px;
  background: #fff; color: var(--ink);
  cursor: pointer; appearance: none;
  font-family: inherit;
}
.opt:active { transform: scale(.995); }
.opt .letter {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: #eef2f6; font-weight: 700; font-size: .85rem; margin-right: 8px; flex-shrink: 0;
}
.opt .ot { display: inline; }
.opt.locked { cursor: default; }
.opt.chosen.wrong { background: var(--chosen-wrong); border-color: var(--red); }
.opt.chosen.right, .opt.show-correct { background: var(--chosen-right); border-color: var(--correct-outline); }
.opt.dim { opacity: .55; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.why .correct-line { margin-top: 8px; font-weight: 650; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.btn:active { background: var(--navy-2); }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
.miss { margin-top: 18px; }
.miss h3 { margin: 0 0 10px; font-size: 1.05rem; }
.miss-item { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.miss-item .mq { font-weight: 650; margin-bottom: 6px; }
.miss-item .mwhy { font-size: .92rem; color: #333; }
.restart { margin-top: 8px; }
#start-note { font-size: .86rem; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Sun · reassessment</h1>
  <div class="sub">Recap only · you/your · 20 questions</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [{"ch":"clock","q":"How often do you reassess from this recap?","opts":[{"t":"Unstable every 15 minutes. Stable every 5","ok":false,"why":"Unstable/critical every 5 minutes \u2014 by the time you finish it is almost time to start again. Stable every 15."},{"t":"Unstable / critical every 5 minutes. Stable every 15 minutes","ok":true,"why":"Unstable/critical every 5 minutes \u2014 by the time you finish it is almost time to start again. Stable every 15."},{"t":"Everyone once per transport, no clock","ok":false,"why":"Unstable/critical every 5 minutes \u2014 by the time you finish it is almost time to start again. Stable every 15."},{"t":"Only if medical control texts you","ok":false,"why":"Unstable/critical every 5 minutes \u2014 by the time you finish it is almost time to start again. Stable every 15."}]},{"ch":"what","q":"What do you reassess each pass?","opts":[{"t":"Only blood pressure","ok":false,"why":"Airway, breathing, circulation, mental status, and full vital sets."},{"t":"ABCs, mental status, and a full set of vitals \u2014 not one number","ok":true,"why":"Airway, breathing, circulation, mental status, and full vital sets."},{"t":"Only the intervention you like most","ok":false,"why":"Airway, breathing, circulation, mental status, and full vital sets."},{"t":"Scene size-up only","ok":false,"why":"Airway, breathing, circulation, mental status, and full vital sets."}]},{"ch":"trend","q":"Why do two vital sets beat one?","opts":[{"t":"One set is a trend. Two sets are a snapshot","ok":false,"why":"One set = snapshot. Two+ = trends. Falling BP with rising HR and RR can mean they are heading toward shock."},{"t":"One set is a snapshot. Two or more sets show trends (for example BP down, HR and RR up toward shock)","ok":true,"why":"One set = snapshot. Two+ = trends. Falling BP with rising HR and RR can mean they are heading toward shock."},{"t":"Vitals never change in the ambulance","ok":false,"why":"One set = snapshot. Two+ = trends. Falling BP with rising HR and RR can mean they are heading toward shock."},{"t":"The second set replaces GCS","ok":false,"why":"One set = snapshot. Two+ = trends. Falling BP with rising HR and RR can mean they are heading toward shock."}]},{"ch":"reset","q":"They were talking and suddenly go unresponsive. What do you do?","opts":[{"t":"Finish SAMPLE, then check the airway","ok":false,"why":"Any significant change (better or worse) resets you to primary assessment, MS then ABCs."},{"t":"Immediately restart primary: mental status \u2192 airway \u2192 breathing \u2192 circulation","ok":true,"why":"Any significant change (better or worse) resets you to primary assessment, MS then ABCs."},{"t":"Give the next medication first","ok":false,"why":"Any significant change (better or worse) resets you to primary assessment, MS then ABCs."},{"t":"Wait 15 minutes because they were stable","ok":false,"why":"Any significant change (better or worse) resets you to primary assessment, MS then ABCs."}]},{"ch":"rosc","q":"You get a pulse back during CPR. Next move from this recap?","opts":[{"t":"Assume they are breathing normally and pack up","ok":false,"why":"ROSC is not automatic good breathing. Stop compressions, then full MS/ABC reassess. You may still need to ventilate."},{"t":"Keep compressing for 2 more minutes no matter what","ok":false,"why":"ROSC is not automatic good breathing. Stop compressions, then full MS/ABC reassess. You may still need to ventilate."},{"t":"Stop compressions, then reassess mental status, airway, breathing, and circulation \u2014 they may still need ventilations","ok":true,"why":"ROSC is not automatic good breathing. Stop compressions, then full MS/ABC reassess. You may still need to ventilate."},{"t":"Give a drug before you reassess breathing","ok":false,"why":"ROSC is not automatic good breathing. Stop compressions, then full MS/ABC reassess. You may still need to ventilate."}]},{"ch":"tq","q":"You placed a tourniquet. What are you rechecking?","opts":[{"t":"Only the patient\u2019s favorite color","ok":false,"why":"If you did it, you re-check it. Tourniquet: control, position, too loose or too tight."},{"t":"Bleeding still controlled, still positioned correctly, not too loose or too tight","ok":true,"why":"If you did it, you re-check it. Tourniquet: control, position, too loose or too tight."},{"t":"Whether you can take it off for comfort every 2 minutes","ok":false,"why":"If you did it, you re-check it. Tourniquet: control, position, too loose or too tight."},{"t":"Nothing \u2014 once it is on you ignore it","ok":false,"why":"If you did it, you re-check it. Tourniquet: control, position, too loose or too tight."}]},{"ch":"splint","q":"A splint that was fine is now tight. What do you check?","opts":[{"t":"Only the proximal joint","ok":false,"why":"Swelling can make a good splint too tight. Distal pulse, motor, sensation, cap refill, movement, new neuro or severe pain."},{"t":"Distal PMS, cap refill, wiggle fingers/toes, new numbness, tingling, or severe pain from compression","ok":true,"why":"Swelling can make a good splint too tight. Distal pulse, motor, sensation, cap refill, movement, new neuro or severe pain."},{"t":"GCS only","ok":false,"why":"Swelling can make a good splint too tight. Distal pulse, motor, sensation, cap refill, movement, new neuro or severe pain."},{"t":"Whether they still want the splint for fashion","ok":false,"why":"Swelling can make a good splint too tight. Distal pulse, motor, sensation, cap refill, movement, new neuro or severe pain."}]},{"ch":"meds","q":"Chest pain was 8/10 before nitro. How do you reassess the drug?","opts":[{"t":"Ask what the pain is now and look for improvement (8 to 5 is progress)","ok":true,"why":"Ask: your pain was 8/10; what is it now? 8 \u2192 5 shows progress. Also watch for adverse effects."},{"t":"Never ask a number again","ok":false,"why":"Ask: your pain was 8/10; what is it now? 8 \u2192 5 shows progress. Also watch for adverse effects."},{"t":"Assume it failed if they are still awake","ok":false,"why":"Ask: your pain was 8/10; what is it now? 8 \u2192 5 shows progress. Also watch for adverse effects."},{"t":"Recheck only blood glucose","ok":false,"why":"Ask: your pain was 8/10; what is it now? 8 \u2192 5 shows progress. Also watch for adverse effects."}]},{"ch":"gluc","q":"You gave oral glucose. What recheck is in this recap?","opts":[{"t":"Recheck blood glucose after treatment","ok":true,"why":"Low blood sugar: recheck glucose after oral glucose or other treatment."},{"t":"Recheck only pupils","ok":false,"why":"Low blood sugar: recheck glucose after oral glucose or other treatment."},{"t":"Never recheck sugar in the ambulance","ok":false,"why":"Low blood sugar: recheck glucose after oral glucose or other treatment."},{"t":"Recheck only the tourniquet","ok":false,"why":"Low blood sugar: recheck glucose after oral glucose or other treatment."}]},{"ch":"o2","q":"You started oxygen. What do you recheck?","opts":[{"t":"Only past medical history","ok":false,"why":"After O2: SpO2, respiratory status, work of breathing."},{"t":"SpO2, respiratory status, and work of breathing","ok":true,"why":"After O2: SpO2, respiratory status, work of breathing."},{"t":"Only whether the tank is pretty","ok":false,"why":"After O2: SpO2, respiratory status, work of breathing."},{"t":"Blood glucose only","ok":false,"why":"After O2: SpO2, respiratory status, work of breathing."}]},{"ch":"rest","q":"Restraints are on. What are you proving?","opts":[{"t":"They cannot feel or move anything","ok":false,"why":"Secure but not causing circulatory compromise. Distal circulation, sensation, movement."},{"t":"Still secure but not cutting circulation: distal CSM, cap refill, warmth, color, they can feel and move fingers and toes","ok":true,"why":"Secure but not causing circulatory compromise. Distal circulation, sensation, movement."},{"t":"They stay prone the whole ride","ok":false,"why":"Secure but not causing circulatory compromise. Distal circulation, sensation, movement."},{"t":"You never recheck restraints","ok":false,"why":"Secure but not causing circulatory compromise. Distal circulation, sensation, movement."}]},{"ch":"rule","q":"General rule for interventions on this recap?","opts":[{"t":"If you did it, you must re-check it: still working, still safe","ok":true,"why":"If you did it, you re-check it."},{"t":"Recheck only medications, never splints","ok":false,"why":"If you did it, you re-check it."},{"t":"Recheck only if the hospital asks","ok":false,"why":"If you did it, you re-check it."},{"t":"One check at the scene is enough forever","ok":false,"why":"If you did it, you re-check it."}]},{"ch":"nremt","q":"National Registry-style meds when the stem does not give orders?","opts":[{"t":"Give the drug first, call later if you remember","ok":false,"why":"Test world: assume you must contact medical control unless told you already have orders or protocol authorization."},{"t":"Assume online orders: contact medical control for permission before you give the drug","ok":true,"why":"Test world: assume you must contact medical control unless told you already have orders or protocol authorization."},{"t":"Street standing orders always apply on the test","ok":false,"why":"Test world: assume you must contact medical control unless told you already have orders or protocol authorization."},{"t":"EMTs never give any medication on a test","ok":false,"why":"Test world: assume you must contact medical control unless told you already have orders or protocol authorization."}]},{"ch":"nremt","q":"The stem says you have orders to give aspirin. Do you pick \u201ccall medical control first\u201d?","opts":[{"t":"Yes, always call twice","ok":false,"why":"If the question already gave you orders or protocol authorization, do not choose call medical control first."},{"t":"No. Orders already exist, so you do not need the call-first answer","ok":true,"why":"If the question already gave you orders or protocol authorization, do not choose call medical control first."},{"t":"Yes, because street protocols never exist","ok":false,"why":"If the question already gave you orders or protocol authorization, do not choose call medical control first."},{"t":"Skip aspirin and start CPR","ok":false,"why":"If the question already gave you orders or protocol authorization, do not choose call medical control first."}]},{"ch":"seq","q":"Which sequence is the safe exam order when you still need permission?","opts":[{"t":"Administer, contact medical control, reassess","ok":false,"why":"Contact \u2192 administer \u2192 reassess. Right pieces in the wrong order is a wrong answer."},{"t":"Reassess, administer, then maybe call","ok":false,"why":"Contact \u2192 administer \u2192 reassess. Right pieces in the wrong order is a wrong answer."},{"t":"Contact medical control, administer, reassess","ok":true,"why":"Contact \u2192 administer \u2192 reassess. Right pieces in the wrong order is a wrong answer."},{"t":"Administer only; never reassess","ok":false,"why":"Contact \u2192 administer \u2192 reassess. Right pieces in the wrong order is a wrong answer."}]},{"ch":"seq","q":"An option lists the right three med steps in the wrong order. How do you score it?","opts":[{"t":"Correct, because the pieces exist","ok":false,"why":"Do not ask \u201care these steps roughly right?\u201d Ask if the order is correct. Wrong order = wrong answer."},{"t":"Wrong. Order matters on the exam","ok":true,"why":"Do not ask \u201care these steps roughly right?\u201d Ask if the order is correct. Wrong order = wrong answer."},{"t":"Half credit","ok":false,"why":"Do not ask \u201care these steps roughly right?\u201d Ask if the order is correct. Wrong order = wrong answer."},{"t":"Correct if you feel rushed","ok":false,"why":"Do not ask \u201care these steps roughly right?\u201d Ask if the order is correct. Wrong order = wrong answer."}]},{"ch":"goal","q":"What do reassessment, ABCs, and vital trends feed?","opts":[{"t":"A formal hospital diagnosis you must name in Latin","ok":false,"why":"Core goal: what is going on with my patient, and what am I going to do for them?"},{"t":"A field impression and the treatments you are going to do","ok":true,"why":"Core goal: what is going on with my patient, and what am I going to do for them?"},{"t":"Only the billing sheet","ok":false,"why":"Core goal: what is going on with my patient, and what am I going to do for them?"},{"t":"Whether you can skip the primary next time","ok":false,"why":"Core goal: what is going on with my patient, and what am I going to do for them?"}]},{"ch":"full","q":"A new full vital set on reassess includes which extras from this recap?","opts":[{"t":"Only heart rate","ok":false,"why":"Full sets, then ask better, worse, or unchanged."},{"t":"BP, HR, RR, SpO2 if available, glucose if indicated, pain 0\u201310, then compare to the last set","ok":true,"why":"Full sets, then ask better, worse, or unchanged."},{"t":"Only a GCS without vitals","ok":false,"why":"Full sets, then ask better, worse, or unchanged."},{"t":"Scene safety numbers","ok":false,"why":"Full sets, then ask better, worse, or unchanged."}]},{"ch":"who","q":"Who is \u201cunstable\u201d enough for the 5-minute clock in the checklist?","opts":[{"t":"Only a sprained ankle with normal vitals","ok":false,"why":"Unstable/critical examples in the recap: shock, severe trauma, concerning chest pain, altered mental status."},{"t":"Shock, severe trauma, chest pain with concerning signs, altered mental status, and similar critical patients","ok":true,"why":"Unstable/critical examples in the recap: shock, severe trauma, concerning chest pain, altered mental status."},{"t":"Anyone who is improving with normal vitals","ok":false,"why":"Unstable/critical examples in the recap: shock, severe trauma, concerning chest pain, altered mental status."},{"t":"Only patients who refuse care","ok":false,"why":"Unstable/critical examples in the recap: shock, severe trauma, concerning chest pain, altered mental status."}]},{"ch":"abc","q":"Circulation recheck on the pass includes which list?","opts":[{"t":"Only bowel sounds","ok":false,"why":"Circulation: pulse, skin signs, major bleeding."},{"t":"Pulse rate/rhythm/quality, skin color/temp/condition, new or ongoing major bleeding","ok":true,"why":"Circulation: pulse, skin signs, major bleeding."},{"t":"Only the pain score","ok":false,"why":"Circulation: pulse, skin signs, major bleeding."},{"t":"Only whether they can sing","ok":false,"why":"Circulation: pulse, skin signs, major bleeding."}]}];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"clock":"Clock","what":"What to recheck","trend":"Trends","reset":"Reset","rosc":"ROSC","tq":"Tourniquet","splint":"Splint","meds":"Meds","gluc":"Glucose","o2":"Oxygen","rest":"Restraints","rule":"Rule","nremt":"Exam meds","seq":"Sequence","goal":"Goal","full":"Vitals","who":"Unstable","abc":"Circulation"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the 9:31 reassessment recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · reassessment recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
</body>
</html>
