<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="light">
<title>Sun 0802 — assessment overview</title>
<style>
:root {
  --bg: #f4efe6;
  --paper: #fffdf8;
  --ink: #1c2430;
  --muted: #5a6573;
  --navy: #1e3a5f;
  --navy-2: #16304d;
  --red: #b42318;
  --red-soft: #fde8e6;
  --green: #1b7a46;
  --green-soft: #e5f6ec;
  --line: #d8d0c4;
  --chosen-wrong: #f8d7d4;
  --chosen-right: #c8edd4;
  --correct-outline: #1b7a46;
  --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; font-weight: 400; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.ch-tag {
  display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: #e8eef6; color: var(--navy); padding: 4px 8px; border-radius: 6px; margin-bottom: 10px;
}
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: block; width: 100%; text-align: left;
  min-height: 48px; padding: 12px 14px;
  font-size: 1rem; line-height: 1.35;
  border: 2px solid var(--line); border-radius: 12px;
  background: #fff; color: var(--ink);
  cursor: pointer; appearance: none;
  font-family: inherit;
}
.opt:active { transform: scale(.995); }
.opt .letter {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: #eef2f6; font-weight: 700; font-size: .85rem; margin-right: 8px; flex-shrink: 0;
}
.opt .ot { display: inline; }
.opt.locked { cursor: default; }
.opt.chosen.wrong { background: var(--chosen-wrong); border-color: var(--red); }
.opt.chosen.right, .opt.show-correct { background: var(--chosen-right); border-color: var(--correct-outline); }
.opt.dim { opacity: .55; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.why .correct-line { margin-top: 8px; font-weight: 650; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.btn:active { background: var(--navy-2); }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
.miss { margin-top: 18px; }
.miss h3 { margin: 0 0 10px; font-size: 1.05rem; }
.miss-item { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.miss-item .mq { font-weight: 650; margin-bottom: 6px; }
.miss-item .mwhy { font-size: .92rem; color: #333; }
.restart { margin-top: 8px; }
#start-note { font-size: .86rem; color: var(--muted); margin: 10px 0 0; }
</style>
</head>

<script>
const BANK = [{"ch":"flow","q":"What is the six-step assessment order from this recap?","opts":[{"t":"Primary, scene, history, secondary, reassess, impression","ok":false,"why":"Order: scene size-up, primary, history (OPQRST and SAMPLE), secondary, field impression and interventions, reassessment."},{"t":"Scene, history, primary, secondary, impression, reassess","ok":false,"why":"Order: scene size-up, primary, history (OPQRST and SAMPLE), secondary, field impression and interventions, reassessment."},{"t":"Scene, primary, history, secondary, field impression and interventions, reassessment","ok":true,"why":"Order: scene size-up, primary, history (OPQRST and SAMPLE), secondary, field impression and interventions, reassessment."},{"t":"History, scene, secondary, primary, impression, reassess","ok":false,"why":"Order: scene size-up, primary, history (OPQRST and SAMPLE), secondary, field impression and interventions, reassessment."}]},{"ch":"scene","q":"You have not touched the patient yet. Which scene pack matches this recap?","opts":[{"t":"BSI, scene safety, MOI/NOI, number of patients, extra resources","ok":true,"why":"Scene before contact: BSI/PPE, safety for you/partner/patient/bystanders, MOI vs NOI, number of patients, extra resources."},{"t":"AVPU, OPQRST, SAMPLE, then BSI","ok":false,"why":"Scene before contact: BSI/PPE, safety for you/partner/patient/bystanders, MOI vs NOI, number of patients, extra resources."},{"t":"Full vitals, GCS, then decide if the scene is safe","ok":false,"why":"Scene before contact: BSI/PPE, safety for you/partner/patient/bystanders, MOI vs NOI, number of patients, extra resources."},{"t":"DCAP-BTLS on every region before you look at safety","ok":false,"why":"Scene before contact: BSI/PPE, safety for you/partner/patient/bystanders, MOI vs NOI, number of patients, extra resources."}]},{"ch":"scene","q":"When do you consider early law enforcement from this recap?","opts":[{"t":"Only after you finish a detailed head-to-toe","ok":false,"why":"Call law early if you suspect abuse/violence or the scene is unsafe or heating up."},{"t":"Abuse or violence suspected, or the scene feels unsafe or escalating","ok":true,"why":"Call law early if you suspect abuse/violence or the scene is unsafe or heating up."},{"t":"Every medical call so you have a witness","ok":false,"why":"Call law early if you suspect abuse/violence or the scene is unsafe or heating up."},{"t":"Only if the patient asks you to call police","ok":false,"why":"Call law early if you suspect abuse/violence or the scene is unsafe or heating up."}]},{"ch":"consent","q":"Alert and oriented \u00d74 versus confused / V / P / U \u2014 which consent pair?","opts":[{"t":"AOx4 is implied; V/P/U is expressed","ok":false,"why":"Alert and oriented \u00d74 \u2192 likely decision-making capacity \u2192 expressed consent. Confused / V / P / U \u2192 implied consent."},{"t":"Both are expressed if a family member is present","ok":false,"why":"Alert and oriented \u00d74 \u2192 likely decision-making capacity \u2192 expressed consent. Confused / V / P / U \u2192 implied consent."},{"t":"AOx4 is likely capacity and expressed consent; confused / V / P / U is implied consent","ok":true,"why":"Alert and oriented \u00d74 \u2192 likely decision-making capacity \u2192 expressed consent. Confused / V / P / U \u2192 implied consent."},{"t":"Consent waits until after the secondary exam","ok":false,"why":"Alert and oriented \u00d74 \u2192 likely decision-making capacity \u2192 expressed consent. Confused / V / P / U \u2192 implied consent."}]},{"ch":"airway","q":"Snoring, gurgling, and stridor without a stethoscope \u2014 what do they mean?","opts":[{"t":"Snoring is fluid, gurgling is tongue, stridor is wheeze in the chest","ok":false,"why":"Upper airway, no stethoscope: snoring = tongue; gurgling = fluid \u2192 suction; stridor = upper swelling/constriction."},{"t":"Snoring is tongue, gurgling is fluid so you suction, stridor is upper swelling","ok":true,"why":"Upper airway, no stethoscope: snoring = tongue; gurgling = fluid \u2192 suction; stridor = upper swelling/constriction."},{"t":"All three are lower-airway sounds you need a stethoscope for","ok":false,"why":"Upper airway, no stethoscope: snoring = tongue; gurgling = fluid \u2192 suction; stridor = upper swelling/constriction."},{"t":"Snoring is anaphylaxis, gurgling is asthma, stridor is pneumonia","ok":false,"why":"Upper airway, no stethoscope: snoring = tongue; gurgling = fluid \u2192 suction; stridor = upper swelling/constriction."}]},{"ch":"breath","q":"Adult breathing rate and the three lower-airway sounds from this recap?","opts":[{"t":"8\u201312. Wheeze is fluid, crackles are mucus, rhonchi are bronchoconstriction","ok":false,"why":"Adult normal 12\u201320. Stethoscope on the chest: wheeze = bronchoconstriction; crackles = fluid in alveoli; rhonchi = mucus/congestion."},{"t":"12\u201320. Wheeze is bronchoconstriction (often exhalation), crackles are alveolar fluid, rhonchi are mucus/congestion","ok":true,"why":"Adult normal 12\u201320. Stethoscope on the chest: wheeze = bronchoconstriction; crackles = fluid in alveoli; rhonchi = mucus/congestion."},{"t":"20\u201330. All three are heard without a stethoscope at the mouth","ok":false,"why":"Adult normal 12\u201320. Stethoscope on the chest: wheeze = bronchoconstriction; crackles = fluid in alveoli; rhonchi = mucus/congestion."},{"t":"12\u201320. Wheeze is tongue, crackles are stridor, rhonchi are gurgling","ok":false,"why":"Adult normal 12\u201320. Stethoscope on the chest: wheeze = bronchoconstriction; crackles = fluid in alveoli; rhonchi = mucus/congestion."}]},{"ch":"circ","q":"Adult pulse and what you do the moment you see major bleeding?","opts":[{"t":"40\u201360. Finish SAMPLE first, then dress the bleed","ok":false,"why":"Adult pulse 60\u2013100. Major bleeding is a life threat \u2014 stop and treat it when you see it."},{"t":"100\u2013140. Wait for the rapid scan","ok":false,"why":"Adult pulse 60\u2013100. Major bleeding is a life threat \u2014 stop and treat it when you see it."},{"t":"60\u2013100. Stop and treat the life threat as soon as you see it","ok":true,"why":"Adult pulse 60\u2013100. Major bleeding is a life threat \u2014 stop and treat it when you see it."},{"t":"60\u2013100. Document it and treat after the hospital handoff","ok":false,"why":"Adult pulse 60\u2013100. Major bleeding is a life threat \u2014 stop and treat it when you see it."}]},{"ch":"hx","q":"Which pair is OPQRST versus SAMPLE from this recap?","opts":[{"t":"OPQRST is allergies and meds; SAMPLE is onset and severity","ok":false,"why":"OPQRST = present illness, especially pain or breathing. SAMPLE = broader history (signs, allergies, meds, past hx, last oral, events)."},{"t":"OPQRST is present illness (pain/breathing); SAMPLE is the broader medical history","ok":true,"why":"OPQRST = present illness, especially pain or breathing. SAMPLE = broader history (signs, allergies, meds, past hx, last oral, events)."},{"t":"Both are only for trauma","ok":false,"why":"OPQRST = present illness, especially pain or breathing. SAMPLE = broader history (signs, allergies, meds, past hx, last oral, events)."},{"t":"SAMPLE replaces AVPU on medical calls","ok":false,"why":"OPQRST = present illness, especially pain or breathing. SAMPLE = broader history (signs, allergies, meds, past hx, last oral, events)."}]},{"ch":"legal","q":"They deny alcohol. You still suspect it. What does this recap want?","opts":[{"t":"Keep asking until they confess or you refuse transport","ok":false,"why":"Ask calmly. You may re-ask once, then drop it and write that they deny use. Reasonable decisions with the facts you had."},{"t":"You may re-ask once, then drop it and document that the patient denies alcohol or drug use","ok":true,"why":"Ask calmly. You may re-ask once, then drop it and write that they deny use. Reasonable decisions with the facts you had."},{"t":"Write that they are intoxicated as a fact","ok":false,"why":"Ask calmly. You may re-ask once, then drop it and write that they deny use. Reasonable decisions with the facts you had."},{"t":"Skip documentation so you are not liable","ok":false,"why":"Ask calmly. You may re-ask once, then drop it and write that they deny use. Reasonable decisions with the facts you had."}]},{"ch":"legal","q":"Suspected abuse \u2014 report and chart from this recap?","opts":[{"t":"Wait for proof. Writing a suspicion is defamation","ok":false,"why":"Mandatory report on suspicion. Reporting suspicion is not defamation. Defamation is stating false guilt as fact. Write what you see and quoted speech."},{"t":"Mandatory report of the suspicion. Chart observations and quotes, not \u201cthat person IS an abuser\u201d","ok":true,"why":"Mandatory report on suspicion. Reporting suspicion is not defamation. Defamation is stating false guilt as fact. Write what you see and quoted speech."},{"t":"Only report if the patient asks you to","ok":false,"why":"Mandatory report on suspicion. Reporting suspicion is not defamation. Defamation is stating false guilt as fact. Write what you see and quoted speech."},{"t":"Call medical control instead of authorities","ok":false,"why":"Mandatory report on suspicion. Reporting suspicion is not defamation. Defamation is stating false guilt as fact. Write what you see and quoted speech."}]},{"ch":"ob","q":"Childbearing-age female with lower abdominal pain. What do you ask?","opts":[{"t":"Nothing about pregnancy unless they volunteer it","ok":false,"why":"Treat them as possibly pregnant. Ask chance of pregnancy and last menstrual period. Document the answer they give."},{"t":"Any chance of pregnancy, and when was the last menstrual period","ok":true,"why":"Treat them as possibly pregnant. Ask chance of pregnancy and last menstrual period. Document the answer they give."},{"t":"Only STI history, never LMP","ok":false,"why":"Treat them as possibly pregnant. Ask chance of pregnancy and last menstrual period. Document the answer they give."},{"t":"Only if they are over 40","ok":false,"why":"Treat them as possibly pregnant. Ask chance of pregnancy and last menstrual period. Document the answer they give."}]},{"ch":"exam","q":"Focused exam versus detailed head-to-toe \u2014 who gets which?","opts":[{"t":"Focused for the unresponsive; detailed for every talking medical patient","ok":false,"why":"Focused = responsive medical who can point at the problem. Detailed = unresponsive, significant MOI (ejection, high speed, big fall), or suspected hidden/multiple injuries."},{"t":"Focused for a responsive medical patient who can localize; detailed for unresponsive, significant MOI, or hidden/multiple injuries","ok":true,"why":"Focused = responsive medical who can point at the problem. Detailed = unresponsive, significant MOI (ejection, high speed, big fall), or suspected hidden/multiple injuries."},{"t":"Always detailed so you never miss anything","ok":false,"why":"Focused = responsive medical who can point at the problem. Detailed = unresponsive, significant MOI (ejection, high speed, big fall), or suspected hidden/multiple injuries."},{"t":"Focused only after you give medications","ok":false,"why":"Focused = responsive medical who can point at the problem. Detailed = unresponsive, significant MOI (ejection, high speed, big fall), or suspected hidden/multiple injuries."}]},{"ch":"exam","q":"DCAP-BTLS letters from this recap?","opts":[{"t":"Deformities, contusions, abrasions, punctures/penetrations, burns, tenderness, lacerations, swelling","ok":true,"why":"Deformities, Contusions, Abrasions, Punctures/penetrations, Burns, Tenderness, Lacerations, Swelling. Compare sides."},{"t":"Distal, capillary, airway, pulse, blood, temperature, lungs, skin","ok":false,"why":"Deformities, Contusions, Abrasions, Punctures/penetrations, Burns, Tenderness, Lacerations, Swelling. Compare sides."},{"t":"Drugs, circulation, AVPU, pupils, blood sugar, tidal, lungs, SpO2","ok":false,"why":"Deformities, Contusions, Abrasions, Punctures/penetrations, Burns, Tenderness, Lacerations, Swelling. Compare sides."},{"t":"Deformities, cyanosis, apnea, pulse, breathing, tremor, limp, shock","ok":false,"why":"Deformities, Contusions, Abrasions, Punctures/penetrations, Burns, Tenderness, Lacerations, Swelling. Compare sides."}]},{"ch":"vitals","q":"Adult systolic band and the pediatric minimum under age 10?","opts":[{"t":"80\u2013140 adult. Ped min is age \u00d7 10","ok":false,"why":"Adult systolic 90\u2013120; <90 hypotension/shock; 120\u2013130 hypertension range. Under 10: 2\u00d7age+70. Age 10 hits 90, then adult cutoff."},{"t":"90\u2013120 adult. Under 90 is hypotension. Ped min = 2 \u00d7 age + 70. At 10 years you use the adult 90 cutoff","ok":true,"why":"Adult systolic 90\u2013120; <90 hypotension/shock; 120\u2013130 hypertension range. Under 10: 2\u00d7age+70. Age 10 hits 90, then adult cutoff."},{"t":"100\u2013160 adult. Ped min is always 90","ok":false,"why":"Adult systolic 90\u2013120; <90 hypotension/shock; 120\u2013130 hypertension range. Under 10: 2\u00d7age+70. Age 10 hits 90, then adult cutoff."},{"t":"90\u2013120 adult. Ped min = age + 90","ok":false,"why":"Adult systolic 90\u2013120; <90 hypotension/shock; 120\u2013130 hypertension range. Under 10: 2\u00d7age+70. Age 10 hits 90, then adult cutoff."}]},{"ch":"gcs","q":"GCS ranges from this recap?","opts":[{"t":"Eyes 1\u20136, verbal 1\u20134, motor 1\u20135. Total 0\u201315","ok":false,"why":"E 1\u20134, V 1\u20135, M 1\u20136. Total 3\u201315. Memorize the table."},{"t":"Eyes 1\u20134, verbal 1\u20135, motor 1\u20136. Total 3\u201315. 15 is fully alert. 3 is no response","ok":true,"why":"E 1\u20134, V 1\u20135, M 1\u20136. Total 3\u201315. Memorize the table."},{"t":"One number 1\u201310 only","ok":false,"why":"E 1\u20134, V 1\u20135, M 1\u20136. Total 3\u201315. Memorize the table."},{"t":"Eyes 0\u20134, verbal 0\u20135, motor 0\u20136. Total 0\u201315","ok":false,"why":"E 1\u20134, V 1\u20135, M 1\u20136. Total 3\u201315. Memorize the table."}]},{"ch":"pupils","q":"PERRL and the pinpoint versus dilated hint from this recap?","opts":[{"t":"PERRL is pulse equal. Pinpoint is stimulants. Dilated is opioids","ok":false,"why":"PERRL. Both constrict together. Note unequal, blown, sluggish. Pinpoint often opioids. Dilated often stimulants or brain injury."},{"t":"Pupils equal, round, reactive to light. Pinpoint often opioids/downers. Dilated often stimulants or brain injury","ok":true,"why":"PERRL. Both constrict together. Note unequal, blown, sluggish. Pinpoint often opioids. Dilated often stimulants or brain injury."},{"t":"Only the left pupil matters","ok":false,"why":"PERRL. Both constrict together. Note unequal, blown, sluggish. Pinpoint often opioids. Dilated often stimulants or brain injury."},{"t":"Fixed and dilated is a normal finding after oxygen","ok":false,"why":"PERRL. Both constrict together. Note unequal, blown, sluggish. Pinpoint often opioids. Dilated often stimulants or brain injury."}]},{"ch":"spo2","q":"SpO2 target and the carbon monoxide trap?","opts":[{"t":"80\u201385%. CO makes the number falsely low","ok":false,"why":"Desired 94\u201399%. CO can look falsely high. Saturation is percent occupied, not red-cell count."},{"t":"100% only. CO is not mentioned","ok":false,"why":"Desired 94\u201399%. CO can look falsely high. Saturation is percent occupied, not red-cell count."},{"t":"94\u201399%. CO can read falsely high because the machine treats CO as occupied hemoglobin. It does not count how many red cells you have","ok":true,"why":"Desired 94\u201399%. CO can look falsely high. Saturation is percent occupied, not red-cell count."},{"t":"70\u201380%. You ignore the number if they are talking","ok":false,"why":"Desired 94\u201399%. CO can look falsely high. Saturation is percent occupied, not red-cell count."}]},{"ch":"bgl","q":"Glucose numbers and when you check from this recap?","opts":[{"t":"40\u201360 normal. Check only known trauma","ok":false,"why":"Normal 80\u2013120 mg/dL. <80 hypoglycemia. Those three looks can mimic each other."},{"t":"80\u2013120. Under 80 is low. Check altered/unconscious, known diabetics, and stroke vs intoxication vs hypoglycemia","ok":true,"why":"Normal 80\u2013120 mg/dL. <80 hypoglycemia. Those three looks can mimic each other."},{"t":"150\u2013200 normal. Never check if they look drunk","ok":false,"why":"Normal 80\u2013120 mg/dL. <80 hypoglycemia. Those three looks can mimic each other."},{"t":"80\u2013120. Over 80 is always shock","ok":false,"why":"Normal 80\u2013120 mg/dL. <80 hypoglycemia. Those three looks can mimic each other."}]},{"ch":"rx","q":"Breathing is inadequate. One option is assist ventilations. One is give a drug. What first?","opts":[{"t":"Give the drug. ABCs wait for medications","ok":false,"why":"Priority rule: ABCs and life threats BEFORE medications. Inadequate breathing \u2192 ventilate first."},{"t":"Ventilate first. ABCs and life threats before medications","ok":true,"why":"Priority rule: ABCs and life threats BEFORE medications. Inadequate breathing \u2192 ventilate first."},{"t":"Skip both and start SAMPLE","ok":false,"why":"Priority rule: ABCs and life threats BEFORE medications. Inadequate breathing \u2192 ventilate first."},{"t":"Call for a detailed head-to-toe first","ok":false,"why":"Priority rule: ABCs and life threats BEFORE medications. Inadequate breathing \u2192 ventilate first."}]},{"ch":"re","q":"Reassessment clocks from this recap?","opts":[{"t":"Unstable about every 5 minutes. Stable about every 15. Recheck MS/GCS, ABCs, vitals, response to treatment","ok":true,"why":"Unstable/critical ~5 min. Stable ~15. Recheck mental status/GCS, ABCs, vitals, treatment response. Then a structured handoff."},{"t":"Everyone every 30 minutes","ok":false,"why":"Unstable/critical ~5 min. Stable ~15. Recheck mental status/GCS, ABCs, vitals, treatment response. Then a structured handoff."},{"t":"Unstable every 15. Stable every 5","ok":false,"why":"Unstable/critical ~5 min. Stable ~15. Recheck mental status/GCS, ABCs, vitals, treatment response. Then a structured handoff."},{"t":"Only once at the hospital door","ok":false,"why":"Unstable/critical ~5 min. Stable ~15. Recheck mental status/GCS, ABCs, vitals, treatment response. Then a structured handoff."}]}];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"flow":"Flow","scene":"Scene","consent":"Consent","airway":"Airway sounds","breath":"Breathing","circ":"Circulation","hx":"History","legal":"Legal / chart","ob":"Pregnancy","exam":"Secondary","vitals":"Vitals","gcs":"GCS","pupils":"Pupils","spo2":"SpO2","bgl":"Glucose","rx":"Interventions","re":"Reassess"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the 8:02 assessment-overview recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · assessment overview recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
</body>
</html>
