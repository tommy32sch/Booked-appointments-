<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Sun 8:03 Cardiovascular Emergencies and Heart Attacks</title>
<style>
:root {
  --bg: #f4efe6;
  --paper: #fffdf8;
  --ink: #1c2430;
  --muted: #5a6573;
  --navy: #1e3a5f;
  --navy-2: #16304d;
  --red: #b42318;
  --red-soft: #fde8e6;
  --green: #1b7a46;
  --green-soft: #e5f6ec;
  --line: #d8d0c4;
  --chosen-wrong: #f8d7d4;
  --chosen-right: #c8edd4;
  --correct-outline: #1b7a46;
  --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; font-weight: 400; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.ch-tag {
  display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: #e8eef6; color: var(--navy); padding: 4px 8px; border-radius: 6px; margin-bottom: 10px;
}
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: block; width: 100%; text-align: left;
  min-height: 48px; padding: 12px 14px;
  font-size: 1rem; line-height: 1.35;
  border: 2px solid var(--line); border-radius: 12px;
  background: #fff; color: var(--ink);
  cursor: pointer; appearance: none;
  font-family: inherit;
}
.opt:active { transform: scale(.995); }
.opt .letter {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: #eef2f6; font-weight: 700; font-size: .85rem; margin-right: 8px; flex-shrink: 0;
}
.opt .ot { display: inline; }
.opt.locked { cursor: default; }
.opt.chosen.wrong { background: var(--chosen-wrong); border-color: var(--red); }
.opt.chosen.right, .opt.show-correct { background: var(--chosen-right); border-color: var(--correct-outline); }
.opt.dim { opacity: .55; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.why .correct-line { margin-top: 8px; font-weight: 650; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.btn:active { background: var(--navy-2); }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
.miss { margin-top: 18px; }
.miss h3 { margin: 0 0 10px; font-size: 1.05rem; }
.miss-item { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.miss-item .mq { font-weight: 650; margin-bottom: 6px; }
.miss-item .mwhy { font-size: .92rem; color: #333; }
.restart { margin-top: 8px; }
#start-note { font-size: .86rem; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Sun 8:03 Cardiovascular Emergencies and Heart Attacks</h1>
  <div class="sub">Recap only · you/your · 12 questions</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [{"ch": "leftfail", "q": "Left ventricle fails in this recap. Where does blood back up?", "opts": [{"t": "Into the lungs now", "ok": true, "why": "The left side receives from the lungs. Fail the left ventricle and fluid is pushed into the alveoli: crackles, shortness of breath, pink frothy sputum."}, {"t": "Into the body only", "ok": false, "why": "Body backup is right-sided failure: JVD and dependent edema."}, {"t": "Into the vena cava", "ok": false, "why": "Vena cava backup is the right-sided path, not left ventricle failure."}, {"t": "Into the legs only", "ok": false, "why": "Leg edema is a right-sided backup. Left failure backs up into the lungs."}]}, {"ch": "rightfail", "q": "Right ventricle fails in this recap. What finding fits?", "opts": [{"t": "JVD and dependent edema", "ok": true, "why": "The right side receives from the body. Fail it and blood backs up into the vena cava: JVD and dependent edema (legs or sacrum)."}, {"t": "Backup into the lungs", "ok": false, "why": "Lung backup is left-sided failure, not right ventricle failure."}, {"t": "Crushing chest pressure", "ok": false, "why": "Crushing pressure is the MI picture. Right failure is JVD and dependent edema."}, {"t": "Pain that eases with rest", "ok": false, "why": "Pain that eases with rest is stable angina, not right-sided backup."}]}, {"ch": "mi", "q": "What does myocardial infarction mean in this recap?", "opts": [{"t": "Heart muscle cells die now", "ok": true, "why": "MI is death of cardiac muscle cells. Dead cells do not come back. Save the tissue around them that is not dead yet."}, {"t": "Low flow, cells still live", "ok": false, "why": "Low flow with cells still alive is ischemia, not infarction."}, {"t": "Plaque of cholesterol only", "ok": false, "why": "Plaque is atherosclerosis. Infarction is cell death after ischemia lasts long enough."}, {"t": "Clot sitting on the plaque", "ok": false, "why": "A clot on plaque is how the block grows. Infarction is cell death after ischemia lasts long enough."}]}, {"ch": "unstable", "q": "Unstable angina in this recap. What is changing?", "opts": [{"t": "Pain pattern is changing", "ok": true, "why": "Unstable angina is a changing pattern: less work than usual, pain at rest, longer pain, or more nitro than usual."}, {"t": "Same work every time here", "ok": false, "why": "Same work every time is stable angina, not a changing pattern."}, {"t": "Eases in 3 to 8 minutes", "ok": false, "why": "Easing in 3 to 8 minutes is the stable picture. Unstable is the pattern changing."}, {"t": "Usual nitro still works", "ok": false, "why": "Usual nitro still working is stable. Unstable needs more nitro or does not respond."}]}, {"ch": "asa", "q": "Aspirin dose in this recap, if they have taken none?", "opts": [{"t": "162 to 324 mg, chewed", "ok": true, "why": "Two to four baby aspirins of 81 mg each, total 162 to 324 mg, chewed. Four is common if they have taken none."}, {"t": "0.4 mg under the tongue", "ok": false, "why": "0.4 mg under the tongue is nitroglycerin, not aspirin."}, {"t": "81 mg swallowed whole", "ok": false, "why": "81 mg is one baby tablet, not the full dose, and this recap wants it chewed."}, {"t": "324 mg swallowed whole", "ok": false, "why": "This recap wants the aspirin chewed, not swallowed whole."}]}, {"ch": "nitrobp", "q": "Before each nitro dose in this recap, systolic pressure must be at least what?", "opts": [{"t": "Nitro floor is 100 mmHg", "ok": true, "why": "Confirm systolic pressure of at least 100 mmHg before each nitro dose. Recheck after each dose."}, {"t": "CPAP floor is 90 mmHg", "ok": false, "why": "90 mmHg is the CPAP floor in this recap, not the nitro floor."}, {"t": "Sat floor is 94 percent", "ok": false, "why": "94 percent is the oxygen-sat floor, not the nitro pressure floor."}, {"t": "Check pressure one time", "ok": false, "why": "You check pressure before every nitro dose, not once."}]}, {"ch": "nitroed", "q": "Recent erectile-dysfunction meds. Nitro in this recap?", "opts": [{"t": "Hold nitro 24 to 48 hrs", "ok": true, "why": "No recent erectile-dysfunction meds (Viagra, Cialis, Levitra) in the last 24 to 48 hours."}, {"t": "Hold nitro five minutes", "ok": false, "why": "Five minutes is the gap between nitro doses, not the erectile-dysfunction window."}, {"t": "Give if pressure is 110", "ok": false, "why": "Good pressure does not cancel the erectile-dysfunction hold."}, {"t": "Hold only if pain is gone", "ok": false, "why": "Still having pain is a nitro yes. Erectile-dysfunction meds are still a no."}]}, {"ch": "aed", "q": "Which rhythms does this recap say the AED shocks?", "opts": [{"t": "VF plus pulseless VT", "ok": true, "why": "Shockable rhythms are ventricular fibrillation and ventricular tachycardia. Pulseless VT is treated the same as VF."}, {"t": "VT that still has pulse", "ok": false, "why": "The AED shock for VT in this recap is pulseless VT, same as VF."}, {"t": "SA node at 60 to 100", "ok": false, "why": "SA node at 60 to 100 is the normal pacemaker, not a shockable arrest rhythm."}, {"t": "AV node delay, atria first", "ok": false, "why": "AV delay is normal conduction. The AED shocks VF and pulseless VT."}]}, {"ch": "cprdepth", "q": "Adult CPR depth in this recap?", "opts": [{"t": "At least 2 inches", "ok": true, "why": "Adult depth is at least 2 inches. Child is about 2 inches. Infant is about 1.5 inches."}, {"t": "About 1.5 inches", "ok": false, "why": "1.5 inches is the infant depth, not the adult depth."}, {"t": "Child, about 2 inches", "ok": false, "why": "About 2 inches is the child depth. Adult is at least 2 inches."}, {"t": "Infant one-third chest", "ok": false, "why": "One-third chest is the child/infant rule. Adult depth is at least 2 inches."}]}, {"ch": "cpap", "q": "CPAP for left-sided failure in this recap. Lowest systolic?", "opts": [{"t": "CPAP floor stays 90 mmHg", "ok": true, "why": "CPAP if they are conscious, breathing adequately, and systolic pressure is at least 90, with no major vomiting or trauma."}, {"t": "Nitro floor is 100 mmHg", "ok": false, "why": "100 mmHg is the nitro floor in this recap, not the CPAP floor."}, {"t": "Sat floor is 94 percent", "ok": false, "why": "94 percent is the oxygen-sat floor, not the CPAP pressure floor."}, {"t": "Check pressure only once", "ok": false, "why": "CPAP still needs a systolic of at least 90, not a one-time skip."}]}, {"ch": "o2sat", "q": "Oxygen target in this recap?", "opts": [{"t": "94 to 99 percent", "ok": true, "why": "Aim for SpO2 94 to 99 percent. Device depends on rate, rhythm, and quality of breathing."}, {"t": "100 percent always", "ok": false, "why": "This recap target is 94 to 99 percent, not 100 every time."}, {"t": "90 to 93 percent", "ok": false, "why": "90 to 93 is below this recap’s 94 to 99 percent target."}, {"t": "Exactly 94 percent only", "ok": false, "why": "The target is the band 94 to 99 percent, not a single 94."}]}, {"ch": "shockpos", "q": "Cardiogenic shock in this recap. How do you position them?", "opts": [{"t": "Flat unless they cannot", "ok": true, "why": "Shock wins over sitting up. Lie them supine unless they absolutely cannot breathe lying down."}, {"t": "Sitting up no matter what", "ok": false, "why": "Sitting up is for chest pain with a stable pressure, not for shock."}, {"t": "Upright, extra pillows", "ok": false, "why": "Extra pillows and sitting up are the PND/CHF positions, not cardiogenic shock."}, {"t": "Force flat if they gasp", "ok": false, "why": "If they cannot breathe lying down, do not force them flat. Shock still usually wants supine."}]}];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"leftfail": "Left failure", "rightfail": "Right failure", "mi": "MI", "unstable": "Unstable angina", "asa": "Aspirin", "nitrobp": "Nitro pressure", "nitroed": "Nitro and ED meds", "aed": "AED", "cprdepth": "CPR depth", "cpap": "CPAP", "o2sat": "Oxygen", "shockpos": "Shock position"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sun 8:03 Cardiovascular Emergencies and Heart Attacks recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · cardio / heart attacks recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
</body>
</html>
