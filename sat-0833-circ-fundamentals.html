 a minute — massive internal bleed, BP crash, they pass out, then arrest."},{"t":"Pulmonary arteries reverse and fill the IVC","ok":false,"why":"All LV output hits the aorta first. Rupture can dump most or all blood volume in about a minute — massive internal bleed, BP crash, they pass out, then arrest."},{"t":"Stroke volume always doubles to compensate","ok":false,"why":"All LV output hits the aorta first. Rupture can dump most or all blood volume in about a minute — massive internal bleed, BP crash, they pass out, then arrest."}]},{"ch":"aaa","q":"Who do you treat as possible aortic catastrophe, and what is the move?","opts":[{"t":"Isolated ankle sprain with a normal mental status — stay and ice","ok":false,"why":"High suspicion in severe trauma or aneurysm rupture: sudden severe pain, shock, rapid deterioration. They can die fast — prioritize rapid transport."},{"t":"Severe trauma or aneurysm rupture — sudden severe pain, shock, fast crash; rapid transport","ok":true,"why":"High suspicion in severe trauma or aneurysm rupture: sudden severe pain, shock, rapid deterioration. They can die fast — prioritize rapid transport."},{"t":"Only a missed SA-node beat with no pain","ok":false,"why":"High suspicion in severe trauma or aneurysm rupture: sudden severe pain, shock, rapid deterioration. They can die fast — prioritize rapid transport."},{"t":"Any flushed skin after epi — wait it out","ok":false,"why":"High suspicion in severe trauma or aneurysm rupture: sudden severe pain, shock, rapid deterioration. They can die fast — prioritize rapid transport."}]},{"ch":"thin","q":"What do blood thinners / anticoagulants do in this recap?","opts":[{"t":"They dissolve the aorta so preload rises","ok":false,"why":"Anticoagulants (warfarin, DOACs) prevent clots from forming or getting bigger. Used for a known clot or high clot risk."},{"t":"They prevent clots from forming or getting bigger","ok":true,"why":"Anticoagulants (warfarin, DOACs) prevent clots from forming or getting bigg ing to the heart — venous return."}]},{"ch":"star","q":"Frank-Starling / rubber-band idea here?","opts":[{"t":"Less blood in always makes a stronger squeeze","ok":false,"why":"More stretch (more blood in) → stronger contraction → more out. Less stretch → weaker contraction → less out."},{"t":"More stretch (more blood in) → stronger squeeze → more blood out","ok":true,"why":"More stretch (more blood in) → stronger contraction → more out. Less stretch → weaker contraction → less out."},{"t":"Afterload and preload are the same number","ok":false,"why":"More stretch (more blood in) → stronger contraction → more out. Less stretch → weaker contraction → less out."},{"t":"The SA node stretches the aorta each minute","ok":false,"why":"More stretch (more blood in) → stronger contraction → more out. Less stretch → weaker contraction → less out."}]},{"ch":"lowpre","q":"What drops preload here, and what do you see?","opts":[{"t":"Massive vasoconstriction only — flushed hot skin, high BP","ok":false,"why":"Bleed (blood on the floor, not in the veins), severe dehydration, third-spacing. Less pumped, lower BP, less brain blood → syncope/AMS. Cluster: tachy, weak pulses, cool/clammy, low BP, AMS."},{"t":"Hemorrhage, severe dehydration, third-spacing — low BP, syncope/AMS","ok":true,"why":"Bleed (blood on the floor, not in the veins), severe dehydration, third-spacing. Less pumped, lower BP, less brain blood → syncope/AMS. Cluster: tachy, weak pulses, cool/clammy, low BP, AMS."},{"t":"Only a clogged coronary with no volume change","ok":false,"why":"Bleed (blood on the floor, not in the veins), severe dehydration, third-spacing. Less pumped, lower BP, less brain blood → syncope/AMS. Cluster: tachy, weak pulses, cool/clammy, low BP, AMS."},{"t":"AV delay getting longer so ventricles overfill forever","ok":false,"why":"Bleed (blood on the floor, not in the veins), severe dehydration, third-spacing. Less pumped, lower BP, less brain blood → syncope/AMS. Cluster: tachy, weak pulses, cool/clammy, low BP, AMS."}]},{"ch":"after","q":"Afterload in this recap is what?","opts":[{"t":"Venous return into the right atrium","ok":false,"why":"Afterload is systemic vascular resistance — how tight or relaxed the arteries are."},{"t":"Systemic vascular resistance — how tight or relaxed the arteries are","ok":true,"why":"Afterload is systemic vascular resistance — how tight or relaxed the arteries are."},{"t":"Stroke volume times heart rate","ok":false,"why":"Afterload is systemic vascular resistance — how tight or relaxed the arteries are."},{"t":"The SA node firing rate only","ok":false,"why":"Afterload is systemic vascular resistance — how tight or relaxed the arteries are."}]},{"ch":"vaso","q":"Straw vs fire hose — which way does BP go?","opts":[{"t":"Vasoconstriction (tiny straw) drops BP; vasodilation (fire hose) raises it","ok":false,"why":"Vasoconstriction (small pipes / tiny straw + high flow) raises BP. Vasodilation (big pipes / fire hose + same flow) lowers BP."},{"t":"Vasoconstriction (tiny straw) raises BP; vasodilation (fire hose) lowers it","ok":true,"why":"Vasoconstriction (small pipes / tiny straw + high flow) raises BP. Vasodilation (big pipes / fire hose + same flow) lowers BP."},{"t":"Neither changes BP; only HR can","ok":false,"why":"Vasoconstriction (small pipes / tiny straw + high flow) raises BP. Vasodilation (big pipes / fire hose + same flow) lowers BP."},{"t":"Both raise preload and never touch afterload","ok":false,"why":"Vasoconstriction (small pipes / tiny straw + high flow) raises BP. Vasodilation (big pipes / fire hose + same flow) lowers BP."}]},{"ch":"comp","q":"Body is compensating for low BP. What pipe picture do you expect?","opts":[{"t":"Massive vasodilation — flushed, warm, bounding","ok":false,"why":"The body compensates with vasoconstriction. You see cool, pale, clammy skin."},{"t":"Vasoconstriction — cool, pale, clammy skin","ok":true,"why":"The body compensates with vasoconstriction. You see cool, pale, clammy skin."},{"  lose oxygen, sugar, or perfusion (blood flow)? Tie that to vitals and history. Carotid compression is the same O₂-to-brain idea."},{"t":"Did afterload rise, did SV rise, did HR hit 40?","ok":false,"why":"Did the brain lose oxygen, sugar, or perfusion (blood flow)? Tie that to vitals and history. Carotid compression is the same O₂-to-brain idea."},{"t":"Did the umbilical vein reverse in an adult?","ok":false,"why":"Did the brain lose oxygen, sugar, or perfusion (blood flow)? Tie that to vitals and history. Carotid compression is the same O₂-to-brain idea."}]},{"ch":"dir","q":"Artery vs vein — the rule this recap wants?","opts":[{"t":"Arteries always carry oxygenated blood; veins never do","ok":false,"why":"Arteries = away from the heart. Veins = back to the heart. Direction, not oxygen content."},{"t":"Arteries go away from the heart; veins come back — direction, not oxygen","ok":true,"why":"Arteries = away from the heart. Veins = back to the heart. Direction, not oxygen content."},{"t":"Veins always leave the left ventricle","ok":false,"why":"Arteries = away from the heart. Veins = back to the heart. Direction, not oxygen content."},{"t":"Names switch every time afterload changes","ok":false,"why":"Arteries = away from the heart. Veins = back to the heart. Direction, not oxygen content."}]},{"ch":"pa","q":"Pulmonary arteries — what do they carry, and where?","opts":[{"t":"Oxygenated blood from the left atrium to the body","ok":false,"why":"Pulmonary arteries carry deoxygenated blood from the right ventricle to the lungs so it can pick up oxygen — a test exception."},{"t":"Deoxygenated blood from the right ventricle to the lungs","ok":true,"why":"Pulmonary arteries carry deoxygenated blood from the right ventricle to the lungs so it can pick up oxygen — a test exception."},{"t":"Oxygenated blood from the placenta to the baby","ok":false,"why":"Pulmonary arteries carry deoxygenated blood from the right ventricle to the lungs so it can pick up oxygen — a test exception."},{"t":"Only waste through the coronary arteries","ok":false,"why":"Pulmonary arteries carry deoxygenated blood from the right ventricle to the lungs so it can pick up oxygen — a test exception."}]},{"ch":"umb","q":"Fetal / umbilical exception in this recap?","opts":[{"t":"Umbilical arteries carry oxygenated blood to the baby","ok":false,"why":"Umbilical arteries: deoxygenated baby → placenta. Umbilical vein: oxygenated placenta → baby."},{"t":"Umbilical arteries: deoxygenated baby → placenta; umbilical vein: oxygenated placenta → baby","ok":true,"why":"Umbilical arteries: deoxygenated baby → placenta. Umbilical vein: oxygenated placenta → baby."},{"t":"Both umbilical vessels carry only oxygenated blood","ok":false,"why":"Umbilical arteries: deoxygenated baby → placenta. Umbilical vein: oxygenated placenta → baby."},{"t":"There is no fetal exception — artery always means oxygenated","ok":false,"why":"Umbilical arteries: deoxygenated baby → placenta. Umbilical vein: oxygenated placenta → baby."}]},{"ch":"cor","q":"Coronary arteries — where do they run, and what do they feed?","opts":[{"t":"Deep inside the lungs; they feed alveoli only","ok":false,"why":"They run on the surface of the heart and supply oxygenated blood to the myocardium (heart muscle). RCA → right side; LCA → left side."},{"t":"On the surface of the heart; they feed the myocardium","ok":true,"why":"They run on the surface of the heart and supply oxygenated blood to the myocardium (heart muscle). RCA → right side; LCA → left side."},{"t":"Only in the placenta; they feed the umbilical vein","ok":false,"why":"They run on the surface of the heart and supply oxygenated blood to the myocardium (heart muscle). RCA → right side; LCA → left side."},{"t":"Inside the SA node only; they set the rate","ok":false,"why":"They run on the surface of the heart and supply oxygenated blood to the myocardium (heart muscle). RCA → right side; LCA → left side."}]},{"ch":"mi","q":"Myocardial infarction in this recap — what function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"sys":"Three parts","co":"Cardiac output","vol":"Blood volume","codrop":"CO drop","aorta":"Aorta","aaa":"Aortic crash","thin":"Thinners","thin2":"Bleed risk","pre":"Preload","star":"Starling","lowpre":"Low preload","after":"Afterload","vaso":"Straw / hose","comp":"Compensate","ana":"Anaphylaxis","epi":"EpiPen","auto":"Automaticity","sa":"SA node","av":"AV delay","pulse":"Pulse","brain":"Brain","sync":"Syncope","dir":"Artery / vein","pa":"Pulm arteries","umb":"Umbilical","cor":"Coronaries","mi":"Heart attack","car":"Carotids"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sat 8:33 circulatory-fundamentals recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · circulatory-fundamentals recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
