ironmental temperature is not the point."},{"t":"Because the gallbladder stores heat","ok":false,"why":"He said one shock treatment does not care what caused the shock: keep them warm. Environmental temperature is not the point."},{"t":"Because lymph has no pump","ok":false,"why":"He said one shock treatment does not care what caused the shock: keep them warm. Environmental temperature is not the point."},{"t":"Cells making less energy make less heat, so the body gets colder; cold then becomes its own problem","ok":true,"why":"He said one shock treatment does not care what caused the shock: keep them warm. Environmental temperature is not the point."}]},{"ch":"primary","q":"Aerobic versus anaerobic in his close (before Otter capped)?","opts":[{"t":"Aerobic means no oxygen","ok":false,"why":"Without enough O2 you do not get the easy wastes (CO2 you breathe, water you pee). Lactic acid builds up instead. Same idea as a lifting burn. Last ~6 min of that talk is not in the notes."},{"t":"Both words only describe kidney stones","ok":false,"why":"Without enough O2 you do not get the easy wastes (CO2 you breathe, water you pee). Lactic acid builds up instead. Same idea as a lifting burn. Last ~6 min of that talk is not in the notes."},{"t":"Anaerobic is how the liver stores glycogen","ok":false,"why":"Without enough O2 you do not get the easy wastes (CO2 you breathe, water you pee). Lactic acid builds up instead. Same idea as a lifting burn. Last ~6 min of that talk is not in the notes."},{"t":"Aerobic = enough air/oxygen and lots of energy. Anaerobic: an- = without; backup path makes lactic acid that is harder to dump than breathing off CO2","ok":true,"why":"Without enough O2 you do not get the easy wastes (CO2 you breathe, water you pee). Lactic acid builds up instead. Same idea as a lifting burn. Last ~6 min of that talk is not in the notes."}]},{"ch":"primary","q":"Phrenic memory he gave for breathing?","opts":[{"t":"C1 keeps the liver alive","ok":false,"why":"Cord: mo : hands, feet, face, genitals."},{"t":"Life-altering means skip the hospital","ok":false,"why":"11:27: genital injury may not kill you but can end reproduction. Eyeball: probably not fatal, blindness is a big deal. His list: hands, feet, face, genitals."},{"t":"Hunt life threats first. After that: hands, feet, face, and genitals (face also has airway)","ok":true,"why":"11:27: genital injury may not kill you but can end reproduction. Eyeball: probably not fatal, blindness is a big deal. His list: hands, feet, face, genitals."}]},{"ch":"airway","q":"Beta-2 in his receptor table, and why albuterol?","opts":[{"t":"Beta-2 = heart rate only","ok":false,"why":"Saturday endocrine talk: beta-2 = 2 lungs. Albuterol → beta-2. Do not invent doses — not in the notes."},{"t":"Albuterol is an alpha clamp on vessels","ok":false,"why":"Saturday endocrine talk: beta-2 = 2 lungs. Albuterol → beta-2. Do not invent doses — not in the notes."},{"t":"Beta-2 stores glycogen","ok":false,"why":"Saturday endocrine talk: beta-2 = 2 lungs. Albuterol → beta-2. Do not invent doses — not in the notes."},{"t":"Beta-2 = lungs = bronchodilation. Albuterol goes there because asthma is bronchoconstriction","ok":true,"why":"Saturday endocrine talk: beta-2 = 2 lungs. Albuterol → beta-2. Do not invent doses — not in the notes."}]},{"ch":"airway","q":"What does beta-1 do in that same table?","opts":[{"t":"Two lungs: bronchodilation only","ok":false,"why":"Beta-1 = 1 heart. Increases HR and contractility. Beta blockers block beta-1 for chronic high BP."},{"t":"Vessels: vasoconstriction only","ok":false,"why":"Beta-1 = 1 heart. Increases HR and contractility. Beta blockers block beta-1 for chronic high BP."},{"t":"Gut: rest and digest","ok":false,"why":"Beta-1 = 1 heart. Increases HR and contractility. Beta blockers block beta-1 for chronic high BP."},{"t":"One heart: faster rate and stronger contractility","ok":true,"why":"Beta-1 = 1 heart. Increases HR and contractility. Beta blockers block beta-1 for chronic high BP."}]},{"ch":"airway","q":"Alpha receptors, as he lumped them?","opts":[{"t":"Open bronchioles","ok":false,"why":"Alpha (1+2 lumped) hooks vessels → vasoconstriction. Epi binds alpha and beta, not one family only."},{"t":"Produce speech in Broca’s area","ok":false,"why":"Alpha (1+2 lumped) hooks vessels → vasoconstriction. Epi binds alpha and beta, not one family only."},{"t":"Absorb nutrients in the ileum","ok":false,"why":"Alpha (1+2 lumped) hooks vessels → vasoconstriction. Epi binds alpha and beta, not one family only."},{"t":"Hook vessels and cause vasoconstriction","ok":true,"why":"Alpha (1+2 lumped) hooks vessels → vasoconstriction. Epi binds alpha and beta, not one family only."}]},{"ch":"airway","q":"Cerebrum vs cerebellum in the shoe story (LOC / neuro impression)?","opts":[{"t":"Kid learning = cerebellum; adult automatic = cerebrum","ok":false,"why":"Conscious learning and recall of past events = cerebrum. Muscle-memory coordination = cerebellum."},{"t":"Both are skin layers","ok":false,"why":"Conscious learning and recall of past events = cerebrum. Muscle-memory coordination = cerebellum."},{"t":"Both are only the RAS","ok":false,"why":"Conscious learning and recall of past events = cerebrum. Muscle-memory coordination = cerebellum."},{"t":"Kid learning to tie = cerebrum. Adult tying without looking = cerebellum (coordination)","ok":true,"why":"Conscious learning and recall of past events = cerebrum. Muscle-memory coordination = cerebellum."}]},{"ch":"primary","q":"On stroke, what was his EMT-level takeaway (10:19/10:48 block)?","opts":[{"t":"Give a clot-busting drug on scene","ok":false,"why":"Recognize stroke, not which lobe. No treatment until CT. Ch 18. Not a stroke-scale how-to — that was not in the notes."},{"t":"Decide the exact lobe before transport","ok":false,"why":"Recognize stroke, not which lobe. No treatment until CT. Ch 18. Not a stroke-scale how-to — that was not in the notes."},{"t":"Intubate every stroke","ok":false,"why":"Recognize stroke, not which lobe. No treatment until CT. Ch 18. Not a stroke-scale how-to — that was not in the notes."},{"t":"Recognize it; do not pick the lobe in the field; no treatment until CT because type is unknown","ok":true,"why":"Recognize stroke, not which lobe. No treatment until CT. Ch 18. Not a stroke-scale how-to — that was not in the notes."}]},{"ch":"tx","q":"What did he say insulin does?","opts":[{"t":"Stores bile in the gallbladder","ok":false,"why":"11:27: metabolism = ability to use sugar. Insulin is that key. Type 1: pancreas stops making it. Specific diabetes treatment: not in the notes."},{"t":"Is clotting factor 8","ok":false,"why":"11:27: metabolism = ability to use sugar. Insulin is that key. Type 1: pancreas stops making it. Specific diabetes treatment: not in the notes."},{"t":"Pumps lymph","ok":false,"why":"11:27: metabolism = ability to use sugar. Insulin is that key. Type 1: pancreas stops making it. Specific diabetes treatment: not in the notes."},{"t":"Gives cells the ability to use the glucose already in the blood","ok":true,"why":"11:27: metabolism = ability to use sugar. Insulin is that key. Type 1: pancreas stops making it. Specific diabetes treatment: not in the notes."}]},{"ch":"tx","q":"Insulin vs glucagon as he paired them (10:48 tail)?","opts":[{"t":"Insulin raises it; glucagon lowers it","ok":false,"why":"Endocrine pancreas: opposite mechanisms. Somatostatin referees and they do not cover it at EMT level."},{"t":"Both only constrict vessels","ok":false,"why":"Endocrine pancreas: opposite mechanisms. Somatostatin referees and they do not cover it at EMT level."},{"t":"Both are burn depths","ok":false,"why":"Endocrine pancreas: opposite mechanisms. Somatostatin referees and they do not cover it at EMT level."},{"t":"Insulin lowers blood sugar; glucagon raises it","ok":true,"why":"Endocrine pancreas: opposite mechanisms. Somatostatin referees and they do not cover it at EMT level."}]},{"ch":"tx","q":"Hemophilia field point he ac ing alpha and beta."},{"t":"Both sit in the RUQ","ok":false,"why":"Domino example: hypothalamus → pituitary → adrenals → epinephrine. Fight-or-flight is still a hormone hitting alpha and beta."},{"t":"Hypothalamus bridges nervous electricity to hormone release; pituitary is the master gland that tells other glands what to dump","ok":true,"why":"Domino example: hypothalamus → pituitary → adrenals → epinephrine. Fight-or-flight is still a hormone hitting alpha and beta."}]},{"ch":"medical","q":"Thyroid vs parathyroids?","opts":[{"t":"Thyroid makes factor 8; parathyroids make bile","ok":false,"why":"Young high metabolism; older often slower. Extra calcium → bones or urine; low → pull from bone."},{"t":"Both only raise blood sugar","ok":false,"why":"Young high metabolism; older often slower. Extra calcium → bones or urine; low → pull from bone."},{"t":"Thyroid is the sewer system","ok":false,"why":"Young high metabolism; older often slower. Extra calcium → bones or urine; low → pull from bone."},{"t":"Thyroid (neck) is overall metabolism — hypo is low/slow. Four parathyroid nodules regulate calcium, with bone as storage, especially so the heart can keep squeezing","ok":true,"why":"Young high metabolism; older often slower. Extra calcium → bones or urine; low → pull from bone."}]},{"ch":"medical","q":"Kidneys: plumbing and the dehydrated pee story?","opts":[{"t":"One pipe that always dumps everything","ok":false,"why":"Keep vs get rid of. Extra sugar after the liver is full can be peed out. Well hydrated → pee extra water."},{"t":"They convert water into bile","ok":false,"why":"Keep vs get rid of. Extra sugar after the liver is full can be peed out. Well hydrated → pee extra water."},{"t":"They store water in the gallbladder","ok":false,"why":"Keep vs get rid of. Extra sugar after the liver is full can be peed out. Well hydrated → pee extra water."},{"t":"Three pipes — blood in, blood kept, urine out. Dehydrated: save every drop, so they pee less","ok":true,"why":"Keep vs get rid of. Extra sugar after the liver is full can be peed out. Well hydrated → pee extra water."}]},{"ch":"medical","q":"pH split he actually said?","opts":[{"t":"Only the spleen sets pH","ok":false,"why":"Brain can use both systems if pH is off. Also mentioned BP via fluid volume."},{"t":"Kidneys breathe off CO2","ok":false,"why":"Brain can use both systems if pH is off. Also mentioned BP via fluid volume."},{"t":"pH is only a thyroid number","ok":false,"why":"Brain can use both systems if pH is off. Also mentioned BP via fluid volume."},{"t":"Two big ingredients in blood are CO2 and water. Kidneys handle water. Lungs handle CO2 by breathing faster or slower","ok":true,"why":"Brain can use both systems if pH is off. Also mentioned BP via fluid volume."}]},{"ch":"medical","q":"Lymphatic system in this weekend’s talks?","opts":[{"t":"It is the main shock treatment","ok":false,"why":"Swollen neck nodes = full of trash. That is the extent."},{"t":"It has a second heart in the neck","ok":false,"why":"Swollen neck nodes = full of trash. That is the extent."},{"t":"It is how insulin works","ok":false,"why":"Swollen neck nodes = full of trash. That is the extent."},{"t":"Sewer of the body; no heart pump; motion, exercise, and breathing move lymph; they barely talk it except plague in the disaster chapter","ok":true,"why":"Swollen neck nodes = full of trash. That is the extent."}]},{"ch":"scene","q":"Scene Size-up and Safety is 15–19% of the official exam. What from HIS Saturday talks covers it?","opts":[{"t":"Saturday fully taught triage tags","ok":false,"why":"Official domain includes plan-before-arrival, protect the scene, PPE, find patients, triage, request resources. Those job tasks are not in the Saturday Otter files. Ch 2 notes exist separately. Not in his Saturday notes / don’t invent."},{"t":"He ran a hazmat algorithm","ok":false,"why":"Official domain includes plan-before-arrival, protect the scene, PPE, find patients, triage, request resources. Those job task line: pre-approved protocols (notes examples: CPR/AED, oxygen, epi for anaphylaxis). Online: radio/phone, that call only, when you are outside protocol or unsure. Named extra protocols: not in the notes."},{"t":"Offline = standing orders you follow without calling. Online = real-time physician direction for that one situation","ok":true,"why":"Offline: pre-approved protocols (notes examples: CPR/AED, oxygen, epi for anaphylaxis). Online: radio/phone, that call only, when you are outside protocol or unsure. Named extra protocols: not in the notes."}]},{"ch":"scene","q":"Ch 2 safety order and the first rule?","opts":[{"t":"Patient first, then you last","ok":false,"why":"Workplace safety notes: you first. Safety order: you → crew → patient. Standard precautions every call; always hand hygiene + gloves."},{"t":"Only the driver needs gloves","ok":false,"why":"Workplace safety notes: you first. Safety order: you → crew → patient. Standard precautions every call; always hand hygiene + gloves."},{"t":"Skip PPE if the call looks medical","ok":false,"why":"Workplace safety notes: you first. Safety order: you → crew → patient. Standard precautions every call; always hand hygiene + gloves."},{"t":"You first (you cannot help if you become a patient), then crew, then patient. Gloves every time","ok":true,"why":"Workplace safety notes: you first. Safety order: you → crew → patient. Standard precautions every call; always hand hygiene + gloves."}]},{"ch":"scene","q":"How far to park from fires, crashes, and hazmat in the Ch 2 notes?","opts":[{"t":"Nose of the rig on the front porch","ok":false,"why":"Park 100 ft from fires, crashes, hazmat. First unit upstream; later downstream. Hazmat uphill/upwind. Notes also point NREMT to the ERG. Full ERG how-to: not in the notes."},{"t":"Exactly 10 feet downhill and downwind","ok":false,"why":"Park 100 ft from fires, crashes, hazmat. First unit upstream; later downstream. Hazmat uphill/upwind. Notes also point NREMT to the ERG. Full ERG how-t led. Never prone, never hog-tie. Soft = EMS preferred. Chemical = ALS, not normal EMT. Med control if possible. LE when possible."}]},{"ch":"ops","q":"What does SBAR stand for in the Ch 4 notes?","opts":[{"t":"Soap, Bandage, Airway, Radio","ok":false,"why":"Radio/handoff format given in the notes is SBAR. Full CHART/SOAP: not in the notes. Radio: brief, plain English, no patient name, repeat orders back."},{"t":"Scene, BLS, ALS, Refusal","ok":false,"why":"Radio/handoff format given in the notes is SBAR. Full CHART/SOAP: not in the notes. Radio: brief, plain English, no patient name, repeat orders back."},{"t":"CHART only — SBAR is not in these notes","ok":false,"why":"Radio/handoff format given in the notes is SBAR. Full CHART/SOAP: not in the notes. Radio: brief, plain English, no patient name, repeat orders back."},{"t":"Situation, Background, Assessment, Recommendation/ETA","ok":true,"why":"Radio/handoff format given in the notes is SBAR. Full CHART/SOAP: not in the notes. Radio: brief, plain English, no patient name, repeat orders back."}]},{"ch":"ops","q":"PCR rule the notes hammer?","opts":[{"t":"Erase freely if you change your mind","ok":false,"why":"Include demographics, CC, history, vitals, findings, treatments, response, times. Error: one line, initial, date, correct. Never erase. Refusal on the PCR: capacity, risks, understanding, signature or refusal to sign."},{"t":"Skip vitals if the ride is short","ok":false,"why":"Include demographics, CC, history, vitals, findings, treatments, response, times. Error: one line, initial, date, correct. Never erase. Refusal on the PCR: capacity, risks, understanding, signature or refusal to sign."},{"t":"Put the patient’s name out on the radio instead","ok":false,"why":"Include demographics, CC, history, vitals, findings, treatments, response, times. Error: one line, initial, date, correct. Never erase. Refusal on the PCR: capacity, risks, understanding, signature or refusal to sign."},{"t":"Facts only, legal and permanent. If it is not documented, it did not happen","ok":true,"why":"Include demographics, CC, history, vitals, findings, treatments, response, times. Error: one line, initial, date, correct. Never erase. Refusal on the PCR: capacity, risks, understanding, signature or refusal to sign."}]},{"ch":"secondary","q":"Interview style in the Ch 4 notes?","opts":[{"t":"Closed yes/no only from the first sentence","ok":false,"why":"Open-ended first, then closed. Avoid: false reassurance, leading, advice, interrupting, jargon, judgment, talking over the patient."},{"t":"Lead them to the answer you want","ok":false,"why":"Open-ended first, then closed. Avoid: false reassurance, leading, advice, interrupting, jargon, judgment, talking over the patient."},{"t":"Talk over them so the radio stays short","ok":false,"why":"Open-ended first, then closed. Avoid: false reassurance, leading, advice, interrupting, jargon, judgment, talking over the patient."},{"t":"Open-ended first, then closed-ended. Avoid false reassurance, leading questions, jargon, and talking over them","ok":true,"why":"Open-ended first, then closed. Avoid: false reassurance, leading, advice, interrupting, jargon, judgment, talking over the patient."}]},{"ch":"secondary","q":"Whose left and right, and what does a- / an- mean in the Ch 5 notes?","opts":[{"t":"Your left as you face them. a- means fast","ok":false,"why":"Directions are the patient’s L/R. a/an = without. tachy fast, brady slow. Saturday: anaerobic = without air."},{"t":"The ambulance left side. an- means many","ok":false,"why":"Directions are the patient’s L/R. a/an = without. tachy fast, brady slow. Saturday: anaerobic = without air."},{"t":"It does not matter. a- means yellow","ok":false,"why":"Directions are the patient’s L/R. a/an = without. tachy fast, brady slow. Saturday: anaerobic = without air."},{"t":"The patient’s left and right. a- / an- = without (same hook he used later for anaerobic)","ok":true,"why":"Directions are the patient’s L/R. a/an = without. tachy fast, brady slow. Saturday: anaerobic = without air."}]},{"ch":"primary","q":"Ch 6 (incomplete) — why ABC is first, in those notes?","opts":[{"t":"Skin dies first, so start with burns","ok":false,"why":"Anatomy pack stops after the skeleton. Cells need O2, glucose, water/nutrients. O2 + glucose → ATP + CO2 + water + heat. That is why ABC is first. Saturday said the same energy story."},{"t":"Only calcium matters, so start with bones","ok":false,"why":"Anatomy pack stops after the skeleton. Cells need O2, glucose, water/nutrients. O2 + glucose → ATP + CO2 + water + heat. That is why ABC is first. Saturday said the same energy story."},{"t":"The notes say skip airway","ok":false,"why":"Anatomy pack stops after the skeleton. Cells need O2, glucose, water/nutrients. O2 + glucose → ATP + CO2 + water + heat. That is why ABC is first. Saturday said the same energy story."},{"t":"Cells need O2, glucose, and water/nutrients. Brain dies fast; skin lasts longer","ok":true,"why":"Anatomy pack stops after the skeleton. Cells need O2, glucose, water/nutrients. O2 + glucose → ATP + CO2 + water + heat. That is why ABC is first. Saturday said the same energy story."}]},{"ch":"primary","q":"Spine counts and the highest-bleed bone group in the Ch 6 notes?","opts":[{"t":"20 vertebrae and the mandible bleeds most","ok":false,"why":"206 adult bones. Spine 33 as 7/12/5/5 fused/4 fused. Pelvis = highest bleed potential. Muscle, respiratory, heart details in that Ch 6 file: not in the notes (file stops after skeleton). Saturday filled some of those systems later."},{"t":"12 cervical and the femur is unnamed","ok":false,"why":"206 adult bones. Spine 33 as 7/12/5/5 fused/4 fused. Pelvis = highest bleed potential. Muscle, respiratory, heart details in that Ch 6 file: not in the notes (file stops after skeleton). Saturday filled some of those systems later."},{"t":"No number given; skull bones all bleed equally","ok":false,"why":"206 adult bones. Spine 33 as 7/12/5/5 fused/4 fused. Pelvis = highest bleed potential. Muscle, respiratory, heart details in that Ch 6 file: not in the notes (file stops after skeleton). Saturday filled some of those systems later."},{"t":"33 vertebrae: 7 / 12 / 5 / 5 fused sacrum / 4 fused coccyx. Pelvis = highest bleed potential","ok":true,"why":"206 adult bones. Spine 33 as 7/12/5/5 fused/4 fused. Pelvis = highest bleed potential. Muscle, respiratory, heart details in that Ch 6 file: not in the notes (file stops after skeleton). Saturday filled some of those systems later."}]}];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {primary:"Primary / perfusion",airway:"Airway / receptors",tx:"Treatment preview",secondary:"Secondary / abdomen",medical:"Medical / endocrine-renal",scene:"Scene (gap)",ops:"Operations (gap)"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Ch 1–6 notes plus Saturday Otter. Official weights pick the mix. Not Registry items.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · class facts, NREMT-weighted topics</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
