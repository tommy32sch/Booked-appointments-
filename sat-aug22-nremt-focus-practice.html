r table?","opts":[{"t":"One heart: rate goes up and squeeze gets stronger","ok":true,"why":"Beta-1 = 1 heart. Increases HR and contractility. Beta blockers block beta-1 for chronic high BP."},{"t":"Two lungs: tubes open and air moves easier","ok":false,"why":"Beta-1 = 1 heart. Increases HR and contractility. Beta blockers block beta-1 for chronic high BP."},{"t":"Many vessels: pipes clamp and pressure goes up","ok":false,"why":"Beta-1 = 1 heart. Increases HR and contractility. Beta blockers block beta-1 for chronic high BP."},{"t":"One gut: motility rises and digestion speeds up","ok":false,"why":"Beta-1 = 1 heart. Increases HR and contractility. Beta blockers block beta-1 for chronic high BP."}]},{"ch":"airway","q":"He lumped alpha-1 and alpha-2. What did that pair do?","opts":[{"t":"Grab vessels and clamp them down","ok":true,"why":"Alpha (1+2 lumped) hooks vessels → vasoconstriction. Epi binds alpha and beta, not one family only."},{"t":"Grab bronchi and open them wide","ok":false,"why":"Alpha (1+2 lumped) hooks vessels → vasoconstriction. Epi binds alpha and beta, not one family only."},{"t":"Grab Broca’s and start speech","ok":false,"why":"Alpha (1+2 lumped) hooks vessels → vasoconstriction. Epi binds alpha and beta, not one family only."},{"t":"Grab ileum and pull in nutrients","ok":false,"why":"Alpha (1+2 lumped) hooks vessels → vasoconstriction. Epi binds alpha and beta, not one family only."}]},{"ch":"airway","q":"A child is learning to tie shoes; an adult ties them without looking. Which map?","opts":[{"t":"Learning = cerebrum. Automatic coordination = cerebellum","ok":true,"why":"Conscious learning and recall of past events = cerebrum. Muscle-memory coordination = cerebellum."},{"t":"Learning = cerebellum. Automatic coordination = cerebrum","ok":false,"why":"Conscious learning and recall of past events = cerebrum. Muscle-memory coordination = cerebellum."},{"t":"Learning = brainstem. Automatic coordination = hypothalamus","ok":false,"why":"Conscious learn That is also why the 10:48 story’s leak from a hollow appendix matters. Hollow vs solid is the scoring idea, not a surgical protocol."}]},{"ch":"secondary","q":"Which jobs did he give the large intestine?","opts":[{"t":"Pull water, then form stool; path up right, across, down left, out","ok":true,"why":"By the time leftovers arrive, nutrients are already taken. Water in, then elimination."},{"t":"Pull nutrients, then store glycogen; path up left, across, down right","ok":false,"why":"By the time leftovers arrive, nutrients are already taken. Water in, then elimination."},{"t":"Pull lymph, then make bile; path stays only in the mid-abdomen","ok":false,"why":"By the time leftovers arrive, nutrients are already taken. Water in, then elimination."},{"t":"Pull oxygen, then make insulin; path stays only in the RUQ","ok":false,"why":"By the time leftovers arrive, nutrients are already taken. Water in, then elimination."}]},{"ch":"secondary","q":"Belly pain: whose “right,” and what else did he want asked?","opts":[{"t":"Patient’s right; onset, better/worse, describe, where, does it move","ok":true,"why":"10:48 tail. Ch 10 ‘detective’ skill itself is later — not in these notes as a full assessment sheet."},{"t":"Your right facing them; skip onset, skip whether the pain moves","ok":false,"why":"10:48 tail. Ch 10 ‘detective’ skill itself is later — not in these notes as a full assessment sheet."},{"t":"Stretcher’s right only; ask only if neck veins look engorged","ok":false,"why":"10:48 tail. Ch 10 ‘detective’ skill itself is later — not in these notes as a full assessment sheet."},{"t":"Ambulance’s right only; ask only the hypothalamus temperature","ok":false,"why":"10:48 tail. Ch 10 ‘detective’ skill itself is later — not in these notes as a full assessment sheet."}]},{"ch":"secondary","q":"Mid-upper pain also hits the back. Which organ placement explains that?","opts":[{"t":"Pancreas: upper mid belly, RUQ/LUQ line, sits far back","ok":true,"why":"Not on their chart. GI enzymes for starch/protein plus endocrine insulin/glucagon."},{"t":"Adrenals: triangle caps on the kidneys, sit far forward","ok":false,"why":"Not on their chart. GI enzymes for starch/protein plus endocrine insulin/glucagon."},{"t":"Spleen: hollow pocket in the RLQ, sits just under skin","ok":false,"why":"Not on their chart. GI enzymes for starch/protein plus endocrine insulin/glucagon."},{"t":"Thyroid: left frontal speech area, sits behind the eyes","ok":false,"why":"Not on their chart. GI enzymes for starch/protein plus endocrine insulin/glucagon."}]},{"ch":"secondary","q":"Which placement matches the spleen as he taught it?","opts":[{"t":"Solid organ, LUQ; clears out old red blood cells","ok":true,"why":"Solid = blood-saturated bleeder if traumatized (same idea as liver in the RUQ). Function he said: old RBCs."},{"t":"Hollow organ, RLQ; stores leftover bile after meals","ok":false,"why":"Solid = blood-saturated bleeder if traumatized (same idea as liver in the RUQ). Function he said: old RBCs."},{"t":"Solid organ, RUQ; makes insulin and glucagon pairs","ok":false,"why":"Solid = blood-saturated bleeder if traumatized (same idea as liver in the RUQ). Function he said: old RBCs."},{"t":"Hollow organ, LUQ; absorbs leftover water into stool","ok":false,"why":"Solid = blood-saturated bleeder if traumatized (same idea as liver in the RUQ). Function he said: old RBCs."}]},{"ch":"medical","q":"Which split matches hypothalamus vs pituitary in his endocrine review?","opts":[{"t":"Hypothalamus: nerve-to-hormone bridge. Pituitary: master ‘dump’ gland","ok":true,"why":"Domino example: hypothalamus → pituitary → adrenals → epinephrine. Fight-or-flight is still a hormone hitting alpha and beta."},{"t":"Hypothalamus: master ‘dump’ gland. Pituitary: nerve-to-hormone bridge","ok":false,"why":"Domino example: hypothalamus → pituitary → adrenals → epinephrine. Fight-or-flight is still a hormone hitting alpha and beta."},{"t":"Hypothalamus: bile store behind liver. Pituitary: lymph sewer e,"why":"Keep vs get rid of. Extra sugar after the liver is full can be peed out. Well hydrated → pee extra water."}]},{"ch":"medical","q":"Blood pH is off. How did he split the two big cleanup jobs?","opts":[{"t":"Kidneys handle water; lungs handle CO2 by changing breathing speed","ok":true,"why":"Brain can use both systems if pH is off. Also mentioned BP via fluid volume."},{"t":"Kidneys handle CO2; lungs handle water by changing urine volume","ok":false,"why":"Brain can use both systems if pH is off. Also mentioned BP via fluid volume."},{"t":"Spleen sets the pH; thyroid sets breathing speed for leftover CO2","ok":false,"why":"Brain can use both systems if pH is off. Also mentioned BP via fluid volume."},{"t":"Liver handles water; pancreas handles CO2 by dumping glucagon","ok":false,"why":"Brain can use both systems if pH is off. Also mentioned BP via fluid volume."}]},{"ch":"medical","q":"Which description matches the lymphatic system from this weekend?","opts":[{"t":"Body sewer; no heart pump; motion, exercise, and breathing move it","ok":true,"why":"Swollen neck nodes = full of trash. That is the extent."},{"t":"Body sewer; a second heart in the neck pushes every drop forward","ok":false,"why":"Swollen neck nodes = full of trash. That is the extent."},{"t":"Main shock blanket; insulin is the pump that drives the flow","ok":false,"why":"Swollen neck nodes = full of trash. That is the extent."},{"t":"Main clot factory; the spleen is the pump that drives the flow","ok":false,"why":"Swollen neck nodes = full of trash. That is the extent."}]},{"ch":"scene","q":"Scene Size-up is a big official slice. What did Saturday’s talks actually add?","opts":[{"t":"Almost nothing new — use the written safety notes; do not invent PPE","ok":true,"why":"Official domain includes plan-before-arrival, protect the scene, PPE, find patients, triage, request resources. Those job tasks are not in the Saturday Otter files. Ch 2 notes exist separately. Not in his Saturday notes / don’t invent."},{"t":"A full triage-tag drill — skip the written safety notes after class","ok":false,"why":"Official domain includes plan-before-arrival, protect the scene, PPE, find patients, triage, request resources. Those job tasks are not in the Saturday Otter files. Ch 2 notes exist separately. Not in his Saturday notes / don’t invent."},{"t":"A full hazmat algorithm — skip the written safety notes after class","ok":false,"why":"Official domain includes plan-before-arrival, protect the scene, PPE, find patients, triage, request resources. Those job tasks are not in the Saturday Otter files. Ch 2 notes exist separately. Not in his Saturday notes / don’t invent."},{"t":"A PPE list by every call type — skip the written safety notes after class","ok":false,"why":"Official domain includes plan-before-arrival, protect the scene, PPE, find patients, triage, request resources. Those job tasks are not in the Saturday Otter files. Ch 2 notes exist separately. Not in his Saturday notes / don’t invent."}]},{"ch":"ops","q":"Operations is another official slice. What did Saturday actually add?","opts":[{"t":"No new rig-check or PCR lesson — lean on Ch 3–4 notes you already have","ok":true,"why":"Official operations tasks: equipment, med/supply inventory, documentation, responder well-being. Saturday was anatomy. Not in Saturday notes / don’t invent."},{"t":"A full radio-report format at 11:27 — skip the Ch 3–4 notes you have","ok":false,"why":"Official operations tasks: equipment, med/supply inventory, documentation, responder well-being. Saturday was anatomy. Not in Saturday notes / don’t invent."},{"t":"A certified ambulance inventory list — skip the Ch 3–4 notes you have","ok":false,"why":"Official operations tasks: equipment, med/supply inventory, documentation, responder well-being. Saturday was anatomy. Not in Saturday notes / don’t invent."},{"t":"A complete state PCR rulebook — skip the Ch 3–4 notes you have","ok":false,"why":"Official operations tasks: equipment, med/supply inventory, documentation, responder well-being. Saturday was anatomy. Not in Saturday notes / don’t invent."}]},{"ch":"primary","q":"Otter cut the 11:27 talk. Which piece is actually missing from the notes?","opts":[{"t":"The last stretch after aerobic/anaerobic, plus extra shock he never said","ok":true,"why":"Otter free plan: 30 minutes per conversation. Do not invent the rest of shock, CPR, or treatment algorithms."},{"t":"The gallbladder’s location behind the liver, plus how it stores bile","ok":false,"why":"Otter free plan: 30 minutes per conversation. Do not invent the rest of shock, CPR, or treatment algorithms."},{"t":"That insulin lets cells use sugar, plus the type-1 pancreas story","ok":false,"why":"Otter free plan: 30 minutes per conversation. Do not invent the rest of shock, CPR, or treatment algorithms."},{"t":"That the spleen is a solid LUQ organ that clears old red cells","ok":false,"why":"Otter free plan: 30 minutes per conversation. Do not invent the rest of shock, CPR, or treatment algorithms."}]},{"ch":"tx","q":"Fight-or-flight dump. How did he treat the names and the receptors?","opts":[{"t":"Call it epinephrine; it hooks both alpha and beta, not one family","ok":true,"why":"Fight-or-flight package is non-specific (bleed, pump fail, or anaphylactic vasodilation still dump epi). Doses: not in the notes."},{"t":"Call it noradrenaline only; it hooks beta-2 in the lungs alone","ok":false,"why":"Fight-or-flight package is non-specific (bleed, pump fail, or anaphylactic vasodilation still dump epi). Doses: not in the notes."},{"t":"Call it a pancreas hormone; it hooks alpha vessels and nothing else","ok":false,"why":"Fight-or-flight package is non-specific (bleed, pump fail, or anaphylactic vasodilation still dump epi). Doses: not in the notes."},{"t":"Call it glucagon only; it hooks beta-1 in the heart alone","ok":false,"why":"Fight-or-flight package is non-specific (bleed, pump fail, or anaphylactic vasodilation still dump epi). Doses: not in the xygen, epi for anaphylaxis). Online: radio/phone, that call only, when you are outside protocol or unsure. Named extra protocols: not in the notes."},{"t":"Offline: never treat anyone. Online: never write the chart afterward","ok":false,"why":"Offline: pre-approved protocols (notes examples: CPR/AED, oxygen, epi for anaphylaxis). Online: radio/phone, that call only, when you are outside protocol or unsure. Named extra protocols: not in the notes."},{"t":"Offline: radio only for parking. Online: standing orders, no call","ok":false,"why":"Offline: pre-approved protocols (notes examples: CPR/AED, oxygen, epi for anaphylaxis). Online: radio/phone, that call only, when you are outside protocol or unsure. Named extra protocols: not in the notes."},{"t":"Offline: one-call physician. Online: standing orders you never use","ok":false,"why":"Offline: pre-approved protocols (notes examples: CPR/AED, oxygen, epi for anaphylaxis). Online: radio/phone, that call only, when you are outside protocol or unsure. Named extra protocols: not in the notes."}]},{"ch":"scene","q":"Ch 2 safety order. Who comes first, and what is always on?","opts":[{"t":"You, then crew, then patient; gloves on every single call","ok":true,"why":"Workplace safety notes: you first. Safety order: you → crew → patient. Standard precautions every call; always hand hygiene + gloves."},{"t":"Patient, then crew, then you; gloves only if it looks bloody","ok":false,"why":"Workplace safety notes: you first. Safety order: you → crew → patient. Standard precautions every call; always hand hygiene + gloves."},{"t":"Crew, then bystanders, then you; gloves only for the driver","ok":false,"why":"Workplace safety notes: you first. Safety order: you → crew → patient. Standard precautions every call; always hand hygiene + gloves."},{"t":"You, then patient, skip the crew; skip gloves on medical calls","ok":false,"why":"Workplace safety notes: you first. Safety order: you → crew → patient. Standard precautions every call; always hand hygiene + gloves."}]},{"ch":"scene","q":"Fire, crash, or hazmat. How did the Ch 2 notes say to park?","opts":[{"t":"About 100 feet; first unit upstream; hazmat uphill and upwind","ok":true,"why":"Park 100 ft from fires, crashes, hazmat. First unit upstream; later downstream. Hazmat uphill/upwind. Notes also point NREMT to the ERG. Full ERG how-to: not in the notes."},{"t":"About 10 feet; first unit downhill; hazmat downwind and down","ok":false,"why":"Park 100 ft from fires, crashes, hazmat. First unit upstream; later downstream. Hazmat uphill/upwind. Notes also point NREMT to the ERG. Full ERG how-to: not in the notes."},{"t":"Nose on the porch; later units upstream; hazmat inside the hot zone","ok":false,"why":"Park 100 ft from fires, crashes, hazmat. First unit upstream; later downstream. Hazmat uphill/upwind. Notes also point NREMT to the ERG. Full ERG how-to: not in the notes."},{"t":"Inside the hot zone; later units downhill; skip wind entirely","ok":false,"why":"Park 100 ft from fires, crashes, hazmat. First unit upstream; later downstream. Hazmat uphill/upwind. Notes also point NREMT to the ERG. Full ERG how-to: not in the notes."}]},{"ch":"scene","q":"N95 vs surgical mask in the Ch 2 notes — which match is right?","opts":[{"t":"N95: airborne, fit-tested. Surgical: droplets on the face","ok":true,"why":"Airborne examples in the notes: TB, measles. Never recap needles. Sanitizer ≥60% if hands are not dirty; soap/water if soiled or norovirus/C. diff."},{"t":"N95: droplets only. Surgical: airborne, fit-tested respirator","ok":false,"why":"Airborne examples in the notes: TB, measles. Never recap needles. Sanitizer ≥60% if hands are not dirty; soap/water if soiled or norovirus/C. diff."},{"t":"N95: hazmat fumes only. Surgical: every call, same as N95","ok":false,"why":"Airborne examples in the notes: TB, measles. Never recap needles. Sanitizer ≥60% if hands are not dirty; soap/water if soiled or norovirus/C. diff."},{"t":"N95: interchangeable always. Surgical: only for needle sticks","ok":false,"why":"Airborne examples in the notes: TB, measles. Never recap needles. Sanitizer ≥60% if hands are not dirty; soap/water if soiled or norovirus/C. diff."}]},{"ch":"scene","q":"You are putting PPE on. Which donning order is in the Ch 2 notes?","opts":[{"t":"Hygiene, then gown, mask, eyes, gloves","ok":true,"why":"Don: hygiene → gown → mask → eyes → gloves. Doff: gloves → gown → eyes → mask → hygiene. Match other providers’ PPE level on scene."},{"t":"Gloves, then gown, mask, eyes, hygiene","ok":false,"why":"Don: hygiene → gown → mask → eyes → gloves. Doff: gloves → gown → eyes → mask → hygiene. Match other providers’ PPE level on scene."},{"t":"Mask, then skip hygiene, gown, eyes, gloves","ok":false,"why":"Don: hygiene → gown → mask → eyes → gloves. Doff: gloves → gown → eyes → mask → hygiene. Match other providers’ PPE level on scene."},{"t":"Gown last, after you already touched the patient","ok":false,"why":"Don: hygiene → gown → mask → eyes → gloves. Doff: gloves → gown → eyes → mask → hygiene. Match other providers’ PPE level on scene."}]},{"ch":"scene","q":"Blood splash in your eye. What do the notes say to do — and not do?","opts":[{"t":"Hand off, flush, no squeeze/suck/bleach, report now, get checked fast","ok":true,"why":"Exposure: hand off → wash/flush → do not squeeze/suck/bleach → report immediately → eval within hours → PEP if indicated, no cost to you. Cannot force new source blood in most cases. Exact PEP drugs: not in the notes."},{"t":"Finish the call, squeeze the site, bleach it, report next week","ok":false,"why":"Exposure: hand off → wash/flush → do not squeeze/suck/bleach → report immediately → eval within hours → PEP if indicated, no cost to you. Cannot force new source blood in most cases. Exact PEP drugs: not in the notes."},{"t":"Force a source blood draw yourself, skip wash, wait a week to tell","ok":false,"why":"Exposure: hand off → wash/flush → do not squeeze/suck/bleach → report immediately → eval within hours → PEP if indicated, no cost to you. Cannot force new source blood in most cases. Exact PEP drugs: not in the notes."},{"t":"Suck the wound, stay on the call, bleach later, skip any eval","ok":false,"why":"Exposure: hand off → wash/flush → do not squeeze/suck/bleach → report immediately → eval within hours → PEP if indicated, no cost to you. Cannot force new source blood in most cases. Exact PEP drugs: not in the notes."}]},{"ch":"ops","q":"Negligence in Ch 3. Which set has to be present?","opts":[{"t":"Duty, breach, damages, and a causal link — all four","ok":true,"why":"Negligence = duty + breach + damages + causation. All four. Good faith + appropriate standard of care usually avoids legal exposure."},{"t":"Duty only, no breach, no damages, and no causal link","ok":false,"why":"Negligence = duty + breach + damages + causation. All four. Good faith + appropriate standard of care usually avoids legal exposure."},{"t":"A bad outcome alone, with no duty and no breach shown","ok":false,"why":"Negligence = duty + breach + damages + causation. All four. Good faith + appropriate standard of care usually avoids legal exposure."},{"t":"A family complaint alone, with no damages and no link","ok":false,"why":"Negligence = duty + breach + damages + causation. All four. Good faith + appropriate standard of care usually avoids legal exposure."}]},{"ch":"ops","q":"Which situation is abandonment in those notes?","opts":[{"t":"Leave while they still need care, no consent, no equal/higher handoff","ok":true,"why":"Abandonment = leave without consent and without equal/higher handoff while they still need care. Ch 4 also: transfer only after verbal handoff to equal or higher + completed PCR."},{"t":"Stay and finish the PCR after a proper equal/higher verbal handoff","ok":false,"why":"Abandonment = leave without consent and without equal/higher handoff while they still need care. Ch 4 also: transfer only after verbal handoff to equal or higher + completed PCR."},{"t":"Wai  3 notes?","opts":[{"t":"Last resort; never prone or hog-tie; soft preferred; watch ABCs","ok":true,"why":"Last resort: danger, protect, allow care, less-restrictive failed. Never prone, never hog-tie. Soft = EMS preferred. Chemical = ALS, not normal EMT. Med control if possible. LE when possible."},{"t":"First move; prone hog-tie is the default; skip ABC checks after","ok":false,"why":"Last resort: danger, protect, allow care, less-restrictive failed. Never prone, never hog-tie. Soft = EMS preferred. Chemical = ALS, not normal EMT. Med control if possible. LE when possible."},{"t":"Chemical restraint is normal EMT work; skip medical control entirely","ok":false,"why":"Last resort: danger, protect, allow care, less-restrictive failed. Never prone, never hog-tie. Soft = EMS preferred. Chemical = ALS, not normal EMT. Med control if possible. LE when possible."},{"t":"Restrain first, ask later; hog-tie is preferred; skip monitoring","ok":false,"why":"Last resort: danger, protect, allow care, less-restrictive failed. Never prone, never hog-tie. Soft = EMS preferred. Chemical = ALS, not normal EMT. Med control if possible. LE when possible."}]},{"ch":"ops","q":"What does SBAR stand for in the Ch 4 notes?","opts":[{"t":"Situation, Background, Assessment, Recommendation/ETA","ok":true,"why":"Radio/handoff format given in the notes is SBAR. Full CHART/SOAP: not in the notes. Radio: brief, plain English, no patient name, repeat orders back."},{"t":"Soap wash, Bandage, Airway check, Radio only","ok":false,"why":"Radio/handoff format given in the notes is SBAR. Full CHART/SOAP: not in the notes. Radio: brief, plain English, no patient name, repeat orders back."},{"t":"Scene size, BLS care, ALS request, Refusal","ok":false,"why":"Radio/handoff format given in the notes is SBAR. Full CHART/SOAP: not in the notes. Radio: brief, plain English, no patient name, repeat orders back."},{"t":"Subjective, Objective, Assessment, Plan note","ok":false,"why":"Radio/handoff format given in st, then jargon; skip anything that takes time","ok":false,"why":"Open-ended first, then closed. Avoid: false reassurance, leading, advice, interrupting, jargon, judgment, talking over the patient."},{"t":"Lead with your diagnosis first, then yes/no; skip how they describe it","ok":false,"why":"Open-ended first, then closed. Avoid: false reassurance, leading, advice, interrupting, jargon, judgment, talking over the patient."}]},{"ch":"secondary","q":"Whose left/right, and what do a- / an- mean in the Ch 5 notes?","opts":[{"t":"Patient’s left and right; a- / an- means without (as in anaerobic)","ok":true,"why":"Directions are the patient’s L/R. a/an = without. tachy fast, brady slow. Saturday: anaerobic = without air."},{"t":"Your left as you face them; a- / an- means fast (as in tachycardic)","ok":false,"why":"Directions are the patient’s L/R. a/an = without. tachy fast, brady slow. Saturday: anaerobic = without air."},{"t":"The ambulance’s left side; a- / an- means many (as in polycythemia)","ok":false,"why":"Directions are the patient’s L/R. a/an = without. tachy fast, brady slow. Saturday: anaerobic = without air."},{"t":"It does not matter which side; a- / an- means yellow (as in jaundice)","ok":false,"why":"Directions are the patient’s L/R. a/an = without. tachy fast, brady slow. Saturday: anaerobic = without air."}]},{"ch":"primary","q":"Ch 6 (file stops early): why did those notes put ABC first?","opts":[{"t":"Cells need O2, sugar, and water; brain dies fast, skin lasts longer","ok":true,"why":"Anatomy pack stops after the skeleton. Cells need O2, glucose, water/nutrients. O2 + glucose → ATP + CO2 + water + heat. That is why ABC is first. Saturday said the same energy story."},{"t":"Skin dies first, so start with burns; brain can wait on the airway","ok":false,"why":"Anatomy pack stops after the skeleton. Cells need O2, glucose, water/nutrients. O2 + glucose → ATP + CO2 + water + heat. That is why ABC is first. Saturday said the same energy story."},{"t":"Only calcium matters, so start with bone; skip airway on medicals","ok":false,"why":"Anatomy pack stops after the skeleton. Cells need O2, glucose, water/nutrients. O2 + glucose → ATP + CO2 + water + heat. That is why ABC is first. Saturday said the same energy story."},{"t":"Notes say skip airway; start with the skeleton every single time","ok":false,"why":"Anatomy pack stops after the skeleton. Cells need O2, glucose, water/nutrients. O2 + glucose → ATP + CO2 + water + heat. That is why ABC is first. Saturday said the same energy story."}]},{"ch":"primary","q":"Spine math plus the highest-bleed bone group in the Ch 6 notes?","opts":[{"t":"33 bones: 7 / 12 / 5 / 5 fused / 4 fused; pelvis bleeds the most","ok":true,"why":"206 adult bones. Spine 33 as 7/12/5/5 fused/4 fused. Pelvis = highest bleed potential. Muscle, respiratory, heart details in that Ch 6 file: not in the notes (file stops after skeleton). Saturday filled some of those systems later."},{"t":"20 bones: 5 / 12 / 3 / 0 fused / 0 fused; mandible bleeds the most","ok":false,"why":"206 adult bones. Spine 33 as 7/12/5/5 fused/4 fused. Pelvis = highest bleed potential. Muscle, respiratory, heart details in that Ch 6 file: not in the notes (file stops after skeleton). Saturday filled some of those systems later."},{"t":"12 cervical only; femur is never named; skull bones bleed equally","ok":false,"why":"206 adult bones. Spine 33 as 7/12/5/5 fused/4 fused. Pelvis = highest bleed potential. Muscle, respiratory, heart details in that Ch 6 file: not in the notes (file stops after skeleton). Saturday filled some of those systems later."},{"t":"26 bones: 8 / 10 / 4 / 2 fused / 2 fused; femur bleeds the least","ok":false,"why":"206 adult bones. Spine 33 as 7/12/5/5 fused/4 fused. Pelvis = highest bleed potential. Muscle, respiratory, heart details in that Ch 6 file: not in the notes (file stops after skeleton). Saturday filled some of those systems later."}]}];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {primary:"Primary / perfusion",airway:"Airway / receptors",tx:"Treatment preview",secondary:"Secondary / abdomen",medical:"Medical / endocrine-renal",scene:"Scene (gap)",ops:"Operations (gap)"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Ch 1–6 notes plus Saturday Otter. Official weights pick the mix. Not Registry items.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · class facts, NREMT-weighted topics</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
