<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Sat 1:09 BLS Resuscitation and CPR Training Guide</title>
<style>
:root {
  --bg: #f4efe6;
  --paper: #fffdf8;
  --ink: #1c2430;
  --muted: #5a6573;
  --navy: #1e3a5f;
  --navy-2: #16304d;
  --red: #b42318;
  --red-soft: #fde8e6;
  --green: #1b7a46;
  --green-soft: #e5f6ec;
  --line: #d8d0c4;
  --chosen-wrong: #f8d7d4;
  --chosen-right: #c8edd4;
  --correct-outline: #1b7a46;
  --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; font-weight: 400; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.ch-tag {
  display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: #e8eef6; color: var(--navy); padding: 4px 8px; border-radius: 6px; margin-bottom: 10px;
}
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: block; width: 100%; text-align: left;
  min-height: 48px; padding: 12px 14px;
  font-size: 1rem; line-height: 1.35;
  border: 2px solid var(--line); border-radius: 12px;
  background: #fff; color: var(--ink);
  cursor: pointer; appearance: none;
  font-family: inherit;
}
.opt:active { transform: scale(.995); }
.opt .letter {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: #eef2f6; font-weight: 700; font-size: .85rem; margin-right: 8px; flex-shrink: 0;
}
.opt .ot { display: inline; }
.opt.locked { cursor: default; }
.opt.chosen.wrong { background: var(--chosen-wrong); border-color: var(--red); }
.opt.chosen.right, .opt.show-correct { background: var(--chosen-right); border-color: var(--correct-outline); }
.opt.dim { opacity: .55; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.why .correct-line { margin-top: 8px; font-weight: 650; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.btn:active { background: var(--navy-2); }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
.miss { margin-top: 18px; }
.miss h3 { margin: 0 0 10px; font-size: 1.05rem; }
.miss-item { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.miss-item .mq { font-weight: 650; margin-bottom: 6px; }
.miss-item .mwhy { font-size: .92rem; color: #333; }
.restart { margin-top: 8px; }
#start-note { font-size: .86rem; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Sat 1:09 BLS Resuscitation and CPR Training Guide</h1>
  <div class="sub">Recap only · you/your · 12 questions</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [{"ch": "infant1", "q": "One-rescuer infant CPR. What compression technique does this recap want for the test?", "opts": [{"t": "One-hand heel for infant", "ok": true, "why": "New AHA: one-hand heel for one-rescuer infant CPR. Two fingers were not getting depth."}, {"t": "Two-finger for an infant", "ok": false, "why": "Two-finger is the old method. The update is one-hand heel."}, {"t": "Two-thumb encircling now", "ok": false, "why": "Two-thumb encircling is preferred for two-rescuer infant CPR, not one rescuer."}, {"t": "Two-hand adult style now", "ok": false, "why": "Adult two-hand is not the infant one-rescuer default here."}]}, {"ch": "infant2", "q": "Two-rescuer infant or child CPR. Preferred compression technique?", "opts": [{"t": "Two-thumb encircling", "ok": true, "why": "Two-thumb encircling stays preferred for two-rescuer infant or child CPR."}, {"t": "One-hand heel (solo)", "ok": false, "why": "One-hand heel is the one-rescuer infant update, not the two-rescuer preference."}, {"t": "Two-finger only, now", "ok": false, "why": "Two-finger is not the two-rescuer preferred method."}, {"t": "Two-hand adult style", "ok": false, "why": "Adult two-hand is not the preferred infant two-rescuer grip."}]}, {"ch": "ccf", "q": "What chest compression fraction does this recap want you to hit?", "opts": [{"t": "80% or more (floor 60%)", "ok": true, "why": "CCF floor is 60%. Target is ≥80%. A 10% rise in CCF is about an 11% rise in survival."}, {"t": "60% or more (floor 40%)", "ok": false, "why": "60% is the floor, not the target. Aim for 80% or more."}, {"t": "40% or more (floor 20%)", "ok": false, "why": "Those numbers are below the recap’s 60% floor."}, {"t": "90% or more (floor 80%)", "ok": false, "why": "80% is the target, not the floor. The floor is 60%."}]}, {"ch": "pause", "q": "How long may a compression pause last in this recap?", "opts": [{"t": "Under 10 seconds", "ok": true, "why": "Never interrupt compressions for more than 10 seconds if you can help it."}, {"t": "Under 15 seconds", "ok": false, "why": "15 seconds is over the 10-second cap."}, {"t": "Under 20 seconds", "ok": false, "why": "20 seconds is over the 10-second cap."}, {"t": "Under 30 seconds", "ok": false, "why": "30 seconds is over the 10-second cap."}]}, {"ch": "lucas", "q": "Routine mechanical CPR (Lucas) in this recap?", "opts": [{"t": "Not recommended routinely", "ok": true, "why": "AHA does not recommend routine mechanical CPR. Setup pauses interrupt compressions and worsen outcomes."}, {"t": "Don't tire, use routinely", "ok": false, "why": "They don't tire, but routine use is still not recommended. Setup pauses hurt."}, {"t": "Consistent, use routinely", "ok": false, "why": "Depth and rate stay consistent, but routine use is still not recommended."}, {"t": "Setup fast, use routinely", "ok": false, "why": "Setup is the problem: long pauses. Routine use is not recommended."}]}, {"ch": "dnr", "q": "Which DNR does this recap treat as a reason not to start CPR?", "opts": [{"t": "Original form, in hand", "ok": true, "why": "A valid original, state-specific DNR that is physically present. A photo is not enough."}, {"t": "Photo of the form only", "ok": false, "why": "A photo does not count here. You need the original in hand."}, {"t": "Rigor mortis is present", "ok": false, "why": "Rigor is a do-not-start sign, but it is not a DNR. This stem is the DNR rule."}, {"t": "Dependent lividity now", "ok": false, "why": "Dependent lividity is a do-not-start sign, but it is not a DNR."}]}, {"ch": "stop", "q": "STOP mnemonic. What does S stand for here?", "opts": [{"t": "Starts breathing and pulse", "ok": true, "why": "S is Starts breathing and has a pulse (ROSC). Then you stop compressions."}, {"t": "Starts breathing, no pulse", "ok": false, "why": "S needs breathing AND a pulse. Breathing without a pulse is still arrest."}, {"t": "Pulse back, not breathing", "ok": false, "why": "S needs breathing AND a pulse. Pulse without breathing is not the S in STOP."}, {"t": "Transferred to other care", "ok": false, "why": "Transferred is T in STOP, not S."}]}, {"ch": "resp", "q": "Adult respiratory arrest (pulse present). Breath rate in this recap?", "opts": [{"t": "1 breath every 6 seconds", "ok": true, "why": "Adults: 1 breath every 6 seconds (10 per minute). Child and infant is 1 every 2–3 seconds."}, {"t": "1 breath every 2 seconds", "ok": false, "why": "Every 2–3 seconds is the child and infant rate, not adult."}, {"t": "1 breath every 10 seconds", "ok": false, "why": "That is too slow. Adult is every 6 seconds."}, {"t": "2 breaths every 6 seconds", "ok": false, "why": "It is 1 breath every 6 seconds, not 2."}]}, {"ch": "mild", "q": "They are choking but still coughing and moving air. What do you do?", "opts": [{"t": "Encourage coughing only", "ok": true, "why": "Mild obstruction: hands off. Let them cough. Do not start thrusts yet. Oxygen is fine."}, {"t": "Start abdominal thrusts", "ok": false, "why": "Thrusts are for severe obstruction, not a patient who is still moving air."}, {"t": "Start 5 back blows, now", "ok": false, "why": "Back blows are for severe obstruction. Mild still coughing: hands off."}, {"t": "Start five chest thrusts", "ok": false, "why": "Chest thrusts are the infant or pregnant/obese severe rule, not mild obstruction."}]}, {"ch": "unresp", "q": "A choking patient goes unresponsive. After 30 compressions you look in the mouth. Blind finger sweep?", "opts": [{"t": "No blind finger sweep now", "ok": true, "why": "Pull only what you can easily see and safely grab. No blind finger sweeps. Then 2 breaths."}, {"t": "Sweep every cycle blind", "ok": false, "why": "Do not sweep blindly. Only remove a visible object."}, {"t": "Sweep before compressions", "ok": false, "why": "Compress first, then look, then breaths."}, {"t": "Skip looking in the mouth", "ok": false, "why": "You do look after compressions. You just do not sweep blind."}]}, {"ch": "narcan", "q": "Obvious opioid overdose in arrest or respiratory failure. Naloxone vs ABCs?", "opts": [{"t": "ABCs first, then naloxone", "ok": true, "why": "They die of hypoxia. Ventilate or do CPR first. Naloxone is secondary after ABCs."}, {"t": "Naloxone before any BVM", "ok": false, "why": "Do not delay the airway and oxygen for the drug."}, {"t": "Naloxone, skip all CPR now", "ok": false, "why": "If they are pulseless, they still need CPR."}, {"t": "Wait, give nothing yet now", "ok": false, "why": "Address ABCs now. Then naloxone per protocol."}]}, {"ch": "tube", "q": "An advanced airway is in. How do you ventilate during CPR in this recap?", "opts": [{"t": "Async CPR, 1 breath / 6s", "ok": true, "why": "Asynchronous CPR: compressions 100–120 with no 30:2 pause. 1 breath every 6 seconds."}, {"t": "Keep pausing for 30:2 now", "ok": false, "why": "Drop 30:2 once the advanced airway is in."}, {"t": "Stop CPR for each breath", "ok": false, "why": "Do not stop compressions for breaths after an advanced airway."}, {"t": "1 breath every 2 seconds", "ok": false, "why": "That is the child respiratory-arrest range, not asynchronous adult CPR breaths."}]}];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"infant1": "Infant, one rescuer", "infant2": "Infant, two rescuers", "ccf": "CCF", "pause": "Pauses", "lucas": "Mechanical CPR", "dnr": "DNR", "stop": "STOP", "resp": "Respiratory arrest", "mild": "Mild choke", "unresp": "Unresponsive choke", "narcan": "Opioid", "tube": "Advanced airway"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sat 1:09 BLS Resuscitation and CPR Training Guide recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · BLS CPR recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
</body>
</html>
