<script>
const BANK = [{"ch":"pic","q":"What is this recap actually about on a call?","opts":[{"t":"Only airway devices and oxygen flow rates","ok":false,"why":"Focus is gurneys, backboards, bariatric gear, and moving people \u2014 lifting, carrying, rolling, log roll. Tests hit device choice, safe moves, SMR, and when you call medical control."},{"t":"Gurneys, boards, bariatric gear, and safe moving including SMR","ok":true,"why":"Focus is gurneys, backboards, bariatric gear, and moving people \u2014 lifting, carrying, rolling, log roll. Tests hit device choice, safe moves, SMR, and when you call medical control."},{"t":"Only pharmacology and drug doses","ok":false,"why":"Focus is gurneys, backboards, bariatric gear, and moving people \u2014 lifting, carrying, rolling, log roll. Tests hit device choice, safe moves, SMR, and when you call medical control."},{"t":"Only 12-lead ECG interpretation","ok":false,"why":"Focus is gurneys, backboards, bariatric gear, and moving people \u2014 lifting, carrying, rolling, log roll. Tests hit device choice, safe moves, SMR, and when you call medical control."}]},{"ch":"gurn","q":"Wheeled ambulance stretcher \u2014 what do you lock, and what is the weight trap?","opts":[{"t":"It is never locked; powered units are lighter than manual","ok":false,"why":"Gurney can be manual or powered. Powered is heavier (about 40\u2013145 lb) but reduces lift strain. Always lock it in the ambulance floor bracket."},{"t":"Manual or powered; powered is heavier (~40\u2013145 lb) but saves your back; lock the floor bracket","ok":true,"why":"Gurney can be manual or powered. Powered is heavier (about 40\u2013145 lb) but reduces lift strain. Always lock it in the ambulance floor bracket."},{"t":"It is a 6\u20137 ft full-body spine splint only","ok":false,"why":"Gurney can be manual or powered. Powered is heavier (about 40\u2013145 lb) but reduces lift strain. Always lock it in the ambulance floor bracket."},{"t":"You never use two people on it","ok":false,"why":"Gurney can be manual or powered. Powered is heavier (about 40\u2013145 lb) but reduces lift strain. Always lock it in the ambulance floor bracket."}]},{"ch":"load","q":"How do you load the gurney, and which end is heavier?","opts":[{"t":"Feet-first, unlocked, because the foot end is heavier","ok":false,"why":"It is very top-heavy with a patient. Head end is usually heavier. Load headfirst so they face the back windows, then lock the floor bracket."},{"t":"Headfirst facing the back windows; head end is usually heavier; lock it","ok":true,"why":"It is very top-heavy with a patient. Head end is usually heavier. Load headfirst so they face the back windows, then lock the floor bracket."},{"t":"Sideways on stairs with one provider","ok":false,"why":"It is very top-heavy with a patient. Head end is usually heavier. Load headfirst so they face the back windows, then lock the floor bracket."},{"t":"Never strap walking patients","ok":false,"why":"It is very top-heavy with a patient. Head end is usually heavier. Load headfirst so they face the back windows, then lock the floor bracket."}]},{"ch":"nogurn","q":"When do you refuse to take the gurney?","opts":[{"t":"Only if the patient asks to walk","ok":false,"why":"No stairs. No off-road/rough ground (dirt, desert, fields). Avoid angled slopes that can tip (driveway edges, curbs at an angle)."},{"t":"Stairs, off-road/rough ground, and angled slopes that can tip","ok":true,"why":"No stairs. No off-road/rough ground (dirt, desert, fields). Avoid angled slopes that can tip (driveway edges, curbs at an angle)."},{"t":"You take it everywhere, including stairs, because it is never top-heavy","ok":false,"why":"No stairs. No off-road/rough ground (dirt, desert, fields). Avoid angled slopes that can tip (driveway edges, curbs at an angle)."},{"t":"Only at the hospital door","ok":false,"why":"No stairs. No off-road/rough ground (dirt, desert, fields). Avoid angled slopes that can tip (driveway edges, curbs at an angle)."}]},{"ch":"two","q":"Turns, ramps, and slopes on the gurney \u2014 how many of you?","opts":[{"t":"One provider at the head only","ok":false,"why":"Use at least two providers, front and back, for turns, ramps, and slopes."},{"t":"At least two \u2014 one front, one back","ok":true,"why":"Use at least two providers, front and back, for turns, ramps, and slopes."},{"t":"Four-person log roll on every ramp","ok":false,"why":"Use at least two providers, front and back, for turns, ramps, and slopes."},{"t":"Zero \u2014 let it roll itself because it is powered","ok":false,"why":"Use at least two providers, front and back, for turns, ramps, and slopes."}]},{"ch":"shock","q":"Universal shock treatment in this recap \u2014 your four-part formula?","opts":[{"t":"Sit them up, withhold oxygen, ice the skin, wait on scene","ok":false,"why":"High-flow oxygen, keep them warm, lay them supine, rapid transport. O2 + warm + supine + go fast."},{"t":"High-flow oxygen, keep warm, supine, rapid transport","ok":true,"why":"High-flow oxygen, keep them warm, lay them supine, rapid transport. O2 + warm + supine + go fast."},{"t":"Only a cervical collar and then walk them","ok":false,"why":"High-flow oxygen, keep them warm, lay them supine, rapid transport. O2 + warm + supine + go fast."},{"t":"Power grip and a stair chair only","ok":false,"why":"High-flow oxygen, keep them warm, lay them supine, rapid transport. O2 + warm + supine + go fast."}]},{"ch":"pos","q":"When may you use position of comfort on the gurney?","opts":[{"t":"Always, even in shock, because sitting raises blood pressure","ok":false,"why":"Position of comfort is when no clear medical position is required. They may sit, go semi-Fowler, or lie on their side if it is safe and protocol allows. Shock prefers supine."},{"t":"When no required medical position \u2014 sitting, semi-Fowler, or side-lying if safe/protocol","ok":true,"why":"Position of comfort is when no clear medical position is required. They may sit, go semi-Fowler, or lie on their side if it is safe and protocol allows. Shock prefers supine."},{"t":"Never \u2014 everyone must be prone","ok":false,"why":"Position of comfort is when no clear medical position is required. They may sit, go semi-Fowler, or lie on their side if it is safe and protocol allows. Shock prefers supine."},{"t":"Only after you take the gurney down the stairs","ok":false,"why":"Position of comfort is when no clear medical position is required. They may sit, go semi-Fowler, or lie on their side if it is safe and protocol allows. Shock prefers supine."}]},{"ch":"walk","q":"Why do \u201cwalking wounded\u201d still ride the gurney?","opts":[{"t":"State law bans sitting on a gurney","ok":false,"why":"If they deteriorate or go unconscious in transit, you already have them on the stretcher. They can sit upright but stay strapped and secured."},{"t":"If they crash mid-transport you do not have to move them; sit upright but stay strapped","ok":true,"why":"If they deteriorate or go unconscious in transit, you already have them on the stretcher. They can sit upright but stay strapped and secured."},{"t":"They must always be fully supine for comfort","ok":false,"why":"If they deteriorate or go unconscious in transit, you already have them on the stretcher. They can sit upright but stay strapped and secured."},{"t":"So you can skip locking the floor bracket","ok":false,"why":"If they deteriorate or go unconscious in transit, you already have them on the stretcher. They can sit upright but stay strapped and secured."}]},{"ch":"sheet","q":"Gurney infection control after the call?","opts":[{"t":"Leave the same sheet for the next three patients","ok":false,"why":"Usually disposable sheets \u2014 strip after the call, disinfect, re-sheet. Some agencies bleach and reuse washable linen."},{"t":"Strip disposable sheets, disinfect, re-sheet (or bleach reusable linen)","ok":true,"why":"Usually disposable sheets \u2014 strip after the call, disinfect, re-sheet. Some agencies bleach and reuse washable linen."},{"t":"Only wipe the wheels; skip the mattress","ok":false,"why":"Usually disposable sheets \u2014 strip after the call, disinfect, re-sheet. Some agencies bleach and reuse washable linen."},{"t":"Spray the cervical collar and send the gurney down the stairs","ok":false,"why":"Usually disposable sheets \u2014 strip after the call, disinfect, re-sheet. Some agencies bleach and reuse washable linen."}]},{"ch":"board","q":"What is a backboard in this recap?","opts":[{"t":"A powered wheeled stretcher locked to the floor","ok":false,"why":"About 6\u20137 ft, usually plastic. It is a full-body splint to protect the spinal column. Often left at the hospital; agencies stencil a name so they can collect, disinfect, and reuse."},{"t":"A 6\u20137 ft plastic full-body splint for the spinal column","ok":true,"why":"About 6\u20137 ft, usually plastic. It is a full-body splint to protect the spinal column. Often left at the hospital; agencies stencil a name so they can collect, disinfect, and reuse."},{"t":"Only a hip strap with no holes","ok":false,"why":"About 6\u20137 ft, usually plastic. It is a full-body splint to protect the spinal column. Often left at the hospital; agencies stencil a name so they can collect, disinfect, and reuse."},{"t":"A stair-only carry device","ok":false,"why":"About 6\u20137 ft, usually plastic. It is a full-body splint to protect the spinal column. Often left at the hospital; agencies stencil a name so they can collect, disinfect, and reuse."}]},{"ch":"strap","q":"Backboard strap order \u2014 what is last?","opts":[{"t":"Head first, then you skip the torso","ok":false,"why":"X strap over chest/torso, strap over hips, one or two over the legs, head last with blocks and tape/straps. More holes let you place straps better."},{"t":"X on torso, then hips, then legs, head last with blocks","ok":true,"why":"X strap over chest/torso, strap over hips, one or two over the legs, head last with blocks and tape/straps. More holes let you place straps better."},{"t":"Legs only \u2014 the torso stays free","ok":false,"why":"X strap over chest/torso, strap over hips, one or two over the legs, head last with blocks and tape/straps. More holes let you place straps better."},{"t":"Power grip the head, then roll them off","ok":false,"why":"X strap over chest/torso, strap over hips, one or two over the legs, head last with blocks and tape/straps. More holes let you place straps better."}]},{"ch":"oldnew","q":"Old SMR versus current SMR in this recap?","opts":[{"t":"Current practice boards every trauma \u201cjust in case\u201d","ok":false,"why":"Old way boarded almost any significant trauma just in case. Current way is selective: symptoms, neuro status, mechanism, and mental status/reliability."},{"t":"Old: board almost any big trauma. Now: selective by symptoms, neuro, mechanism, reliability","ok":true,"why":"Old way boarded almost any significant trauma just in case. Current way is selective: symptoms, neuro status, mechanism, and mental status/reliability."},{"t":"SMR is no longer used for anyone","ok":false,"why":"Old way boarded almost any significant trauma just in case. Current way is selective: symptoms, neuro status, mechanism, and mental status/reliability."},{"t":"You only board if they ask for it","ok":false,"why":"Old way boarded almost any significant trauma just in case. Current way is selective: symptoms, neuro status, mechanism, and mental status/reliability."}]},{"ch":"smr","q":"Conscious trauma \u2014 which cluster strongly pushes you toward SMR/backboard?","opts":[{"t":"Hunger only, with a normal exam","ok":false,"why":"Neck or back pain, numbness, tingling, weakness, or paralysis after trauma. Also unconscious with a big mechanism, or a poor historian."},{"t":"Neck/back pain, numbness, tingling, weakness, or paralysis","ok":true,"why":"Neck or back pain, numbness, tingling, weakness, or paralysis after trauma. Also unconscious with a big mechanism, or a poor historian."},{"t":"They want position of comfort after a medical call with no trauma","ok":false,"why":"Neck or back pain, numbness, tingling, weakness, or paralysis after trauma. Also unconscious with a big mechanism, or a poor historian."},{"t":"They walked to the gurney smiling with no complaints","ok":false,"why":"Neck or back pain, numbness, tingling, weakness, or paralysis after trauma. Also unconscious with a big mechanism, or a poor historian."}]},{"ch":"unc","q":"Unconscious after a bad crash or high fall \u2014 why consider the board?","opts":[{"t":"They can still report pain clearly","ok":false,"why":"Unconscious plus significant mechanism (bad MVC, high fall) \u2014 they cannot report pain or symptoms, so you strongly consider SMR/backboard."},{"t":"Significant mechanism and they cannot report pain or symptoms","ok":true,"why":"Unconscious plus significant mechanism (bad MVC, high fall) \u2014 they cannot report pain or symptoms, so you strongly consider SMR/backboard."},{"t":"Unconsciousness always means skip SMR","ok":false,"why":"Unconscious plus significant mechanism (bad MVC, high fall) \u2014 they cannot report pain or symptoms, so you strongly consider SMR/backboard."},{"t":"You only board if they ask after they wake","ok":false,"why":"Unconscious plus significant mechanism (bad MVC, high fall) \u2014 they cannot report pain or symptoms, so you strongly consider SMR/backboard."}]},{"ch":"poor","q":"Severely intoxicated man winces when you press the spine, then denies pain. Your move?","opts":[{"t":"Trust the verbal denial and walk him","ok":false,"why":"He is a poor historian. Treat as possible spinal injury and backboard. Intoxicated, head-injured, or unreliable plus concerning signs counts."},{"t":"Poor historian \u2014 treat as possible spine injury and board","ok":true,"why":"He is a poor historian. Treat as possible spinal injury and backboard. Intoxicated, head-injured, or unreliable plus concerning signs counts."},{"t":"Position of comfort sitting on the bench seat only","ok":false,"why":"He is a poor historian. Treat as possible spinal injury and backboard. Intoxicated, head-injured, or unreliable plus concerning signs counts."},{"t":"Take the gurney down the stairs first","ok":false,"why":"He is a poor historian. Treat as possible spinal injury and backboard. Intoxicated, head-injured, or unreliable plus concerning signs counts."}]},{"ch":"bari","q":"Patient is wider than the backboard. What does this recap want?","opts":[{"t":"Force them onto the board anyway for legal cover","ok":false,"why":"Ask whether the board helps or harms. Forcing can worsen alignment or safety. Use other stabilization, call medical control, and use a bariatric gurney for transport when available."},{"t":"Help vs harm \u2014 do not force a bad fit; other stabilization, medical control, bariatric gurney","ok":true,"why":"Ask whether the board helps or harms. Forcing can worsen alignment or safety. Use other stabilization, call medical control, and use a bariatric gurney for transport when available."},{"t":"Skip medical control because size is never an SMR issue","ok":false,"why":"Ask whether the board helps or harms. Forcing can worsen alignment or safety. Use other stabilization, call medical control, and use a bariatric gurney for transport when available."},{"t":"Carry them on your back with a power grip","ok":false,"why":"Ask whether the board helps or harms. Forcing can worsen alignment or safety. Use other stabilization, call medical control, and use a bariatric gurney for transport when available."}]},{"ch":"comb","q":"Combative or claustrophobic on a possible spine call \u2014 first and last moves?","opts":[{"t":"Board them silently, never call medical control","ok":false,"why":"Reassure and explain first. Severe agitation/head injury may need paramedic sedation per protocol. If they cannot tolerate the board or it is unsafe, call medical control for orders (modify SMR, off board, sedate, restrain)."},{"t":"Explain and reassure first; call medical control if they cannot tolerate the board","ok":true,"why":"Reassure and explain first. Severe agitation/head injury may need paramedic sedation per protocol. If they cannot tolerate the board or it is unsafe, call medical control for orders (modify SMR, off board, sedate, restrain)."},{"t":"Walk them off-road on the gurney alone","ok":false,"why":"Reassure and explain first. Severe agitation/head injury may need paramedic sedation per protocol. If they cannot tolerate the board or it is unsafe, call medical control for orders (modify SMR, off board, sedate, restrain)."},{"t":"Head-strap first, then ignore the torso","ok":false,"why":"Reassure and explain first. Severe agitation/head injury may need paramedic sedation per protocol. If they cannot tolerate the board or it is unsafe, call medical control for orders (modify SMR, off board, sedate, restrain)."}]},{"ch":"lift","q":"Safe lift mechanics this recap wants you to lock?","opts":[{"t":"Lift with the back, twist, load far away, bend at the waist","ok":false,"why":"Lift with legs, not back. Shoulders over pelvis \u2014 no twisting while lifting. Load close. Feet shoulder-width. Bend at hips and knees, not the waist."},{"t":"Legs not back; shoulders over pelvis; load close; hip/knee bend; no twist","ok":true,"why":"Lift with legs, not back. Shoulders over pelvis \u2014 no twisting while lifting. Load close. Feet shoulder-width. Bend at hips and knees, not the waist."},{"t":"Lean far forward so your center of gravity is away from the load","ok":false,"why":"Lift with legs, not back. Shoulders over pelvis \u2014 no twisting while lifting. Load close. Feet shoulder-width. Bend at hips and knees, not the waist."},{"t":"Feet together and an overhand finger pinch","ok":false,"why":"Lift with legs, not back. Shoulders over pelvis \u2014 no twisting while lifting. Load close. Feet shoulder-width. Bend at hips and knees, not the waist."}]},{"ch":"grip","q":"Power grip \u2014 which picture is yours?","opts":[{"t":"Palms down, fingers spread, overhand only","ok":false,"why":"Palms up, hands about 10 inches apart, full wrap, fingers at a similar angle. Stronger and safer than spread fingers or overhand."},{"t":"Palms up, hands about 10 inches apart, full finger wrap at a similar angle","ok":true,"why":"Palms up, hands about 10 inches apart, full wrap, fingers at a similar angle. Stronger and safer than spread fingers or overhand."},{"t":"One fingertip on the rail so you stay loose","ok":false,"why":"Palms up, hands about 10 inches apart, full wrap, fingers at a similar angle. Stronger and safer than spread fingers or overhand."},{"t":"Hands 3 feet apart behind your back","ok":false,"why":"Palms up, hands about 10 inches apart, full wrap, fingers at a similar angle. Stronger and safer than spread fingers or overhand."}]},{"ch":"smart","q":"Heavy or awkward patient \u2014 smarter, not harder?","opts":[{"t":"Always carry; never ask the weight","ok":false,"why":"Roll when you can. Ask a conscious patient their weight; estimate if unconscious. Too much or awkward \u2192 request more people or lifting devices."},{"t":"Roll when you can; ask or estimate weight; call extra help or devices","ok":true,"why":"Roll when you can. Ask a conscious patient their weight; estimate if unconscious. Too much or awkward \u2192 request more people or lifting devices."},{"t":"One-person lift with a twist at the waist","ok":false,"why":"Roll when you can. Ask a conscious patient their weight; estimate if unconscious. Too much or awkward \u2192 request more people or lifting devices."},{"t":"Take the gurney off-road instead of asking for help","ok":false,"why":"Roll when you can. Ask a conscious patient their weight; estimate if unconscious. Too much or awkward \u2192 request more people or lifting devices."}]},{"ch":"log","q":"By-the-book log roll \u2014 who is where?","opts":[{"t":"One person rolls while everyone else watches","ok":false,"why":"Four-person: one at the head holds manual c-spine and commands the count. Three along the side at shoulders/chest, hips, and legs do the roll."},{"t":"Head person holds c-spine and counts; three on the side at shoulders, hips, legs","ok":true,"why":"Four-person: one at the head holds manual c-spine and commands the count. Three along the side at shoulders/chest, hips, and legs do the roll."},{"t":"Head person only straps the feet first","ok":false,"why":"Four-person: one at the head holds manual c-spine and commands the count. Three along the side at shoulders/chest, hips, and legs do the roll."},{"t":"Two people on a gurney for stairs","ok":false,"why":"Four-person: one at the head holds manual c-spine and commands the count. Three along the side at shoulders/chest, hips, and legs do the roll."}]},{"ch":"seq","q":"Log-roll sequence \u2014 what happens first, and what is secured last?","opts":[{"t":"Head blocks first, then skip the collar, then strap the head first","ok":false,"why":"Cervical collar first if you can. Roll as one unit onto the side, slide the board, roll back. Secure torso, hips, legs, then head last while the head holder stays."},{"t":"Collar first if you can; roll as a unit; torso\u2013hips\u2013legs, head last","ok":true,"why":"Cervical collar first if you can. Roll as one unit onto the side, slide the board, roll back. Secure torso, hips, legs, then head last while the head holder stays."},{"t":"Slide the board after they sit up on their own","ok":false,"why":"Cervical collar first if you can. Roll as one unit onto the side, slide the board, roll back. Secure torso, hips, legs, then head last while the head holder stays."},{"t":"Let the side team give the count instead of the head","ok":false,"why":"Cervical collar first if you can. Roll as one unit onto the side, slide the board, roll back. Secure torso, hips, legs, then head last while the head holder stays."}]},{"ch":"skill","q":"Log roll / backboarding as a skill station \u2014 who leads?","opts":[{"t":"Whoever is at the feet gives all commands","ok":false,"why":"It is a tested team skill. The person at the head controls c-spine and leads commands. You are evaluated as a group."},{"t":"The person at the head \u2014 c-spine and the count; you are scored as a team","ok":true,"why":"It is a tested team skill. The person at the head controls c-spine and leads commands. You are evaluated as a group."},{"t":"It is a solo station with no commands","ok":false,"why":"It is a tested team skill. The person at the head controls c-spine and leads commands. You are evaluated as a group."},{"t":"Medical control must be on the radio before every practice roll","ok":false,"why":"It is a tested team skill. The person at the head controls c-spine and leads commands. You are evaluated as a group."}]},{"ch":"reg","q":"What must be on the ambulance versus optional extras?","opts":[{"t":"Stryker yellow vs Ferno red is the NREMT must-know","ok":false,"why":"State rules list required equipment (gurney, splints, etc.). Agencies add optional gear by cost, preference, and medical director. Manufacturer colors are field trivia, not the test."},{"t":"State lists required gear; agency/medical director add optional extras","ok":true,"why":"State rules list required equipment (gurney, splints, etc.). Agencies add optional gear by cost, preference, and medical director. Manufacturer colors are field trivia, not the test."},{"t":"Every ambulance must carry only Ferno red gurneys","ok":false,"why":"State rules list required equipment (gurney, splints, etc.). Agencies add optional gear by cost, preference, and medical director. Manufacturer colors are field trivia, not the test."},{"t":"There are no required devices","ok":false,"why":"State rules list required equipment (gurney, splints, etc.). Agencies add optional gear by cost, preference, and medical director. Manufacturer colors are field trivia, not the test."}]}];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"gurn":"Gurney","tip":"Top-heavy","load":"Load / lock","nogurn":"When not to gurney","two":"Two providers","shockpos":"Shock position","shock4":"Shock formula","comfort":"Position of comfort","walk":"Walking wounded","sheet":"Infection control","board":"Backboard","strap":"Strapping","smrold":"SMR old vs new","smrind":"SMR indications","poor":"Poor historian","bari":"Bariatric","comb":"Combative / SMR","lift":"Body mechanics","grip":"Power grip","roll":"Roll vs carry","log4":"Log-roll team","logseq":"Log-roll sequence","headlast":"Head last","state":"Equipment rules"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sat 1:01 equipment and patient-movement recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · equipment and patient-movement recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
