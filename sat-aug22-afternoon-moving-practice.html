w transport","ok":false,"why":"Position of comfort if no medical preference. Shock four-pack: lots of O2, keep warm, supine, rapid transport. Later he retired feet-up."},{"t":"Always flat; shock gets extra O2, warm, sitting Fowler, fast transport","ok":false,"why":"Position of comfort if no medical preference. Shock four-pack: lots of O2, keep warm, supine, rapid transport. Later he retired feet-up."},{"t":"Always prone; shock gets room air, warm, flat supine, fast transport","ok":false,"why":"Position of comfort if no medical preference. Shock four-pack: lots of O2, keep warm, supine, rapid transport. Later he retired feet-up."},{"t":"Comfort if they pick it; shock gets extra O2, warm, flat supine, fast transport","ok":true,"why":"Position of comfort if no medical preference. Shock four-pack: lots of O2, keep warm, supine, rapid transport. Later he retired feet-up."}]},{"ch":"board","q":"A possible-spine patient is on the ground. Who runs the log roll?","opts":[{"t":"Two people: feet hold C-spine and count; one rolls the body after a collar","ok":false,"why":"Book log roll is four. Head = manual C-spine and in charge. Collar before the roll. Head does not lift by the head."},{"t":"Four people: feet hold C-spine and count; three roll the body before a collar","ok":false,"why":"Book log roll is four. Head = manual C-spine and in charge. Collar before the roll. Head does not lift by the head."},{"t":"Four people: head lifts by the skull and counts; three shove sideways","ok":false,"why":"Book log roll is four. Head = manual C-spine and in charge. Collar before the roll. Head does not lift by the head."},{"t":"Four people: head holds C-spine and counts; three roll the body after a collar","ok":true,"why":"Book log roll is four. Head = manual C-spine and in charge. Collar before the roll. Head does not lift by the head."}]},{"ch":"board","q":"Which conscious patient did he still want on a board?","opts":[{"t":"Arm bruise only after the crash, or hunger, thirst, weakness, paralysis","ok":false,"why":"Now: pain, neuro signs, unconscious trauma, or a poor historian. Old: almost every trauma. Combative/refuse: med control if you skip what others would do."},{"t":"Neck or back pain after the crash, or a stuffy nose with no neuro change","ok":false,"why":"Now: pain, neuro signs, unconscious trauma, or a poor historian. Old: almost every trauma. Combative/refuse: med control if you skip what others would do."},{"t":"Old walking-wounded rule: board every trauma even if they deny pain","ok":false,"why":"Now: pain, neuro signs, unconscious trauma, or a poor historian. Old: almost every trauma. Combative/refuse: med control if you skip what others would do."},{"t":"Neck or back pain after the crash, or numbness, tingling, weakness, paralysis","ok":true,"why":"Now: pain, neuro signs, unconscious trauma, or a poor historian. Old: almost every trauma. Combative/refuse: med control if you skip what others would do."}]},{"ch":"board","q":"Intoxicated, says no neck pain, but says ow when you press mid-back. What did they do?","opts":[{"t":"Treat them as a clear historian and skip the board; alcohol sharpens the pain report","ok":false,"why":"Poor historian example from class. They boarded him. Palpate the spine during the log roll."},{"t":"Treat them as a poor historian and use only a stair chair; alcohol can dull the pain report","ok":false,"why":"Poor historian example from class. They boarded him. Palpate the spine during the log roll."},{"t":"Treat them as a clear historian and board; alcohol never changes the pain report","ok":false,"why":"Poor historian example from class. They boarded him. Palpate the spine during the log roll."},{"t":"Treat them as a poor historian and board; alcohol can dull the pain report","ok":true,"why":"Poor historian example from class. They boarded him. Palpate the spine during the log roll."}]},{"ch":"lift","q":"Power grip, as he named it?","opts":[{"t":"Palms down, about ten inches apart, overhand on the load","ok":false,"why":"Shoulders over pelvis, straight back, lift with the legs, weight close. Power grip palms up ~10 in."},{"t":"Palms up, about thirty inches apart, underhand on the load","ok":false,"why":"Shoulders over pelvis, straight back, lift with the legs, weight close. Power grip palms up ~10 in."},{"t":"Palms up, about ten inches apart, lift with a rounded back","ok":false,"why":"Shoulders over pelvis, straight back, lift with the legs, weight close. Power grip palms up ~10 in."},{"t":"Palms up, about ten inches apart, underhand on the load","ok":true,"why":"Shoulders over pelvis, straight back, lift with the legs, weight close. Power grip palms up ~10 in."}]},{"ch":"move","q":"You need more hands for a heavy patient. What is a lift assist here?","opts":[{"t":"A second ambulance by default, not extra people on scene","ok":false,"why":"Lift assist = people. About 250 lb two-person expectation at his agency. Ask facility staff."},{"t":"A helicopter by default, not extra people on scene","ok":false,"why":"Lift assist = people. About 250 lb two-person expectation at his agency. Ask facility staff."},{"t":"Extra people on scene, plus a second ambulance every time","ok":false,"why":"Lift assist = people. About 250 lb two-person expectation at his agency. Ask facility staff."},{"t":"Extra people on scene, not a second ambulance by default","ok":true,"why":"Lift assist = people. About 250 lb two-person expectation at his agency. Ask facility staff."}]},{"ch":"move","q":"Why did he say bariatric is mostly a width problem?","opts":[{"t":"A regular gurney already holds about 1200 lb; the wide one is about 750 lb","ok":false,"why":"Regular ~750 lb. Bariatric wider ~1200 lb he said. Keep low. Load with lift-gate or ramp plus winch."},{"t":"A regular gurney already holds about 250 lb; the wide one is about 400 lb","ok":false,"why":"Regular ~750 lb. Bariatric wider ~1200 lb he said. Keep low. Load with lift-gate or ramp plus winch."},{"t":"A regular gurney already holds about 750 lb; the stair chair is about 1200 lb","ok":false,"why":"Regular ~750 lb. Bariatric wider ~1200 lb he said. Keep low. Load with lift-gate or ramp plus winch."},{"t":"A regular gurney already holds about 750 lb; the wide one is about 1200 lb","ok":true,"why":"Regular ~750 lb. Bariatric wider ~1200 lb he said. Keep low. Load with lift-gate or ramp plus winch."}]},{"ch":"move","q":"Car on fire, patient still in the seat. Which move category?","opts":[{"t":"Urgent: about one minute, still a full backboard package","ok":false,"why":"Emergency = fire / wreck on fire / pulseless in wreck. They may be mad you worsened spine — they are alive. Urgent ~1 min, not full board time. Non-urgent = stable."},{"t":"Non-urgent: scene is stable, take your time on the board","ok":false,"why":"Emergency = fire / wreck on fire / pulseless in wreck. They may be mad you worsened spine — they are alive. Urgent ~1 min, not full board time. Non-urgent = stable."},{"t":"Emergency: seconds, grab-and-go, then a complete two-minute board","ok":false,"why":"Emergency = fire / wreck on fire / pulseless in wreck. They may be mad you worsened spine — they are alive. Urgent ~1 min, not full board time. Non-urgent = stable."},{"t":"Emergency: seconds, grab-and-go, spine care may be incomplete","ok":true,"why":"Emergency = fire / wreck on fire / pulseless in wreck. They may be mad you worsened spine — they are alive. Urgent ~1 min, not full board time. Non-urgent = stable."}]},{"ch":"move","q":"Patient is stable, scene is stable, lots of time. Which move?","opts":[{"t":"Emergency: skip the path and use the most lifting you can","ok":false,"why":"Non-urgent when both scene and patient are stable. Least lift."},{"t":"Urgent: one-minute drag and skip the gurney lock","ok":false,"why":"Non-urgent when both scene and patient are stable. Least lift."},{"t":"Non-urgent: plan the path and run a grab-and-go from the fire","ok":false,"why":"Non-urgent when both scene and patient are stable. Least lift."},{"t":"Non-urgent: plan the path and use the least lifting you can","ok":true,"why":"Non-urgent when both scene and patient are stable. Least lift."}]},{"ch":"move","q":"Unconscious on a stairwell, possible spine. How do they come down?","opts":[{"t":"On a stair chair, strong hands at head and feet, head first","ok":false,"why":"Stairs + unconscious = board, strong at head/feet, feet first. Stair chair is for awake, not spine. Diamond carry = four sides preferred."},{"t":"On a board, strong hands at head and feet, head first","ok":false,"why":"Stairs + unconscious = board, strong at head/feet, feet first. Stair chair is for awake, not spine. Diamond carry = four sides preferred."},{"t":"On a stair chair, one person at the feet only, feet first","ok":false,"why":"Stairs + unconscious = board, strong at head/feet, feet first. Stair chair is for awake, not spine. Diamond carry = four sides preferred."},{"t":"On a board, strong hands at head and feet, feet first","ok":true,"why":"Stairs + unconscious = board, strong at head/feet, feet first. Stair chair is for awake, not spine. Diamond carry = four sides preferred."}]},{"ch":"move","q":"Awake, no spine worry, no elevator. Which device?","opts":[{"t":"Stair chair down the stairs, stay on it for the whole ambulance ride","ok":false,"why":"Stair chair: conscious, no spine, no elevator. A board can be just a carry tool — off it at the bottom if no spine worry."},{"t":"Backboard down the stairs as the only option, head first","ok":false,"why":"Stair chair: conscious, no spine, no elevator. A board can be just a carry tool — off it at the bottom if no spine worry."},{"t":"Gurney down the stairs, one person at the side","ok":false,"why":"Stair chair: conscious, no spine, no elevator. A board can be just a carry tool — off it at the bottom if no spine worry."},{"t":"Stair chair down the stairs, then off it at the bottom if you want","ok":true,"why":"Stair chair: conscious, no spine, no elevator. A board can be just a carry tool — off it at the bottom if no spine worry."}]},{"ch":"dev","q":"Suspected hip fracture on the floor. Which tool did he point at?","opts":[{"t":"Stair chair: it splits so you do not log-roll the hip","ok":false,"why":"Scoop splits, hip fx. He mentioned a 50%/12 mo stat he heard — not a protocol. Vacuum mattress is the beanbag for kyphosis."},{"t":"Scoop stretcher: it needs a full four-person log roll first","ok":false,"why":"Scoop splits, hip fx. He mentioned a 50%/12 mo stat he heard — not a protocol. Vacuum mattress is the beanbag for kyphosis."},{"t":"Vacuum mattress only: it splits so you do not log-roll the hip","ok":false,"why":"Scoop splits, hip fx. He mentioned a 50%/12 mo stat he heard — not a protocol. Vacuum mattress is the beanbag for kyphosis."},{"t":"Scoop stretcher: it splits so you do not log-roll the hip","ok":true,"why":"Scoop splits, hip fx. He mentioned a 50%/12 mo stat he heard — not a protocol. Vacuum mattress is the beanbag for kyphosis."}]},{"ch":"dev","q":"Older patient with a very curved thoracic spine. Which mattress idea?","opts":[{"t":"Hard backboard only: it conforms after you suck the air out","ok":false,"why":"Vacuum = beanbag + suction; kyphosis; rare locally; call the doc if unsure."},{"t":"Vacuum mattress: it stays rigid before you suck the air out","ok":false,"why":"Vacuum = beanbag + suction; kyphosis; rare locally; call the doc if unsure."},{"t":"Stair chair: it conforms after you suck the air out","ok":false,"why":"Vacuum = beanbag + suction; kyphosis; rare locally; call the doc if unsure."},{"t":"Vacuum mattress: it conforms after you suck the air out","ok":true,"why":"Vacuum = beanbag + suction; kyphosis; rare locally; call the doc if unsure."}]},{"ch":"dev","q":"A neonate 0–1 month needs a controlled box. What was his role in that story?","opts":[{"t":"Isolette belongs to the EMT student; he ran the ventilator","ok":false,"why":"Isolette = neonate 0–1 month. Flight crew’s patient. He called it an Uber-style drive. Cut mid-story — n function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {gurney:"Gurney",shock:"Shock pack",board:"Board / log roll",lift:"Body mechanics",move:"Moves / stairs",dev:"Other devices",pos:"Positioning",restr:"Restraints",safe:"Lift safety",carry:"Carries",cap:"Otter cap"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Afternoon Ch 8 moving only. 2:01 talk capped ~28:05. 2:47 live assessment is not in this quiz.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · afternoon moving only</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
