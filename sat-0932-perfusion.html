const BANK = [{"ch":"rbc","q":"Your patient is bleeding. Besides volume, what are they losing in this recap?","opts":[{"t":"Only white cells, so infection starts in minutes","ok":false,"why":"RBCs are oxygen trucks. Bleeding costs oxygen-carrying capacity, not just tank volume."},{"t":"Oxygen-carrying capacity — RBCs with hemoglobin","ok":true,"why":"RBCs are oxygen trucks. Bleeding costs oxygen-carrying capacity, not just tank volume."},{"t":"Only diastolic pressure; systolic always holds","ok":false,"why":"RBCs are oxygen trucks. Bleeding costs oxygen-carrying capacity, not just tank volume."},{"t":"Only the tricuspid valve’s seal","ok":false,"why":"RBCs are oxygen trucks. Bleeding costs oxygen-carrying capacity, not just tank volume."}]},{"ch":"iv","q":"You give IV fluid for a bleeder. What does this recap say it does not do?","opts":[{"t":"It never changes pressure or volume","ok":false,"why":"IV fluids can help pressure and volume. They do not carry oxygen. Only blood restores oxygen-carrying capacity."},{"t":"It does not carry oxygen — only blood restores that","ok":true,"why":"IV fluids can help pressure and volume. They do not carry oxygen. Only blood restores oxygen-carrying capacity."},{"t":"It immediately replaces every lost platelet","ok":false,"why":"IV fluids can help pressure and volume. They do not carry oxygen. Only blood restores oxygen-carrying capacity."},{"t":"It turns the pipes into a fire hose","ok":false,"why":"IV fluids can help pressure and volume. They do not carry oxygen. Only blood restores oxygen-carrying capacity."}]},{"ch":"wbc","q":"Leukocytes (WBCs) in this recap — job, and how hard you lean on them in acute trauma?","opts":[{"t":"They carry oxygen; they are your first shock lever","ok":false,"why":"WBCs fight infection. Important conceptually, not the main EMT lever in acute trauma or shock."},{"t":"They fight infection; not your main acute trauma/shock focus","ok":true,"why":"WBCs fight infection. Important conceptually, not the main EMT lever in acute trauma or shock."},{"t":"They form the clot by clumping first","ok":false,"why":"WBCs fight infection. Important conceptually, not the main EMT lever in acute trauma or shock."},{"t":"They set systolic to 90 by themselves","ok":false,"why":"WBCs fight infection. Important conceptually, not the main EMT lever in acute trauma or shock."}]},{"ch":"plt","q":"Platelets — what do you need them for here?","opts":[{"t":"They haul glucose and hormones in plasma","ok":false,"why":"Platelets clump together to form a clot. That is how you start to stabilize hemorrhage."},{"t":"They clump to form a clot and help control bleeding","ok":true,"why":"Platelets clump together to form a clot. That is how you start to stabilize hemorrhage."},{"t":"They are the only thing IV fluid replaces","ok":false,"why":"Platelets clump together to form a clot. That is how you start to stabilize hemorrhage."},{"t":"They squeeze the left ventricle","ok":false,"why":"Platelets clump together to form a clot. That is how you start to stabilize hemorrhage."}]},{"ch":"plasma","q":"Besides the three cell types, what else is blood hauling in this recap?","opts":[{"t":"Only nitrogen and bone marrow","ok":false,"why":"Plasma carries sugar, hormones, nutrients, carbon dioxide, and waste (lactic acid, debris)."},{"t":"Glucose, hormones, nutrients, CO₂, and waste such as lactic acid","ok":true,"why":"Plasma carries sugar, hormones, nutrients, carbon dioxide, and waste (lactic acid, debris)."},{"t":"Only the gag reflex and tidal volume","ok":false,"why":"Plasma carries sugar, hormones, nutrients, carbon dioxide, and waste (lactic acid, debris)."},{"t":"Only the pulmonic valve leaflets","ok":false,"why":"Plasma carries sugar, hormones, nutrients, carbon dioxide, and waste (lactic acid, debris)."}]},{"ch":"ppf","q":"Blood pressure in this recap is which three parts?","opts":[{"t":"Lungs, diaphragm, and residual volume only","ok":false,"why":"Pump = heart, pipes = vessels, fluid = blood volume. All three make BP."},{"t":"Pump (heart), pipes (vessels), fluid (blood volume)","ok":true,"why":"Pump = heart, pipes = vessels, fluid = blood volume. All three make BP."},{"t":"Only SAMPLE, OPQRST, and DCAP-BTLS","ok":false,"why":"Pump = heart, pipes = vessels, fluid = blood volume. All three make BP."},{"t":"Only WBC, RBC, and the gag reflex","ok":false,"why":"Pump = heart, pipes = vessels, fluid = blood volume. All three make BP."}]},{"ch":"fail","q":"Pump or pipes or fluid fails. What happens next here?","opts":[{"t":"The other two always keep BP and perfusion normal","ok":false,"why":"Any one of the three failing drops BP, cuts perfusion, and starves cells of oxygen."},{"t":"BP drops, perfusion falls, cells do not get oxygen","ok":true,"why":"Any one of the three failing drops BP, cuts perfusion, and starves cells of oxygen."},{"t":"You only get right-sided JVD and nothing else","ok":false,"why":"Any one of the three failing drops BP, cuts perfusion, and starves cells of oxygen."},{"t":"Diastolic becomes the only number you use","ok":false,"why":"Any one of the three failing drops BP, cuts perfusion, and starves cells of oxygen."}]},{"ch":"sys","q":"Systolic BP — what is it, and which number do you use in emergencies?","opts":[{"t":"Resting fill pressure; you ignore it and use only diastolic","ok":false,"why":"Systolic is left-ventricular squeeze into the body. EMTs mainly use the top number for decisions."},{"t":"Pressure when the left ventricle contracts; that is your field number","ok":true,"why":"Systolic is left-ventricular squeeze into the body. EMTs mainly use the top number for decisions."},{"t":"Pressure in the pulmonary veins only","ok":false,"why":"Systolic is left-ventricular squeeze into the body. EMTs mainly use the top number for decisions."},{"t":"The WBC count expressed as mmHg","ok":false,"why":"Systolic is left-ventricular squeeze into the body. EMTs mainly use the top number for decisions."}]},{"ch":"dia","q":"Diastolic BP in this recap?","opts":[{"t":"The squeeze of the left ventricle into the aorta","ok":false,"why":"Diastolic is resting/fill pressure. Much less important for prehospital emergency decisions."},{"t":"Resting pressure while the heart relaxes and fills — less important prehospital","ok":true,"why":"Diastolic is resting/fill pressure. Much less important for prehospital emergency decisions."},{"t":"The only number that proves shock","ok":false,"why":"Diastolic is resting/fill pressure. Much less important for prehospital emergency decisions."},{"t":"Oxygen-carrying capacity in mmHg","ok":false,"why":"Diastolic is resting/fill pressure. Much less important for prehospital emergency decisions."}]},{"ch":"90","q":"Adult systolic cutoff this recap wants you to carry?","opts":[{"t":"≥ 60 mmHg is always enough perfusion","ok":false,"why":"Adult systolic ≥ 90 is usually enough pressure. Under 90 is hypotension and high suspicion for shock."},{"t":"≥ 90 mmHg is the usual perfusion target; < 90 is hypotension and a shock flag","ok":true,"why":"Adult systolic ≥ 90 is usually enough pressure. Under 90 is hypotension and high suspicion for shock."},{"t":"≥ 140 is required before you reassess","ok":false,"why":"Adult systolic ≥ 90 is usually enough pressure. Under 90 is hypotension and high suspicion for shock."},{"t":"Any systolic is fine if the pulse ox is 99%","ok":false,"why":"Adult systolic ≥ 90 is usually enough pressure. Under 90 is hypotension and high suspicion for shock."}]},{"ch":"trend","q":"One set of vitals versus two or more — what does this recap call them?","opts":[{"t":"One set is a full diagnosis; two sets are wasted time","ok":false,"why":"One set is a snapshot. Two or more sets show a trend. Document at least two so you can say stable, improving, or deteriorating."},{"t":"One set is a snapshot; two or more is a trend (better, worse, same)","ok":true,"why":"One set is a snapshot. Two or more sets show a trend. Document at least two so you can say stable, improving, or deteriorating."},{"t":"Two sets are only for stable patients every 5 minutes","ok":false,"why":"One set is a snapshot. Two or more sets show a trend. Document at least two so you can say stable, improving, or deteriorating."},{"t":"Vitals never need a second set if the first systolic is 90","ok":false,"why":"One set is a snapshot. Two or more sets show a trend. Document at least two so you can say stable, improving, or deteriorating."}]},{"ch":"clock","q":"Reassessment clocks from this recap?","opts":[{"t":"Unstable every 15 minutes; stable every 5","ok":false,"why":"Critical/unstable: every 5 minutes (BP, HR, RR, SpO₂, mental status). Stable: every 15."},{"t":"Unstable / critical every 5 minutes; stable every 15","ok":true,"why":"Critical/unstable: every 5 minutes (BP, HR, RR, SpO₂, mental status). Stable: every 15."},{"t":"Everyone every 30 minutes once you have one BP","ok":false,"why":"Critical/unstable: every 5 minutes (BP, HR, RR, SpO₂, mental status). Stable: every 15."},{"t":"Only reassess if diastolic changes","ok":false,"why":"Critical/unstable: every 5 minutes (BP, HR, RR, SpO₂, mental status). Stable: every 15."}]},{"ch":"perf","q":"Perfusion in one line from this recap?","opts":[{"t":"Only the sound of valves snapping shut","ok":false,"why":"Perfusion is delivery of oxygen and nutrients and removal of waste at the cell."},{"t":"Good stuff in (O₂ and nutrients) and trash out (CO₂, acids, junk)","ok":true,"why":"Perfusion is delivery of oxygen and nutrients and removal of waste at the cell."},{"t":"Only diastolic pressure in the right atrium","ok":false,"why":"Perfusion is delivery of oxygen and nutrients and removal of waste at the cell."},{"t":"Only WBC count above 10","ok":false,"why":"Perfusion is delivery of oxygen and nutrients and removal of waste at the cell."}]},{"ch":"double","q":"Cells are poorly perfused. Why are they “doubly unhappy” here?","opts":[{"t":"They have too much oxygen and no waste at all","ok":false,"why":"Inadequate perfusion starves the cell and lets waste build (lactic acid if they go anaerobic)."},{"t":"Not enough oxygen/nutrients, and waste (lactic acid) piles up","ok":true,"why":"Inadequate perfusion starves the cell and lets waste build (lactic acid if they go anaerobic)."},{"t":"The tricuspid valve is thicker than the left wall","ok":false,"why":"Inadequate perfusion starves the cell and lets waste build (lactic acid if they go anaerobic)."},{"t":"IV fluid immediately fixes both problems","ok":false,"why":"Inadequate perfusion starves the cell and lets waste build (lactic acid if they go anaerobic)."}]},{"ch":"shock","q":"Hypoperfusion versus shock in EMS, this recap?","opts":[{"t":"They are different diseases; shock is only bleeding","ok":false,"why":"Hypoperfusion = shock. Interchangeable in EMS. Low adult systolic (especially < 90) plus poor-perfusion signs."},{"t":"They are the same word — not enough circulation for cellular needs","ok":true,"why":"Hypoperfusion = shock. Interchangeable in EMS. Low adult systolic (especially < 90) plus poor-perfusion signs."},{"t":"Hypoperfusion is only a pipe problem; shock is only fever","ok":false,"why":"Hypoperfusion = shock. Interchangeable in EMS. Low adult systolic (especially < 90) plus poor-perfusion signs."},{"t":"Shock requires a diastolic under 40 and nothing else","ok":false,"why":"Hypoperfusion = shock. Interchangeable in EMS. Low adult systolic (especially < 90) plus poor-perfusion signs."}]},{"ch":"pump","q":"Which cluster is a pump problem in this recap?","opts":[{"t":"Sepsis, anaphylaxis, and neurogenic vasodilation","ok":false,"why":"Pump: heart too weak or squeezed — MI, CHF, tension pneumo, tamponade."},{"t":"Massive MI, CHF, tension pneumothorax, pericardial tamponade","ok":true,"why":"Pump: heart too weak or squeezed — MI, CHF, tension pneumo, tamponade."},{"t":"GI bleed and severe dehydration only","ok":false,"why":"Pump: heart too weak or squeezed — MI, CHF, tension pneumo, tamponade."},{"t":"Platelets clumping too well","ok":false,"why":"Pump: heart too weak or squeezed — MI, CHF, tension pneumo, tamponade."}]},{"ch":"pipe","q":"Pipes too wide — analogy and shock family?","opts":[{"t":"Kitchen sink on a fire hose; that is only hemorrhage","ok":false,"why":"Vasodilation drops pressure even with volume still there. Distributive: sepsis, anaphylaxis, neurogenic."},{"t":"Fire hose on a kitchen sink — vasodilation; distributive (sepsis, anaphylaxis, neurogenic)","ok":true,"why":"Vasodilation drops pressure even with volume still there. Distributive: sepsis, anaphylaxis, neurogenic."},{"t":"Left ventricle backup into the lungs only","ok":false,"why":"Vasodilation drops pressure even with volume still there. Distributive: sepsis, anaphylaxis, neurogenic."},{"t":"IV fluid carrying extra oxygen","ok":false,"why":"Vasodilation drops pressure even with volume still there. Distributive: sepsis, anaphylaxis, neurogenic."}]},{"ch":"fluid","q":"Fluid-problem shock in this recap looks like what?","opts":[{"t":"Vessels too dilated with a full tank","ok":false,"why":"Fluid fail is not enough volume: trauma bleed, GI bleed, severe dehydration."},{"t":"Not enough in the tank — hemorrhage, GI bleed, severe dehydration","ok":true,"why":"Fluid fail is not enough volume: trauma bleed, GI bleed, severe dehydration."},{"t":"Only a mitral valve that will not open","ok":false,"why":"Fluid fail is not enough volume: trauma bleed, GI bleed, severe dehydration."},{"t":"Only fever climbing slowly to 105 °F","ok":false,"why":"Fluid fail is not enough volume: trauma bleed, GI bleed, severe dehydration."}]},{"ch":"speed","q":"500 mL blood loss — what decides whether they tank?","opts":[{"t":"Amount alone; speed never matters","ok":false,"why":"Significant loss is often 500–1000 mL, but speed (and age/hydration/illness) decide tolerance. Slow can compensate; fast can syncope."},{"t":"Speed and the patient: 500 mL in 30–45 min may be tolerated; in 60 seconds they can collapse","ok":true,"why":"Significant loss is often 500–1000 mL, but speed (and age/hydration/illness) decide tolerance. Slow can compensate; fast can syncope."},{"t":"Only if diastolic is the number that changes first","ok":false,"why":"Significant loss is often 500–1000 mL, but speed (and age/hydration/illness) decide tolerance. Slow can compensate; fast can syncope."},{"t":"Only if they already got IV fluid","ok":false,"why":"Significant loss is often 500–1000 mL, but speed (and age/hydration/illness) decide tolerance. Slow can compensate; fast can syncope."}]},{"ch":"comp","q":"Sympathetic compensation this recap lists?","opts":[{"t":"Slower HR, wider pipes, slower breathing","ok":false,"why":"Fight-or-flight: tachycardia, vasoconstriction, increased respiratory rate."},{"t":"Faster HR, vasoconstriction to raise BP, faster RR for O₂ in / CO₂ out","ok":true,"why":"Fight-or-flight: tachycardia, vasoconstriction, increased respiratory rate."},{"t":"Only platelet clumping and a fever to 105 °F","ok":false,"why":"Fight-or-flight: tachycardia, vasoconstriction, increased respiratory rate."},{"t":"Only a rise in diastolic with a falling systolic","ok":false,"why":"Fight-or-flight: tachycardia, vasoconstriction, increased respiratory rate."}]},{"ch":"stages","q":"Compensated versus decompensated shock here?","opts":[{"t":"Compensated already has a systolic under 90; decompensated never drops BP","ok":false,"why":"Compensated still holds BP. Decompensated is hypotension with obvious poor perfusion. Slow problems compensate; fast ones crash."},{"t":"Compensated: shock signs with a still-okay BP. Decompensated: hypotension plus clear poor perfusion","ok":true,"why":"Compensated still holds BP. Decompensated is hypotension with obvious poor perfusion. Slow problems compensate; fast ones crash."},{"t":"They are the same; only the fever analogy changes","ok":false,"why":"Compensated still holds BP. Decompensated is hypotension with obvious poor perfusion. Slow problems compensate; fast ones crash."},{"t":"Decompensated is only a WBC problem","ok":false,"why":"Compensated still holds BP. Decompensated is hypotension with obvious poor perfusion. Slow problems compensate; fast ones crash."}]},{"ch":"path","q":"One RBC from the right atrium — correct valve order through the lungs to the body?","opts":[{"t":"Mitral → aortic → pulmonic → tricuspid","ok":false,"why":"RA → tricuspid → RV → pulmonic → pulmonary arteries → alveoli → pulmonary veins → LA → mitral → LV → aortic → aorta."},{"t":"Tricuspid → pulmonic → (lungs) → mitral/bicuspid → aortic","ok":true,"why":"RA → tricuspid → RV → pulmonic → pulmonary arteries → alveoli → pulmonary veins → LA → mitral → LV → aortic → aorta."},{"t":"Aortic → tricuspid → mitral → pulmonic","ok":false,"why":"RA → tricuspid → RV → pulmonic → pulmonary arteries → alveoli → pulmonary veins → LA → mitral → LV → aortic → aorta."},{"t":"Pulmonic → mitral → tricuspid → aortic, skip the lungs","ok":false,"why":"RA → tricuspid → RV → pulmonic → pulmonary arteries → alveoli → pulmonary veins → LA → mitral → LV → aortic → aorta."}]},{"ch":"left","q":"Left-sided pump is failing. Where does blood back up, and what do you see?","opts":[{"t":"Into the body first — JVD and ankle edema only","ok":false,"why":"Left fail: cannot go forward to the body, so backup LV → LA → pulmonary veins → lung capillaries."},{"t":"Into the lungs — pulmonary edema, SOB, crackles","ok":true,"why":"Left fail: cannot go forward to the body, so backup LV → LA → pulmonary veins → lung capillaries."},{"t":"Only into the SVC, never the pulmonary veins","ok":false,"why":"Left fail: cannot go forward to the body, so backup LV → LA → pulmonary veins → lung capillaries."},{"t":"Nowhere — IV fluid carries the oxygen instead","ok":false,"why":"Left fail: cannot go forward to the body, so backup LV → LA → pulmonary veins → lung capillaries."}]},{"ch":"right","q":"Right-sided pump is failing. Backup where?","opts":[{"t":"Into the lungs — crackles and a CHF picture only","ok":false,"why":"Right fail: cannot go to the lungs, so backup RV → RA → SVC/IVC → systemic venous congestion."},{"t":"Into systemic veins — JVD, peripheral edema, liver enlargement","ok":true,"why":"Right fail: cannot go to the lungs, so backup RV → RA → SVC/IVC → systemic venous congestion."},{"t":"Through the aortic valve into the body as extra stroke volume","ok":false,"why":"Right fail: cannot go to the lungs, so backup RV → RA → SVC/IVC → systemic venous congestion."},{"t":"Nowhere — the right side never backs up","ok":false,"why":"Right fail: cannot go to the lungs, so backup RV → RA → SVC/IVC → systemic venous congestion."}]}];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · perfusion recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
</body>
</html>
