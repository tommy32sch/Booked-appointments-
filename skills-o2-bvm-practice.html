<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Skills lab O2 / NRB / BVM — practice</title>
<style>
:root {
  --bg: #f4efe6; --paper: #fffdf8; --ink: #1c2430; --muted: #5a6573;
  --navy: #1e3a5f; --navy-2: #16304d; --red: #b42318; --green: #1b7a46;
  --line: #d8d0c4; --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
input[type=text] {
  width: 100%; min-height: 48px; font-size: 1.05rem; font-family: inherit;
  padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
}
input[type=text]:focus { outline: 2px solid var(--navy); border-color: var(--navy); }
input[type=text]:disabled { background: #f3f1ec; }
.check {
  width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.check:active { background: var(--navy-2); }
.check:disabled { opacity: .55; cursor: default; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.links { display:flex; flex-wrap:wrap; gap:8px; margin: 12px 0 0; }
.links a { font-size:.82rem; color:#1e3a5f; background:#e8e1d4; border-radius:999px; padding:4px 10px; text-decoration:none; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>Skills lab O2 / NRB / BVM</h1>
  <div class="sub">Type-in · 18 from locked notes</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [
  {
    "ch": "lab",
    "q": "While your hands work a skills station, what do you do with your mouth?",
    "a": [
      "say the step while your hands do it",
      "say each step as you do it",
      "talk the step while hands work",
      "say it while you do it"
    ],
    "why": "Say the step while your hands do it. Your mouth and hands stay on the same line."
  },
  {
    "ch": "lab",
    "q": "What must you name on medical assessment or you fail?",
    "a": [
      "the field impression",
      "field impression / the problem",
      "name the field impression",
      "say the field impression"
    ],
    "why": "Medical assessment fails if you never name the problem. You must say the field impression."
  },
  {
    "ch": "lab",
    "q": "If you finish medical and have no idea what is wrong, what happened?",
    "a": [
      "you skipped a check / a box",
      "skipped a check",
      "you skipped a box",
      "lost = skipped a check"
    ],
    "why": "If you are lost, you skipped a check. If you finish medical with no idea, you skipped a box — look at your notes."
  },
  {
    "ch": "lab",
    "q": "What flow do you run on an NRB?",
    "a": [
      "10–15 L/min",
      "10 to 15 L/min",
      "10-15 L/min",
      "NRB 10–15 L/min"
    ],
    "why": "NRB is 10–15 L/min. Less than 10 is a straw — you suffocate them."
  },
  {
    "ch": "lab",
    "q": "What is the adult BVM rate, squeeze time, and when do you stop the squeeze?",
    "a": [
      "1 breath every 6 seconds; squeeze 1 second; until chest rises",
      "1/6s; squeeze ~1s; stop when chest rises",
      "one every 6 seconds; 1-second squeeze; chest rise",
      "1 breath/6s; squeeze 1s; just until chest rises"
    ],
    "why": "BVM: 1 breath every 6 seconds. Squeeze 1 second. Just until the chest rises."
  },
  {
    "ch": "lab",
    "q": "What is the time limit for suction and for the pulse + breathing check?",
    "a": [
      "≤10 seconds each",
      "no more than 10 seconds each",
      "suction ≤10s; pulse+breathing ≤10s",
      "10 seconds max for both"
    ],
    "why": "Suction no more than 10 seconds. Pulse + breathing check no more than 10 seconds."
  },
  {
    "ch": "lab",
    "q": "What is Chapter 10 in book form for these skills?",
    "a": [
      "the skill sheet",
      "Chapter 10 = the skill sheet in book form",
      "skill sheet in book form",
      "the skill sheet (book form)"
    ],
    "why": "Review Chapter 10. That chapter is the skill sheet in book form."
  },
  {
    "ch": "lab",
    "q": "After you gather tank, regulator, mask, and wrench, what is cracking the tank?",
    "a": [
      "quick open then close to blow dirt out of the outlet",
      "quick open, then close; blows dirt out",
      "brief open/close to clear the outlet",
      "crack = quick open then close (dirt out)"
    ],
    "why": "Crack the tank. Quick open, then close. Blows dirt out of the outlet. Open = lefty-loosey."
  },
  {
    "ch": "lab",
    "q": "How do you seat the regulator so it is right?",
    "a": [
      "two pins in two holes first, then screw down; sits at a right angle",
      "pins first, then screw; right angle (tilted = not seated)",
      "pins in holes first; screw down; right angle",
      "two pins first; screw; right angle — tilted means not seated"
    ],
    "why": "Seat the regulator. Two pins go in the two holes first. Then screw it down. It should sit at a right angle. Tilted = not seated."
  },
  {
    "ch": "lab",
    "q": "After opening the tank one full turn, what gauge reading is about full, and what do you listen for?",
    "a": [
      "about 2000 PSI; listen for a hiss / leak",
      "~2000 PSI; hiss (leak often dead brass washer)",
      "full ~2000 PSI; listen for hiss",
      "about 2000 PSI; hiss = leak check"
    ],
    "why": "Check the gauge. Full tank is about 2000 PSI. Listen for a hiss. A leak is usually a dead brass washer."
  },
  {
    "ch": "lab",
    "q": "What flow do you set from the start on the tank build, and why not start low?",
    "a": [
      "10–15 L/min from the start; do not start low and forget",
      "set 10–15 first; do not start low and forget",
      "10–15 from the start so you do not forget",
      "turn flow to 10–15 L/min from the start"
    ],
    "why": "Turn flow to 10–15 L/min from the start. Do not start low and forget. Shortcut: set 10–15 first so “adjust to at least 10” is already done."
  },
  {
    "ch": "lab",
    "q": "Is 0.5 L/min a treatment on an NRB?",
    "a": [
      "no — not a treatment",
      "no; 0.5 L/min is not a treatment",
      "no — NRB below 10 restricts breathing",
      "no"
    ],
    "why": "0.5 L/min is not a treatment. NRB below 10 restricts breathing."
  },
  {
    "ch": "lab",
    "q": "If you are not holding the O2 tank, what do you do with it, and why?",
    "a": [
      "lay it down; standing tank with snapped neck becomes a missile",
      "lay it down — snapped neck = missile",
      "lay the tank down; standing + snapped neck = missile",
      "lay it down so it cannot become a missile"
    ],
    "why": "If you are not holding the tank, lay it down. A standing tank with a snapped neck becomes a missile."
  },
  {
    "ch": "lab",
    "q": "On the BVM station the patient is unresponsive, not breathing, with a weak pulse of 60. What does that mean for you?",
    "a": [
      "alive, not breathing — keep going",
      "alive not breathing; keep going with airway/BVM",
      "weak pulse 60 = alive, not breathing; keep going",
      "keep going — alive but not breathing"
    ],
    "why": "The station says: unresponsive, not breathing, weak pulse of 60. Alive, not breathing. Keep going."
  },
  {
    "ch": "lab",
    "q": "How do you run suction after you find a mouth full of vomit?",
    "a": [
      "on+test; measure mouth-corner to earlobe; insert OFF; ON coming out circling ≤10s",
      "test suction; measure; insert OFF; suction ON on the way out; circle; ≤10s",
      "measure corner to earlobe; insert OFF; ON while out; ≤10 seconds",
      "turn on/test; measure; insert OFF; suction ON coming out; ≤10s"
    ],
    "why": "Turn it on. Test that it sucks. Measure corner of mouth to earlobe. Insert with suction OFF. Suction ON while you come out. Circle. No more than 10 seconds."
  },
  {
    "ch": "lab",
    "q": "How do you measure and insert an OPA?",
    "a": [
      "corner of mouth to earlobe; insert sideways; twist 90°",
      "measure mouth-corner to earlobe; sideways then twist 90°",
      "corner-to-earlobe; insert sideways; twist 90 degrees",
      "OPA: measure corner to earlobe; sideways; twist 90°"
    ],
    "why": "OPA. Measure corner of mouth to earlobe. Insert sideways. Twist 90°. The station says: no gag — patient accepts it."
  },
  {
    "ch": "lab",
    "q": "On BVM, what oxygen setup and grip do you use once the airway is held open?",
    "a": [
      "high-flow O2 at 15 L/min; C-E grip; seal the mask",
      "BVM on 15 L/min; C-E grip; seal",
      "15 L/min high-flow; C-E grip; seal the mask",
      "high-flow 15 L/min with C-E grip seal"
    ],
    "why": "BVM on high-flow oxygen at 15 L/min. C-E grip. Seal the mask."
  },
  {
    "ch": "lab",
    "q": "The printed sheet wants room air first, then oxygen after ventilations work. Class put 15 L on right away. What do you do on test day?",
    "a": [
      "do whatever that day’s sheet says",
      "follow that day’s sheet",
      "do the printed sheet order for that day",
      "that day’s sheet wins"
    ],
    "why": "The printed sheet may have you bag on room air first, then add oxygen after ventilations are working. Do whatever that day’s sheet says. In class he put 15 L on right away."
  }
]
;

const LINKS = "<a href=\"emt-quiz-index.html\">Hub</a><a href=\"skills-o2-bvm-key.html\">Key</a><a href=\"skills-o2-bvm-detailed.html\">Detailed</a>";

function norm(s) { return String(s).trim().toLowerCase(); }
function acceptList(item) {
  if (Array.isArray(item.a)) return item.a.map(String);
  if (item.a == null) return [];
  return [String(item.a)];
}
function isRight(item, typed) {
  const n = norm(typed);
  if (!n) return false;
  return acceptList(item).some(function (a) { return norm(a) === n; });
}

let i = 0, correct = 0, answered = 0, locked = false;
const main = document.getElementById("main");
const nextBtn = document.getElementById("nextBtn");
const scoreEl = document.getElementById("score");
const progLabel = document.getElementById("progLabel");
const progBar = document.getElementById("progBar");

function setProg() {
  scoreEl.textContent = correct + " / " + answered;
  progLabel.textContent = i < BANK.length ? ("Question " + (i + 1) + " of " + BANK.length) : "Done";
  progBar.style.width = (Math.min(i, BANK.length) / BANK.length * 100) + "%";
}

function renderEnd() {
  nextBtn.classList.remove("visible");
  const pct = BANK.length ? Math.round(correct / BANK.length * 100) : 0;
  main.innerHTML = '<div class="card end"><h2>Done</h2><div class="big">' + correct + " / " + BANK.length + '</div><p class="pct">' + pct + '% first-check correct</p><div class="links">' + LINKS + '</div><button type="button" class="check restart" id="restart">Again</button></div>';
  document.getElementById("restart").onclick = function () {
    i = 0; correct = 0; answered = 0; locked = false; renderQ();
  };
}

function renderQ() {
  if (i >= BANK.length) { setProg(); renderEnd(); return; }
  locked = false;
  nextBtn.classList.remove("visible");
  const item = BANK[i];
  setProg();
  main.innerHTML = '<div class="card"><p class="qtext"></p><input type="text" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button type="button" class="check" id="check">Check</button><div class="why" id="why"></div></div>';
  main.querySelector(".qtext").textContent = item.q;
  const input = document.getElementById("ans");
  const check = document.getElementById("check");
  const why = document.getElementById("why");
  input.focus();

  function submit() {
    if (locked) return;
    const typed = input.value;
    if (!norm(typed)) { input.focus(); return; }
    locked = true;
    answered += 1;
    const ok = isRight(item, typed);
    if (ok) correct += 1;
    input.disabled = true;
    check.disabled = true;
    why.classList.add("visible");
    why.innerHTML = "";
    const v = document.createElement("div");
    v.className = "verdict " + (ok ? "ok" : "bad");
    v.textContent = ok ? "Correct" : "Not quite";
    const w = document.createElement("div");
    w.textContent = item.why;
    why.appendChild(v);
    why.appendChild(w);
    setProg();
    nextBtn.textContent = i === BANK.length - 1 ? "Finish" : "Next";
    nextBtn.classList.add("visible");
  }
  check.onclick = submit;
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
  });
}

nextBtn.onclick = function () {
  if (!locked) return;
  i += 1;
  renderQ();
};

renderQ();

</script>
</body>
</html>
