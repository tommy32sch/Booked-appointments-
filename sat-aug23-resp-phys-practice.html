ulled in. We cannot make that vacuum."}]}, {"ch": "ppv", "q": "You are bagging. When do you stop the squeeze?", "opts": [{"t": "Gentle squeeze just until chest rise, then stop; do not chase half a bag", "ok": true, "why": "Nothing stops overinflation except your hand when you ventilate. Be the calm person."}, {"t": "Hard squeeze well past chest rise so you fill half a bag every time", "ok": false, "why": "Nothing stops overinflation except your hand when you ventilate. Be the calm person."}, {"t": "Gentle squeeze until the stomach rises, then keep going for half a bag", "ok": false, "why": "Nothing stops overinflation except your hand when you ventilate. Be the calm person."}, {"t": "Hard squeeze to a set mmHg he named; half a bag is the rule", "ok": false, "why": "He did not name a squeeze-mmHg. Stop at chest rise only."}]}, {"ch": "ppv", "q": "Why is PPV the opposite of the body, in his words?", "opts": [{"t": "Pushed air also goes down the esophagus and later can mean vomit", "ok": true, "why": "We push; the body pulls. Stomach air is the later problem he named."}, {"t": "Pushed air never reaches the esophagus so vomit cannot happen", "ok": false, "why": "We push; the body pulls. Stomach air is the later problem he named."}, {"t": "Pushed air only fills residual volume so alveoli stay closed", "ok": false, "why": "We push; the body pulls. Stomach air is the later problem he named."}, {"t": "Pushed air replaces the phrenic nerve so C3–4–5 no longer matter", "ok": false, "why": "We push; the body pulls. Stomach air is the later problem he named."}]}, {"ch": "tv", "q": "How do you judge tidal volume in this class?", "opts": [{"t": "Chest rise and fall; you do not measure mL", "ok": true, "why": "One breath. Too small and air may never reach alveoli."}, {"t": "A numbered mL he listed for every adult", "ok": false, "why": "He said we do not measure mL. Proxy is chest rise."}, {"t": "Pulse ox only; rise does not count", "ok": false, "why": "He said we do not measure mL ys the same at altitude", "ok": false, "why": "Everest example. Extrinsic respiration problem is low partial pressure."}, {"t": "Stays 100% O2; only the pulse ox changes at altitude", "ok": false, "why": "Everest example. Extrinsic respiration problem is low partial pressure."}]}, {"ch": "adeq", "q": "Adult adequate breathing numbers he used?", "opts": [{"t": "12–20/min, equal rise, regular, clear equal sounds, depth = chest rise", "ok": true, "why": "Adequate = enough air × enough times. They can still have SOB or SpO2 91%."}, {"t": "8–10/min, unequal rise, irregular, absent sounds, depth = pulse ox", "ok": false, "why": "Adequate = enough air × enough times. They can still have SOB or SpO2 91%."}, {"t": "22–28/min only, no need for rise or sounds", "ok": false, "why": "Adequate = enough air × enough times. They can still have SOB or SpO2 91%."}, {"t": "Any rate if SpO2 is 100%; sounds do not matter", "ok": false, "why": "Adequate = enough air × enough times. They can still have SOB or SpO2 91%."}]}, {"ch": "adeq", "q": "Adult at 22, good rise, regular, clear. What bucket?", "opts": [{"t": "Abnormal-fast but may still be adequate; change % O2, do not take over", "ok": true, "why": "Abnormal rate is <12 or >20. Slow usually means ventilate. 22 can still be adequate."}, {"t": "Inadequate by rate alone; you must breathe for them now", "ok": false, "why": "Abnormal rate is <12 or >20. Slow usually means ventilate. 22 can still be adequate."}, {"t": "Adequate only if you invent a device LPM he deferred", "ok": false, "why": "Device names/LPM this hour: not in his notes."}, {"t": "Respiratory arrest; 22 means they stopped", "ok": false, "why": "Abnormal rate is <12 or >20. Slow usually means ventilate. 22 can still be adequate."}]}, {"ch": "adeq", "q": "Inadequate breathing, as he used the word?", "opts": [{"t": "Not moving enough air, so you breathe for them (too slow or too shallow)", "ok": true, "why": "Test split is almost always adequate vs inadequate if you read R/ ration?", "opts": [{"t": "External: O2 into blood at the lungs; internal: O2 off hemoglobin into the cell", "ok": true, "why": "Diffusion is high to low and seeks balance."}, {"t": "External: O2 off hemoglobin into the cell; internal: O2 into blood at the lungs", "ok": false, "why": "Diffusion is high to low and seeks balance."}, {"t": "External: ventilation only; internal: residual volume only", "ok": false, "why": "Diffusion is high to low and seeks balance."}, {"t": "Both happen only in the mediastinum, never at cells", "ok": false, "why": "Diffusion is high to low and seeks balance."}]}, {"ch": "fluid", "q": "Fluid in the lung versus fluid outside the lung?", "opts": [{"t": "In = edema (brick wall); outside drain = thoracentesis, medic, not EMT", "ok": true, "why": "He split those two places. Do not invent an EMT drain."}, {"t": "In = thoracentesis you do; outside = edema you suction from alveoli", "ok": false, "why": "He split those two places. Do not invent an EMT drain."}, {"t": "Both are the same; EMT needles both", "ok": false, "why": "He split those two places. Do not invent an EMT drain."}, {"t": "Neither needs blood in the capillaries to exchange", "ok": false, "why": "Gas exchange needs air in alveoli AND blood in pulmonary capillaries."}]}, {"ch": "airway", "q": "End of this talk, the airway goal word?", "opts": [{"t": "Patent = clear and open upper path; next talk manages it", "ok": true, "why": "That is where 9:54 handed off."}, {"t": "Patent = a named OPA/NPA size he taught this hour", "ok": false, "why": "Adjuncts not this hour. Do not invent."}, {"t": "Patent = ETCO2 35–45 you must memorize", "ok": false, "why": "He said do not need to remember 35–45."}, {"t": "Patent = 15 LPM on a device he named this hour", "ok": false, "why": "Device LPM this hour: not in his notes."}]}, {"ch": "scene", "q": "What can beat airway after you are safe and they are alive?", "opts": [{"t": "A major life-threatening bleed seen on general impression", "ok": true, "why": "Find a life threat, treat a life threat. Then airway."}, {"t": "A month of belly pain before you look at A or B", "ok": false, "why": "Find a life threat, treat a life threat. Then airway."}, {"t": "Dispatch ‘difficulty breathing,’ which is already the diagnosis", "ok": false, "why": "Dispatch ≠ diagnosis. After ABCs you may land cardiac."}, {"t": "A pulse ox of 99% even if they are spurting", "ok": false, "why": "Find a life threat, treat a life threat. Then airway."}]}, {"ch": "etco2", "q": "Capnometry versus capnography, and the number?", "opts": [{"t": "Number vs waveform; 35–45 he said you do not need to remember; more medic", "ok": true, "why": "Shark-fin = asthma, hard to get air out. Good exhaled CO2 means the whole chain is working."}, {"t": "Waveform vs number; 35–45 you must memorize as an EMT skill", "ok": false, "why": "Shark-fin = asthma, hard to get air out. Good exhaled CO2 means the whole chain is working."}, {"t": "Both are pulse ox; 94–99 is exhaled CO2", "ok": false, "why": "Shark-fin = asthma, hard to get air out. Good exhaled CO2 means the whole chain is working."}, {"t": "Both prove only residual volume; never circulation", "ok": false, "why": "Shark-fin = asthma, hard to get air out. Good exhaled CO2 means the whole chain is working."}]}, {"ch": "clot", "q": "Gas exchange needs both of these, clot example?", "opts": [{"t": "Air in alveoli and blood in the capillaries; clot = no blood to exchange", "ok": true, "why": "He said both sides have to show up."}, {"t": "Air in the mediastinum only; a clot in the lung does not matter here", "ok": false, "why": "He said both sides have to show up."}, {"t": "Blood in the esophagus and air in the stomach, not the capillaries", "ok": false, "why": "He said both sides have to show up."}, {"t": "Only residual volume; pulmonary capillaries are optional for exchange", "ok": false, "why": "He said both sides have to show up."}]}];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"cspine": "C-spine / phrenic", "chain": "Vent → resp → ox", "defs": "Definitions", "press": "Pressure", "ppv": "PPV", "tv": "Tidal volume", "drive": "Drive", "gas": "Diffusion", "alt": "Altitude", "adeq": "Adequate vs not", "patt": "Patterns", "words": "Words", "o2": "O2 indications", "spo2": "Pulse ox", "anat": "Anatomy", "exhale": "Exhalation", "chest": "Chest", "cell": "Cells", "resp": "Respiration types", "fluid": "Fluid", "airway": "Patent", "scene": "Priority", "etco2": "ETCO2", "clot": "Exchange"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Sunday 9:54 respiratory phys only. Device LPM / adjuncts: not in his notes this hour.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · 9:54 respiratory phys only</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
