ad-tilt moves the C-spine.","keyPoints":[{"text":"Trauma or unknown = jaw thrust, C-spine neutral","terms":["jaw","thrust","neutral","trauma"]},{"text":"Medical, no spine concern = head-tilt chin-lift","terms":["tilt","chin","medical"]}]},{"id":"v2-airway-opa-gag","topic":"airway","prompt":"You drop an OPA and the patient gags. You:","rationale":"A gag means the OPA comes out now. Have suction ready. OPA is only for a fully unresponsive patient with no gag.","keyPoints":[{"text":"OPA only if unresponsive with no gag","terms":["gag","unresponsive","opa"]},{"text":"Any gag = pull it and be ready to suction","terms":["pull","vomit","suction"]}]},{"id":"v2-airway-npa-raccoon","topic":"airway","prompt":"Unresponsive with raccoon eyes and blood from one ear after a fall. Best adjunct?","rationale":"Raccoon eyes and otorrhea suggest a basilar skull fracture. An NPA can track into the cranial vault. Use an OPA if there is no gag, or manual jaw thrust.","keyPoints":[{"text":"No NPA with head/face trauma or basilar skull signs (raccoon eyes, Battle's, CSF)","terms":["npa","basilar","raccoon","skull","face"]},{"text":"Use OPA if no gag, or hold the jaw manually","terms":["opa","jaw","manual","gag"]}]},{"id":"v2-circ-compensated","topic":"circ","prompt":"A stabbing victim is anxious, pale, and tachycardic. Radial pulse is thready. BP is 118/76. This is:","rationale":"Shock signs with a pressure that is still holding is compensated shock. A normal BP never rules shock out. Decompensated is when the systolic falls.","keyPoints":[{"text":"Compensated = shock signs + BP still holding","terms":["compensat","holding","normal","tachycard"]},{"text":"Decompensated = systolic falling (adult under 90); never use a normal BP to rule out shock","terms":["90","decompensat","fall","hypotens"]}]},{"id":"v2-circ-warfarin","topic":"circ","prompt":"An older adult on warfarin bumped his head on a cabinet. He says he feels fine. You:","rationale":"Warfarin blocks clotting. A minor head strike can become an intracranial bleed hours later. Transport bias goes up; aspirin would make it worse.","keyPoints":[{"text":"Warfarin/anticoagulants + head strike = hidden brain-bleed risk","terms":["warfarin","anticoag","head","bleed"]},{"text":"Ask about blood thinners on every trauma patient","terms":["ask","thinner","every"]}]},{"id":"v2-circ-sepsis-pipes","topic":"circ","prompt":"A febrile nursing-home patient is hypotensive and flushed. Which part of the perfusion triad failed?","rationale":"Sepsis is distributive (pipe) shock: infection dilates the container so it outgrows the blood in it. He may also be dry, but the classic mechanism is vasodilation.","keyPoints":[{"text":"Pump = heart; pipes = vessels; fluid = blood volume","terms":["pump","pipe","fluid"]},{"text":"Sepsis and anaphylaxis dilate the pipes","terms":["sepsis","dilat","distribut","anaphyla"]}]},{"id":"v2-circ-jvd-tamponade","topic":"circ","prompt":"Penetrating chest wound, JVD, muffled heart sounds, falling BP. That pattern is:","rationale":"Beck's triad — JVD, muffled sounds, hypotension — is tamponade. Blood in the pericardial sac squeezes the heart (a pump problem from the outside).","keyPoints":[{"text":"JVD + muffled heart + hypotension = tamponade","terms":["tamponade","muffled","jvd","beck"]},{"text":"Flat veins = empty tank; JVD = backup (tamponade, tension, right failure)","terms":["flat","empty","backup","tension"]}]},{"id":"v2-body-spleen","topic":"body","prompt":"A left-upper-quadrant blow in a pickup game, now pale and dizzy. Which solid organ is the classic bleeder?","rationale":"The spleen sits in the LUQ and bleeds like a solid, blood-rich organ. Hollow organs leak contents and cause peritonitis more than instant shock.","keyPoints":[{"text":"Spleen = LUQ solid organ and a hidden bleeder","terms":["spleen","luq","left"]},{"text":"Solid organs bleed; hollow organs leak","terms":["solid","hollow","bleed","leak"]}]},{"id":"v2-body-glucagon","topic":"body","prompt":"Glucagon's job is to:","rationale":"Insulin lowers glucose; glucagon raises it. Both come from the pancreas.","keyPoints":[{"text":"Insulin lowers glucose; glucagon raises it","terms":["insulin","glucagon","raise","lower"]},{"text":"Check a sugar on altered patients; under 80 is low","terms":["80","120","altered","low"]}]},{"id":"v2-body-full-thickness","topic":"body","prompt":"The center of a burn is dry, leathery, and the patient says that part does not hurt. Depth?","rationale":"Full thickness destroys dermis and nerve endings — leathery, dry, and painless in the center. The rim is often partial thickness and screaming painful.","keyPoints":[{"text":"Full thickness = leathery, dry, nerves gone → least pain in the center","terms":["leather","nerve","painless","full"]},{"text":"Partial = blisters and severe pain; superficial = red, no blisters","terms":["blister","partial","superficial","red"]}]},{"id":"v2-body-phrenic","topic":"body","prompt":"A football player is numb from the shoulders down and is getting short of breath. The nerve you are worried about exits at:","rationale":"C3, 4, 5 keeps the diaphragm alive — the phrenic nerve. A high cervical injury can stop breathing.","keyPoints":[{"text":"Phrenic nerve = C3–C5 = diaphragm","terms":["phrenic","c3","c5","diaphragm"]},{"text":"Injury at or above that level can stop breathing","terms":["above","breath","stop","high cervical"]}]},{"id":"v2-move-stair-chair","topic":"move","prompt":"A 70-year-old with flu is weak but awake, no spine concern, apartment is a walk-up. Best device?","rationale":"Conscious, no spine issue, stairs = stair chair. Boards are for the unconscious or spine-injured.","keyPoints":[{"text":"Awake, no spine, stairs = stair chair","terms":["stair chair","conscious","awake"]},{"text":"Unconscious or spine = board, feet first","terms":["board","feet first","unconscious"]}]},{"id":"v2-move-left-lateral","topic":"move","prompt":"A 34-week pregnant patient is hypotensive after a fender-bender, no spinal complaint. Best position?","rationale":"After about 20 weeks, the uterus compresses the vena cava when she lies flat. Left lateral restores venous return.","keyPoints":[{"text":"20+ weeks supine → uterus on the vena cava (supine hypotensive syndrome)","terms":["vena cava","20","supine hypotensive"]},{"text":"Left lateral restores return; do not leave her flat","terms":["left","lateral","flat"]}]},{"id":"v2-move-head-last","topic":"move","prompt":"On a long board, the head is secured:","rationale":"Body first (torso X, hips, legs), head last with blocks. If the body can still shift, a strapped head becomes the fulcrum that wrenches the neck.","keyPoints":[{"text":"Strap torso, hips, and legs before the head","terms":["torso","head last","hips","legs"]},{"text":"A shifting body with a fixed head twists the neck","terms":["shift","twist","neck"]}]},{"id":"v2-move-power-grip","topic":"move","prompt":"The power grip is:","rationale":"Palms up, spaced, full wrap — that is the strongest, most stable hold. Lift with the legs, load close, no twist.","keyPoints":[{"text":"Power grip: palms up, ~10 inches apart, fingers fully wrapped","terms":["palm","10","wrap","up"]},{"text":"Lift with the legs, load close, do not twist","terms":["leg","close","twist"]}]},{"id":"v2-meds-viagra","topic":"meds","prompt":"Chest pain, BP 142/88, patient took sildenafil (Viagra) last night. Nitroglycerin?","rationale":"PDE-5 inhibitors (-fil: Viagra, Cialis) plus nitro can produce refractory hypotension. Hold nitro for about 24–48 hours after those drugs. BP over 100 does not cancel that rule.","keyPoints":[{"text":"No nitro with ED meds (-fil) in the last 24–48 hours","terms":["fil","viagra","cialis","24","ed"]},{"text":"Also hold if systolic is under 100 or there is a head injury","terms":["100","head","systolic"]}]},{"id":"v2-meds-asa-dose","topic":"meds","prompt":"Suspected cardiac chest pain, no aspirin allergy. The protocol dose is:","rationale":"160–325 mg chewed (often 2–4 baby aspirin). Chewing gets the antiplatelet effect on board faster. It makes platelets slippery so the clot cannot grow.","keyPoints":[{"text":"160–325 mg chewed for suspected ACS","terms":["160","325","chew"]},{"text":"Antiplatelet — stops the clot from growing; allergy and kids are holds","terms":["platelet","allerg","reye","kid"]}]},{"id":"v2-meds-epi-dose","topic":"meds","prompt":"Bee sting, hives, wheezing, BP 78/40. Adult epinephrine dose and route?","rationale":"This is anaphylaxis: two systems plus hypotension. Adult epi is 0.3 mg IM in the lateral thigh. 0.15 mg is the pediatric auto-injector.","keyPoints":[{"text":"Adult epi 0.3 mg IM lateral thigh; peds 0.15 mg","terms":["0.3","0.15","thigh","im"]},{"text":"Anaphylaxis = airway, shock/hypotension, or two-plus systems","terms":["anaphyla","two","shock","airway"]}]},{"id":"v2-meds-oral-glucose-hold","topic":"meds","prompt":"Glucose is 52. The patient is unresponsive with a snoring airway. Oral glucose?","rationale":"Oral glucose needs a conscious patient who can swallow. Unresponsive and snoring = no oral sugar. Airway first; ALS or the ED can give IV dextrose.","keyPoints":[{"text":"Oral glucose only if conscious and able to swallow","terms":["conscious","swallow","awake","protect"]},{"text":"Unresponsive or no gag → no oral sugar; need IV dextrose at ALS/ED","terms":["unrespons","aspirat","dextrose","als"]}]},{"id":"v2-life-immunity","topic":"life","prompt":"A healthy 5-year-old in kindergarten has had four colds since school started. The best explanation is:","rationale":"Passive maternal antibodies fade around ages 4–6. Kids then build their own immunity through exposure — and they get sick doing it.","keyPoints":[{"text":"Maternal (passive) antibodies fade around ages 4–6","terms":["4","6","maternal","passive","fade"]},{"text":"After the fade, kids get sick more while building their own immunity","terms":["own","build","school","sick"]}]},{"id":"v2-life-diaphragm","topic":"life","prompt":"A 2-year-old with a huge, distended belly is now breathing faster. Why does the belly matter?","rationale":"Young children rely on the diaphragm. A packed belly, a belly injury, or lying flat cuts their tidal volume.","keyPoints":[{"text":"Young kids are diaphragm breathers — chest wall muscles are still weak","terms":["diaphragm","chest wall","toddler"]},{"text":"A distended belly, injury, or flat position cuts their ventilation","terms":["belly","abdom","flat","distend"]}]},{"id":"v2-life-vs","topic":"life","prompt":"Compared with a healthy adolescent, a 6-month-old should have:","rationale":"Younger means faster heart and breathing, lower blood pressure. Adolescents sit in adult ranges: HR 60–100, RR 12–20, systolic at least 90.","keyPoints":[{"text":"Younger = faster HR and RR, lower BP","terms":["faster","lower","infant","younger"]},{"text":"Adolescents use adult ranges (HR 60–100, RR 12–20, SBP ≥ 90)","terms":["adolescen","teen","60","12","90"]}]},{"id":"v2-life-moral","topic":"life","prompt":"A 15-year-old will only wear the collar if his friends say it looks fine. That moral stage is:","rationale":"Teens usually reason at the conventional, peer-driven stage. Pre-conventional is punishment-avoidance; post-conventional is internalized ethics.","keyPoints":[{"text":"Pre-conventional = avoid punishment; conventional = peers; post-conventional = internal ethics","terms":["punish","peer","ethic","conventional"]},{"text":"Adolescents usually sit at the conventional, friend-driven stage","terms":["teen","adolescen","friend","peer"]}]},{"id":"v2-terms-hepat","topic":"terms","prompt":"Nephritis is inflammation of the:","rationale":"Nephr- is kidney and -itis is inflammation. Hepat- is liver; neuro- is nerves; pulmon- is lung.","keyPoints":[{"text":"hepat- = liver, nephr- = kidney, cardi- = heart, pulmon- = lung","terms":["hepat","nephr","liver","kidney"]},{"text":"-itis = inflammation","terms":["itis","inflam"]}]},{"id":"v2-terms-palm","topic":"terms","prompt":"You are estimating a scattered burn. Whose palm is about 1% of total body surface?","rationale":"The patient's own palm is about 1% of their body surface. Your hand may be a different size entirely.","keyPoints":[{"text":"The patient's palm ≈ 1% TBSA","terms":["1","palm","patient"]},{"text":"Depth (superficial / partial / full) is charted separately from area","terms":["depth","area","separate"]}]},{"id":"v2-docs-soap","topic":"docs","prompt":"In a SOAP note, the line \"I have been dizzy since breakfast\" belongs under:","rationale":"Subjective is what the patient says. Objective is what you measure or observe. Assessment is your impression; plan is treatment and transport.","keyPoints":[{"text":"Subjective = what they say; objective = what you can measure or see","terms":["subjective","objective","says","measur"]},{"text":"CHART = Chief complaint, History, Assessment, Rx, Transport","terms":["chart","chief","rx","transport"]}]},{"id":"v2-docs-radio","topic":"docs","prompt":"The handheld radio you take to the patient's side is the:","rationale":"Portable = handheld. Mobile is mounted in the truck. Base is fixed at the station or hospital. A repeater is hardware that rebroadcasts to extend range.","keyPoints":[{"text":"Portable = handheld, mobile = vehicle, base = fixed; FCC owns the frequencies","terms":["portable","handheld","mobile","base"]},{"text":"Simplex = push-to-talk one at a time; duplex = both ways at once","terms":["simplex","duplex","push"]}]},{"id":"v2-docs-sbar","topic":"docs","prompt":"In SBAR, the B stands for:","rationale":"SBAR is Situation, Background, Assessment, Treatment — the order of a verbal handoff. The written ePCR follows.","keyPoints":[{"text":"SBAR = Situation, Background, Assessment, Treatment","terms":["situation","background","assessment","treatment"]},{"text":"Verbal handoff first; the ePCR is the written follow-up","terms":["verbal","handoff","epcr"]}]},{"id":"v2-docs-ethno","topic":"docs","prompt":"You catch yourself thinking a patient's home remedies are \"ignorant\" because they are not how you grew up. That barrier is:","rationale":"Ethnocentrism is \"my culture is the standard.\" Cultural imposition goes further and forces your values onto the patient. Both count as noise in communication.","keyPoints":[{"text":"Ethnocentrism = my culture first; imposition = forcing your values","terms":["ethno","imposition","culture","values"]},{"text":"Noise = anything that blocks the message","terms":["noise","block","interfer","barrier"]}]},{"id":"v2-reassess-orders","topic":"reassess","prompt":"The stem gives you no standing order and no online order for a drug you want to give. You:","rationale":"No standing order means you call. Sequence is graded: authorization → administer → reassess. Half of an unauthorized dose is still unauthorized.","keyPoints":[{"text":"No standing order → contact medical control before the drug","terms":["medical control","order","contact","call"]},{"text":"Sequence: authorize → give → reassess","terms":["reassess","sequence","then","authorize"]}]},{"id":"v2-resp-three","topic":"resp","prompt":"A pulse ox of 86% with a good waveform is measuring:","rationale":"SpO2 is oxygenation. Ventilation is air movement. Respiration is the alveolar swap. Three different failures, three different fixes.","keyPoints":[{"text":"Ventilation = air moving; respiration = alveolar exchange; oxygenation = O2 on hemoglobin","terms":["ventilation","respiration","oxygenation","hemoglobin"]},{"text":"SpO2 is oxygenation — it does not prove the patient is ventilating","terms":["spo2","sat","not","ventilat"]}]},{"id":"v2-resp-co","topic":"resp","prompt":"Pulled from a house fire, talking, sat 99% on room air, headache and nausea. Oxygen?","rationale":"Carbon monoxide occupies hemoglobin. The pulse ox counts those seats as full, so you get a false-normal sat. Fire or CO exposure gets high-flow O2 anyway.","keyPoints":[{"text":"CO fills hemoglobin; the sat reads false-normal","terms":["carbon","hemoglobin","false","co"]},{"text":"Fire or CO exposure → high-flow oxygen no matter the number","terms":["high-flow","high flow","nrb","regardless","fire"]}]},{"id":"v2-resp-agonal","topic":"resp","prompt":"You find an adult with occasional irregular gasps and no other breathing. You:","rationale":"Agonal gasps are not breathing. They are a sign of arrest or peri-arrest. Ventilate immediately — and check a pulse.","keyPoints":[{"text":"Agonal gasps are not breathing — ventilate and check a pulse","terms":["agonal","gasp","bag","not breath"]},{"text":"NRB is for the patient who is still actually moving air","terms":["nrb","moving air","adequate"]}]},{"id":"v2-resp-distress","topic":"resp","prompt":"Tripod, retractions, two-word sentences, still moving air. This is:","rationale":"Accessory-muscle use and broken speech are distress. He is still ventilating, so you oxygenate and prepare to bag if he tiring. Arrest is no breathing.","keyPoints":[{"text":"Retractions, tripod, and broken speech = respiratory distress","terms":["retract","tripod","distress","two-word"]},{"text":"Sleepy and quieter means failure is coming — ready the BVM","terms":["sleepy","fail","tire","bvm"]}]},{"id":"v2-assess-lmp","topic":"assess","prompt":"A 27-year-old has sudden right-lower-quadrant pain and dizziness. After ABCs, you must ask:","rationale":"Childbearing age plus abdominal pain means you screen for pregnancy. Ectopic pregnancy is the hidden killer behind that question.","keyPoints":[{"text":"Childbearing age + abdominal pain → pregnancy chance and LMP","terms":["pregnan","lmp","period","menstrual"]},{"text":"Ectopic pregnancy is the life threat behind the question","terms":["ectopic","rupture","bleed"]}]},{"id":"v2-assess-tq","topic":"assess","prompt":"Bright red blood is spurting from a mid-thigh wound. Direct pressure is soaking through. Next?","rationale":"Spurting = arterial. Pressure first; if a limb is still bleeding, tourniquet high and tight proximal to the wound. No tourniquet on the neck, torso, or junctions.","keyPoints":[{"text":"Direct pressure first; failed limb bleed → tourniquet proximal to the wound","terms":["pressure","tourniquet","proximal"]},{"text":"Spurting = arterial; no TQ on neck, torso, or junctions","terms":["arterial","spurt","neck","torso"]}]},{"id":"v2-assess-rr8","topic":"assess","prompt":"An adult overdose is breathing 6 times a minute, still has a pulse. You:","rationale":"Adult worry cutoffs are over 28 or under 8. Under 8 — or failure or arrest — means you bag. A pulse means no compressions yet.","keyPoints":[{"text":"Under 8/min — or failure or arrest — means assist ventilations","terms":["8","eight","ventilat","bag"]},{"text":"Worry over 28; fast is not automatically a BVM if volume is good","terms":["28","fast","volume"]}]},{"id":"v2-assess-sign","topic":"assess","prompt":"Which of these is a sign?","rationale":"Signs are observed or measured by you. Symptoms are what the patient reports — even when they attach a number.","keyPoints":[{"text":"Sign = observable or measurable (rate, cyanosis, bleeding)","terms":["sign","measur","observ","see"]},{"text":"Symptom = what the patient reports, even with a number on it","terms":["symptom","report","says","feel"]}]},{"id":"v2-assess-order","topic":"assess","prompt":"The correct order of a call is:","rationale":"Life threats come before questions. Scene and primary (ABCs) are first; history waits until the patient is not dying in front of you.","keyPoints":[{"text":"Scene → primary → history → secondary + vitals → impression/treatment → reassess","terms":["scene","primary","history","secondary","reassess"]},{"text":"ABCs before questions — history waits","terms":["abc","before","history","life threat"]}]},{"id":"v2-assess-scene","topic":"assess","prompt":"Which task belongs in scene size-up?","rationale":"The five size-up jobs happen before you touch the patient. History and detailed exams come later.","keyPoints":[{"text":"Five size-up tasks: BSI, safety, MOI/NOI, number of patients, extra resources","terms":["bsi","safety","moi","noi","resource"]},{"text":"All of it happens before patient contact","terms":["before","contact","touch"]}]},{"id":"v2-assess-stridor","topic":"assess","prompt":"A child has a harsh, high-pitched sound on inspiration and is drooling. That sound is:","rationale":"Stridor is an upper-airway warning. Snoring is the tongue. Gurgling is fluid. Wheezes are usually lower airway.","keyPoints":[{"text":"Stridor = upper-airway swelling (croup, epiglottitis, anaphylaxis)","terms":["stridor","upper","swell","croup"]},{"text":"Snoring = tongue; gurgling = fluid","terms":["snor","tongue","gurgl","fluid"]}]},{"id":"v2-assess-pedsbp","topic":"assess","prompt":"Minimum acceptable systolic for a 4-year-old is about:","rationale":"Under age 10: minimum systolic ≈ 2 × age + 70. 2 × 4 + 70 = 78. The adult floor of 90 starts around age 10.","keyPoints":[{"text":"Under 10: minimum systolic = 2 × age + 70","terms":["2","70","age","formula"]},{"text":"Adult floor is 90; the formula reaches it at age 10","terms":["90","10","adult"]}]},{"id":"v2-assess-gcs","topic":"assess","prompt":"Eyes open to speech, words are confused, he localizes pain. GCS?","rationale":"Eyes to speech = 3, confused verbal = 4, localizes = 5. 3 + 4 + 5 = 12. Floor is 3, ceiling is 15.","keyPoints":[{"text":"Eyes 1–4, verbal 1–5, motor 1–6 — add them","terms":["eyes","verbal","motor","add"]},{"text":"15 = fully alert; 3 = no response at all","terms":["15","3","alert","floor"]}]},{"id":"v2-assess-eject","topic":"assess","prompt":"A driver was ejected, is awake, and points to a wrist. Exam?","rationale":"Ejection, high speed, and big falls are significant MOI. Talking does not cancel a hidden second injury. Localized minor complaints get a focused exam; this is not that.","keyPoints":[{"text":"Significant MOI (ejection, high speed, big fall) → rapid head-to-toe even if awake","terms":["moi","eject","head-to-toe","head to toe"]},{"text":"Isolated minor complaint → focused exam of that area","terms":["focused","minor","localiz","finger"]}]},{"id":"v2-assess-priority","topic":"assess","prompt":"Which patient is high-priority / load-and-go?","rationale":"Altered status, airway work, assisted ventilations, major bleeding, shock, ACS pain, and complicated childbirth are high priority. Stable chronic complaints can stay and play.","keyPoints":[{"text":"High priority: altered, airway work, ventilation, shock, major bleed, ACS, complicated birth","terms":["altered","shock","ventilat","priority","bleed"]},{"text":"Stable, non-critical complaints can stay and play","terms":["stable","stay","chronic"]}]},{"id":"v2-assess-platinum","topic":"assess","prompt":"The Platinum 10 is:","rationale":"Platinum 10 is scene time — get the essential ABCs done and move. The Golden Hour is injury to surgery in under 60 minutes; your 10 minutes live inside that hour.","keyPoints":[{"text":"Platinum 10 = 10 minutes or less on scene, ABC care only","terms":["10","ten","scene","platinum"]},{"text":"Golden Hour = injury to surgery in under 60 minutes","terms":["golden","hour","surgery","60"]}]},{"id":"v2-assess-onset","topic":"assess","prompt":"\"What were you doing when this started?\" is asking:","rationale":"Onset is what you were doing when it began and whether it hit suddenly. Timing is how long it has lasted. Sudden and recent is scarier than weeks-old pain.","keyPoints":[{"text":"Onset = what you were doing when it started; timing = how long it has lasted","terms":["onset","timing","start","doing"]},{"text":"Sudden and recent is scarier; a severity CHANGE matters more than the first number","terms":["sudden","change","severity","recent"]}]},{"id":"v2-assess-abcs-first","topic":"assess","prompt":"Suspected opioid OD, pulse present, breathing 4 and shallow. Naloxone is in your partner's hand. You:","rationale":"ABCs before meds. Inadequate breathing gets a BVM first. Naloxone takes minutes to work; the brain needs oxygen during every one of them.","keyPoints":[{"text":"ABCs before meds: inadequate breathing → BVM first","terms":["abc","first","bvm","bag","before"]},{"text":"Naloxone takes minutes — oxygen the brain the whole time","terms":["minute","oxygen","brain","naloxone"]}]},{"id":"v2-assess-abuse","topic":"assess","prompt":"You think a child was abused. Which line belongs on the PCR?","rationale":"Charts hold measured findings and quoted words — never guilt conclusions. You still file the mandatory report. Good-faith reporting is protected; defamation is stating a false fact as fact.","keyPoints":[{"text":"Chart objective findings and the patient's (or child's) words in quotes","terms":["objective","quote","bruise","measur"]},{"text":"No guilt on the PCR; suspicions go through mandatory reporting","terms":["guilt","mandatory","report"]}]},{"id":"v2-airway-sample","topic":"airway","prompt":"Unresponsive in an empty apartment, no wallet, no med list, no neighbors. SAMPLE history?","rationale":"You skip history only when the patient is out AND no family, ID, or med list exists. Otherwise you pull SAMPLE from any source. The physical exam becomes your information.","keyPoints":[{"text":"Skip SAMPLE only if he is out AND there is no family, ID, or med list","terms":["skip","no family","no source","unconscious"]},{"text":"Otherwise pull history from anyone available; the exam fills the gaps","terms":["wife","family","exam","source"]}]},{"id":"v2-airway-nc","topic":"airway","prompt":"Mild SOB after a long walk, sats 94%, speaking full sentences. Best oxygen start?","rationale":"Cannula is the low-need comfort device: 1–6 L/min, about 24–44%. Real distress or hypoxia with adequate breathing steps up to an NRB at 10–15 L.","keyPoints":[{"text":"Cannula = 1–6 L/min (about 24–44%) for low-need patients","terms":["cannula","1","6","24","44"]},{"text":"Real hypoxia or distress with adequate breathing → NRB at 10–15 L","terms":["nrb","15","10","hypox"]}]},{"id":"v2-airway-cpap","topic":"airway","prompt":"Awake CHF, wet crackles, follows commands, BP 148/90, breathing 28. Best support?","rationale":"CPAP needs alert, follows commands, still breathing, systolic at least 90. Wet lungs in a working CHF patient are the classic indication. Kills: apnea, low BP, chest/face trauma, pneumothorax, vomiting.","keyPoints":[{"text":"CPAP needs: alert, follows commands, still breathing, SBP at least 90","terms":["alert","command","90","cpap"]},{"text":"Kills: apnea, hypotension, chest/face trauma, pneumothorax, vomiting","terms":["apnea","hypotens","trauma","pneumo","vomit"]}]},{"id":"v2-airway-choke","topic":"airway","prompt":"A diner is silent, clutching his throat, no air moving. You:","rationale":"Severe (silent, no air) gets 5 and 5, repeated. Mild (talking or coughing) gets coached coughs. Collapse = start compressions. Blind sweeps push food deeper.","keyPoints":[{"text":"Severe (silent, no air) = 5 back blows + 5 abdominal thrusts, repeat","terms":["5","back blow","abdominal","thrust"]},{"text":"Mild = coach the cough; collapse = start compressions","terms":["cough","mild","collapse","compress"]}]},{"id":"v2-airway-bvmrate","topic":"airway","prompt":"Adult with a pulse, you are bagging. The rate is:","rationale":"Adult with a pulse: about 1 every 6 seconds. Child or infant: every 2–3 seconds. Squeeze only until the chest rises — over-ventilating drops BP and fills the stomach.","keyPoints":[{"text":"Adult with a pulse: 1 breath every 6 seconds; child/infant every 2–3","terms":["6 second","10","2–3","2-3"]},{"text":"Squeeze to visible chest rise only — over-ventilating drops BP and causes vomiting","terms":["rise","over","stomach","visible"]}]},{"id":"v2-circ-chf-side","topic":"circ","prompt":"Crackles and severe breathlessness, no ankle swelling. Which side of the heart failed?","rationale":"Blood backs up BEHIND the side that failed. Left failure fills the lungs (crackles, SOB). Right failure fills the body (JVD, ankle edema).","keyPoints":[{"text":"Blood backs up behind the side that failed","terms":["back","behind","failed"]},{"text":"Left → lungs (crackles, SOB); right → body (JVD, ankle edema)","terms":["left","right","lung","jvd","edema"]}]},{"id":"v2-circ-tpma","topic":"circ","prompt":"The valve order blood follows is:","rationale":"T-P-M-A: right atrium through tricuspid to right ventricle, pulmonic to the lungs, pulmonary veins to left atrium, mitral to left ventricle, aortic out to the body.","keyPoints":[{"text":"Valve order T-P-M-A: tricuspid → pulmonic → mitral → aortic","terms":["tpma","tricuspid","pulmonic","mitral","aortic"]},{"text":"Pulmonary arteries carry deoxygenated blood — the artery exception","terms":["deoxygen","pulmonary arter","exception"]}]},{"id":"v2-circ-output","topic":"circ","prompt":"Cardiac output equals:","rationale":"CO = SV × HR. Roughly 80 mL × 70 ≈ 5.6 L/min. Very fast rates shrink filling time, so stroke volume — and output — can fall.","keyPoints":[{"text":"Cardiac output = stroke volume × heart rate (~80 mL × 70 ≈ 5.6 L/min)","terms":["stroke volume","heart rate","80","5.6"]},{"text":"Very fast rates cut filling time → output can drop","terms":["fill","fast","drop","time"]}]},{"id":"v2-circ-radial","topic":"circ","prompt":"He is talking, but you cannot feel a radial pulse. Think:","rationale":"The radial disappears early as pressure falls. A talking patient with no radial is a shock flag — check the carotid and treat shock. You do not start CPR on a talking patient.","keyPoints":[{"text":"Awake → radial; unresponsive adult/child → carotid; infant → brachial","terms":["radial","carotid","brachial"]},{"text":"A weak or absent radial in a living patient = shock until proven otherwise","terms":["absent","weak","shock","pressure"]}]},{"id":"v2-circ-triad","topic":"circ","prompt":"The perfusion triad is:","rationale":"Perfusion needs a working pump, intact pipes, and enough fluid. Any one failing is shock. IV saline can fill volume but cannot carry oxygen the way red cells do.","keyPoints":[{"text":"Pump = heart, pipes = vessels, fluid = blood","terms":["pump","pipe","fluid","heart","vessel"]},{"text":"Any one failing = shock; IV fluid is not oxygen-carrying red cells","terms":["shock","fail","iv","oxygen","red cell"]}]},{"id":"v2-body-hemophilia","topic":"body","prompt":"A hemophiliac has a small scalp laceration that will not quit. Why is that a big deal?","rationale":"Missing factors (Hemophilia A = factor VIII) mean minor wounds bleed a long time. Firm uninterrupted pressure, no peeking, early transport — the hospital has the factor.","keyPoints":[{"text":"Hemophilia = missing clotting factors — minor trauma bleeds a long time","terms":["factor","clot","missing","viii"]},{"text":"Uninterrupted pressure, no peeking, early transport","terms":["pressure","peek","transport"]}]},{"id":"v2-body-anaerobic","topic":"body","prompt":"A shock patient is covered with a blanket on a warm day. Why?","rationale":"Hypoperfusion forces anaerobic metabolism: little energy, lactic acid, acidosis — and heat loss. Cover them to protect what little energy is left.","keyPoints":[{"text":"Hypoperfusion → anaerobic metabolism: less energy, lactic acid, acidosis","terms":["anaerobic","lactic","acid","energy"]},{"text":"Heat loss comes with it — blanket shock patients even when it is warm","terms":["heat","blanket","cover","warm"]}]},{"id":"v2-body-receptors","topic":"body","prompt":"Albuterol opens lower airways by stimulating:","rationale":"Alpha constricts vessels and raises BP. Beta-1 is the heart. Beta-2 opens bronchioles. Epinephrine hits all three — pressure up and airways open.","keyPoints":[{"text":"Alpha = vasoconstriction; beta-1 = heart; beta-2 = bronchodilation","terms":["alpha","beta-1","beta-2","bronchodil"]},{"text":"Epinephrine hits all three — pressure up AND airways open","terms":["epi","all three","epipen"]}]},{"id":"v2-move-recovery","topic":"move","prompt":"Post-seizure, groggy, breathing adequately, no spine concern. Position?","rationale":"Recovery = unresponsive or groggy + breathing adequately + no spine concern. Gravity drains vomit. If breathing fails, he goes supine for the bag.","keyPoints":[{"text":"Recovery = unresponsive/groggy + adequate breathing + no spine concern","terms":["recovery","side","lateral","vomit"]},{"text":"Needs a bag → supine","terms":["supine","bag","ventilat"]}]},{"id":"v2-move-restrain","topic":"move","prompt":"A combative patient needs restraints. First you:","rationale":"Agitation is a medical exam first. Then five people (one per limb plus one), supine only, and recheck ABCs and distal circulation the whole ride. Chart situation, intervention, outcome.","keyPoints":[{"text":"First rule out hypoxia, hypoglycemia, and head injury","terms":["hypox","sugar","glucose","head"]},{"text":"Five people, supine only, recheck circulation — never prone","terms":["five","5","supine","prone","recheck"]}]},{"id":"v2-move-scoop","topic":"move","prompt":"Suspected hip fracture, patient screaming if you try to roll him. Best device?","rationale":"The scoop splits in half and captures a no-roll patient. Stair chairs are for sitting, walking-wounded stairs. Emergency drags are for fire or gunfire, not a controlled hip.","keyPoints":[{"text":"Scoop splits in half — hip fractures and other no-roll patients","terms":["scoop","split","no roll","hip"]},{"text":"Stairs = stair chair; water = board or Stokes; everyday = the gurney","terms":["stair","stokes","gurney","device"]}]},{"id":"v2-meds-rights","topic":"meds","prompt":"Which of these is one of the five rights?","rationale":"The five rights: patient, medication, dose, route, time. Time includes expiration and repeat intervals. After giving, chart name, dose, route, time, and the response.","keyPoints":[{"text":"Five rights: patient, medication, dose, route, time","terms":["patient","medication","dose","route","time"]},{"text":"After giving: chart name, dose, route, time, and the response","terms":["chart","response","document"]}]},{"id":"v2-meds-narcan","topic":"meds","prompt":"Pinpoint pupils, RR 6, track marks. Naloxone will reverse:","rationale":"Naloxone is an opioid antagonist. It does nothing for benzos or alcohol. It is benign if no opioid is aboard. Expect a combative wake-up. Intranasal works even if they are apneic.","keyPoints":[{"text":"Naloxone reverses opioids only — heroin, fentanyl, oxycodone, morphine","terms":["opioid","fentanyl","heroin","antagonist"]},{"text":"Useless for benzos or alcohol; watch for the combative wake-up","terms":["benzo","alcohol","combative","wake"]}]},{"id":"v2-meds-albuterol","topic":"meds","prompt":"Asthma, wheezing, talking in phrases. Albuterol works by:","rationale":"Albuterol is a beta-2 agonist — bronchodilation for asthma and wheezing. A nebulizer runs about 6 L/min. An MDI must fire on the inhale; kids need a spacer.","keyPoints":[{"text":"Albuterol = beta-2 agonist → bronchodilation","terms":["beta-2","bronchodil","relax","wheez"]},{"text":"SVN at ~6 L/min; MDI fires on the inhale (spacer for kids)","terms":["6","svn","mdi","spacer"]}]},{"id":"v2-meds-scope","topic":"meds","prompt":"Which of these is outside typical EMT scope?","rationale":"The EMT six: aspirin, nitro, oral glucose, epinephrine, naloxone, albuterol. IV meds, intubation, and IO are paramedic. Assist only with the patient's own prescription — not grandma's nitro.","keyPoints":[{"text":"The EMT six: aspirin, nitro, oral glucose, epinephrine, naloxone, albuterol","terms":["six","aspirin","nitro","glucose","epi","naloxone","albuterol"]},{"text":"IV meds, intubation, IO = paramedic; only the patient's own assisted meds","terms":["iv","paramedic","als","own","prescription"]}]}]</script>
<script>
const RECALL_MIN_CHARS = 12;
const TOPIC_ORDER = ["life","terms","docs","assess","reassess","resp","airway","circ","body","move","meds"];
const TOPIC_LABEL = {
  life: "Lifespan",
  terms: "Terms",
  docs: "Docs / comms",
  assess: "Assessment",
  reassess: "Reassess",
  resp: "Respiratory",
  airway: "Airway / O2",
  circ: "Circulation",
  body: "Body systems",
  move: "Move / position",
  meds: "Meds"
};

const QUESTIONS = JSON.parse(document.getElementById("bank").textContent);

function coversPoint(explanation, point) {
  const lower = explanation.toLowerCase();
  return point.terms.some(function(term) { return lower.includes(term); });
}

function autoRecallGrade(text, question) {
  if (question.keyPoints.length === 0) return "solid";
  const covered = question.keyPoints.filter(function(point) {
    return coversPoint(text, point);
  }).length;
  return covered === question.keyPoints.length ? "solid" : "miss";
}

function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function mulberry32(a) {
  return function() {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function seededShuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function pickMixed(questions, seed, n) {
  const rng = mulberry32(hashSeed(String(seed)));
  const byTopic = {};
  TOPIC_ORDER.forEach(function(t) { byTopic[t] = []; });
  questions.forEach(function(q) {
    if (byTopic[q.topic]) byTopic[q.topic].push(q);
  });
  const order = seededShuffle(TOPIC_ORDER.filter(function(t) {
    return byTopic[t].length > 0;
  }), rng);
  order.forEach(function(t) {
    byTopic[t] = seededShuffle(byTopic[t], rng);
  });
  const picked = [];
  let round = 0;
  while (picked.length < n) {
    let added = false;
    for (let t = 0; t < order.length; t++) {
      if (picked.length >= n) break;
      const topic = order[t];
      if (round < byTopic[topic].length) {
        picked.push(byTopic[topic][round]);
        added = true;
      }
    }
    if (!added) break;
    round += 1;
  }
  return picked;
}

function hourSeed() {
  const d = new Date();
  function p(n) { return String(n).padStart(2, "0"); }
  return String(d.getFullYear()) + p(d.getMonth() + 1) + p(d.getDate()) + p(d.getHours());
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function $(id) { return document.getElementById(id); }

const params = new URLSearchParams(location.search);
const seedParam = (params.get("seed") || "").trim();
const topicParam = (params.get("topic") || "all").trim();

let bank = seedParam ? pickMixed(QUESTIONS, seedParam, 20) : QUESTIONS.slice();
let topic = TOPIC_LABEL[topicParam] ? topicParam : "all";
let queue = [];
let i = 0;
let locked = false;
let solid = 0;
let answered = 0;
let missed = [];
let retrying = false;
let draft = "";

function poolForTopic() {
  if (topic === "all") return bank.slice();
  return bank.filter(function(q) { return q.topic === topic; });
}

function setQueue(list, isRetry) {
  queue = list.slice();
  i = 0;
  locked = false;
  solid = 0;
  answered = 0;
  missed = [];
  retrying = !!isRetry;
  draft = "";
}

function syncUrl() {
  const u = new URL(location.href);
  if (seedParam) u.searchParams.set("seed", seedParam);
  else u.searchParams.delete("seed");
  if (topic !== "all") u.searchParams.set("topic", topic);
  else u.searchParams.delete("topic");
  history.replaceState(null, "", u.pathname + u.search + u.hash);
}

function renderFilters() {
  const bits = ['<button type="button" class="chip' + (topic === "all" ? " on" : "") + '" data-topic="all">All</button>'];
  TOPIC_ORDER.forEach(function(t) {
    bits.push(
      '<button type="button" class="chip' + (topic === t ? " on" : "") + '" data-topic="' + t + '">' +
      escapeHtml(TOPIC_LABEL[t]) + "</button>"
    );
  });
  $("filters").innerHTML = bits.join("");
  $("filters").querySelectorAll(".chip").forEach(function(btn) {
    btn.addEventListener("click", function() {
      topic = btn.getAttribute("data-topic");
      syncUrl();
      setQueue(poolForTopic(), false);
      render();
    });
  });
}

function renderSeedLinks() {
  const hour = hourSeed();
  const uAll = new URL(location.href);
  uAll.searchParams.delete("seed");
  if (topic !== "all") uAll.searchParams.set("topic", topic);
  else uAll.searchParams.delete("topic");
  const uHour = new URL(location.href);
  uHour.searchParams.set("seed", hour);
  if (topic !== "all") uHour.searchParams.set("topic", topic);
  else uHour.searchParams.delete("topic");
  if (seedParam) {
    $("sub").textContent = "Seed " + seedParam + " · " + bank.length + " mixed · type-in";
    $("seedLinks").innerHTML = '<a href="' + escapeHtml(uAll.pathname + uAll.search) + '">All 188 in file order</a>';
  } else {
    $("sub").textContent = "All " + QUESTIONS.length + " · file order · type-in, no multiple choice";
    $("seedLinks").innerHTML = '<a href="' + escapeHtml(uHour.pathname + uHour.search) + '">This hour’s 20</a> · seed=' + escapeHtml(hour);
  }
}

function updateScore() {
  $("score").textContent = solid + " / " + answered;
  const n = queue.length;
  if (n === 0) {
    $("progLabel").textContent = "No questions";
    $("progBar").style.width = "0%";
    return;
  }
  const done = i >= n;
  $("progLabel").textContent = done ? ("Done · " + n + " questions") : ("Question " + (i + 1) + " of " + n);
  $("progBar").style.width = (n ? Math.round(((i + (locked ? 1 : 0)) / n) * 100) : 0) + "%";
}

function showFooter(which) {
  $("checkBtn").classList.toggle("visible", which === "check");
  $("nextBtn").classList.toggle("visible", which === "next");
}

function render() {
  locked = false;
  draft = "";
  showFooter(null);
  if (queue.length === 0) {
    $("main").innerHTML = '<div class="card"><h2>No questions in this filter</h2><p class="hint">Pick All, or drop the hour seed if this topic was not in the 20.</p></div>';
    updateScore();
    return;
  }
  if (i >= queue.length) return endScreen();
  const q = queue[i];
  $("main").innerHTML =
    (retrying ? '<div class="banner">Retrying missed items</div>' : "") +
    '<div class="card">' +
      '<div class="ch-tag"></div>' +
      '<p class="qtext"></p>' +
      '<p class="hint">Type the answer in your own words. No choices.</p>' +
      '<textarea id="answer" rows="5" autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true" inputmode="text" placeholder="Type your answer…"></textarea>' +
      '<p class="char" id="charHint">Need ' + RECALL_MIN_CHARS + ' characters to check</p>' +
      '<button type="button" class="btn visible" id="cardCheck" disabled>Check</button>' +
      '<div id="feedback"></div>' +
    '</div>' +
    '<p class="note">From your locked EMT notes canvas. Keyword check marks solid vs miss.</p>';
  $("main").querySelector(".ch-tag").textContent = TOPIC_LABEL[q.topic] || q.topic;
  $("main").querySelector(".qtext").textContent = q.prompt;
  const area = $("answer");
  area.addEventListener("input", onDraft);
  area.addEventListener("keydown", function(ev) {
    if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter") {
      ev.preventDefault();
      submit();
    }
  });
  $("checkBtn").disabled = true;
  $("cardCheck").disabled = true;
  $("cardCheck").addEventListener("click", submit);
  showFooter("check");
  updateScore();
  window.scrollTo(0, 0);
  area.focus();
}

function onDraft() {
  if (locked) return;
  draft = $("answer").value;
  const n = draft.trim().length;
  const ready = n >= RECALL_MIN_CHARS;
  $("checkBtn").disabled = !ready;
  const cardCheck = $("cardCheck");
  if (cardCheck) cardCheck.disabled = !ready;
  const hint = $("charHint");
  if (ready) {
    hint.textContent = n + " characters · ready to check";
    hint.classList.add("ok");
  } else {
    hint.textContent = "Need " + RECALL_MIN_CHARS + " characters to check · " + n + " now";
    hint.classList.remove("ok");
  }
}

function submit() {
  if (locked) return;
  const q = queue[i];
  const text = ($("answer").value || "");
  if (text.trim().length < RECALL_MIN_CHARS) return;
  locked = true;
  $("answer").readOnly = true;
  const grade = autoRecallGrade(text, q);
  answered += 1;
  if (grade === "solid") solid += 1;
  else missed.push({ q: q, text: text });
  const hits = q.keyPoints.map(function(point) { return coversPoint(text, point); });
  let points = "";
  q.keyPoints.forEach(function(point, idx) {
    const hit = hits[idx];
    points += '<li class="' + (hit ? "hit" : "gap") + '">' +
      '<span class="pill ' + (hit ? "hit" : "gap") + '">' + (hit ? "Solid" : "Miss") + "</span>" +
      '<span class="ptxt"></span></li>';
  });
  const box = $("feedback");
  box.innerHTML =
    '<div class="why ' + grade + '">' +
      '<div class="verdict ' + (grade === "solid" ? "ok" : "bad") + '">' +
        (grade === "solid" ? "Solid — you hit the key points" : "Miss — compare yours to the model") +
      "</div>" +
      '<p class="model-label">Model answer</p>' +
      '<p class="model"></p>' +
      '<p class="coach-label">Why</p>' +
      '<ul class="points">' + points + "</ul>" +
    "</div>";
  box.querySelector(".model").textContent = q.rationale;
  box.querySelectorAll(".ptxt").forEach(function(el, idx) {
    el.textContent = q.keyPoints[idx].text;
  });
  const cardCheck = $("cardCheck");
  if (cardCheck) cardCheck.classList.remove("visible");
  $("nextBtn").textContent = (i + 1 >= queue.length) ? "See results" : "Next";
  showFooter("next");
  updateScore();
}

function endScreen() {
  locked = true;
  showFooter(null);
  const n = queue.length;
  const pct = n ? Math.round((solid / n) * 100) : 0;
  let missHtml = missed.length
    ? '<div class="miss"><h3>Missed (' + missed.length + ")</h3>"
    : "<p>No misses. Nice work.</p>";
  missed.forEach(function() {
    missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="model-label">Model answer</div><div class="mwhy"></div></div>';
  });
  if (missed.length) missHtml += "</div>";
  const retryBtn = missed.length
    ? '<button type="button" class="btn visible" id="retryMissed">Retry missed</button>'
    : "";
  $("main").innerHTML =
    '<div class="card end"><h2>Pass complete</h2>' +
    '<div class="big">' + solid + " / " + n + "</div>" +
    '<div class="pct">' + pct + "% solid · type-in</div>" +
    missHtml +
    retryBtn +
    '<button type="button" class="btn visible secondary" id="again">Start over</button>' +
    "</div>";
  if (missed.length) {
    const items = $("main").querySelectorAll(".miss-item");
    missed.forEach(function(m, idx) {
      items[idx].querySelector(".ch-tag").textContent = TOPIC_LABEL[m.q.topic] || m.q.topic;
      items[idx].querySelector(".mq").textContent = m.q.prompt;
      items[idx].querySelector(".mwhy").textContent = m.q.rationale;
    });
    $("retryMissed").addEventListener("click", function() {
      const ids = missed.map(function(m) { return m.q.id; });
      const byId = {};
      QUESTIONS.forEach(function(q) { byId[q.id] = q; });
      setQueue(ids.map(function(id) { return byId[id]; }), true);
      render();
    });
  }
  $("again").addEventListener("click", function() {
    setQueue(poolForTopic(), false);
    render();
  });
  updateScore();
  window.scrollTo(0, 0);
}

$("checkBtn").addEventListener("click", submit);
$("nextBtn").addEventListener("click", function() {
  if (!locked) return;
  i += 1;
  render();
});
