<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>EMT type-in flash</title>
<style>
:root {
  --bg: #f4efe6;
  --paper: #fffdf8;
  --ink: #1c2430;
  --muted: #5a6573;
  --navy: #1e3a5f;
  --navy-2: #16304d;
  --red: #b42318;
  --red-soft: #fde8e6;
  --green: #1b7a46;
  --green-soft: #e5f6ec;
  --line: #d8d0c4;
  --gold: #f0c14b;
  --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden;
}
body { min-height: 100dvh; padding-bottom: calc(92px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; font-weight: 400; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 99px; transition: width .2s; }
.filters {
  display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  margin: 10px -16px 0; padding: 0 16px 2px;
}
.chip {
  flex: 0 0 auto; min-height: 36px; padding: 6px 12px; border-radius: 99px;
  border: 1px solid rgba(255,255,255,.32); background: transparent; color: #fff;
  font-size: .78rem; font-weight: 700; font-family: inherit; cursor: pointer;
}
.chip.on { background: #fff; color: var(--navy); border-color: #fff; }
.links { margin-top: 8px; font-size: .75rem; opacity: .9; }
.links a { color: #fff; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.ch-tag {
  display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: #e8eef6; color: var(--navy); padding: 4px 8px; border-radius: 6px; margin-bottom: 10px;
}
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 10px; }
.hint { margin: 0 0 10px; font-size: .86rem; color: var(--muted); }
textarea#answer {
  width: 100%; min-height: 132px; resize: vertical;
  font-family: inherit; font-size: 16px; line-height: 1.4;
  padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px;
  background: #fff; color: var(--ink);
}
textarea#answer:focus { outline: none; border-color: var(--navy); }
textarea#answer[readonly] { background: #f6f3ec; }
.char { margin: 6px 0 0; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
#cardCheck { margin-top: 12px; }
.char.ok { color: var(--green); }
.banner {
  margin: 0 0 12px; padding: 10px 12px; border-radius: 10px;
  background: #e8eef6; color: var(--navy); font-size: .9rem; font-weight: 650;
}
.why {
  margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.solid { background: var(--green-soft); border-left-color: var(--green); }
.why.miss { background: var(--red-soft); border-left-color: var(--red); }
.verdict { font-weight: 800; margin-bottom: 6px; }
.verdict.ok { color: var(--green); }
.verdict.bad { color: var(--red); }
.model-label, .coach-label {
  font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); margin: 12px 0 6px;
}
.model { margin: 0; }
.points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.points li {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 8px 10px; border-radius: 10px; background: #fff; border: 1px solid var(--line);
}
.points li.hit { border-color: #b9e0c6; background: #f3fbf6; }
.points li.gap { border-color: #f0c4bf; background: #fff8f7; }
.pill {
  flex: 0 0 auto; font-size: .7rem; font-weight: 800; letter-spacing: .03em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 99px; margin-top: 2px;
}
.pill.hit { background: var(--green-soft); color: var(--green); }
.pill.gap { background: var(--red-soft); color: var(--red); }
.ptxt { flex: 1; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.btn:active { background: var(--navy-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.secondary { background: #fff; color: var(--navy); border: 2px solid var(--navy); margin-top: 8px; }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
.miss { margin-top: 18px; }
.miss h3 { margin: 0 0 10px; font-size: 1.05rem; }
.miss-item { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.miss-item .mq { font-weight: 650; margin-bottom: 6px; }
.miss-item .mwhy { font-size: .92rem; color: #333; }
.note { font-size: .86rem; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<header>
  <h1>EMT type-in flash</h1>
  <div class="sub" id="sub">Write the answer. No multiple choice.</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="links" id="seedLinks"></div>
</header>
<main id="main"></main>
<footer class="act">
  <button type="button" class="btn" id="checkBtn">Check</button>
  <button type="button" class="btn" id="nextBtn">Next</button>
</footer>
<script id="bank" type="application/json">[{"id":"life-reflexes","topic":"life","prompt":"You touch a newborn's cheek and he turns his head toward your finger. Which reflex is this?","rationale":"Rooting is the head turning toward a touch on the cheek to find food. The four normal newborn reflexes are Moro, palmar grasp, rooting, and sucking.","keyPoints":[{"text":"Rooting = head turns toward a touch on the cheek — a feeding reflex","terms":["root","cheek","turn","feed"]},{"text":"The four normal newborn reflexes: Moro, palmar grasp, rooting, sucking","terms":["moro","palmar","grasp","suck","four"]}]},{"id":"life-fontanelle","topic":"life","prompt":"A 6-month-old has had vomiting and diarrhea for two days. Which fontanelle finding would you expect?","rationale":"A sunken fontanelle means volume loss — dehydration. Bulging means pressure (meningitis or trauma). The posterior closes by about 3 months; the anterior stays open 9–18 months.","keyPoints":[{"text":"Sunken fontanelle = volume loss / dehydration; bulging = intracranial pressure","terms":["sunken","dehydrat","volume","bulg","pressure"]},{"text":"Posterior closes by about 3 months; anterior stays open 9–18 months","terms":["9","18","3 month","three month","anterior","posterior"]}]},{"id":"life-immunity","topic":"life","prompt":"Passive immunity from maternal antibodies typically protects a child until approximately what age?","rationale":"Maternal antibodies fade around ages 4–6, which is why kids catch more infections in their early school years while building their own immune system.","keyPoints":[{"text":"Maternal (passive) antibodies fade around ages 4–6","terms":["4","6","four","six","fade","maternal","passive"]},{"text":"After the fade, kids get sick more while building their own immune system","terms":["own immun","build","school","sick","infection"]}]},{"id":"life-preschool-breathe","topic":"life","prompt":"A 5-year-old with abdominal pain is breathing shallowly. Children this age rely primarily on which muscle to breathe?","rationale":"Young children are diaphragm breathers because the intercostals and chest wall are underdeveloped. Anything that limits diaphragm motion — a full belly, lying flat, an abdominal injury — hits their ventilation harder than an adult's.","keyPoints":[{"text":"Young kids are diaphragm breathers — chest wall and intercostals are underdeveloped","terms":["diaphragm","intercostal","chest wall"]},{"text":"Belly problems (distension, injury, lying flat) compromise their breathing","terms":["belly","abdom","flat","stomach"]}]},{"id":"life-vs-trend","topic":"life","prompt":"Compared with an adult, a healthy toddler will normally have:","rationale":"The younger the patient, the faster the heart rate and respirations and the lower the blood pressure. Adolescents match adult numbers: HR 60–100, RR 12–20, systolic at least 90.","keyPoints":[{"text":"Younger = faster heart rate and breathing, lower blood pressure","terms":["faster","lower","blood pressure","bp"]},{"text":"Adolescents share adult vital ranges (HR 60–100, RR 12–20, SBP at least 90)","terms":["adolescen","teen","adult","60","12","90"]}]},{"id":"life-infant-airway","topic":"life","prompt":"An infant's airway obstructs more easily than an adult's because the infant has:","rationale":"The infant airway is shaped like an upside-down cone and the tongue is large relative to the mouth, so a little swelling or the tongue itself can block it fast.","keyPoints":[{"text":"Infant tongue is proportionally large — a common obstruction","terms":["tongue","large","big"]},{"text":"Airway is narrow and cone-shaped, so small swelling closes it fast","terms":["cone","narrow","swell","funnel"]}]},{"id":"life-aging","topic":"life","prompt":"Which respiratory change is expected with normal aging in a patient over 61?","rationale":"Aging lungs lose elasticity and vital capacity, the alveoli enlarge with less surface area, and the cough and gag weaken — raising aspiration and pneumonia risk. Add atherosclerosis, slower metabolism, Type 2 diabetes, hypothyroidism, and gallstones to the older-adult picture.","keyPoints":[{"text":"Aging lungs: less elasticity and vital capacity, larger alveoli with less surface area","terms":["elastic","vital capacity","alveoli","surface"]},{"text":"Weaker cough and gag → aspiration and pneumonia risk","terms":["cough","gag","aspirat","pneumonia"]}]},{"id":"life-reasoning","topic":"life","prompt":"A 15-year-old hesitates to accept care mainly because his friends are watching. Which stage of moral reasoning is he most likely using?","rationale":"Reasoning develops from pre-conventional (avoiding punishment) to conventional (peer and social approval) to, ideally, post-conventional (internalized ethics). Teens often sit in the peer-driven middle stage.","keyPoints":[{"text":"Pre-conventional = avoid punishment; conventional = peer approval; post-conventional = internal ethics","terms":["punish","peer","approval","ethic","conventional"]},{"text":"Teens usually reason at the conventional, peer-driven stage","terms":["teen","adolescen","peer","friend"]}]},{"id":"terms-prefix","topic":"terms","prompt":"The prefix brady-, as in bradycardia, means:","rationale":"Brady- = slow, tachy- = fast, dys- = difficult, hyper- = high, hypo- = low, a-/an- = without. Bradycardia is a slow heart rate; bradypnea is slow breathing.","keyPoints":[{"text":"brady- = slow, tachy- = fast","terms":["slow","fast","tachy","brady"]},{"text":"dys- = difficult, hyper- = high, hypo- = low, a-/an- = without","terms":["dys","difficult","hyper","hypo","without"]}]},{"id":"terms-phasia-phagia","topic":"terms","prompt":"A stroke patient is having difficulty swallowing. The correct term for your report is:","rationale":"Phagia (g) is eating or swallowing; phasia (s) is speech. Dysphagia = difficulty swallowing. Chart the wrong one and the hospital works the wrong problem.","keyPoints":[{"text":"phagia (g) = eating/swallowing; phasia (s) = speech","terms":["swallow","speech","phagia","phasia","eat","g","s"]},{"text":"Charting the wrong one sends the hospital after the wrong problem","terms":["chart","wrong","hospital","mix","confus"]}]},{"id":"terms-roots","topic":"terms","prompt":"The word root hepat-, as in hepatitis, refers to the:","rationale":"Hepat- is the liver, so hepatitis is liver inflammation (-itis). Cardi- is heart, nephr- is kidney, pulmon- is lung, neuro- is nerves, thorac- is chest.","keyPoints":[{"text":"hepat- = liver, nephr- = kidney, cardi- = heart, pulmon- = lung","terms":["liver","kidney","hepat","nephr"]},{"text":"-itis = inflammation (hepatitis = liver inflammation)","terms":["itis","inflam"]}]},{"id":"terms-direction","topic":"terms","prompt":"When you document an injury to the \"left arm,\" the term left refers to:","rationale":"Directional terms always come from the patient's perspective in the anatomic position — standing, palms forward. Their left, not yours. Proximal is toward the core; distal is away.","keyPoints":[{"text":"Left and right always from the patient's perspective in anatomic position","terms":["patient","anatomic","their left","perspective"]},{"text":"Proximal = toward the core; distal = away from it","terms":["proximal","distal","core","toward","away"]}]},{"id":"terms-positions","topic":"terms","prompt":"A CHF patient with severe difficulty breathing should be transported in which position?","rationale":"Sit respiratory distress upright if the patient tolerates it — High Fowler. Supine is for shock. Prone is never a transport position for a compromised patient.","keyPoints":[{"text":"Respiratory distress sits upright (High Fowler) if tolerated","terms":["fowler","sit","upright"]},{"text":"Shock = supine; never transport a compromised patient prone","terms":["supine","shock","prone","flat"]}]},{"id":"terms-palmar","topic":"terms","prompt":"Using the Palmar method, a burn the size of the patient's palm equals approximately what percent of total body surface area?","rationale":"The patient's own palm represents about 1% of their total body surface area. Burn depth — superficial, partial, or full thickness — is documented separately.","keyPoints":[{"text":"The patient's palm ≈ 1% of their total body surface area","terms":["1","one percent","patient"]},{"text":"Burn depth (superficial / partial / full) is charted separately from area","terms":["depth","superficial","partial","full","separate"]}]},{"id":"docs-refusal","topic":"docs","prompt":"A competent adult refuses transport and also refuses to sign your refusal form. You should:","rationale":"There is no legal requirement that the patient sign. Document that he was informed of the risks and refused, and get a witness — law enforcement, family, or a bystander — to sign that they saw it. Refusals are lawsuit magnets.","keyPoints":[{"text":"No legal requirement the patient signs — document the informed refusal thoroughly","terms":["document","no legal","not required","chart","informed"]},{"text":"Get a third-party witness (law, family, bystander) to sign","terms":["witness","third","law","family","bystander"]}]},{"id":"docs-paper-fix","topic":"docs","prompt":"You wrote the wrong medication dose on a paper PCR. The correct way to fix it is to:","rationale":"One line through the error plus your initials keeps the original legible, so the correction never looks like a cover-up. The PCR is a permanent legal record. After submission, corrections go in as an addendum.","keyPoints":[{"text":"Single line through the error plus initials — the original stays legible","terms":["single line","one line","initial","legible","readable"]},{"text":"After submission, corrections become an addendum","terms":["addendum","submit","after"]}]},{"id":"docs-handoff-name","topic":"docs","prompt":"To protect yourself against an abandonment claim, your PCR must document:","rationale":"Transfer of care goes to a person, not a place. Naming who assumed care — for example, RN Smith — is what proves the patient was never abandoned.","keyPoints":[{"text":"Transfer of care goes to a person — name who assumed care (RN Smith)","terms":["name","rn","nurse","person","who"]},{"text":"That named handoff is the defense against an abandonment claim","terms":["abandon","handoff","transfer","proof","defense"]}]},{"id":"docs-narrative","topic":"docs","prompt":"In a SOAP narrative, the patient's statement \"my chest hurts\" belongs under:","rationale":"Subjective is what the patient tells you; objective is what you can see or measure, like vitals. CHART is the other format: Chief complaint, History, Assessment, Rx, Transport.","keyPoints":[{"text":"Subjective = what the patient says; Objective = what you can measure or verify","terms":["subjective","objective","says","measur","verif"]},{"text":"CHART = Chief complaint, History, Assessment, Rx, Transport","terms":["chart","chief","rx","transport","history"]}]},{"id":"docs-radios","topic":"docs","prompt":"Which radio mode allows you to talk and listen at the same time, like a phone call?","rationale":"Duplex works both directions at once. Simplex is push-to-talk, one direction at a time. Multiplex carries multiple signals on one channel. Base = fixed, mobile = in the truck, portable = handheld. The FCC regulates the frequencies.","keyPoints":[{"text":"Simplex = one at a time (push-to-talk); duplex = both directions at once; multiplex = multiple signals","terms":["simplex","duplex","multiplex","push","both","same time"]},{"text":"Base = fixed, mobile = vehicle-mounted, portable = handheld; the FCC owns the frequencies","terms":["base","mobile","portable","handheld","fcc"]}]},{"id":"docs-facility","topic":"docs","prompt":"You are doing CPR on a patient who is 5 minutes from a community ER and 25 minutes from a trauma center. Where should you transport?","rationale":"Destination is the closest most appropriate facility. An active arrest needs the absolute closest ER; stroke, trauma, and pediatric patients may justify bypassing a closer hospital. Notify the receiving ER on every transport.","keyPoints":[{"text":"Destination = the closest MOST APPROPRIATE facility","terms":["appropriate","closest most","facility"]},{"text":"Arrest → absolute closest; stroke/trauma/peds may bypass a closer ER","terms":["arrest","bypass","stroke","trauma","closest"]}]},{"id":"docs-sbar","topic":"docs","prompt":"In an SBAR handoff report, the B stands for:","rationale":"SBAR is Situation, Background, Assessment, Treatment — the structure of your verbal handoff before the written ePCR follows.","keyPoints":[{"text":"SBAR = Situation, Background, Assessment, Treatment","terms":["situation","background","assessment","treatment"]},{"text":"Verbal handoff first, then the written ePCR follows","terms":["verbal","handoff","epcr","written"]}]},{"id":"docs-noise","topic":"docs","prompt":"In the Shannon-Weaver communication model, \"noise\" is best defined as:","rationale":"Noise is anything that interferes with the message — physical sound, hearing or vision impairment, age gaps, ethnocentrism (my culture first), or cultural imposition (forcing your values on the patient).","keyPoints":[{"text":"Noise = anything blocking the message: sound, hearing or vision loss, age, culture","terms":["noise","block","interfer","barrier","hearing","culture"]},{"text":"Ethnocentrism (my culture first) and cultural imposition (forcing values) count as noise","terms":["ethno","imposition","culture","values"]}]},{"id":"assess-dcap","topic":"assess","prompt":"In the trauma exam mnemonic DCAP-BTLS, the P stands for:","rationale":"DCAP-BTLS: Deformities, Contusions, Abrasions, Punctures/penetrations, Burns, Tenderness, Lacerations, Swelling — what you look and feel for on each body region.","keyPoints":[{"text":"DCAP = deformities, contusions, abrasions, punctures/penetrations","terms":["deform","contus","abras","punctur"]},{"text":"BTLS = burns, tenderness, lacerations, swelling — look and feel each region","terms":["burn","tender","lacerat","swell"]}]},{"id":"assess-perrl","topic":"assess","prompt":"An unresponsive patient has pinpoint pupils and respirations of 6 per minute. This presentation is most consistent with:","rationale":"Pinpoint pupils plus depressed breathing is the classic opioid picture. PERRL is the normal finding — pupils equal, round, reactive to light. Stimulants dilate; brain injury tends to blow or unequalize a pupil.","keyPoints":[{"text":"Pinpoint pupils + slow breathing = the opioid picture","terms":["pinpoint","opioid","constrict","slow"]},{"text":"PERRL = equal, round, reactive to light; stimulants dilate, herniation blows one pupil","terms":["perrl","equal","react","dilat","blown"]}]},{"id":"assess-preg","topic":"assess","prompt":"Which question is MOST important to ask a 24-year-old female with lower abdominal pain?","rationale":"Any female of childbearing age with lower abdominal pain gets the pregnancy question and last menstrual period — ectopic pregnancy is the hidden life threat. Document the answer either way.","keyPoints":[{"text":"Childbearing age + lower abdominal pain → ask pregnancy chance and LMP","terms":["pregnan","lmp","period","menstrual"]},{"text":"Ectopic pregnancy is the life threat behind the question","terms":["ectopic","life threat","rupture"]}]},{"id":"assess-consent","topic":"assess","prompt":"Which of the following patients can legally refuse transport?","rationale":"Refusal requires decision-making capacity: alert, oriented to person, place, time, and event, behaving reasonably, and able to understand the risks. Confusion, intoxication, or being a minor defeats capacity — care proceeds under implied consent or a guardian.","keyPoints":[{"text":"Capacity = alert and oriented ×4 + reasonable behavior + understands the risks","terms":["oriented","a&o","x4","capacity","understand"]},{"text":"Confused, intoxicated, or a minor → implied consent or a guardian decides","terms":["implied","guardian","minor","intoxicat","confus"]}]},{"id":"assess-bleed-algo","topic":"assess","prompt":"Direct pressure has failed to control bright, spurting bleeding from a mid-thigh wound. You should next:","rationale":"When direct pressure fails on an extremity, place a tourniquet proximal — between the wound and the heart. Tourniquets do not work on the neck, shoulder, hip, or torso. Bright and spurting means arterial.","keyPoints":[{"text":"Direct pressure first; if it fails on a limb → tourniquet proximal to the wound","terms":["pressure first","direct pressure","proximal","tourniquet"]},{"text":"Bright spurting = arterial; no tourniquet on neck, torso, or junctions","terms":["arterial","spurt","neck","torso","bright"]}]},{"id":"assess-breathe-cutoffs","topic":"assess","prompt":"Which adult respiratory rate requires you to begin assisting ventilations?","rationale":"A rate under 8 — or respiratory failure or arrest — means you ventilate. The worry thresholds are over 28 or under 8; fast breathing needs a workup, and chaotic irregular patterns suggest a head injury.","keyPoints":[{"text":"Under 8/min — or failure or arrest — means assist ventilations","terms":["8","eight","ventilat","bag"]},{"text":"Worry over 28; fast breathing gets a workup, not automatically a bag","terms":["28","fast","workup","worry"]}]},{"id":"assess-pulse-sites","topic":"assess","prompt":"Where should you check the pulse on an unresponsive 6-month-old?","rationale":"Infants under 1 get a brachial pulse — pressing on an infant's neck can collapse the airway. Awake adults and children get radial; unresponsive adults and children get carotid.","keyPoints":[{"text":"Infant under 1 year → brachial pulse, inside the upper arm","terms":["brachial","arm","infant"]},{"text":"Awake → radial; unresponsive adult or child → carotid","terms":["radial","carotid","awake","unresponsive"]}]},{"id":"assess-sign-symptom","topic":"assess","prompt":"Which of the following is a sign rather than a symptom?","rationale":"Signs are what you can see or measure and another provider could verify — cyanosis, vitals, bleeding. Symptoms are what the patient reports, even when they attach a number to it.","keyPoints":[{"text":"Sign = observable or measurable by anyone (cyanosis, vitals, bleeding)","terms":["sign","observ","measur","see"]},{"text":"Symptom = what the patient reports, even with a number attached","terms":["symptom","report","feel","says"]}]},{"id":"reassess-splint","topic":"reassess","prompt":"Ten minutes after you splint a forearm, the patient reports new tingling in her fingers. You should:","rationale":"Swelling can turn a good splint into a tourniquet. New numbness, tingling, or severe compression pain triggers a distal CSM recheck. If you did an intervention, you recheck it.","keyPoints":[{"text":"Swelling can turn a splint into a tourniquet — new tingling or numbness means recheck now","terms":["swell","tight","tingl","numb","tourniquet"]},{"text":"If you did an intervention, you recheck it — CSM distal to the splint","terms":["csm","recheck","circulation","sensation","movement","pulse"]}]},{"id":"resp-peds-rate","topic":"resp","prompt":"Which respiratory rate is within normal limits for a 1-month-old infant?","rationale":"Infants breathe 30–60 per minute, children 12–40, adults 12–20. The younger the patient, the faster the normal rate.","keyPoints":[{"text":"Infants 30–60, children 12–40, adults 12–20 breaths per minute","terms":["30","60","12","20","40"]},{"text":"The younger the patient, the faster the normal rate","terms":["younger","faster"]}]},{"id":"resp-lobes-dead","topic":"resp","prompt":"The left lung has how many lobes, and why?","rationale":"The right lung has three lobes; the left has two because the heart occupies that side of the chest. Tidal volume is one breath, residual volume keeps the alveoli open after exhale, and dead space is air that never exchanges gas.","keyPoints":[{"text":"Right lung has 3 lobes; the left has 2 to make room for the heart","terms":["two","2","three","3","heart","lobe"]},{"text":"Tidal = one breath; residual keeps alveoli open; dead space exchanges nothing","terms":["tidal","residual","dead space","exchange"]}]},{"id":"resp-o2-vs-ppv","topic":"resp","prompt":"A patient is breathing 28 times per minute with very shallow chest rise and is becoming sleepy. The most appropriate intervention is:","rationale":"Fast and shallow means inadequate tidal volume — the air never reaches the alveoli. Supplemental oxygen cannot fix air that is not arriving; positive pressure from a BVM can.","keyPoints":[{"text":"Fast plus shallow = inadequate tidal volume — air never reaches the alveoli","terms":["shallow","tidal","alveoli","volume"]},{"text":"Inadequate ventilation → BVM (positive pressure); supplemental O₂ requires adequate breathing","terms":["bvm","bag","positive pressure","ventilat"]}]},{"id":"circ-thinners","topic":"circ","prompt":"A patient on warfarin falls and strikes his head. Why is this fall more dangerous for him than for most patients?","rationale":"Anticoagulants block clots from forming or growing, so trauma and internal bleeding — especially in the head — are worse and harder to stop, even when the injury looks minor.","keyPoints":[{"text":"Anticoagulants block clot formation — bleeding keeps going, even from minor trauma","terms":["clot","anticoag","thin","bleed"]},{"text":"A head strike on warfarin can become a brain bleed — ask about thinners every time","terms":["head","brain","warfarin","ask"]}]},{"id":"circ-shock-types","topic":"circ","prompt":"Septic shock is primarily caused by which mechanism?","rationale":"Sepsis, anaphylaxis, and neurogenic shock are pipe problems — massive vasodilation. Pump failures are MI, CHF, tension pneumothorax, and tamponade. Fluid losses are hemorrhage, GI bleed, and severe dehydration.","keyPoints":[{"text":"Pump = MI/CHF/tamponade/tension; pipes = sepsis/anaphylaxis/neurogenic; fluid = bleeding/dehydration","terms":["pump","pipe","fluid","dilat","distribut"]},{"text":"Sepsis dilates vessels everywhere — the container outgrows the blood in it","terms":["sepsis","vessel","container","infection","dilat"]}]},{"id":"body-hemophilia","topic":"body","prompt":"A patient with hemophilia has a small laceration that has soaked through two dressings. You should:","rationale":"Hemophiliacs are missing clotting factors, so even minor trauma bleeds for a long time. Hold continuous pressure without peeking, ask what they take, and move early — you do not carry replacement factor.","keyPoints":[{"text":"Hemophilia = missing clotting factors — minor trauma bleeds a long time","terms":["factor","clot","missing","viii","8"]},{"text":"Firm uninterrupted pressure, no peeking, early transport — the hospital has the factor","terms":["pressure","peek","uninterrupt","transport","hospital"]}]},{"id":"body-aerobic","topic":"body","prompt":"During shock, cells switch to anaerobic metabolism. This produces:","rationale":"Hypoperfusion starves cells of oxygen, forcing anaerobic metabolism: far less energy, lactic acid, acidosis, and heat loss. That is why shock patients get a blanket even on a warm day.","keyPoints":[{"text":"Hypoperfusion → anaerobic metabolism: far less energy plus lactic acid and acidosis","terms":["anaerobic","lactic","acid","less energy"]},{"text":"Heat loss comes with it — blanket shock patients even when it is warm","terms":["heat","blanket","cover","warm"]}]},{"id":"move-power-grip","topic":"move","prompt":"When using the power grip to lift a stretcher, your hands should be positioned:","rationale":"Power grip is palms up, hands roughly 10 inches apart, fingers fully wrapped. Lift with the legs, keep the shoulders over the pelvis, hold the load close, and never twist.","keyPoints":[{"text":"Power grip: palms up, hands about 10 inches apart, fingers fully wrapped","terms":["palm","10","ten","wrap","up"]},{"text":"Lift with the legs, load close, shoulders over pelvis, no twisting","terms":["leg","close","twist","pelvis","back"]}]},{"id":"move-stair-iso","topic":"move","prompt":"A conscious patient with no spinal complaint must be carried down two flights of stairs in a building with no elevator. The best device is:","rationale":"Conscious, no spine concern, stairs — that is the stair chair. Unconscious or spine-injured patients go on a board, carried feet first with the strongest providers at the ends.","keyPoints":[{"text":"Conscious, no spine concern, stairs = stair chair","terms":["stair chair","conscious","sit"]},{"text":"Unconscious or spine = backboard, feet first, strongest at the ends","terms":["board","feet first","unconscious","spine"]}]},{"id":"flow","topic":"assess","prompt":"You have completed the scene size-up on an unresponsive medical patient. Your next step is:","rationale":"The call order is scene size-up, primary assessment, history, secondary exam with vitals, field impression and interventions, then reassessment. Life threats come before questions.","keyPoints":[{"text":"Order: scene size-up → primary → history → secondary + vitals → impression and treatment → reassess","terms":["scene","primary","history","secondary","order","reassess"]},{"text":"Life threats come before questions — history waits for the ABCs","terms":["life threat","abc","before","wait"]}]},{"id":"scene-five","topic":"assess","prompt":"Which of the following is a component of the scene size-up?","rationale":"The scene size-up happens before you touch anyone: BSI, scene safety, MOI or NOI, number of patients, and the need for extra resources. Call law enforcement early for suspected abuse or an escalating scene.","keyPoints":[{"text":"Five size-up tasks: BSI, scene safety, MOI/NOI, number of patients, extra resources","terms":["bsi","safety","moi","noi","number","resource"]},{"text":"All of it happens before patient contact","terms":["before","contact","touch"]}]},{"id":"upper-sounds","topic":"assess","prompt":"You hear gurgling from an unresponsive patient's airway. Your immediate action is to:","rationale":"Gurgling means fluid in the airway — suction it before anything else. Snoring means the tongue (reposition or adjunct); stridor means upper-airway swelling. Pushing air past fluid drives it into the lungs.","keyPoints":[{"text":"Gurgling = fluid → suction before pushing any air","terms":["gurgl","fluid","suction"]},{"text":"Snoring = tongue; stridor = upper-airway swelling","terms":["snor","tongue","stridor","swell"]}]},{"id":"adult-numbers","topic":"assess","prompt":"Using the pediatric formula, the minimum acceptable systolic blood pressure for a 5-year-old is:","rationale":"Under age 10, minimum systolic is 2 × age + 70 — for a 5-year-old, 2 × 5 + 70 = 80. At age 10 the formula reaches 90, the adult cutoff. Adult normals: RR 12–20, pulse 60–100, systolic 90–120.","keyPoints":[{"text":"Under 10: minimum systolic = 2 × age + 70","terms":["2","70","formula","age"]},{"text":"The adult floor is 90; the formula reaches it at age 10","terms":["90","10","adult"]}]},{"id":"gcs","topic":"assess","prompt":"A patient opens his eyes to your voice, is confused when he speaks, and obeys commands. His Glasgow Coma Scale score is:","rationale":"Eyes to voice = 3, confused speech = 4, obeys commands = 6, for a total of 13. Ranges: eyes 1–4, verbal 1–5, motor 1–6. Fully alert is 15; no response at all is 3.","keyPoints":[{"text":"Eyes 1–4, verbal 1–5, motor 1–6 — add the three scores","terms":["eyes","verbal","motor","add","1-4","1–4"]},{"text":"15 = fully alert; 3 = no response at all","terms":["15","3","alert","floor","lowest"]}]},{"id":"focused-vs-detailed","topic":"assess","prompt":"Which patient requires a rapid head-to-toe exam rather than a focused exam?","rationale":"Significant mechanism of injury — ejection, high speed, a big fall — earns a full head-to-toe even if the patient is awake, because injuries hide. Responsive patients who can localize a minor complaint get a focused exam.","keyPoints":[{"text":"Significant MOI (ejection, high speed, big fall) → rapid head-to-toe even if awake","terms":["moi","mechanism","eject","head-to-toe","head to toe"]},{"text":"Localized minor complaint → focused exam of that area only","terms":["focused","localiz","point","minor","area"]}]},{"id":"load-go","topic":"assess","prompt":"Which patient is the highest transport priority?","rationale":"High priority means a time-sensitive threat: altered mental status, an airway you had to open or suction, assisted ventilations, major bleeding, shock, ACS-type chest pain, or complicated childbirth. Stable complaints can stay and play.","keyPoints":[{"text":"High priority = a time-sensitive threat: altered, airway work, ventilation, shock, major bleed","terms":["altered","airway","shock","ventilat","bleed","priority"]},{"text":"Stable, non-critical complaints can stay and play","terms":["stable","stay","non-critical"]}]},{"id":"golden-platinum","topic":"assess","prompt":"For a critical trauma patient, the \"Platinum 10\" refers to:","rationale":"Platinum 10 is arrive-to-drive: no more than about 10 minutes on scene, doing only essential ABC work. The Golden Hour is the bigger clock — injury to surgery in under an hour.","keyPoints":[{"text":"Platinum 10 = 10 minutes or less on scene, essential ABC care only","terms":["10","ten","scene","abc"]},{"text":"Golden Hour = injury to surgery in under 60 minutes","terms":["golden","hour","surgery","60","injury"]}]},{"id":"opqrst-ot","topic":"assess","prompt":"You ask a chest-pain patient, \"What were you doing when the pain started?\" Which OPQRST element is this?","rationale":"Onset is the activity at the moment the pain began. Timing is how long it has lasted — sudden pain 10 minutes ago is far more concerning than pain for two weeks. Severity is the 0–10 scale, and the change matters more than the first number.","keyPoints":[{"text":"Onset = what you were doing when it started; Timing = how long it has lasted","terms":["onset","timing","start","duration","doing when"]},{"text":"Sudden and recent is scarier than weeks-old pain; a severity CHANGE matters more than the first number","terms":["sudden","recent","severity","change","worse"]}]},{"id":"clocks","topic":"reassess","prompt":"How often should you reassess a stable patient during transport?","rationale":"Stable patients get a reassessment about every 15 minutes; unstable or critical patients about every 5. One set of vitals is a snapshot — two or more make a trend.","keyPoints":[{"text":"Stable = about every 15 minutes; unstable or critical = every 5","terms":["15","5","five","fifteen"]},{"text":"Two or more vital sets make a trend — one set is just a snapshot","terms":["trend","snapshot","two sets","second set","compare"]}]},{"id":"reassess-pass","topic":"reassess","prompt":"A complete reassessment includes all of the following EXCEPT:","rationale":"The reassessment pass is mental status, ABCs, a new full vital set, and a recheck of every intervention — tourniquets, dressings, splints, meds, restraints. History is not re-interviewed unless something changed.","keyPoints":[{"text":"A pass = mental status + ABCs + a new full set of vitals + every intervention","terms":["mental","abc","vitals","intervention","full set"]},{"text":"History is not re-interviewed unless something changed","terms":["history","sample","not","unless","re-interview"]}]},{"id":"rosc","topic":"reassess","prompt":"During CPR you feel a strong carotid pulse return. You should:","rationale":"Return of circulation is not automatic return of breathing — the heart can restart while the patient still needs ventilations. Any major change sends you back through mental status, airway, breathing, circulation.","keyPoints":[{"text":"Return of pulse does not mean return of breathing — reassess airway and breathing immediately","terms":["rosc","breath","reassess","airway","not mean"]},{"text":"Never compress a beating heart; big changes send you back to mental status and ABCs","terms":["stop compress","beating","abc","change","never compress"]}]},{"id":"test-med-order","topic":"reassess","prompt":"Your patient needs a medication, and your protocol has no standing order for it. Before administering, you must:","rationale":"Without standing orders, the sequence is: contact medical control, administer if approved, then reassess. On the exam, assume you need an online order unless the question already gave you one.","keyPoints":[{"text":"No standing order → contact medical control before giving the med","terms":["medical control","order","contact","call"]},{"text":"Sequence matters and is graded: authorization → administer → reassess","terms":["sequence","reassess","then","order of"]}]},{"id":"vent-resp-ox","topic":"resp","prompt":"The exchange of gases between the alveoli and the blood is called:","rationale":"Ventilation is air moving in and out; respiration is gas exchange at the alveoli; oxygenation is oxygen loading onto hemoglobin — what the pulse ox reads. Three different failures need three different fixes.","keyPoints":[{"text":"Ventilation = air moving; respiration = alveolar gas exchange; oxygenation = O₂ on hemoglobin","terms":["ventilation","respiration","oxygenation","exchange","hemoglobin"]},{"text":"Three different failures — three different fixes","terms":["different","three","failure","fix"]}]},{"id":"c345","topic":"resp","prompt":"A spinal cord injury above C3–C5 threatens breathing because it can paralyze the:","rationale":"\"C3, 4, 5 keeps the diaphragm alive\" — the phrenic nerve exits there. An injury above that level can stop the diaphragm; a lower neck injury can paralyze the body yet leave breathing intact.","keyPoints":[{"text":"The phrenic nerve exits C3–C5 and drives the diaphragm","terms":["phrenic","c3","c4","c5","diaphragm"]},{"text":"Injury at or above that level can stop breathing; below it may spare the diaphragm","terms":["above","below","paralyz","stop breath","spare"]}]},{"id":"patterns","topic":"resp","prompt":"A diabetic patient with fruity breath is breathing very deep and fast. This pattern is called:","rationale":"Kussmaul is deep, fast breathing — the body blowing off acid in DKA or aspirin overdose. Do not reflexively bag it down; it is compensation. Agonal = arrest gasps, Cheyne-Stokes = wax-wane with pauses (brain), Biot's = chaotic (brainstem).","keyPoints":[{"text":"Kussmaul = deep + fast = blowing off acid (DKA); do not bag it down","terms":["kussmaul","acid","dka","deep","blow"]},{"text":"Agonal = arrest gasps; Cheyne-Stokes = wax-wane (brain); Biot's = chaotic (brainstem)","terms":["agonal","cheyne","biot","gasp","chaotic"]}]},{"id":"co-sat","topic":"resp","prompt":"A patient rescued from a house fire has no burns and an SpO₂ of 100% on room air. You should:","rationale":"Carbon monoxide occupies hemoglobin, and the pulse ox counts those seats as full — a fire patient can read 100% while suffocating. Treat the exposure with high-flow oxygen. Anemia, cold fingers, nail polish, and bright light can also fool the probe.","keyPoints":[{"text":"CO occupies hemoglobin; the pulse ox counts those seats as full — a false-normal reading","terms":["hemoglobin","occup","seat","false","carbon monoxide"]},{"text":"Fire or CO exposure → high-flow oxygen regardless of the number","terms":["high-flow","high flow","nrb","15","regardless"]}]},{"id":"bag-vs-nrb","topic":"resp","prompt":"Which patient needs bag-valve-mask ventilations rather than a non-rebreather?","rationale":"The bag is for failed ventilation: apnea, agonal breathing, or inadequate rate or volume. A patient who is breathing adequately but hypoxic, distressed, or shocked gets high-concentration oxygen — on the test, almost always a non-rebreather.","keyPoints":[{"text":"Bag = apnea, agonal gasps, or inadequate rate/volume","terms":["bag","bvm","agonal","apnea","inadequate"]},{"text":"Breathing but hypoxic or shocked = NRB while you keep watching the airway","terms":["nrb","non-rebreather","15","hypox"]}]},{"id":"suction-triggers","topic":"airway","prompt":"Which finding is an indication for oropharyngeal suctioning?","rationale":"Suction has two triggers: fluid you can see, or gurgling you can hear. Measure the rigid catheter from mouth corner to earlobe, suction only on the way out, 10 seconds max at every age.","keyPoints":[{"text":"Two triggers only: visible fluid or audible gurgling","terms":["see","visible","gurgl","two trigger","fluid","hear"]},{"text":"Rigid catheter measured mouth-corner to earlobe; 10 seconds max; suction on the way out","terms":["10","earlobe","way out","measure","rigid"]}]},{"id":"tilt-vs-thrust","topic":"airway","prompt":"You find an unresponsive patient at the bottom of a staircase. You should open the airway using:","rationale":"An unknown fall means possible spine injury — use the jaw thrust and keep the head and neck in line. Head-tilt chin-lift is for medical patients with no spine concern. When unsure, err toward the jaw thrust.","keyPoints":[{"text":"Possible spine involvement (falls, wrecks, unknown) → jaw thrust, neck stays neutral","terms":["jaw","thrust","neutral","spine","trauma"]},{"text":"Medical with no spine concern → head-tilt chin-lift","terms":["tilt","chin","medical"]}]},{"id":"opa","topic":"airway","prompt":"Which patient is an appropriate candidate for an oropharyngeal airway?","rationale":"The OPA is only for the fully unresponsive patient with no gag — AVPU = U. Size it mouth corner to earlobe, insert rotated (180° or 90°), and if a gag appears, pull it and expect vomit.","keyPoints":[{"text":"OPA only if fully unresponsive with NO gag reflex","terms":["no gag","unresponsive","gag reflex"]},{"text":"Size corner of mouth to earlobe; insert rotated; any gag = pull it now","terms":["earlobe","rotate","180","pull","size"]}]},{"id":"npa-stop","topic":"airway","prompt":"A nasopharyngeal airway is contraindicated in a patient with:","rationale":"With a fractured skull base, the tube can pass through the break into the brain. Any significant head or face trauma is the NPA hard stop. If there is facial trauma and a gag, use neither adjunct — hold the jaw manually.","keyPoints":[{"text":"NPA hard stop = head or face trauma / possible basilar skull fracture","terms":["skull","basilar","face","head trauma","fracture"]},{"text":"The NPA is the gag-tolerant adjunct; facial trauma plus a gag = hold the jaw manually","terms":["gag","tolerat","hand","jaw","manual"]}]},{"id":"skip-sample","topic":"airway","prompt":"In which situation is it acceptable to skip the SAMPLE history?","rationale":"When the patient is out and there is no one and nothing to ask, there is no history to take — go to the physical exam. Life threats and a short scene beat empty history boxes.","keyPoints":[{"text":"Skip history only when the patient is out AND no family, ID, or med list exists","terms":["no family","no source","nothing","unconscious","skip"]},{"text":"Otherwise pull SAMPLE from any available source; the physical exam becomes your information","terms":["bystander","family","exam","source","wife","med list"]}]},{"id":"nrb-nc","topic":"airway","prompt":"An adult is breathing adequately with an SpO₂ of 87% and visible distress. The most appropriate oxygen device is:","rationale":"Adequate breathing plus real hypoxia or distress gets the high-concentration device — the non-rebreather at 10–15 L/min. The cannula delivers only about 24–44% and dries the nose at 6 L. On the exam, the NRB is almost always the answer here.","keyPoints":[{"text":"Real hypoxia or distress with adequate breathing → NRB at 10–15 L/min","terms":["nrb","non-rebreather","15","10"]},{"text":"Cannula = 1–6 L/min, about 24–44% — the low-need comfort device","terms":["cannula","1","6","44","24"]}]},{"id":"cpap","topic":"airway","prompt":"Which patient is an appropriate candidate for CPAP?","rationale":"CPAP needs an alert patient who is still breathing, follows commands, has an SBP of at least 90, and has no facial or chest trauma, pneumothorax, or vomiting. It drops blood pressure, so shock is a contraindication.","keyPoints":[{"text":"CPAP needs: alert, follows commands, still breathing, systolic at least 90","terms":["alert","command","90","breathing","awake"]},{"text":"Kills: apnea, low BP, chest or face trauma, pneumothorax, vomiting","terms":["apnea","trauma","pneumo","vomit","low bp","hypotens"]}]},{"id":"choke","topic":"airway","prompt":"An adult choking on food can only produce a faint wheeze and cannot speak. You should:","rationale":"Silent or nearly silent means severe obstruction: alternate 5 back blows and 5 abdominal thrusts on a conscious adult or child. Infants get back blows and chest thrusts. If he collapses, go straight to compressions — pulse or not.","keyPoints":[{"text":"Severe (silent, no air) = 5 back blows + 5 abdominal thrusts, repeat","terms":["back blow","abdominal","5","five","thrust"]},{"text":"Mild (talking or coughing) = coach the cough; collapse = start compressions","terms":["cough","mild","collapse","compress"]}]},{"id":"bvm-rates","topic":"airway","prompt":"When ventilating an apneic adult who still has a pulse, you should deliver one breath every:","rationale":"Adults with a pulse get one breath every 6 seconds — about 10–12 per minute — with 10–15 L/min oxygen on the bag, squeezing only until the chest visibly rises. Over-squeezing fills the stomach and drops blood pressure.","keyPoints":[{"text":"Adult with a pulse: 1 breath every 6 seconds (~10/min); child or infant every 2–3 seconds","terms":["6 second","10","2–3","2-3"]},{"text":"Squeeze to visible chest rise only — over-ventilating drops BP and causes vomiting","terms":["rise","over","stomach","gentle","visible"]}]},{"id":"pump-pipes","topic":"circ","prompt":"Adequate perfusion depends on which three components?","rationale":"Perfusion needs a working pump (heart), intact pipes (vessels), and enough fluid (blood). Failure of any one produces shock. IV fluid can replace volume, but only blood restores oxygen-carrying red cells.","keyPoints":[{"text":"Perfusion triad: pump (heart), pipes (vessels), fluid (blood)","terms":["pump","pipe","fluid","heart","vessel","blood"]},{"text":"Any one failing = shock; IV fluid is not oxygen-carrying red cells","terms":["fail","shock","iv","red cell","oxygen"]}]},{"id":"left-right-fail","topic":"circ","prompt":"A patient has jugular vein distention and swollen ankles, but his lungs are clear. This presentation suggests failure of the:","rationale":"Blood backs up behind the failing side. Right-side failure backs up into the body — JVD and peripheral edema. Left-side failure backs up into the lungs — shortness of breath and crackles (CHF).","keyPoints":[{"text":"Blood backs up BEHIND the side that failed","terms":["back","behind","backup"]},{"text":"Left → lungs (crackles, SOB); right → body (JVD, ankle edema)","terms":["left","right","lung","jvd","edema","crackle"]}]},{"id":"tpma","topic":"circ","prompt":"Blood returning from the body to the heart passes through which valve first?","rationale":"The valve order is T-P-M-A: body → right atrium → tricuspid → right ventricle → pulmonic → lungs → left atrium → mitral → left ventricle → aortic → aorta. Pulmonary arteries are the exception that carries deoxygenated blood.","keyPoints":[{"text":"Valve order T-P-M-A: tricuspid → pulmonic → mitral → aortic","terms":["tpma","t-p-m-a","tricuspid","pulmonic","mitral","aortic"]},{"text":"Pulmonary arteries carry deoxygenated blood — the exception to arteries-carry-oxygen","terms":["deoxygen","exception","pulmonary arter"]}]},{"id":"co","topic":"circ","prompt":"Cardiac output is calculated as:","rationale":"Cardiac output = stroke volume × heart rate — at rest, roughly 80 mL × 70 = 5.6 L/min, so the whole blood volume circulates about once a minute. A very fast heart rate can cut filling time, drop stroke volume, and lower output.","keyPoints":[{"text":"Cardiac output = stroke volume × heart rate (about 80 mL × 70 ≈ 5.6 L/min)","terms":["stroke volume","sv","80","5.6","multiply","times"]},{"text":"Very fast rates cut filling time → stroke volume and output drop","terms":["fill","fast","drop","time"]}]},{"id":"shock-stages","topic":"circ","prompt":"A trauma patient has a heart rate of 124, pale cool skin, and a blood pressure of 104/72. This patient is in:","rationale":"Fast heart rate and clamped-down skin with a blood pressure still holding is compensation. When the systolic falls below 90, compensation has failed — decompensated shock. A normal pressure never rules shock out.","keyPoints":[{"text":"Compensated = shock signs (fast HR, cool pale skin, anxiety) with BP still holding","terms":["compensat","holding","normal bp","still"]},{"text":"Decompensated = systolic falls (under 90 adult); a normal BP never rules out shock","terms":["decompensat","90","fall","drop","hypotens"]}]},{"id":"solid-hollow","topic":"circ","prompt":"Blunt trauma to the right upper quadrant most concerns you for major bleeding from the:","rationale":"The liver sits mostly in the RUQ and is a major bleed source after blunt trauma there. Solid organs — liver, spleen, kidneys, pancreas — bleed; hollow organs — stomach, intestines, bladder, gallbladder — leak and cause peritonitis.","keyPoints":[{"text":"Solid organs (liver, spleen, kidneys, pancreas) bleed; hollow ones leak → peritonitis","terms":["solid","hollow","bleed","leak","periton"]},{"text":"Liver mostly RUQ; spleen LUQ; appendix RLQ","terms":["ruq","luq","rlq","liver","spleen","quadrant"]}]},{"id":"pulses","topic":"circ","prompt":"In an unresponsive adult, you should check the pulse at the:","rationale":"Unresponsive adults and children get a carotid check; responsive patients get radial; infants get brachial; femoral is the shock and trauma backup. A weak or absent radial pulse in a living patient suggests low blood pressure.","keyPoints":[{"text":"Unresponsive adult or child → carotid; awake → radial; infant → brachial","terms":["carotid","radial","brachial","unresponsive"]},{"text":"A weak or absent radial while alive = low pressure — a shock clue","terms":["weak","absent","shock","low bp","pressure","fall"]}]},{"id":"receptors","topic":"body","prompt":"Stimulation of beta-2 receptors causes:","rationale":"Alpha receptors constrict vessels and raise blood pressure; beta-1 speeds and strengthens the heart; beta-2 dilates the bronchioles. Epinephrine hits all three — which is why an EpiPen raises pressure and opens airways at once.","keyPoints":[{"text":"Alpha = vasoconstriction and BP up; beta-1 = heart rate and contractility; beta-2 = bronchodilation","terms":["alpha","beta-1","beta 1","beta-2","beta 2","constrict","bronchodil"]},{"text":"Epinephrine hits all three — pressure up AND airways open","terms":["epi","all three","epipen","both"]}]},{"id":"brain-parts","topic":"body","prompt":"Breathing, heart rate, and blood pressure are controlled by which part of the brain?","rationale":"The brainstem — midbrain, pons, medulla — runs the life functions, which is why it is the most protected structure. The cerebrum handles speech, thought, memory, and senses; the cerebellum handles balance; the RAS gates consciousness.","keyPoints":[{"text":"Brainstem (midbrain, pons, medulla) runs breathing, heart rate, BP — lethal if hit","terms":["brainstem","medulla","pons","breath","vital"]},{"text":"Cerebrum = speech/thought/memory/senses; cerebellum = balance; RAS = consciousness","terms":["cerebrum","cerebell","ras","balance","conscious"]}]},{"id":"jvd-flat","topic":"body","prompt":"A semi-sitting trauma patient has flat, collapsed jugular veins. This finding suggests:","rationale":"Flat jugulars mean an empty tank — hemorrhage or severe dehydration. Distended jugulars (JVD) mean backup: right-heart failure, tamponade, or tension pneumothorax. Inspect the neck veins semi-upright.","keyPoints":[{"text":"Flat jugulars = an empty tank: bleeding or severe dehydration","terms":["flat","empty","hypovolem","blood loss","tank"]},{"text":"JVD = a backup: right-heart failure, tamponade, tension pneumothorax","terms":["jvd","distend","backup","tamponade","tension"]}]},{"id":"burns","topic":"body","prompt":"A burn that is dry and leathery with little pain at its center is classified as:","rationale":"Full thickness destroys all skin layers and the nerves with them, so the worst area can hurt the least. Superficial is red with no blisters; partial thickness reaches the dermis, blisters, and is very painful — often at the rim of a full-thickness burn.","keyPoints":[{"text":"Full thickness = leathery, dry, nerve endings destroyed → least pain at the center","terms":["leather","nerve","painless","numb","full"]},{"text":"Superficial = red without blisters; partial = blisters and severe pain (often the rim)","terms":["blister","red","partial","rim","superficial"]}]},{"id":"insulin-glucagon","topic":"body","prompt":"Which hormone lowers blood glucose?","rationale":"Insulin moves sugar out of the blood into the cells; glucagon raises blood sugar. Both come from the pancreas. Normal glucose runs about 80–120, and under 80 is low — check it in anyone altered.","keyPoints":[{"text":"Insulin lowers blood glucose (moves it into cells); glucagon raises it","terms":["insulin","glucagon","lower","raise","cell"]},{"text":"Normal glucose about 80–120; under 80 is low — check anyone altered","terms":["80","120","low","altered","check"]}]},{"id":"shock-preg","topic":"move","prompt":"A patient who is 32 weeks pregnant shows signs of shock. She should be positioned:","rationale":"At 20 weeks and beyond, the uterus can compress the vena cava when supine and cut venous return — supine hypotensive syndrome. Roll her left. For non-pregnant shock, use flat supine; raising the feet is no longer recommended.","keyPoints":[{"text":"20+ weeks supine → the uterus compresses the vena cava (supine hypotensive syndrome)","terms":["vena cava","compress","20 week","supine hypotensive","pinch"]},{"text":"Left lateral restores venous return; the feet-up trick is outdated","terms":["left","lateral","roll","return","feet"]}]},{"id":"recovery","topic":"move","prompt":"An unresponsive overdose patient is breathing adequately with no suspected spinal injury. You should place him:","rationale":"Unresponsive plus adequate breathing plus no spine concern equals the recovery position — it keeps the tongue forward and lets vomit drain. A patient who needs ventilations stays supine so you can work the airway.","keyPoints":[{"text":"Recovery = unresponsive + breathing adequately + no spine concern; gravity drains vomit","terms":["recovery","side","lateral","vomit","drain"]},{"text":"Needs ventilations → stays supine so you can work the airway","terms":["supine","bag","ventilat","back"]}]},{"id":"restrain","topic":"move","prompt":"Before restraining a combative patient, your first consideration should be:","rationale":"Combativeness can be a symptom — rule out hypoxia, hypoglycemia, and head injury first. When restraint is justified, use five people, supine only, then recheck ABCs and distal circulation, and chart situation, intervention, and outcome.","keyPoints":[{"text":"First rule out hypoxia, low sugar, and head injury as the real cause","terms":["hypox","sugar","glucose","head injury","cause","medical"]},{"text":"Five people, supine only, recheck circulation — chart situation, intervention, outcome","terms":["five","5","supine","recheck","chart"]}]},{"id":"board-straps","topic":"move","prompt":"When securing a patient to a long backboard, which body part is strapped LAST?","rationale":"Strap the torso in an X, then the hips, then the legs, and secure the head last with blocks. If the body shifts before the head is fixed, the neck twists with it. On the log roll, the head-holder counts and everyone rolls as a unit.","keyPoints":[{"text":"Strap order: torso (X) → hips → legs → head LAST with blocks","terms":["torso","hip","leg","head last","order","x"]},{"text":"Body is fixed first so a shift cannot twist the neck; the head-holder counts the roll","terms":["shift","twist","neck","count","unit"]}]},{"id":"devices","topic":"move","prompt":"The best device for moving a patient with a suspected hip fracture off the floor without rolling her is:","rationale":"The scoop splits in half and slides under from both sides — no rolling required, which is the whole point with a hip fracture. Stairs get the stair chair, water rescues get a backboard or Stokes, and everyday transport is the gurney.","keyPoints":[{"text":"Scoop splits in half — captures a no-roll patient (hip fracture) without rolling","terms":["scoop","split","no roll","without roll","hip"]},{"text":"Stairs = stair chair; water = board or Stokes; everyday = the gurney","terms":["stair","stokes","gurney","water","match"]}]},{"id":"five-rights","topic":"meds","prompt":"Which of the following is one of the original five rights of medication administration?","rationale":"The original five rights: right patient, medication, dose, route, and time. Documentation and response come after the drug is given — always chart name, dose, route, time, and the patient's response.","keyPoints":[{"text":"Five rights: patient, medication, dose, route, time","terms":["patient","medication","dose","route","time","five"]},{"text":"After giving: chart name, dose, route, time, and the response","terms":["chart","response","document","after"]}]},{"id":"glucose","topic":"meds","prompt":"Oral glucose is contraindicated when the patient:","rationale":"The gel is thick — an unconscious patient or one who cannot swallow will aspirate it. The green light is sugar under 80, conscious, able to swallow, one tube by mouth. Unresponsive hypoglycemics get IV dextrose from ALS or the ED.","keyPoints":[{"text":"Green light: sugar under 80, conscious, able to swallow and protect the airway","terms":["80","conscious","swallow","awake","protect"]},{"text":"Cannot swallow or unresponsive = aspiration risk → IV dextrose at ALS or the ED","terms":["aspirat","unrespons","dextrose","als","cannot"]}]},{"id":"asa","topic":"meds","prompt":"The correct prehospital aspirin dose for suspected ACS chest pain is:","rationale":"Chew 160–325 mg — two to four baby aspirin — so it absorbs fast. Aspirin makes platelets slippery so the clot cannot grow; it does not dissolve what is already there. Allergy is a hard stop, and kids do not get it (Reye's syndrome).","keyPoints":[{"text":"160–325 mg chewed (2–4 baby aspirin) for suspected cardiac chest pain","terms":["160","325","chew","baby"]},{"text":"Makes platelets slippery so the clot cannot GROW; allergy is a hard stop; no kids (Reye's)","terms":["platelet","slippery","grow","allerg","reye"]}]},{"id":"nitro-kill","topic":"meds","prompt":"Which finding contraindicates nitroglycerin administration?","rationale":"Kill nitro for a systolic under 100, an erectile-dysfunction -fil drug within 24 hours, or a head injury — stacked vasodilators crash the pressure. Dose is 0.4 mg SL, blood pressure before each dose, every 5 minutes, maximum 3. Gloves on: it absorbs through skin.","keyPoints":[{"text":"Kills: systolic under 100, ED meds (-fil: Viagra/Cialis) within ~24–48 hours, head injury","terms":["100","fil","viagra","cialis","24","head"]},{"text":"0.4 mg SL, BP before each dose, every 5 minutes, max 3; gloves — it absorbs through skin","terms":["0.4","sl","5 min","max 3","glove","three"]}]},{"id":"anaphylaxis","topic":"meds","prompt":"A patient stung by a bee has hives across his chest and audible wheezing. The best treatment is:","rationale":"Two body systems — skin plus respiratory — after an exposure is anaphylaxis, and anaphylaxis gets epinephrine: adult 0.3 mg IM lateral thigh (peds 0.15). Simple asthma with no allergic picture gets albuterol instead.","keyPoints":[{"text":"Anaphylaxis = airway involvement, shock or low BP, or two-plus body systems","terms":["two system","2 system","airway","shock","systems"]},{"text":"Adult epi 0.3 mg IM in the lateral thigh (peds 0.15); plain wheezing alone gets albuterol","terms":["0.3","thigh","im","0.15","albuterol"]}]},{"id":"naloxone","topic":"meds","prompt":"Naloxone will reverse respiratory depression caused by which of the following?","rationale":"Naloxone is an antagonist at opioid receptors only — it reverses heroin, fentanyl, oxycodone, morphine. It does nothing for alcohol or benzodiazepines. Prefer the intranasal route, and expect nausea and a possibly combative wake-up.","keyPoints":[{"text":"Naloxone reverses opioids only — heroin, fentanyl, oxycodone, morphine","terms":["opioid","antagonist","fentanyl","heroin","receptor"]},{"text":"Useless for benzos or alcohol; benign if no opioid aboard; watch for the combative wake-up","terms":["benzo","alcohol","benign","combative","wake"]}]},{"id":"albuterol","topic":"meds","prompt":"Albuterol relieves asthma symptoms by:","rationale":"Albuterol is a beta-2 agonist — it relaxes the bronchiole muscle and opens the lower airway. The nebulizer runs on 6 L/min of oxygen with the liquid in the cup; an MDI must fire as the patient inhales, and kids get a spacer.","keyPoints":[{"text":"Albuterol = beta-2 agonist → bronchodilation for asthma and wheezing","terms":["beta-2","beta 2","bronchodil","relax","open"]},{"text":"SVN at 6 L/min; an MDI must fire on the inhale (use a spacer for kids)","terms":["6","svn","mdi","spacer","inhale"]}]},{"id":"emt-list","topic":"meds","prompt":"Which of the following medications is NOT within the standard EMT scope of practice?","rationale":"The EMT list is aspirin, nitroglycerin, oral glucose, epinephrine, naloxone, and albuterol — with Tylenol or Benadryl only if protocol specifically adds them. IV medications, intubation, and IO access belong to paramedics.","keyPoints":[{"text":"The EMT six: aspirin, nitro, oral glucose, epinephrine, naloxone, albuterol","terms":["six","aspirin","nitro","glucose","epi","naloxone","albuterol"]},{"text":"IV meds, intubation, IO = paramedic; OTC extras only if protocol writes them in","terms":["iv","paramedic","als","protocol","scope"]}]},{"id":"ventilate-first","topic":"assess","prompt":"An overdose patient is breathing 5 times per minute with shallow effort. Naloxone is in your hand. Your FIRST action is to:","rationale":"Airway and breathing come before medications — ventilate the inadequate breather first, then give the drug. On the exam, when one option fixes the ABCs and another is a medication, the ABC fix wins.","keyPoints":[{"text":"ABCs before meds: inadequate breathing → BVM first, always","terms":["abc","first","bvm","bag","ventilat","before"]},{"text":"Naloxone takes minutes to work — the brain needs oxygen during every one of them","terms":["minute","brain","oxygen","while","hypox"]}]},{"id":"chart","topic":"assess","prompt":"You suspect abuse. Which statement belongs on your PCR?","rationale":"Charts hold objective observations and the patient's words in quotes — never conclusions about guilt. Reporting a suspicion of abuse through the mandatory channel is required and is not defamation; defamation is stating a false fact as fact.","keyPoints":[{"text":"Chart objective findings — size, color, location — plus the patient's words in quotes","terms":["objective","quote","describ","measur","words"]},{"text":"No guilt conclusions on the PCR; suspicions go through the mandatory reporting channel","terms":["guilt","conclusion","mandatory","report","accus"]}]},{"id":"v2-life-moro","topic":"life","prompt":"You bump a 3-week-old's bassinet. Both arms fly out, fingers spread, then the baby cries. Which reflex is that?","rationale":"Moro is the startle: arms abduct, fingers fan, then the infant often cries. Rooting turns toward a cheek touch; palmar grasp squeezes a finger; sucking triggers at the lips.","keyPoints":[{"text":"Moro = startle with arms wide after a sudden movement or drop","terms":["moro","startle","arms","abduct"]},{"text":"Do not mix it with rooting (cheek) or palmar grasp (hand squeeze)","terms":["root","palmar","grasp","cheek"]}]},{"id":"v2-life-fontanelle-age","topic":"life","prompt":"A well-appearing 14-month-old still has a soft anterior fontanelle. What does that tell you?","rationale":"The anterior fontanelle closes around 9–18 months, so 14 months can still be open. The posterior usually closes by about 3 months.","keyPoints":[{"text":"Anterior fontanelle closes about 9–18 months","terms":["9","18","anterior"]},{"text":"Posterior closes first, around 3 months","terms":["posterior","3 month","three"]}]},{"id":"v2-life-nose-breather","topic":"life","prompt":"A 4-month-old has a stuffy nose and is working harder to breathe. Why does that matter more than in an adult?","rationale":"Young infants are preferential nose breathers. Nasal congestion can obstruct a large share of their airway.","keyPoints":[{"text":"Young infants are preferential nose breathers — congestion is an airway problem","terms":["nose","nasal","congest","prefer"]},{"text":"The airway is narrow and cone-shaped, so small swelling closes it fast","terms":["narrow","cone","swell"]}]},{"id":"v2-life-elderly-gag","topic":"life","prompt":"An 82-year-old with a recent stroke now has a weak cough. What are you most worried about?","rationale":"Aging plus a stroke weakens cough and gag, so food and secretions go the wrong way — aspiration pneumonia is the risk.","keyPoints":[{"text":"Weaker cough and gag in older adults raise aspiration and pneumonia risk","terms":["cough","gag","aspirat","pneumonia"]},{"text":"Stroke or sedation on top of that makes the risk worse","terms":["stroke","sedat","weak"]}]},{"id":"v2-terms-brady","topic":"terms","prompt":"Bradypnea means:","rationale":"Brady- is slow and -pnea is breathing. Tachy- is fast, dys- is difficulty, a- is without.","keyPoints":[{"text":"brady- = slow, tachy- = fast, dys- = difficult, a-/an- = without","terms":["brady","tachy","dys","slow","fast"]},{"text":"hypo- = low, hyper- = high","terms":["hypo","hyper","low","high"]}]},{"id":"v2-terms-speech-stroke","topic":"terms","prompt":"After a stroke, the patient understands you but cannot form words. The correct term is:","rationale":"Phasia (s) is speech. Aphasia is a speech or language deficit. Dysphagia (g) is swallowing.","keyPoints":[{"text":"phasia (s) = speech; phagia (g) = swallowing","terms":["speech","swallow","phasia","phagia"]},{"text":"Chart the right one — stroke care and aspiration precautions are different problems","terms":["chart","stroke","aspirat"]}]},{"id":"v2-terms-distal","topic":"terms","prompt":"A laceration sits just above the left wrist. Relative to the elbow, that wound is:","rationale":"Distal means farther from the trunk. The wrist is farther out than the elbow.","keyPoints":[{"text":"Distal = farther from the core; proximal = closer to it","terms":["distal","proximal","core","trunk"]},{"text":"Left and right are always the patient's","terms":["patient","their","anatomic"]}]},{"id":"v2-terms-fowler","topic":"terms","prompt":"A CHF patient is sitting bolt upright, leaning on the stretcher. That position is:","rationale":"High Fowler is sitting nearly upright — the working position for respiratory distress. Supine is flat on the back; prone is face down.","keyPoints":[{"text":"High Fowler = sitting upright for respiratory distress","terms":["fowler","upright","sit"]},{"text":"Shock (not late pregnancy) = supine; never prone for a compromised patient","terms":["supine","shock","prone"]}]},{"id":"v2-docs-risks","topic":"docs","prompt":"An alert, oriented adult refuses transport after you explain the risks. The chart must show:","rationale":"Informed refusal means you documented capacity, the risks you explained, and that he declined anyway. A signature alone is not the whole story.","keyPoints":[{"text":"Informed refusal = capacity + risks explained + the decision, all charted","terms":["risk","capacity","refus","informed"]},{"text":"Minors need a parent or guardian; get a witness when you can","terms":["guardian","minor","parent","witness"]}]},{"id":"v2-docs-addendum","topic":"docs","prompt":"You notice a wrong time stamp after the PCR is already submitted. You:","rationale":"After submission, corrections go in as an addendum. The original stays; you add the fix and own it.","keyPoints":[{"text":"After submission, fix errors with an addendum — do not rewrite the original","terms":["addendum","submit","original"]},{"text":"On paper: one line, initials, keep it readable","terms":["line","initial","legible","readable"]}]},{"id":"v2-docs-abandon","topic":"docs","prompt":"You wheel a patient into the ED, park the stretcher in the hall, and leave without telling anyone. That is:","rationale":"Abandonment is ending care without handing the patient to someone of equal or higher training. A named nurse or physician has to take the patient.","keyPoints":[{"text":"Abandonment = stopping care without a proper handoff","terms":["abandon","handoff","transfer"]},{"text":"Chart the name of the person who took the patient","terms":["name","rn","nurse","who"]}]},{"id":"v2-docs-trauma-dest","topic":"docs","prompt":"A stable, talking patient was ejected from a highway rollover. Closest small ER is 6 minutes; a trauma center is 14. You go:","rationale":"Significant mechanism (ejection, rollover) belongs at a trauma center when the patient can make the extra minutes. Arrests get the absolute closest.","keyPoints":[{"text":"Destination = closest most appropriate facility","terms":["appropriate","closest","facility"]},{"text":"Ejection/trauma can bypass a closer ER; arrest cannot","terms":["eject","trauma","arrest","bypass"]}]},{"id":"v2-assess-laceration","topic":"assess","prompt":"In DCAP-BTLS, the L stands for:","rationale":"BTLS is burns, tenderness, lacerations, swelling. Lacerations are cuts through the skin.","keyPoints":[{"text":"DCAP-BTLS: deformities, contusions, abrasions, punctures, burns, tenderness, lacerations, swelling","terms":["lacerat","dcap","btls","abras"]},{"text":"Look and feel every region — tenderness is a palpation finding","terms":["tender","palp","feel"]}]},{"id":"v2-assess-pupils-head","topic":"assess","prompt":"After a fall, one pupil is large and sluggish, the other is midsize and reactive. You should think:","rationale":"Unequal or blown pupils after trauma point to rising pressure or globe injury. Opioids pinpoint both pupils.","keyPoints":[{"text":"Unequal or blown pupil after trauma = pressure or globe injury until proven otherwise","terms":["unequal","blown","herniat","trauma"]},{"text":"Opioids pinpoint both; stimulants dilate both","terms":["pinpoint","opioid","dilat","stimulant"]}]},{"id":"v2-assess-implied","topic":"assess","prompt":"An unresponsive diabetic is on the kitchen floor. No family. You treat under:","rationale":"An emergency plus no capacity equals implied consent — a reasonable person would want care.","keyPoints":[{"text":"No capacity + emergency = implied consent","terms":["implied","unrespons","capacity","emergency"]},{"text":"Once he is oriented and understands the risks, he can refuse","terms":["oriented","refus","understand","capacity"]}]},{"id":"v2-assess-infant-pulse","topic":"assess","prompt":"Where do you check a pulse on a 6-month-old?","rationale":"Infants under 1 year: brachial pulse on the inside of the upper arm. The neck is short and soft — carotid pressure can collapse the airway.","keyPoints":[{"text":"Infant under 1 year → brachial","terms":["brachial","infant","arm"]},{"text":"Awake adult → radial; unresponsive adult or child → carotid","terms":["radial","carotid","awake","unresponsive"]}]},{"id":"v2-reassess-clock","topic":"reassess","prompt":"Your chest-pain patient is now pale, sweaty, and BP is 82/50. How often do you reassess?","rationale":"Unstable or critical patients get a full reassess about every 5 minutes. Stable is about every 15. He just became unstable.","keyPoints":[{"text":"Stable ≈ every 15 minutes; unstable/critical ≈ every 5","terms":["15","5","five","unstable"]},{"text":"A change in condition resets the clock — do not stay on 15 after he crashes","terms":["change","crash","clock","reset"]}]},{"id":"v2-reassess-csm","topic":"reassess","prompt":"Twenty minutes after you splint a forearm, the fingers are pale and the patient says they are numb. You:","rationale":"Swelling can turn a splint into a tourniquet. Loosen, readjust, and recheck circulation, sensation, and movement. The bone still needs support.","keyPoints":[{"text":"New numbness, tingling, or pale fingers = recheck the splint now","terms":["numb","pale","tingl","splint"]},{"text":"Adjust it and recheck CSM — do not abandon immobilization","terms":["csm","adjust","loosen","circulation"]}]},{"id":"v2-reassess-rosc-bvm","topic":"reassess","prompt":"During CPR you feel a carotid pulse. The patient is still not breathing. Next?","rationale":"A real pulse means stop compressions. No breathing means start ventilations. Recovery position needs adequate breathing.","keyPoints":[{"text":"Pulse back = stop compressions; still not breathing = ventilate","terms":["stop","compress","ventilat","bag","rosc"]},{"text":"Return of pulse is not return of breathing","terms":["not","breath","pulse"]}]},{"id":"v2-reassess-pass","topic":"reassess","prompt":"A proper reassessment pass includes:","rationale":"Each pass is mental status + ABCs + new vitals + a check of everything you did. You do not re-interview SAMPLE unless something changed.","keyPoints":[{"text":"Pass = mentation + ABCs + full vitals + every intervention","terms":["mental","abc","vitals","intervention"]},{"text":"Do not redo SAMPLE unless the story changed","terms":["sample","history","unless"]}]},{"id":"v2-resp-infant-slow","topic":"resp","prompt":"A 3-month-old is breathing 18 times a minute, looking tired. That rate is:","rationale":"Infant normal is about 30–60. Eighteen in a tired 3-month-old is bradypnea — treat the ventilation, not the number alone.","keyPoints":[{"text":"Infants 30–60, children 12–40, adults 12–20","terms":["30","60","12","20","40"]},{"text":"A tired infant at 18 is too slow — that is a ventilation problem","terms":["slow","18","tired","ventilat"]}]},{"id":"v2-resp-shallow","topic":"resp","prompt":"An adult is breathing 40 and shallow, getting sleepier. Best next airway move?","rationale":"Fast plus shallow means tidal volume is not reaching the alveoli. An NRB only helps if air is actually exchanging. He needs a bag.","keyPoints":[{"text":"Fast + shallow = inadequate tidal volume","terms":["shallow","tidal","volume","fast"]},{"text":"Falling mentation plus bad volume → BVM, not just a mask","terms":["bvm","bag","mentation","sleepy"]}]},{"id":"v2-resp-kussmaul","topic":"resp","prompt":"A diabetic is breathing deep and fast, with a fruity odor. You should:","rationale":"Deep and fast in DKA is Kussmaul — he is blowing off acid. Do not suppress it. This is hyperglycemia, not a sugar you fix with oral glucose in the field.","keyPoints":[{"text":"Kussmaul = deep + fast = blowing off metabolic acid (DKA)","terms":["kussmaul","dka","acid","deep"]},{"text":"Do not bag it down; this is compensation, not panic","terms":["compensat","not","panic","slow"]}]},{"id":"v2-resp-dead-space","topic":"resp","prompt":"Air that sits in the trachea and bronchi and never reaches alveoli is called:","rationale":"Dead space is the conducting airway that does not exchange gas. Tidal volume is one breath; minute volume is tidal × rate.","keyPoints":[{"text":"Dead space = air that never reaches alveoli","terms":["dead space","alveoli","exchange"]},{"text":"Shallow breaths can be almost all dead space","terms":["shallow","dead","tidal"]}]},{"id":"v2-airway-gurgle","topic":"airway","prompt":"An unresponsive patient is gurgling. First action?","rationale":"Gurgling is fluid. Bagging first drives it into the lungs. Suction, then ventilate.","keyPoints":[{"text":"Gurgling = fluid → suction before any ventilation","terms":["gurgl","suction","fluid"]},{"text":"10 seconds max; measure corner of mouth to earlobe","terms":["10","earlobe","measure"]}]},{"id":"v2-airway-jaw","topic":"airway","prompt":"Unresponsive after a motorcycle crash, helmet off, no obvious fluid. How do you open the airway?","rationale":"Trauma or unknown mechanism = jaw thrust. He
