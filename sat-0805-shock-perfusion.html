<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Sat 8:05 Understanding Shock and Perfusion</title>
<style>
:root {
  --bg: #f4efe6;
  --paper: #fffdf8;
  --ink: #1c2430;
  --muted: #5a6573;
  --navy: #1e3a5f;
  --navy-2: #16304d;
  --red: #b42318;
  --red-soft: #fde8e6;
  --green: #1b7a46;
  --green-soft: #e5f6ec;
  --line: #d8d0c4;
  --chosen-wrong: #f8d7d4;
  --chosen-right: #c8edd4;
  --correct-outline: #1b7a46;
  --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; font-weight: 400; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.ch-tag {
  display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: #e8eef6; color: var(--navy); padding: 4px 8px; border-radius: 6px; margin-bottom: 10px;
}
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: block; width: 100%; text-align: left;
  min-height: 48px; padding: 12px 14px;
  font-size: 1rem; line-height: 1.35;
  border: 2px solid var(--line); border-radius: 12px;
  background: #fff; color: var(--ink);
  cursor: pointer; appearance: none;
  font-family: inherit;
}
.opt:active { transform: scale(.995); }
.opt .letter {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: #eef2f6; font-weight: 700; font-size: .85rem; margin-right: 8px; flex-shrink: 0;
}
.opt .ot { display: inline; }
.opt.locked { cursor: default; }
.opt.chosen.wrong { background: var(--chosen-wrong); border-color: var(--red); }
.opt.chosen.right, .opt.show-correct { background: var(--chosen-right); border-color: var(--correct-outline); }
.opt.dim { opacity: .55; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.why .correct-line { margin-top: 8px; font-weight: 650; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.btn:active { background: var(--navy-2); }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
.miss { margin-top: 18px; }
.miss h3 { margin: 0 0 10px; font-size: 1.05rem; }
.miss-item { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.miss-item .mq { font-weight: 650; margin-bottom: 6px; }
.miss-item .mwhy { font-size: .92rem; color: #333; }
.restart { margin-top: 8px; }
#start-note { font-size: .86rem; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Sat 8:05 Understanding Shock and Perfusion</h1>
  <div class="sub">Recap only · you/your · 12 questions</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [{"ch": "perf", "q": "What two jobs does perfusion do?", "opts": [{"t": "Bring oxygen and nutrients in; take waste out", "ok": true, "why": "Perfusion pumps blood so cells get oxygen and sugar and waste leaves."}, {"t": "Bring waste in; take oxygen and nutrients out", "ok": false, "why": "That swaps the jobs. Perfusion delivers oxygen and nutrients and removes waste."}, {"t": "Bring oxygen in; skip removing any waste", "ok": false, "why": "Both jobs matter. Waste (CO₂, later lactic acid) has to leave too."}, {"t": "Bring waste in; skip delivering any oxygen", "ok": false, "why": "Cells need oxygen and nutrients in, not waste in."}]}, {"ch": "shock", "q": "For an EMT, shock is which of these?", "opts": [{"t": "Hypoperfusion", "ok": true, "why": "Shock = hypoperfusion = a circulatory / perfusion problem."}, {"t": "Hyperperfusion", "ok": false, "why": "Hyper is too much flow. Shock is hypo: not enough perfusion."}, {"t": "Adequate perfusion", "ok": false, "why": "Adequate perfusion is the healthy state, not shock."}, {"t": "Aerobic metabolism", "ok": false, "why": "Aerobic work is what cells do when perfusion is already good."}]}, {"ch": "aero", "q": "When perfusion is adequate, what is the main cell waste?", "opts": [{"t": "Carbon dioxide", "ok": true, "why": "Aerobic metabolism needs oxygen, makes lots of ATP, and wastes CO₂ that is easy to clear."}, {"t": "Lactic acid", "ok": false, "why": "Lactic acid is the anaerobic waste when perfusion is already failing."}, {"t": "Unused oxygen", "ok": false, "why": "Aerobic cells use oxygen. The waste they make is carbon dioxide."}, {"t": "Unused glucose", "ok": false, "why": "Glucose is fuel going in, not the aerobic waste product."}]}, {"ch": "anaero", "q": "When perfusion is inadequate, what is the main cell waste?", "opts": [{"t": "Lactic acid", "ok": true, "why": "Anaerobic work makes less energy and lactic acid, which is hard to clear and adds acidosis."}, {"t": "Carbon dioxide", "ok": false, "why": "CO₂ is the aerobic waste. Shock cells switch to lactic acid."}, {"t": "Unused oxygen", "ok": false, "why": "These cells are short on oxygen. Their waste is lactic acid."}, {"t": "Unused glucose", "ok": false, "why": "Glucose is fuel. The anaerobic waste is lactic acid."}]}, {"ch": "clock-bh", "q": "Without oxygen, how long do brain and heart last?", "opts": [{"t": "Minutes", "ok": true, "why": "Brain and heart injure and die in minutes. That is why time is critical."}, {"t": "Hours", "ok": false, "why": "Hours is the skin and gut clock, not brain and heart."}, {"t": "Days", "ok": false, "why": "Brain and heart do not last days without oxygen."}, {"t": "Seconds", "ok": false, "why": "The recap clock for brain and heart is minutes, not seconds."}]}, {"ch": "clock-sg", "q": "Without oxygen, how long do skin and intestines last?", "opts": [{"t": "Hours", "ok": true, "why": "Skin and gut last hours. They still get injured, just slower. Brain and heart come first."}, {"t": "Minutes", "ok": false, "why": "Minutes is the brain and heart clock, not skin and gut."}, {"t": "Days", "ok": false, "why": "The recap clock for skin and gut is hours, not days."}, {"t": "Seconds", "ok": false, "why": "Seconds is too fast. Skin and gut last hours."}]}, {"ch": "fof", "q": "Heart rate up, harder squeeze, some vessels tight so heart and brain keep blood. What is this?", "opts": [{"t": "Fight-or-flight epinephrine", "ok": true, "why": "Sympathetic epinephrine raises rate and squeeze and tightens some beds to protect heart and brain."}, {"t": "Decompensated late shock", "ok": false, "why": "Those epi moves are compensation, not the late collapse."}, {"t": "Aerobic cell metabolism", "ok": false, "why": "This is a vessel-and-heart response, not the aerobic waste path."}, {"t": "Hyperperfusion of cells", "ok": false, "why": "This fires because perfusion is dropping, not because flow is too high."}]}, {"ch": "comp", "q": "Fast pulse, fast breathing, cool pale clammy skin, blood pressure still normal. What is this?", "opts": [{"t": "Compensated shock", "ok": true, "why": "Early compensation can hold the pressure. Do not wait for hypotension to name it."}, {"t": "Decompensated shock", "ok": false, "why": "Decompensated shock has a falling pressure and a much worse mental status."}, {"t": "Adequate perfusion", "ok": false, "why": "Cool pale clammy skin and a fast pulse are not adequate perfusion."}, {"t": "Hyperperfusion state", "ok": false, "why": "Hyper is too much flow. These signs are early low perfusion."}]}, {"ch": "decomp", "q": "Falling blood pressure, much worse mental status, very weak or absent wrist pulses, mottled very cool skin. What is this?", "opts": [{"t": "Decompensated shock", "ok": true, "why": "When compensation fails you get hypotension, a worse mental status, and failing pulses and skin."}, {"t": "Compensated shock", "ok": false, "why": "Compensated shock still holds a near-normal pressure."}, {"t": "Adequate perfusion", "ok": false, "why": "These are late shock signs, not adequate perfusion."}, {"t": "Hyperperfusion state", "ok": false, "why": "Hyper is too much flow. This is late low perfusion."}]}, {"ch": "bp", "q": "When do you name shock?", "opts": [{"t": "Call it from perfusion signs", "ok": true, "why": "Shock can exist before blood pressure drops. Read mental status, skin, and pulses first."}, {"t": "Call it from falling pressure", "ok": false, "why": "Waiting for hypotension means you missed compensated shock."}, {"t": "Call it from heart rate only", "ok": false, "why": "A fast pulse is one sign, not the whole perfusion check."}, {"t": "Call it from cap refill only", "ok": false, "why": "Cap refill can help. Name shock from perfusion signs, not one test."}]}, {"ch": "look", "q": "Besides blood pressure, what do you check first for perfusion?", "opts": [{"t": "Mental status, skin, and pulses", "ok": true, "why": "Perfusion status first: mental status, skin signs, pulses. Blood pressure is a clue, not the whole story."}, {"t": "Heart rate, cap refill, and SBP", "ok": false, "why": "Heart rate and cap refill can help, but the recap’s first look is mental status, skin, and pulses."}, {"t": "Heart rate, pressure, and color", "ok": false, "why": "Do not lead with the pressure number. Mental status, skin, and pulses come first."}, {"t": "Cap refill, pressure, and color", "ok": false, "why": "Cap refill is extra. The recap’s first look is mental status, skin, and pulses."}]}, {"ch": "warm", "q": "Why keep a shock patient warm?", "opts": [{"t": "Anaerobic work makes less heat", "ok": true, "why": "Less energy means less heat, so they slide toward hypothermia in the lethal triad."}, {"t": "Aerobic work makes extra heat", "ok": false, "why": "Shock cells are anaerobic. They make less heat, not extra heat."}, {"t": "Cold helps lactic acid clear", "ok": false, "why": "Cold is a problem (hypothermia), not a treatment for lactic acid."}, {"t": "Cold helps carbon dioxide clear", "ok": false, "why": "Keep them warm. Hypothermia is part of the lethal triad, not a clearance trick."}]}];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"perf": "Perfusion", "shock": "Shock", "aero": "Aerobic", "anaero": "Anaerobic", "clock-bh": "Brain / heart", "clock-sg": "Skin / gut", "fof": "Fight-or-flight", "comp": "Compensated", "decomp": "Decompensated", "bp": "When to name it", "look": "What you check", "warm": "Keep warm"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sat 8:05 shock and perfusion recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · shock and perfusion recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
</body>
</html>
