<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Ch 28 Head and Spine — practice</title>
<style>
:root {
  --bg: #f4efe6; --paper: #fffdf8; --ink: #1c2430; --muted: #5a6573;
  --navy: #1e3a5f; --navy-2: #16304d; --red: #b42318; --green: #1b7a46;
  --line: #d8d0c4; --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
input[type=text] {
  width: 100%; min-height: 48px; font-size: 1.05rem; font-family: inherit;
  padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
}
input[type=text]:focus { outline: 2px solid var(--navy); border-color: var(--navy); }
input[type=text]:disabled { background: #f3f1ec; }
.check {
  width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.check:active { background: var(--navy-2); }
.check:disabled { opacity: .55; cursor: default; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.links { display:flex; flex-wrap:wrap; gap:8px; margin: 12px 0 0; }
.links a { font-size:.82rem; color:#1e3a5f; background:#e8e1d4; border-radius:999px; padding:4px 10px; text-decoration:none; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>Ch 28 Head and Spine</h1>
  <div class="sub">Type-in · 22 from locked notes</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [
  {
    "ch": 28,
    "q": "Work outside-in on head injury. What is the order?",
    "a": [
      "scalp → skull → bleeds around brain → brain → cord",
      "scalp, skull, bleeds around the brain, brain, cord",
      "scalp to skull to bleeds around brain to brain to cord",
      "outside-in: scalp → skull → bleeds → brain → cord"
    ],
    "why": "Work from the outside in: scalp → skull → bleeds around the brain → the brain itself → the cord."
  },
  {
    "ch": 28,
    "q": "Primary brain injury already happened. What three secondary problems do you fight?",
    "a": [
      "low oxygen, low blood pressure, infection",
      "low O2, low BP, infection",
      "low oxygen, low BP, infection",
      "low oxygen / low blood pressure / infection"
    ],
    "why": "Fight the secondary stuff: low oxygen, low blood pressure, infection."
  },
  {
    "ch": 28,
    "q": "Trauma patient has a slow heart. What two problems are on your short list?",
    "a": [
      "pressure in the head or spinal cord injury",
      "head pressure or spinal cord / neurogenic",
      "Cushing’s / head pressure OR spinal cord injury",
      "pressure inside the head, or a spinal cord injury"
    ],
    "why": "Trauma + slow heart rate = only two things: pressure in the head, or a spinal cord injury."
  },
  {
    "ch": 28,
    "q": "Slow heart + HIGH blood pressure after trauma — what do you think?",
    "a": [
      "pressure inside the head (Cushing’s)",
      "Cushing’s / head pressure",
      "pressure in the head",
      "head pressure (Cushing’s)"
    ],
    "why": "Slow heart + HIGH blood pressure = pressure inside the head (Cushing’s)."
  },
  {
    "ch": 28,
    "q": "Slow heart + LOW blood pressure after trauma — what do you think?",
    "a": [
      "spinal cord / neurogenic shock",
      "spinal cord injury / neurogenic",
      "spinal / neurogenic shock",
      "spinal cord or neurogenic shock"
    ],
    "why": "Slow heart + LOW blood pressure = spinal cord / neurogenic shock."
  },
  {
    "ch": 28,
    "q": "Name Cushing’s triad.",
    "a": [
      "high wide BP, slow heart, irregular breathing",
      "high and wide blood pressure, slow heart, irregular breathing",
      "high wide BP + slow heart + irregular breathing",
      "high wide BP, slow HR, irregular breathing"
    ],
    "why": "Cushing’s triad: high wide BP, slow heart, irregular breathing."
  },
  {
    "ch": 28,
    "q": "What BP pattern fits Cushing’s better — 200/90 or 160/110?",
    "a": [
      "200/90",
      "200/90 (high wide)",
      "200/90 — systolic up, diastolic nearer normal",
      "200/90 (high and wide)"
    ],
    "why": "High and WIDE BP: systolic shoots up, diastolic stays nearer normal. Example 200/90. Regular high blood pressure usually climbs together like 160/110."
  },
  {
    "ch": 28,
    "q": "May you give nitro to drop Cushing’s high BP?",
    "a": [
      "no",
      "no — do not give nitro",
      "no (do not drop that BP)",
      "no nitro"
    ],
    "why": "Do not give nitro to drop that blood pressure. A drop in BP after a brain injury is a secondary killer."
  },
  {
    "ch": 28,
    "q": "Central nervous system equals what?",
    "a": [
      "brain + spinal cord",
      "brain and spinal cord",
      "brain and cord",
      "CNS = brain + spinal cord"
    ],
    "why": "Central nervous system = brain + spinal cord."
  },
  {
    "ch": 28,
    "q": "Meninges outside to inside — name the three layers.",
    "a": [
      "dura, arachnoid, pia",
      "dura → arachnoid → pia",
      "dura, arachnoid, pia (outside in)",
      "dura then arachnoid then pia"
    ],
    "why": "Meninges outside to inside: dura, arachnoid, pia."
  },
  {
    "ch": 28,
    "q": "Where is CSF made, and about how much?",
    "a": [
      "inside the brain, about 125 mL",
      "made inside the brain (~125 mL)",
      "inside the brain — about 125 mL",
      "brain; ~125 mL"
    ],
    "why": "CSF is made inside the brain (about 125 mL)."
  },
  {
    "ch": 28,
    "q": "Late rising pressure shoves the brainstem down which hole?",
    "a": [
      "foramen magnum",
      "foramen magnum (herniation)",
      "the foramen magnum",
      "foramen magnum at base of skull"
    ],
    "why": "Foramen magnum = big hole at base of skull. Late rising pressure shoves brainstem down that hole (herniation)."
  },
  {
    "ch": 28,
    "q": "Basilar skull fracture clues — name three.",
    "a": [
      "raccoon eyes, Battle’s sign, CSF nose/ear",
      "raccoon eyes, Battle’s (mastoid), CSF from nose or ear",
      "raccoon eyes + Battle’s sign + CSF leak",
      "raccoon eyes, Battle’s sign, CSF from nose or ear"
    ],
    "why": "Basilar: raccoon eyes. Battle’s sign (mastoid bruise). CSF from nose or ear."
  },
  {
    "ch": 28,
    "q": "Epidural bleed classic pattern?",
    "a": [
      "lucid interval — down → up → down",
      "hit, pass out, wake up talking, pass out again",
      "lucid interval (down-up-down)",
      "down → up → down (lucid interval)"
    ],
    "why": "Epidural: usually artery, fast. Lucid interval — down → up → down."
  },
  {
    "ch": 28,
    "q": "Subdural bleed — fast or slow, and who is it common in?",
    "a": [
      "slow; older people and alcoholics",
      "vein / slow; older and alcoholics",
      "slow delayed; older people and alcoholics",
      "slow; common in older people and alcoholics"
    ],
    "why": "Subdural: usually a vein. Slow. Common in older people and alcoholics."
  },
  {
    "ch": 28,
    "q": "Sudden worst headache after a head event — which bleed pattern?",
    "a": [
      "subarachnoid",
      "subarachnoid bleed",
      "subarachnoid (sudden worst headache)",
      "subarachnoid — sudden worst headache"
    ],
    "why": "Subarachnoid: sudden worst headache. Clutch the head and drop."
  },
  {
    "ch": 28,
    "q": "Concussion CT — normal or bruise? About what percent never pass out?",
    "a": [
      "CT normal; about 90% never pass out",
      "CT looks normal; ~90% never pass out",
      "normal CT; 90% never pass out",
      "CT looks normal; about 90% never pass out"
    ],
    "why": "Concussion: CT looks normal. About 90% never pass out."
  },
  {
    "ch": 28,
    "q": "Bones out of place pinch the cord without cutting it. What can happen when pressure comes off?",
    "a": [
      "feeling and movement can return",
      "numbness/paralysis can reverse",
      "feeling and movement returned when pinch gone",
      "pressure off → feeling and movement can return"
    ],
    "why": "Bones can pinch without cutting. Same numbness and paralysis until the pinch is gone; pressure off can return feeling and movement."
  },
  {
    "ch": 28,
    "q": "Name board reasons after trauma.",
    "a": [
      "unconscious, numb/paralysis, neck/back pain, or you do not believe them",
      "unconscious; numbness or paralysis; neck or back pain; do not trust them",
      "unconscious, numb/paralyzed, neck/back pain, or do not believe them",
      "unconscious / numb or paralyzed / neck or back pain / you do not trust them"
    ],
    "why": "Board for unconscious, numbness or paralysis, neck or back pain after trauma, or you do not believe them."
  },
  {
    "ch": 28,
    "q": "Full-face helmet blocks airway, or head rattles inside — what do you do?",
    "a": [
      "take it off (two people)",
      "remove helmet; two people",
      "take it off — two people, no neck bend",
      "remove it with two people"
    ],
    "why": "Take it off if full-face blocks airway, head rattles, arrest, or cannot immobilize with it. Two people; do not bend the neck."
  },
  {
    "ch": 28,
    "q": "Trauma airway — which maneuver, and may you use an NPA?",
    "a": [
      "jaw thrust; no NPA",
      "jaw thrust. No NPA.",
      "jaw thrust; refuse NPA",
      "jaw thrust — no NPA"
    ],
    "why": "Jaw thrust. No NPA."
  },
  {
    "ch": 28,
    "q": "One minute of low oxygen after a brain injury — what happens to death risk?",
    "a": [
      "makes death much more likely",
      "death much more likely",
      "much more likely to die",
      "greatly raises death risk"
    ],
    "why": "One minute of low oxygen after a brain injury makes death much more likely."
  }
]
;

const LINKS = "<a href=\"emt-quiz-index.html\">Hub</a><a href=\"ch28-head-spine-key.html\">Key</a><a href=\"ch28-head-spine-detailed.html\">Detailed</a>";

function norm(s) { return String(s).trim().toLowerCase(); }
function acceptList(item) {
  if (Array.isArray(item.a)) return item.a.map(String);
  if (item.a == null) return [];
  return [String(item.a)];
}
function isRight(item, typed) {
  const n = norm(typed);
  if (!n) return false;
  return acceptList(item).some(function (a) { return norm(a) === n; });
}

let i = 0, correct = 0, answered = 0, locked = false;
const main = document.getElementById("main");
const nextBtn = document.getElementById("nextBtn");
const scoreEl = document.getElementById("score");
const progLabel = document.getElementById("progLabel");
const progBar = document.getElementById("progBar");

function setProg() {
  scoreEl.textContent = correct + " / " + answered;
  progLabel.textContent = i < BANK.length ? ("Question " + (i + 1) + " of " + BANK.length) : "Done";
  progBar.style.width = (Math.min(i, BANK.length) / BANK.length * 100) + "%";
}

function renderEnd() {
  nextBtn.classList.remove("visible");
  const pct = BANK.length ? Math.round(correct / BANK.length * 100) : 0;
  main.innerHTML = '<div class="card end"><h2>Done</h2><div class="big">' + correct + " / " + BANK.length + '</div><p class="pct">' + pct + '% first-check correct</p><div class="links">' + LINKS + '</div><button type="button" class="check restart" id="restart">Again</button></div>';
  document.getElementById("restart").onclick = function () {
    i = 0; correct = 0; answered = 0; locked = false; renderQ();
  };
}

function renderQ() {
  if (i >= BANK.length) { setProg(); renderEnd(); return; }
  locked = false;
  nextBtn.classList.remove("visible");
  const item = BANK[i];
  setProg();
  main.innerHTML = '<div class="card"><p class="qtext"></p><input type="text" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button type="button" class="check" id="check">Check</button><div class="why" id="why"></div></div>';
  main.querySelector(".qtext").textContent = item.q;
  const input = document.getElementById("ans");
  const check = document.getElementById("check");
  const why = document.getElementById("why");
  input.focus();

  function submit() {
    if (locked) return;
    const typed = input.value;
    if (!norm(typed)) { input.focus(); return; }
    locked = true;
    answered += 1;
    const ok = isRight(item, typed);
    if (ok) correct += 1;
    input.disabled = true;
    check.disabled = true;
    why.classList.add("visible");
    why.innerHTML = "";
    const v = document.createElement("div");
    v.className = "verdict " + (ok ? "ok" : "bad");
    v.textContent = ok ? "Correct" : "Not quite";
    const w = document.createElement("div");
    w.textContent = item.why;
    why.appendChild(v);
    why.appendChild(w);
    setProg();
    nextBtn.textContent = i === BANK.length - 1 ? "Finish" : "Next";
    nextBtn.classList.add("visible");
  }
  check.onclick = submit;
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
  });
}

nextBtn.onclick = function () {
  if (!locked) return;
  i += 1;
  renderQ();
};

renderQ();

</script>
</body>
</html>
