t ventricle to the lungs — the exception."}]},{"ch":"cava","q":"Blood is coming home to the right atrium. Which pairing is right?","opts":[{"t":"Pulmonary veins from the legs; aorta from the head","ok":false,"why":"SVC returns head/upper body. IVC returns lower body. Both empty into the right atrium."},{"t":"SVC from head and upper body; IVC from the lower body","ok":true,"why":"SVC returns head/upper body. IVC returns lower body. Both empty into the right atrium."},{"t":"Both vena cavae empty into the left ventricle","ok":false,"why":"SVC returns head/upper body. IVC returns lower body. Both empty into the right atrium."},{"t":"Hepatic arteries return all venous blood","ok":false,"why":"SVC returns head/upper body. IVC returns lower body. Both empty into the right atrium."}]},{"ch":"art","q":"Arteries in this recap — pressure, blood, and what you feel?","opts":[{"t":"Low pressure, no pulse, you start every IV here","ok":false,"why":"Arteries are high pressure, usually oxygenated (except pulmonary arteries), and that is where you feel a pulse."},{"t":"High pressure, usually oxygenated (except pulmonary arteries), and you feel pulses here","ok":true,"why":"Arteries are high pressure, usually oxygenated (except pulmonary arteries), and that is where you feel a pulse."},{"t":"They only carry deoxygenated blood from the spleen","ok":false,"why":"Arteries are high pressure, usually oxygenated (except pulmonary arteries), and that is where you feel a pulse."},{"t":"They oozed dark blood and never spurts","ok":false,"why":"Arteries are high pressure, usually oxygenated (except pulmonary arteries), and that is where you feel a pulse."}]},{"ch":"vein","q":"Why do you start IVs in veins, this recap?","opts":[{"t":"Veins are high pressure so the fluid shoots in faster","ok":false,"why":"Veins are low pressure, so IVs go there. They usually carry deoxygenated blood (except pulmonary veins)."},{"t":"Veins are low pressure — safer than an arterial stick","ok":true,"why":"Veins are low pressure, so IVs go there. They usually carry deoxygenated blood (except pulmonary veins)."},{"t":"Veins are the only place you can feel a pulse","ok":false,"why":"Veins are low pressure, so IVs go there. They usually carry deoxygenated blood (except pulmonary veins)."},{"t":"Pulmonary veins are the only IV site on an adult","ok":false,"why":"Veins are low pressure, so IVs go there. They usually carry deoxygenated blood (except pulmonary veins)."}]},{"ch":"abl","q":"Arterial bleeding — what do you expect?","opts":[{"t":"Dark red, slow ooze, rarely urgent","ok":false,"why":"Arterial bleed: bright red, spurts with the heartbeat, rapidly life-threatening."},{"t":"Bright red, spurts with the heartbeat, rapidly life-threatening","ok":true,"why":"Arterial bleed: bright red, spurts with the heartbeat, rapidly life-threatening."},{"t":"Clear fluid from a hollow organ only","ok":false,"why":"Arterial bleed: bright red, spurts with the heartbeat, rapidly life-threatening."},{"t":"No color change because arteries have no pressure","ok":false,"why":"Arterial bleed: bright red, spurts with the heartbeat, rapidly life-threatening."}]},{"ch":"vbl","q":"Venous bleeding — picture from this recap?","opts":[{"t":"Bright red spurts timed to each systole","ok":false,"why":"Venous bleed: darker red, flows or oozes rather than spurts."},{"t":"Darker red, flows or oozes rather than spurts","ok":true,"why":"Venous bleed: darker red, flows or oozes rather than spurts."},{"t":"Always from the carotid on a responsive adult","ok":false,"why":"Venous bleed: darker red, flows or oozes rather than spurts."},{"t":"It only happens after a solid-organ hit","ok":false,"why":"Venous bleed: darker red, flows or oozes rather than spurts."}]},{"ch":"pulse","q":"What is a pulse, and how do you feel it?","opts":[{"t":"Air moving at the alveoli; you listen with a thumb on the vein","ok":false,"why":"Pulse = pressure wave from LV contraction. Press an artery against bone/cartilage; too hard stops it."},{"t":"The pressure wave when the left ventricle contracts — press an artery against a firm structure","ok":true,"why":"Pulse = pressure wave from LV contraction. Press an artery against bone/cartilage; too hard stops it."},{"t":"Diastolic refill only; press as hard as you can until it stops","ok":false,"why":"Pulse = pressure wave from LV contraction. Press an artery against bone/cartilage; too hard stops it."},{"t":"A venous wave you feel in the IVC","ok":false,"why":"Pulse = pressure wave from LV contraction. Press an artery against bone/cartilage; too hard stops it."}]},{"ch":"sites","q":"Unresponsive adult vs responsive adult — which pulse sites does this recap assign?","opts":[{"t":"Dorsalis pedis for both, because the neck is never used","ok":false,"why":"Carotid = unresponsive adult life check. Radial (thumb-side wrist) = responsive adult."},{"t":"Carotid for the unresponsive adult; radial (thumb-side wrist) for the responsive adult","ok":true,"why":"Carotid = unresponsive adult life check. Radial (thumb-side wrist) = responsive adult."},{"t":"Brachial for every adult; carotid only on infants","ok":false,"why":"Carotid = unresponsive adult life check. Radial (thumb-side wrist) = responsive adult."},{"t":"Femoral only if they can talk to you","ok":false,"why":"Carotid = unresponsive adult life check. Radial (thumb-side wrist) = responsive adult."}]},{"ch":"brac","q":"Brachial pulse — where, and who needs it most here?","opts":[{"t":"Top of the foot; only for distal checks after a splint","ok":false,"why":"Brachial is inside the upper arm — crucial for infants and used for BP."},{"t":"Inside of the upper arm — crucial for infants, and a BP site","ok":true,"why":"Brachial is inside the upper arm — crucial for infants and used for BP."},{"t":"Behind the medial ankle; main adult life check","ok":false,"why":"Brachial is inside the upper arm — crucial for infants and used for BP."},{"t":"Thumb-side wrist; never used for blood pressure","ok":false,"why":"Brachial is inside the upper arm — crucial for infants and used for BP."}]},{"ch":"dist","q":"You need distal circulation after a leg injury. Which pair?","opts":[{"t":"Carotid and radial","ok":false,"why":"Dorsalis pedis (top of foot) and posterior tibial (behind medial ankle) check distal circulation."},{"t":"Dorsalis pedis (top of foot) and posterior tibial (behind the medial ankle)","ok":true,"why":"Dorsalis pedis (top of foot) and posterior tibial (behind medial ankle) check distal circulation."},{"t":"Hepatic and mesenteric only","ok":false,"why":"Dorsalis pedis (top of foot) and posterior tibial (behind medial ankle) check distal circulation."},{"t":"Brachial and carotid, because they are closest to the foot","ok":false,"why":"Dorsalis pedis (top of foot) and posterior tibial (behind medial ankle) check distal circulation."}]},{"ch":"why","q":"Why do pulses matter on your patient, this recap?","opts":[{"t":"Only to decide left versus right quadrant","ok":false,"why":"Pulses tell you dead vs alive/CPR, rate and quality, and distal flow beyond injury or splint."},{"t":"Dead vs alive / CPR, rate and quality, and distal flow beyond an injury or splint","ok":true,"why":"Pulses tell you dead vs alive/CPR, rate and quality, and distal flow beyond injury or splint."},{"t":"They prove gas exchange in the aorta","ok":false,"why":"Pulses tell you dead vs alive/CPR, rate and quality, and distal flow beyond injury or splint."},{"t":"You must always pick the left side or the reading is false","ok":false,"why":"Pulses tell you dead vs alive/CPR, rate and quality, and distal flow beyond injury or splint."}]},{"ch":"side","q":"Left vs right pulse — does the side matter?","opts":[{"t":"Always use the left; the right never counts","ok":false,"why":"Left vs right usually does not matter unless local injury or a specific concern."},{"t":"Usually it does not matter unless there is a local injury or a specific concern","ok":true,"why":"Left vs right usually does not matter unless local injury or a specific concern."},{"t":"You must alternate sides every 15 seconds","ok":false,"why":"Left vs right usually does not matter unless local injury or a specific concern."},{"t":"Right side only, because the LV is on the right","ok":false,"why":"Left vs right usually does not matter unless local injury or a specific concern."}]},{"ch":"bp","q":"Systolic vs diastolic in this recap?","opts":[{"t":"Systolic is relax/refill; diastolic is LV squeeze","ok":false,"why":"Systolic = LV contracts and ejects. Diastolic = heart relaxes and refills."},{"t":"Systolic (top) is LV contraction and ejection; diastolic (bottom) is relax and refill","ok":true,"why":"Systolic = LV contracts and ejects. Diastolic = heart relaxes and refills."},{"t":"Both numbers are venous pressure in the IVC","ok":false,"why":"Systolic = LV contracts and ejects. Diastolic = heart relaxes and refills."},{"t":"Diastolic is the only number you feel as a pulse","ok":false,"why":"Systolic = LV contracts and ejects. Diastolic = heart relaxes and refills."}]},{"ch":"hose","q":"Is arterial flow a steady garden hose in this recap?","opts":[{"t":"Yes — pressure never changes between beats","ok":false,"why":"Blood flow is pulsatile, not a continuous garden hose."},{"t":"No — flow is pulsatile, not continuous like a hose","ok":true,"why":"Blood flow is pulsatile, not a continuous garden hose."},{"t":"Only veins are pulsatile","ok":false,"why":"Blood flow is pulsatile, not a continuous garden hose."},{"t":"Only after a hollow-organ leak","ok":false,"why":"Blood flow is pulsatile, not a continuous garden hose."}]},{"ch":"solid","q":"Solid organs this recap lists, and the injury risk?","opts":[{"t":"Stomach and bladder — they leak bile first","ok":false,"why":"Solid: liver, spleen, kidneys, pancreas. Injury risk is severe internal bleeding."},{"t":"Liver, spleen, kidneys, pancreas — high blood content, so severe internal bleeding","ok":true,"why":"Solid: liver, spleen, kidneys, pancreas. Injury risk is severe internal bleeding."},{"t":"Only hollow organs bleed; solid organs only infect","ok":false,"why":"Solid: liver, spleen, kidneys, pancreas. Injury risk is severe internal bleeding."},{"t":"Gallbladder and intestines — they hold 40% of blood volume","ok":false,"why":"Solid: liver, spleen, kidneys, pancreas. Injury risk is severe internal bleeding."}]},{"ch":"holl","q":"Hollow-organ injury — main risk this recap wants?","opts":[{"t":"Instant arterial spurting from the aorta","ok":false,"why":"Hollow: stomach, intestines, bladder, gallbladder. Injury risk is leak → peritonitis/infection."},{"t":"Leakage of contents → peritonitis / severe infection","ok":true,"why":"Hollow: stomach, intestines, bladder, gallbladder. Injury risk is leak → peritonitis/infection."},{"t":"Old RBC removal stops in the LUQ","ok":false,"why":"Hollow: stomach, intestines, bladder, gallbladder. Injury risk is leak → peritonitis/infection."},{"t":"Bone marrow stops making urine","ok":false,"why":"Hollow: stomach, intestines, bladder, gallbladder. Injury risk is leak → peritonitis/infection."}]},{"ch":"quad","q":"Quadrants — whose view, and where is the spleen?","opts":[{"t":"Your view as you stand at the feet; spleen is RLQ","ok":false,"why":"Quadrants are from the patient’s view, centered on the navel. Spleen = LUQ."},{"t":"The patient’s perspective, centered on the navel; spleen is LUQ","ok":true,"why":"Quadrants are from the patient’s view, centered on the navel. Spleen = LUQ."},{"t":"Always the liver’s view; spleen is RUQ","ok":false,"why":"Quadrants are from the patient’s view, centered on the navel. Spleen = LUQ."},{"t":"There are only two boxes, both on the right","ok":false,"why":"Quadrants are from the patient’s view, centered on the navel. Spleen = LUQ."}]},{"ch":"livq","q":"Liver location you should carry from this lecture plus general EMT knowledge?","opts":[{"t":"Only LLQ, so RUQ pain is never liver","ok":false,"why":"Liver is mostly RUQ and remains a high-yield trauma bleed."},{"t":"Mostly   i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sat 9:02 circ-abdomen recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · circ-abdomen recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
</body>
</html>
