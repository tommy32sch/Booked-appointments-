ody."}]},{"ch":"wall","q":"Why is the left ventricle wall thicker and stronger?","opts":[{"t":"It only has to reach the nearby lungs","ok":false,"why":"Left wall is thicker because it pumps to the entire body. Right is thinner — lungs only."},{"t":"It has to push blood through the whole body","ok":true,"why":"Left wall is thicker because it pumps to the entire body. Right is thinner — lungs only."},{"t":"It receives blood from the SVC and IVC","ok":false,"why":"Left wall is thicker because it pumps to the entire body. Right is thinner — lungs only."},{"t":"It sits after the tricuspid valve","ok":false,"why":"Left wall is thicker because it pumps to the entire body. Right is thinner — lungs only."}]},{"ch":"lfail","q":"Left-sided pump is failing. Where does blood back up, and what do you see?","opts":[{"t":"Into the body — JVD and ankle swelling first","ok":false,"why":"Left fail: cannot go forward to the body, so it backs into the lungs — SOB, crackles, CHF picture."},{"t":"Into the lungs — shortness of breath, crackles, a CHF picture","ok":true,"why":"Left fail: cannot go forward to the body, so it backs into the lungs — SOB, crackles, CHF picture."},{"t":"Only into the right atrium through the tricuspid","ok":false,"why":"Left fail: cannot go forward to the body, so it backs into the lungs — SOB, crackles, CHF picture."},{"t":"Nowhere — stroke volume always rises","ok":false,"why":"Left fail: cannot go forward to the body, so it backs into the lungs — SOB, crackles, CHF picture."}]},{"ch":"rfail","q":"Right-sided pump is failing (logic this recap wants you to use now). Backup where?","opts":[{"t":"Into the lungs — crackles and a CHF picture","ok":false,"why":"Right fail: backup into the body — JVD and peripheral edema (weight gain shows up in later chapters)."},{"t":"Into the body — JVD and peripheral edema","ok":true,"why":"Right fail: backup into the body — JVD and peripheral edema (weight gain shows up in later chapters)."},{"t":"Into the aorta through the aortic valve","ok":false,"why":"Right fail: backup into the body — JVD and peripheral edema (weight gain shows up in later chapters)."},{"t":"Nowhere — the right wall is thicker so it never fails","ok":false,"why":"Right fail: backup into the body — JVD and peripheral edema (weight gain shows up in later chapters)."}]},{"ch":"cava","q":"Blood is coming back to the right atrium. Which vessel pairing is right?","opts":[{"t":"Pulmonary veins from the head; aorta from the legs","ok":false,"why":"SVC returns head and upper body. IVC returns lower body. Both empty into the right atrium."},{"t":"SVC from head and upper body; IVC from the lower body","ok":true,"why":"SVC returns head and upper body. IVC returns lower body. Both empty into the right atrium."},{"t":"Pulmonary arteries from the alveoli; mitral from the gut","ok":false,"why":"SVC returns head and upper body. IVC returns lower body. Both empty into the right atrium."},{"t":"Aortic valve from the arms; pulmonic from the feet","ok":false,"why":"SVC returns head and upper body. IVC returns lower body. Both empty into the right atrium."}]},{"ch":"pa","q":"What do the pulmonary arteries carry, and where?","opts":[{"t":"Oxygenated blood from the left atrium to the body","ok":false,"why":"Pulmonary arteries carry deoxygenated blood from the right ventricle to the lungs — the test exception."},{"t":"Deoxygenated blood from the right ventricle to the lungs","ok":true,"why":"Pulmonary arteries carry deoxygenated blood from the right ventricle to the lungs — the test exception."},{"t":"Oxygenated blood from the alveoli to the left atrium","ok":false,"why":"Pulmonary arteries carry deoxygenated blood from the right ventricle to the lungs — the test exception."},{"t":"Mixed waste only through the mitral valve","ok":false,"why":"Pulmonary arteries carry deoxygenated blood from the right ventricle to the lungs — the test exception."}]},{"ch":"pv","q":"What do the pulmonary veins do after alveolar exchange?","opts":[{"t":"Take deoxygenated blood to the right atrium","ok":false,"why":"Pulmonary veins bring oxygenated blood to the left atrium after O₂ in / CO₂ out at the alveoli."},{"t":"Bring oxygenated blood to the left atrium","ok":true,"why":"Pulmonary veins bring oxygenated blood to the left atrium after O₂ in / CO₂ out at the alveoli."},{"t":"Dump into the SVC with the head return","ok":false,"why":"Pulmonary veins bring oxygenated blood to the left atrium after O₂ in / CO₂ out at the alveoli."},{"t":"Cross the pulmonic valve into the aorta","ok":false,"why":"Pulmonary veins bring oxygenated blood to the left atrium after O₂ in / CO₂ out at the alveoli."}]},{"ch":"tpma","q":"Valve order on the path — T–P–M–A means what?","opts":[{"t":"Tracheal, pleural, mediastinal, alveolar","ok":false,"why":"T–P–M–A is tricuspid, then pulmonic, then mitral (bicuspid), then aortic."},{"t":"Tricuspid, pulmonic, mitral, aortic","ok":true,"why":"T–P–M–A is tricuspid, then pulmonic, then mitral (bicuspid), then aortic."},{"t":"Tachycardia, perfusion, minute volume, afterload","ok":false,"why":"T–P–M–A is tricuspid, then pulmonic, then mitral (bicuspid), then aortic."},{"t":"Tricuspid, mitral, pulmonic, aortic","ok":false,"why":"T–P–M–A is tricuspid, then pulmonic, then mitral (bicuspid), then aortic."}]},{"ch":"av","q":"Which pair are the AV valves, and on which side?","opts":[{"t":"Pulmonic on the left; aortic on the right","ok":false,"why":"AV valves: tricuspid on the right, mitral/bicuspid on the left. Pulmonic and aortic are semilunar."},{"t":"Tricuspid on the right; mitral (bicuspid) on the left","ok":true,"why":"AV valves: tricuspid on the right, mitral/bicuspid on the left. Pulmonic and aortic are semilunar."},{"t":"Both semilunar valves sit between atria and ventricles","ok":false,"why":"AV valves: tricuspid on the right, mitral/bicuspid on the left. Pulmonic and aortic are semilunar."},{"t":"Mitral on the right; tricuspid on the left","ok":false,"why":"AV valves: tricuspid on the right, mitral/bicuspid on the left. Pulmonic and aortic are semilunar."}]},{"ch":"sl","q":"Semilunar valves — which door is which?","opts":[{"t":"Tricuspid is RV to lungs; mitral is LV to body","ok":false,"why":"Semilunar: pulmonic is RV → lungs; aortic is LV → body. They close to stop backflow."},{"t":"Pulmonic is RV to lungs; aortic is LV to body","ok":true,"why":"Semilunar: pulmonic is RV → lungs; aortic is LV → body. They close to stop backflow."},{"t":"Aortic is RA to RV; pulmonic is LA to LV","ok":false,"why":"Semilunar: pulmonic is RV → lungs; aortic is LV → body. They close to stop backflow."},{"t":"Both sit in the vena cava before the atria","ok":false,"why":"Semilunar: pulmonic is RV → lungs; aortic is LV → body. They close to stop backflow."}]},{"ch":"sound","q":"The lub-dub you hear is what, in this recap?","opts":[{"t":"The ventricles squeezing, not the valves","ok":false,"why":"Lub-dub is valves snapping shut each cycle. They open for forward flow and close to stop backflow."},{"t":"Valves snapping shut each cycle","ok":true,"why":"Lub-dub is valves snapping shut each cycle. They open for forward flow and close to stop backflow."},{"t":"Air moving at the alveoli only","ok":false,"why":"Lub-dub is valves snapping shut each cycle. They open for forward flow and close to stop backflow."},{"t":"The brain firing every single beat","ok":false,"why":"Lub-dub is valves snapping shut each cycle. They open for forward flow and close to stop backflow."}]},{"ch":"mvp","q":"Mitral valve prolapse as this recap named it?","opts":[{"t":"The aortic valve never opens toward the body","ok":false,"why":"The mitral valve does not close correctly and can let some blood backflow during contraction."},{"t":"The valve does not close right and can leak backward during squeeze","ok":true,"why":"The mitral valve does not close correctly and can let some blood backflow during contraction."},{"t":"The tricuspid is missing so SVC blood pools in the legs","ok":false,"why":"The mitral valve does not close correctly and can let some blood backflow during contraction."},{"t":"Pulmonary arteries start carrying oxygenated blood","ok":false,"why":"The mitral valve does not close correctly and can let some blood backflow during contraction."}]},{"ch":"elec","q":"Unconscious on the floor. Why is that not automatically cardiac arrest?","opts":[{"t":"Every beat still needs a brain signal or the heart stops","ok":false,"why":"Cardiac muscle can fire its own impulses. The brain can speed or slow the rate, but each beat does not require the brain."},{"t":"The heart can keep beating on its own — the brain only speeds or slows it","ok":true,"why":"Cardiac muscle can fire its own impulses. The brain can speed or slow the rate, but each beat does not require the brain."},{"t":"Unconscious always means the left ventricle has failed","ok":false,"why":"Cardiac muscle can fire its own impulses. The brain can speed or slow the rate, but each beat does not require the brain."},{"t":"You must assume no stroke volume until they speak","ok":false,"why":"Cardiac muscle can fire its own impulses. The brain can speed or slow the rate, but each beat does not require the brain."}]},{"ch":"gas","q":"Two places you have to think about gas exchange?","opts":[{"t":"Only inside the right atrium and the aorta","ok":false,"why":"Lungs: blood ↔ alveoli (O₂ in, CO₂ out). Tissues: blood ↔ cells (O₂ in, CO₂ out as waste)."},{"t":"Lungs (blood ↔ alveoli) and tissues (blood ↔ cells)","ok":true,"why":"Lungs: blood ↔ alveoli (O₂ in, CO₂ out). Tissues: blood ↔ cells (O₂ in, CO₂ out as waste)."},{"t":"Only at the tricuspid and mitral doors","ok":false,"why":"Lungs: blood ↔ alveoli (O₂ in, CO₂ out). Tissues: blood ↔ cells (O₂ in, CO₂ out as waste)."},{"t":"SVC and IVC before they reach the heart","ok":false,"why":"Lungs: blood ↔ alveoli (O₂ in, CO₂ out). Tissues: blood ↔ cells (O₂ in, CO₂ out as waste)."}]},{"ch":"hr","q":"Adult resting rate from this recap, and the two labels?","opts":[{"t":"40–50; over 50 is ard during squeeze","ok":true,"why":"The mitral valve does not close correctly and can let some blood backflow during contraction."},{"t":"The tricuspid is missing so SVC blood pools in the legs","ok":false,"why":"The mitral valve does not close correctly and can let some blood backflow during contraction."},{"t":"Pulmonary arteries start carrying oxygenated blood","ok":false,"why":"The mitral valve does not close correctly and can let some blood backflow during contraction."}]},{"ch":"elec","q":"Unconscious on the floor. Why is that not automatically cardiac arrest?","opts":[{"t":"Every beat still needs a brain signal or the heart stops","ok":false,"why":"Cardiac muscle can fire its own impulses. The brain can speed or slow the rate, but each beat does not require the brain."},{"t":"The heart can keep beating on its own \u2014 the brain only speeds or slows it","ok":true,"why":"Cardiac muscle can fire its own impulses. The brain can speed or slow the rate, but each beat does not require the brain."},{"t":"Unconscious always means the left ventricle has failed","ok":false,"why":"Cardiac muscle can fire its own impulses. The brain can speed or slow the rate, but each beat does not require the brain."},{"t":"You must assume no stroke volume until they speak","ok":false,"why":"Cardiac muscle can fire its own impulses. The brain can speed or slow the rate, but each beat does not require the brain."}]},{"ch":"gas","q":"Two places you have to think about gas exchange?","opts":[{"t":"Only inside the right atrium and the aorta","ok":false,"why":"Lungs: blood \u2194 alveoli (O\u2082 in, CO\u2082 out). Tissues: blood \u2194 cells (O\u2082 in, CO\u2082 out as waste)."},{"t":"Lungs (blood \u2194 alveoli) and tissues (blood \u2194 cells)","ok":true,"why":"Lungs: blood \u2194 alveoli (O\u2082 in, CO\u2082 out). Tissues: blood \u2194 cells (O\u2082 in, CO\u2082 out as waste)."},{"t":"Only at the tricuspid and mitral doors","ok":false,"why":"Lungs: blood \u2194 alveoli (O\u2082 in, s tidal volume \u00d7 rate \u2014 same shape as SV and CO."},{"t":"Tidal volume is air per breath; minute volume is that times the rate","ok":true,"why":"Tidal volume is air per breath; minute volume is tidal volume \u00d7 rate \u2014 same shape as SV and CO."},{"t":"Crackles equal minute volume; wheezes equal stroke volume","ok":false,"why":"Tidal volume is air per breath; minute volume is that times the rate \u2014 same shape as SV and CO."},{"t":"There is no breathing comparison in this recap","ok":false,"why":"Tidal volume is air per breath; minute volume is that times the rate \u2014 same shape as SV and CO."}]},{"ch":"fast","q":"Rate is very high. What can happen to filling and output?","opts":[{"t":"Stroke volume always rises, so output is safer","ok":false,"why":"A very high HR can drop SV because there is less filling time \u2014 cardiac output can still fall."},{"t":"Stroke volume can fall (less fill time) and output can drop","ok":true,"why":"A very high HR can drop SV because there is less filling time \u2014 cardiac output can still fall."},{"t":"Only the right ventricle thickens in that minute","ok":false,"why":"A very high HR can drop SV because there is less filling time \u2014 cardiac output can still fall."},{"t":"Pulmonary veins reverse and feed the IVC","ok":false,"why":"A very high HR can drop SV because there is less filling time \u2014 cardiac output can still fall."}]},{"ch":"poor","q":"You think cardiac output is poor. Which cluster matches this recap?","opts":[{"t":"Warm dry skin, strong pulses, normal mental status","ok":false,"why":"Poor CO: altered mental status, weak or absent peripheral pulses, cool pale clammy skin, low BP \u2014 especially with tachycardia."},{"t":"Altered mind, weak pulses, cool pale clammy skin, low BP","ok":true,"why":"Poor CO: altered mental status, weak or absent peripheral pulses, cool pale clammy skin, low BP \u2014 especially with tachycardia."},{"t":"Only JVD with no lung or skin change","ok":false,"why":"Poor CO: altered mental status, weak or absent peripheral pulses, cool pale clammy skin, low BP \u2014 especially with tachycardia."},{"t":"Sat 99% and they look fine, so output is proven","ok":false,"why":"Poor CO: altered mental status, weak or absent peripheral pulses, cool pale clammy skin, low BP \u2014 especially with tachycardia."}]},{"ch":"fluid","q":"History of bleeding or vomiting or diarrhea. Which signs fit low fluid here?","opts":[{"t":"Slow rate, hot flushed skin, bounding pulses","ok":false,"why":"Hypovolemia clues: tachycardia, low BP, cool pale clammy, thirst, weakness, dizziness."},{"t":"Fast rate, low BP, cool pale clammy, thirst and dizziness","ok":true,"why":"Hypovolemia clues: tachycardia, low BP, cool pale clammy, thirst, weakness, dizziness."},{"t":"Crackles and a left-fail CHF picture only","ok":false,"why":"Hypovolemia clues: tachycardia, low BP, cool pale clammy, thirst, weakness, dizziness."},{"t":"JVD and weight gain as the first fluid-loss signs","ok":false,"why":"Hypovolemia clues: tachycardia, low BP, cool pale clammy, thirst, weakness, dizziness."}]},{"ch":"lungs","q":"You are checking the lung side of this recap. Left heart fail makes you think what?","opts":[{"t":"Empty dry lungs and a strong left wall","ok":false,"why":"Left heart failure \u2192 fluid in the lungs \u2192 crackles, SOB, possible CHF. Check rate, effort, sounds, SpO\u2082 if you have it."},{"t":"Fluid in the lungs \u2014 crackles, SOB, possible CHF","ok":true,"why":"Left heart failure \u2192 fluid in the lungs \u2192 crackles, SOB, possible CHF. Check rate, effort, sounds, SpO\u2082 if you have it."},{"t":"Only right-sided JVD with clear bases","ok":false,"why":"Left heart failure \u2192 fluid in the lungs \u2192 crackles, SOB, possible CHF. Check rate, effort, sounds, SpO\u2082 if you have it."},{"t":"Pulmonary arteries now carry oxygenated blood","ok":false,"why":"Left heart failure \u2192 fluid in the lungs \u2192 crackles, SOB, possible CHF. Check rate, effort, sounds, SpO\u2082 if you have it."}]},{"ch":"tissue","q":"Cells may not be getting O\u2082. Which tissue clues does this recap list?","opts":[{"t":"Warm pink skin and a normal mental status","ok":false,"why":"Tissue hypoxia clues: altered mental status, cyanosis (late), cool pale skin, signs of shock."},{"t":"Altered mental status, cyanosis (late), cool pale skin, shock","ok":true,"why":"Tissue hypoxia clues: altered mental status, cyanosis (late), cool pale skin, signs of shock."},{"t":"Only a missing tricuspid sound","ok":false,"why":"Tissue hypoxia clues: altered mental status, cyanosis (late), cool pale skin, signs of shock."},{"t":"Bradycardia in an athlete as the only sign","ok":false,"why":"Tissue hypoxia clues: altered mental status, cyanosis (late), cool pale skin, signs of shock."}]}];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"sys":"Three parts","fail":"Perfusion","pulm":"Pulmonary","sysl":"Systemic","chamb":"Chambers","wall":"LV wall","lfail":"Left fail","rfail":"Right fail","cava":"SVC / IVC","pa":"Pulm arteries","pv":"Pulm veins","tpma":"T\u2013P\u2013M\u2013A","av":"AV valves","sl":"Semilunar","sound":"Lub-dub","mvp":"Prolapse","elec":"Own beat","gas":"Two sites","hr":"Rate","co":"Cardiac output","twin":"Minute volume","fast":"Fill time","poor":"Poor CO","fluid":"Low fluid","lungs":"Lung backup","tissue":"Tissues"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sat 8:02 circulatory-intro recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · circulatory-intro recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
