<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Ch 26 Soft Tissue Part 1 — practice</title>
<style>
:root {
  --bg: #f4efe6; --paper: #fffdf8; --ink: #1c2430; --muted: #5a6573;
  --navy: #1e3a5f; --navy-2: #16304d; --red: #b42318; --green: #1b7a46;
  --line: #d8d0c4; --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
input[type=text] {
  width: 100%; min-height: 48px; font-size: 1.05rem; font-family: inherit;
  padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
}
input[type=text]:focus { outline: 2px solid var(--navy); border-color: var(--navy); }
input[type=text]:disabled { background: #f3f1ec; }
.check {
  width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.check:active { background: var(--navy-2); }
.check:disabled { opacity: .55; cursor: default; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.links { display:flex; flex-wrap:wrap; gap:8px; margin: 12px 0 0; }
.links a { font-size:.82rem; color:#1e3a5f; background:#e8e1d4; border-radius:999px; padding:4px 10px; text-decoration:none; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>Ch 26 Soft Tissue Part 1</h1>
  <div class="sub">Type-in · 20 from locked notes</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [{"ch":26,"q":"What does all bleeding control start with?","a":["direct pressure","direct pressure first","pressure","apply direct pressure"],"why":"All bleeding control starts with direct pressure."},{"ch":26,"q":"Direct pressure stops an arm bleed. What do you put on next?","a":["pressure dressing","a pressure dressing","pressure bandage","pressure dressing (not a tourniquet)"],"why":"Direct pressure works → pressure dressing so you can use your hand again. Not a tourniquet."},{"ch":26,"q":"Arm bleed still flowing after direct pressure. What next?","a":["tourniquet","apply a tourniquet","go to a tourniquet","tourniquet (do not stack gauze)"],"why":"Arm or leg + pressure fails → go straight to a tourniquet. Do not keep stacking gauze."},{"ch":26,"q":"Groin bleed too high for a tourniquet. What do you do?","a":["pack with clotting gauze","wound packing","pack the wound","pack with hemostatic / clotting gauze"],"why":"Groin or just inside the shoulder: cannot get a TQ above it. Pack with clotting gauze."},{"ch":26,"q":"Book placement for a limb tourniquet is how far from the wound?","a":["a couple inches proximal","couple inches closer to the body","a few inches above the wound","couple inches proximal to the hole"],"why":"Book spot: a couple inches closer to the body than the hole (proximal). High and tight is also okay."},{"ch":26,"q":"What does CAT stand for?","a":["combat application tourniquet","Combat Application Tourniquet","combat application TQ"],"why":"Most common here: CAT (combat application tourniquet)."},{"ch":26,"q":"On a CAT, when do you stop twisting the stick?","a":["when bleeding stops","until bleeding STOPS","when the bleed stops","bleeding stops (not feels tight)"],"why":"Twist until the bleeding STOPS. Not until it “feels tight.”"},{"ch":26,"q":"After locking a CAT stick in the C-clamp, what do you write?","a":["the time","time on the white strap","application time","time on white strap"],"why":"Write the time on the white strap."},{"ch":26,"q":"Major arm bleed, TQ on, bleed stopped, patient in shock. What care next?","a":["high-flow oxygen, supine, warm, rapid transport","O2, lay down, keep warm, go","high-flow O2, supine, warm, rapid transport","oxygen, supine, warm, rapid transport"],"why":"Bleed stopped + shock → high-flow oxygen, lay them down, keep warm, rapid transport."},{"ch":26,"q":"Which tourniquet type fits tiny kid arms better?","a":["elastic","elastic / stretchy band","stretchy elastic tourniquet","elastic band TQ"],"why":"Elastic / stretchy band conforms to any size. Better for small kid arms. CAT stiff plastic may not wrap a tiny arm."},{"ch":26,"q":"About how effective is the first clotting-gauze pack?","a":["about 80%","80%","~80%","80 percent"],"why":"First pack about 80% effective. Pull and pack fresh → about 90%."},{"ch":26,"q":"Dirt in an open wound. What do you do in the field?","a":["leave it","do not pick it out","leave dirt for the hospital","do not pick dirt out"],"why":"Do not pick rocks or dirt out. Leave cleanup to the hospital."},{"ch":26,"q":"Chemical still burning in a wound. What do you do now?","a":["wash it","wash it now","irrigate / wash now","wash the chemical now"],"why":"Chemical in the wound is still burning. Wash that now."},{"ch":26,"q":"What dressing goes over moist sterile gauze on exposed organs?","a":["occlusive","plastic / occlusive","occlusive dressing","plastic occlusive"],"why":"Moist sterile on the organs, then plastic / occlusive over that. Do not push guts back in."},{"ch":26,"q":"When may you remove an impaled object from the cheek or mouth?","a":["if it blocks the airway you need","blocks airway you must manage","only if it blocks the airway","cheek/mouth blocking airway"],"why":"Remove only if cheek/mouth AND it blocks the airway you need. Breathing fine → it can stay. Also remove from chest/back for CPR."},{"ch":26,"q":"Neck bleed pressure rule — how many sides?","a":["one side only","one-sided pressure","that side only","direct pressure on one side only"],"why":"Direct pressure on that side only. Never wrap around. Never squeeze both sides."},{"ch":26,"q":"What dressing do you use for an animal or human bite?","a":["dry sterile","dry sterile dressing","dry sterile cover","dry sterile dressing only"],"why":"EMT: dry sterile dressing. Just cover it. Hospital does abx/tetanus/rabies."},{"ch":26,"q":"Open/sucking chest wound — how many sides do you tape on the occlusive?","a":["3 sides","tape 3 sides","three sides","3"],"why":"Tape 3 sides so extra air can vent out. Which open side does not really matter."},{"ch":26,"q":"Belly crush with the weight about to come off. What do you do?","a":["call medical control and go to hospital","medical control + hospital","call med control; transport","medical control and rapid transport"],"why":"Belly crush: no TQ option. When weight comes off, next minutes can go bad. Call medical control. Get them to the hospital."},{"ch":26,"q":"First CAT step before twisting the stick?","a":["Velcro the strap tight","Velcro tight first","strap Velcro down tight","tighten Velcro strap first"],"why":"Velcro the strap down tight first. That alone already slows a lot of flow. A loose gap cannot be fixed by twisting."}];
const LINKS = "<a href=\"emt-quiz-index.html\">Hub</a><a href=\"ch26-soft-tissue-part1-key.html\">Key</a><a href=\"ch26-soft-tissue-part1-detailed.html\">Detailed</a>";

function norm(s) { return String(s).trim().toLowerCase(); }
function acceptList(item) {
  if (Array.isArray(item.a)) return item.a.map(String);
  if (item.a == null) return [];
  return [String(item.a)];
}
function isRight(item, typed) {
  const n = norm(typed);
  if (!n) return false;
  return acceptList(item).some(function (a) { return norm(a) === n; });
}

let i = 0, correct = 0, answered = 0, locked = false;
const main = document.getElementById("main");
const nextBtn = document.getElementById("nextBtn");
const scoreEl = document.getElementById("score");
const progLabel = document.getElementById("progLabel");
const progBar = document.getElementById("progBar");

function setProg() {
  scoreEl.textContent = correct + " / " + answered;
  progLabel.textContent = i < BANK.length ? ("Question " + (i + 1) + " of " + BANK.length) : "Done";
  progBar.style.width = (Math.min(i, BANK.length) / BANK.length * 100) + "%";
}

function renderEnd() {
  nextBtn.classList.remove("visible");
  const pct = BANK.length ? Math.round(correct / BANK.length * 100) : 0;
  main.innerHTML = '<div class="card end"><h2>Done</h2><div class="big">' + correct + " / " + BANK.length + '</div><p class="pct">' + pct + '% first-check correct</p><div class="links">' + LINKS + '</div><button type="button" class="check restart" id="restart">Again</button></div>';
  document.getElementById("restart").onclick = function () {
    i = 0; correct = 0; answered = 0; locked = false; renderQ();
  };
}

function renderQ() {
  if (i >= BANK.length) { setProg(); renderEnd(); return; }
  locked = false;
  nextBtn.classList.remove("visible");
  const item = BANK[i];
  setProg();
  main.innerHTML = '<div class="card"><p class="qtext"></p><input type="text" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button type="button" class="check" id="check">Check</button><div class="why" id="why"></div></div>';
  main.querySelector(".qtext").textContent = item.q;
  const input = document.getElementById("ans");
  const check = document.getElementById("check");
  const why = document.getElementById("why");
  input.focus();

  function submit() {
    if (locked) return;
    const typed = input.value;
    if (!norm(typed)) { input.focus(); return; }
    locked = true;
    answered += 1;
    const ok = isRight(item, typed);
    if (ok) correct += 1;
    input.disabled = true;
    check.disabled = true;
    why.classList.add("visible");
    why.innerHTML = "";
    const v = document.createElement("div");
    v.className = "verdict " + (ok ? "ok" : "bad");
    v.textContent = ok ? "Correct" : "Not quite";
    const w = document.createElement("div");
    w.textContent = item.why;
    why.appendChild(v);
    why.appendChild(w);
    setProg();
    nextBtn.textContent = i === BANK.length - 1 ? "Finish" : "Next";
    nextBtn.classList.add("visible");
  }
  check.onclick = submit;
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
  });
}

nextBtn.onclick = function () {
  if (!locked) return;
  i += 1;
  renderQ();
};

renderQ();
</script>
</body>
</html>
