<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Ch 21 Allergy &amp; Anaphylaxis — practice</title>
<style>
:root {
  --bg: #f4efe6; --paper: #fffdf8; --ink: #1c2430; --muted: #5a6573;
  --navy: #1e3a5f; --navy-2: #16304d; --red: #b42318; --green: #1b7a46;
  --line: #d8d0c4; --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
input[type=text] {
  width: 100%; min-height: 48px; font-size: 1.05rem; font-family: inherit;
  padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
}
input[type=text]:focus { outline: 2px solid var(--navy); border-color: var(--navy); }
input[type=text]:disabled { background: #f3f1ec; }
.check {
  width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.check:active { background: var(--navy-2); }
.check:disabled { opacity: .55; cursor: default; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.links { display:flex; flex-wrap:wrap; gap:8px; margin: 12px 0 0; }
.links a { font-size:.82rem; color:#1e3a5f; background:#e8e1d4; border-radius:999px; padding:4px 10px; text-decoration:none; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>Ch 21 Allergy &amp; Anaphylaxis</h1>
  <div class="sub">Type-in · 20 from locked notes</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [{"ch":21,"q":"Skin only: itch, hives, or rash. Do you give epinephrine (Epi)?","a":["no","no epi","do not give epi","no epinephrine"],"why":"Mild allergic reaction is one system, usually skin only. No Epi."},{"ch":21,"q":"Skin plus breathing trouble, or skin plus adult systolic blood pressure (SBP) under what number, is anaphylaxis?","a":["90","under 90","SBP under 90","90 mmHg"],"why":"Anaphylaxis is skin plus a breathing problem or adult SBP under 90. Give Epi."},{"ch":21,"q":"Besides breathing trouble or low blood pressure, the book also counts which gut findings as a second system?","a":["nausea/vomiting","nausea or vomiting","nausea and vomiting","nausea"],"why":"The book also counts nausea or vomiting as a second system. Breathing trouble or low pressure is the usual pair with skin."},{"ch":21,"q":"What does pruritus mean?","a":["itching","itch","it means itching"],"why":"Pruritus is itching."},{"ch":21,"q":"What does urticaria mean?","a":["hives","hives (many raised itchy bumps)","many hives"],"why":"Urticaria is hives. Many raised itchy bumps."},{"ch":21,"q":"What is one single hive-like bump called?","a":["wheal","a wheal"],"why":"A wheal is one single bump, like a mosquito bite."},{"ch":21,"q":"High whistle, usually on inhale, upper airway, heard without a stethoscope. What sound is that?","a":["stridor"],"why":"Stridor is a high whistle, usually on inhale. Upper airway. Heard without a stethoscope."},{"ch":21,"q":"High whistle, usually on exhale, lower airway, heard with a stethoscope. What sound is that?","a":["wheeze","wheezing"],"why":"Wheezing is a high whistle, usually on exhale. Lower airway. Heard with a stethoscope."},{"ch":21,"q":"First exposure to an allergen usually does what to the body?","a":["sensitizes","sensitize","teaches the body","sensitizes the body"],"why":"The body must be sensitized first. First exposure usually just teaches the body. Later exposure can cause the big reaction."},{"ch":21,"q":"Epinephrine (Epi) stops more histamine release. Does it wipe out histamine already in the blood?","a":["no","no it does not","does not wipe existing","it does not"],"why":"Epi stops the body from making more histamine. It does not wipe out histamine already in the blood."},{"ch":21,"q":"Anaphylactic shock is what kind of shock?","a":["distributive","pipe","distributive shock","pipe problem"],"why":"Pipe problem = distributive shock. Same group as septic and neurogenic."},{"ch":21,"q":"They are short of breath and in shock. How do you position them?","a":["supine","lay them down","flat","supine (shock wins)"],"why":"Hard to breathe only → High Fowler. Shock → supine. Both → shock wins. Lay them down."},{"ch":21,"q":"What comes before epinephrine (Epi) on the treatment order?","a":["ABCs","oxygen","ABCs / oxygen","oxygen / ABCs"],"why":"Airway, breathing, and circulation (ABCs) come first. Give oxygen before Epi."},{"ch":21,"q":"Adult epinephrine (Epi) auto-injector dose and route?","a":["0.3 mg IM","0.3 mg intramuscular","0.3 IM"],"why":"Adult dose is 0.3 mg intramuscular (IM) auto-injector."},{"ch":21,"q":"Child epinephrine (Epi) auto-injector dose and route?","a":["0.15 mg IM","0.15 mg intramuscular","0.15 IM"],"why":"Child dose is 0.15 mg intramuscular (IM) auto-injector."},{"ch":21,"q":"Who do you call for permission to give epinephrine (Epi) or to repeat it?","a":["medical control","med control","the doctor","medical control / the doctor"],"why":"Call medical control to give Epi and to repeat it."},{"ch":21,"q":"A stinger is still in the skin. How do you take it out?","a":["scrape with a credit card","scrape","credit card","scrape it out with a credit card"],"why":"Scrape it out with a credit card. Do not use tweezers. Tweezers squeeze more venom in."},{"ch":21,"q":"How long can a honeybee stinger keep pumping venom?","a":["20 minutes","about 20 minutes","20 min","~20 minutes"],"why":"A honeybee cannot pull the stinger out. It can keep pumping venom for about 20 minutes."},{"ch":21,"q":"More than two-thirds of anaphylaxis deaths happen in the first how many minutes?","a":["30","30 minutes","first 30 minutes","30 min"],"why":"More than two-thirds of anaphylaxis deaths happen in the first 30 minutes."},{"ch":21,"q":"What is the most common drug allergy worldwide?","a":["penicillin"],"why":"Penicillin is the most common drug allergy worldwide."}];
const LINKS = "<a href=\"emt-quiz-index.html\">Hub</a><a href=\"ch21-allergy-anaphylaxis-key.html\">Key</a><a href=\"ch21-allergy-anaphylaxis-detailed.html\">Detailed</a>";

function norm(s) { return String(s).trim().toLowerCase(); }
function acceptList(item) {
  if (Array.isArray(item.a)) return item.a.map(String);
  if (item.a == null) return [];
  return [String(item.a)];
}
function isRight(item, typed) {
  const n = norm(typed);
  if (!n) return false;
  return acceptList(item).some(function (a) { return norm(a) === n; });
}

let i = 0, correct = 0, answered = 0, locked = false;
const main = document.getElementById("main");
const nextBtn = document.getElementById("nextBtn");
const scoreEl = document.getElementById("score");
const progLabel = document.getElementById("progLabel");
const progBar = document.getElementById("progBar");

function setProg() {
  scoreEl.textContent = correct + " / " + answered;
  progLabel.textContent = i < BANK.length ? ("Question " + (i + 1) + " of " + BANK.length) : "Done";
  progBar.style.width = (Math.min(i, BANK.length) / BANK.length * 100) + "%";
}

function renderEnd() {
  nextBtn.classList.remove("visible");
  const pct = BANK.length ? Math.round(correct / BANK.length * 100) : 0;
  main.innerHTML = '<div class="card end"><h2>Done</h2><div class="big">' + correct + " / " + BANK.length + '</div><p class="pct">' + pct + '% first-check correct</p><div class="links">' + LINKS + '</div><button type="button" class="check restart" id="restart">Again</button></div>';
  document.getElementById("restart").onclick = function () {
    i = 0; correct = 0; answered = 0; locked = false; renderQ();
  };
}

function renderQ() {
  if (i >= BANK.length) { setProg(); renderEnd(); return; }
  locked = false;
  nextBtn.classList.remove("visible");
  const item = BANK[i];
  setProg();
  main.innerHTML = '<div class="card"><p class="qtext"></p><input type="text" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button type="button" class="check" id="check">Check</button><div class="why" id="why"></div></div>';
  main.querySelector(".qtext").textContent = item.q;
  const input = document.getElementById("ans");
  const check = document.getElementById("check");
  const why = document.getElementById("why");
  input.focus();

  function submit() {
    if (locked) return;
    const typed = input.value;
    if (!norm(typed)) { input.focus(); return; }
    locked = true;
    answered += 1;
    const ok = isRight(item, typed);
    if (ok) correct += 1;
    input.disabled = true;
    check.disabled = true;
    why.classList.add("visible");
    why.innerHTML = "";
    const v = document.createElement("div");
    v.className = "verdict " + (ok ? "ok" : "bad");
    v.textContent = ok ? "Correct" : "Not quite";
    const w = document.createElement("div");
    w.textContent = item.why;
    why.appendChild(v);
    why.appendChild(w);
    setProg();
    nextBtn.textContent = i === BANK.length - 1 ? "Finish" : "Next";
    nextBtn.classList.add("visible");
  }
  check.onclick = submit;
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
  });
}

nextBtn.onclick = function () {
  if (!locked) return;
  i += 1;
  renderQ();
};

renderQ();
</script>
</body>
</html>
