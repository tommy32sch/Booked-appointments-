<head>

<title>Quiz 4 — Weekend 50-question quiz</title>
<style>
:root {

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);

body { min-height: 100dvh; padding-bottom: calc(96px + var(--safe-b)); }
header {

  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; font-weight: 400; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.score, .clock {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.clock.warn { background: #b42318; }
.clock.idle { opacity: .7; font-weight: 650; }
.prog-wrap { flex: 1; min-width: 110px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }

.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }

}
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; width: 100%; text-align: left;
  min-height: 48px; padding: 12px 14px;
  font-size: 1rem; line-height: 1.35;
  border: 2px solid var(--line); border-radius: 12px;
  background: #fff; color: var(--ink);
  cursor: pointer; appearance: none;
  font-family: inherit;
}
.opt:active { transform: scale(.995); }
.opt .letter {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: #eef2f6; font-weight: 700; font-size: .85rem; margin-right: 8px; flex-shrink: 0;
}
.opt .ot { display: inline; flex: 1; }
.opt.locked { cursor: default; }
.opt.chosen { border-color: var(--navy); background: #eef3f8; }
.opt.chosen.wrong { background: var(--chosen-wrong); border-color: var(--red); }
.opt.chosen.right, .opt.show-correct { background: var(--chosen-right); border-color: var(--correct-outline); }
.opt.dim { opacity: .55; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.why .correct-line { margin-top: 8px; font-weight: 650; }
.why-tap {
  display: none; margin-top: 12px; width: 100%;
  min-height: 48px; border: 2px solid var(--navy); border-radius: 12px;
  background: #fff; color: var(--navy); font-size: 1.02rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.why-tap.visible { display: block; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.btn:active { background: var(--navy-2); }
.btn.ghost {
  background: #fff; color: var(--navy); border: 2px solid var(--navy); margin-top: 10px;

.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }

.miss h3 { margin: 0 0 10px; font-size: 1.05rem; }
.miss-item { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.miss-item .mq { font-weight: 650; margin-bottom: 6px; }
.miss-item .mwhy { font-size: .92rem; color: #333; }
.start-lead { font-size: 1.05rem; margin: 0 0 10px; }
.start-meta { color: var(--muted); margin: 0 0 16px; font-size: .95rem; }
.start-meta li { margin: 0 0 6px; }
.err { color: var(--red); font-weight: 700; }
</style>
</head>

    "answer": "B",
    "why": "BVM: 1 breath every 6 seconds (10/min); squeeze about 1 second until chest rises."

  {

  {

      "2000 PSI",

    "answer": "A",
    "why": "Full tank is about 2000 PSI; listen for a hiss from a dead brass washer leak."

  {

    "q": "When seating the regulator on an O2 tank, the first step is:",
    "choices": [
      "seat the two pins in the two holes, then screw it down at a right angle",

    "answer": "A",
    "why": "Pins go in first, then screw down; tilted means not seated."

  {

;
const LETTERS = ["A", "B", "C", "D"];
const TIME_LIMIT_MS_DEFAULT = 60 * 60 * 1000;
const TIME_LIMIT_MS = (function () {
  const n = Number(new URLSearchParams(location.search).get("ms"));
  return (Number.isFinite(n) && n > 0) ? n : TIME_LIMIT_MS_DEFAULT;
})();

let i = 0;
let correct = 0;
let answered = 0;
let picked = false;
let whyOpen = false;
let timedOut = false;
let started = false;
let deadline = 0;
let tickTimer = null;
let missed = [];
let picks = [];

function $(id) { return document.getElementById(id); }

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function formatTime(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const s = t % 60;
  const pad = function(n) { return (n < 10 ? "0" : "") + n; };
  if (h > 0) return h + ":" + pad(m) + ":" + pad(s);
  return pad(m) + ":" + pad(s);
}

function stopTick() {
  if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
}

function updateClock() {
  const el = $("clock");
  if (!started) {
    el.textContent = formatTime(TIME_LIMIT_MS);
    el.classList.add("idle");
    el.classList.remove("warn");
    return;
  }
  el.classList.remove("idle");
  const left = deadline - Date.now();
  el.textContent = formatTime(left);
  if (left <= 5 * 60 * 1000) el.classList.add("warn");
  else el.classList.remove("warn");
  if (left <= 0) timeUp();
}

function startTimer() {
  deadline = Date.now() + TIME_LIMIT_MS;
  stopTick();
  tickTimer = setInterval(updateClock, 250);
  updateClock();
}

function updateScore() {
  $("score").textContent = correct + " / " + answered;
  const n = BANK.length;
  if (!started) {
    $("progLabel").textContent = "Not started";
    $("progBar").style.width = "0%";
    return;
  }
  if (timedOut || i >= n) {
    $("progLabel").textContent = timedOut ? ("Time up · " + n + " questions") : ("Done · " + n + " questions");
    $("progBar").style.width = "100%";
    return;
  }
  $("progLabel").textContent = "Question " + (i + 1) + " of " + n;
  $("progBar").style.width = Math.round(((i + (picked ? 1 : 0)) / n) * 100) + "%";
}

function gateScreen() {
  started = false;
  timedOut = false;
  picked = false;
  whyOpen = false;
  i = 0; correct = 0; answered = 0; missed = []; picks = [];
  stopTick();
  deadline = 0;
  $("nextBtn").classList.remove("visible");
  $("nextBtn").textContent = "Next";
  if (!Array.isArray(BANK) || BANK.length !== 50) {
    $("main").innerHTML = '<div class="card"><p class="err">This page needs exactly 50 questions from quiz4-50mc.json.</p></div>';
    updateScore();
    updateClock();
    return;
  }
  $("main").innerHTML =
    '<div class="card">'
    + '<p class="start-lead">Straight 50-question multiple-choice test.</p>'
    + '<ul class="start-meta">'
    + '<li>One hour. The clock starts when you tap Begin and cannot be paused.</li>'
    + '<li>When the hour hits 0, the quiz locks and submits.</li>'
    + '<li>Pick a choice first. Correct letter and why stay hidden until then. Then tap Why.</li>'
    + '</ul>'
    + '<button type="button" class="btn visible" id="beginBtn">Begin</button>'
    + '</div>';
  $("beginBtn").addEventListener("click", begin);
  updateScore();
  updateClock();
  window.scrollTo(0, 0);
}

function begin() {
  if (started) return;
  started = true;
  timedOut = false;
  picked = false;
  whyOpen = false;
  i = 0; correct = 0; answered = 0; missed = []; picks = new Array(BANK.length).fill(null);
  startTimer();
  render();
}

function render() {
  if (timedOut) return endScreen();
  picked = false;
  whyOpen = false;
  $("nextBtn").classList.remove("visible");
  if (i >= BANK.length) { return endScreen(); }
  const q = BANK[i];
  let optsHtml = "";
  LETTERS.forEach(function(letter, idx) {
    optsHtml += '<button type="button" class="opt" data-idx="' + idx + '">'
      + '<span class="letter">' + letter + '</span>'
      + '<span class="ot"></span></button>';
  });
  $("main").innerHTML =
    '<div class="card">'
    + '<div class="ch-tag">Ch ' + q.ch + '</div>'
    + '<p class="qtext"></p>'
    + '<div class="opts">' + optsHtml + '</div>'
    + '<button type="button" class="why-tap" id="whyTap">Why</button>'
    + '<div class="why" id="whyBox"></div>'
    + '</div>';
  $("main").querySelector(".qtext").textContent = q.q;
  const buttons = $("main").querySelectorAll(".opt");
  buttons.forEach(function(btn, idx) {
    btn.querySelector(".ot").textContent = q.choices[idx];
    btn.addEventListener("click", function() { pick(idx); });
  });
  $("whyTap").addEventListener("click", showWhy);
  updateScore();
  window.scrollTo(0, 0);
}

function pick(idx) {
  if (!started || timedOut || picked) return;
  picked = true;
  const q = BANK[i];
  const letter = LETTERS[idx];
  const ok = letter === q.answer;
  answered += 1;
  if (ok) correct += 1;
  picks[i] = letter;
  if (!ok) {
    missed.push({
      ch: q.ch,
      q: q.q,
      chosen: letter + ". " + q.choices[idx],
      right: q.answer + ". " + q.choices[LETTERS.indexOf(q.answer)],
      why: q.why
    });
  }
  const buttons = $("main").querySelectorAll(".opt");
  buttons.forEach(function(btn, j) {
    btn.classList.add("locked");
    btn.disabled = true;
    if (j === idx) btn.classList.add("chosen");
  });
  $("whyTap").classList.add("visible");
  $("nextBtn").textContent = (i + 1 >= BANK.length) ? "See results" : "Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}

function showWhy() {
  if (!picked || whyOpen || timedOut) return;
  whyOpen = true;
  const q = BANK[i];
  const chosenLetter = picks[i];
  const ok = chosenLetter === q.answer;
  const buttons = $("main").querySelectorAll(".opt");
  const rightIdx = LETTERS.indexOf(q.answer);
  buttons.forEach(function(btn, j) {
    const letter = LETTERS[j];
    if (letter === chosenLetter && ok) btn.classList.add("right");
    else if (letter === chosenLetter && !ok) btn.classList.add("wrong");
    else if (letter === q.answer) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box = $("whyBox");
  const verdict = ok
    ? '<div class="verdict ok">Correct</div>'
    : '<div class="verdict bad">Incorrect</div>';
  const extra = ok ? "" :
    '<div class="correct-line">Correct: ' + escapeHtml(q.answer + ". " + q.choices[rightIdx]) + '</div>';
  box.innerHTML = verdict + '<div class="why-body"></div>' + extra;
  box.querySelector(".why-body").textContent = q.why;
  box.classList.add("visible");
  $("whyTap").classList.remove("visible");
}

function timeUp() {
  if (timedOut || !started) return;
  timedOut = true;
  stopTick();
  deadline = Date.now();
  updateClock();
  endScreen();
}

function endScreen() {
  $("nextBtn").classList.remove("visible");
  const n = BANK.length;
  const unanswered = n - answered;
  const pct = n ? Math.round((correct / n) * 100) : 0;
  let missHtml = "";
  if (missed.length === 0 && unanswered === 0) {
    missHtml = '<p>No missed questions.</p>';
  } else {
    missHtml = '<div class="miss"><h3>Missed or blank (' + (missed.length + unanswered) + ')</h3>';
    missed.forEach(function() {
      missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>';
    });
    if (unanswered) {
      missHtml += '<p>' + unanswered + ' left unanswered when time ran out or the quiz locked.</p>';
    }
    missHtml += '</div>';
  }
  const title = timedOut ? "Time is up" : "Quiz complete";
  $("main").innerHTML =
    '<div class="card end">'
    + '<h2>' + title + '</h2>'
    + '<div class="big">' + correct + ' / ' + n + '</div>'
    + '<div class="pct">' + pct + '% · 50 questions · 1 hour</div>'
    + missHtml
    + '<button type="button" class="btn visible" id="again">Back to start</button>'
    + '</div>';
  if (missed.length) {
    const items = $("main").querySelectorAll(".miss-item");
    missed.forEach(function(m, idx) {
      items[idx].querySelector(".ch-tag").textContent = "Ch " + m.ch;
      items[idx].querySelector(".mq").textContent = m.q;
      items[idx].querySelector(".mwhy").textContent =
        "You chose: " + m.chosen + " — " + m.why + "  Correct: " + m.right;
    });
  }
  $("again").addEventListener("click", gateScreen);
  updateScore();
  window.scrollTo(0, 0);
}

$("nextBtn").addEventListener("click", function() {
  if (!picked || timedOut) return;
  i += 1;
  render();
});

gateScreen();
</script>
</body>
</html>
