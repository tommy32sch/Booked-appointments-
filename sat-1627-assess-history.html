<style>

<script>
const BANK = [{"ch":"bleed","q":"You see massive external bleeding as you walk up. When do you handle it?","opts":[{"t":"Only after a full SAMPLE history","ok":false,"why":"Life-threatening external bleeding is a circulation issue, but you treat it as soon as you see it, even before airway/breathing if it is massive."},{"t":"Right away — even before airway and breathing if it is massive","ok":true,"why":"Life-threatening external bleeding is a circulation issue, but you treat it as soon as you see it, even before airway/breathing if it is massive."},{"t":"After the secondary exam, never before airway","ok":false,"why":"Life-threatening external bleeding is a circulation issue, but you treat it as soon as you see it, even before airway/breathing if it is massive."},{"t":"Only if capillary refill is under 2 seconds","ok":false,"why":"Life-threatening external bleeding is a circulation issue, but you treat it as soon as you see it, even before airway/breathing if it is massive."}]},{"ch":"art","q":"Arterial versus venous bleeding in this recap?","opts":[{"t":"Arterial is dark and steady; venous is bright and spurting","ok":false,"why":"Arterial: bright red, spurts with the heart, high pressure from the left ventricle, high oxygen. Venous: darker red, steady flow, lower oxygen, returning to the heart."},{"t":"Arterial is bright red and spurting; venous is darker and a steady flow","ok":true,"why":"Arterial: bright red, spurts with the heart, high pressure from the left ventricle, high oxygen. Venous: darker red, steady flow, lower oxygen, returning to the heart."},{"t":"Both are dark and only differ by location on the neck","ok":false,"why":"Arterial: bright red, spurts with the heart, high pressure from the left ventricle, high oxygen. Venous: darker red, steady flow, lower oxygen, returning to the heart."},{"t":"Venous spurts from the left ventricle; arterial is low pressure","ok":false,"why":"Arterial: bright red, spurts with the heart, high pressure from the left ventricle, high oxygen. Venous: darker red, steady flow, lower oxygen, returning to the heart."}]},{"ch":"tk","q":"Direct pressure fails on a major arm bleed. Your next tool here?","opts":[{"t":"A neck tourniquet, because any bleed can be tourniqueted","ok":false,"why":"Direct pressure first. If it fails on a major extremity bleed, tourniquet only on arms or legs, proximal to the wound. If pressure works, gauze plus a pressure dressing."},{"t":"Tourniquet on the arm, proximal to the wound (toward the core)","ok":true,"why":"Direct pressure first. If it fails on a major extremity bleed, tourniquet only on arms or legs, proximal to the wound. If pressure works, gauze plus a pressure dressing."},{"t":"Skip dressings and start a 20-minute OPQRST on scene","ok":false,"why":"Direct pressure first. If it fails on a major extremity bleed, tourniquet only on arms or legs, proximal to the wound. If pressure works, gauze plus a pressure dressing."},{"t":"Wait for the golden hour to finish before you touch it","ok":false,"why":"Direct pressure first. If it fails on a major extremity bleed, tourniquet only on arms or legs, proximal to the wound. If pressure works, gauze plus a pressure dressing."}]},{"ch":"core","q":"Neck or torso bleed — why no tourniquet?","opts":[{"t":"Tourniquets work better on the neck than on a thigh","ok":false,"why":"You cannot safely tourniquet the neck. Neck, shoulder/hip, and torso/core need other techniques and rapid transport."},{"t":"Tourniquets do not work on neck, shoulder/hip, or torso — other methods and a fast ride","ok":true,"why":"You cannot safely tourniquet the neck. Neck, shoulder/hip, and torso/core need other techniques and rapid transport."},{"t":"You always tourniquet the shoulder and hip first","ok":false,"why":"You cannot safely tourniquet the neck. Neck, shoulder/hip, and torso/core need other techniques and rapid transport."},{"t":"Core bleeds only need a 0–10 pain score","ok":false,"why":"You cannot safely tourniquet the neck. Neck, shoulder/hip, and torso/core need other techniques and rapid transport."}]},{"ch":"cap","q":"A child’s capillary refill is over 2 seconds. Your read?","opts":[{"t":"Normal perfusion in kids","ok":false,"why":"Capillary refill > 2 seconds in children is delayed perfusion and a sign of shock."},{"t":"Delayed perfusion — a shock sign in children","ok":true,"why":"Capillary refill > 2 seconds in children is delayed perfusion and a sign of shock."},{"t":"It only matters on stable medical calls at home","ok":false,"why":"Capillary refill > 2 seconds in children is delayed perfusion and a sign of shock."},{"t":"It proves the bleed is venous, not arterial","ok":false,"why":"Capillary refill > 2 seconds in children is delayed perfusion and a sign of shock."}]},{"ch":"pri","q":"Primary assessment order in this recap?","opts":[{"t":"SAMPLE first, then you skip airway if they look okay","ok":false,"why":"Primary is a fast life-threat check: general impression, LOC (AVPU), airway, breathing, circulation, rapid body scan for major trauma, then high vs low priority."},{"t":"Impression → AVPU → airway → breathing → circulation → rapid scan if trauma → transport decision","ok":true,"why":"Primary is a fast life-threat check: general impression, LOC (AVPU), airway, breathing, circulation, rapid body scan for major trauma, then high vs low priority."},{"t":"Rapid scan on every home chest-pain call, then AVPU last","ok":false,"why":"Primary is a fast life-threat check: general impression, LOC (AVPU), airway, breathing, circulation, rapid body scan for major trauma, then high vs low priority."},{"t":"Transport decision, then you finally form a general impression","ok":false,"why":"Primary is a fast life-threat check: general impression, LOC (AVPU), airway, breathing, circulation, rapid body scan for major trauma, then high vs low priority."}]},{"ch":"scan","q":"When do you do the ~60-second “trauma naked” rapid scan?","opts":[{"t":"On every stable, awake medical patient at home","ok":false,"why":"Critical/major trauma gets a quick 60-second head-to-toe, often “trauma naked” with shears, to find extra gunshots, exit wounds, or missed major bleeding. Not routine on a stable non-trauma chest-pain call."},{"t":"Critical / major trauma — expose and hunt missed wounds and bleeding","ok":true,"why":"Critical/major trauma gets a quick 60-second head-to-toe, often “trauma naked” with shears, to find extra gunshots, exit wounds, or missed major bleeding. Not routine on a stable non-trauma chest-pain call."},{"t":"Only after surgery, never on scene","ok":false,"why":"Critical/major trauma gets a quick 60-second head-to-toe, often “trauma naked” with shears, to find extra gunshots, exit wounds, or missed major bleeding. Not routine on a stable non-trauma chest-pain call."},{"t":"Instead of controlling a massive bleed","ok":false,"why":"Critical/major trauma gets a quick 60-second head-to-toe, often “trauma naked” with shears, to find extra gunshots, exit wounds, or missed major bleeding. Not routine on a stable non-trauma chest-pain call."}]},{"ch":"high","q":"Which single finding already makes them high priority / load and go?","opts":[{"t":"Belly pain for a month with good ABCs","ok":false,"why":"High priority if ANY: altered mental status, airway problems, breathing problems, major bleed, shock, serious chest pain (e.g. ACS), complicated childbirth, or another time-sensitive life threat."},{"t":"Altered mental status — or any airway, breathing, major bleed, shock, ACS-type chest pain, or complicated birth","ok":true,"why":"High priority if ANY: altered mental status, airway problems, breathing problems, major bleed, shock, serious chest pain (e.g. ACS), complicated childbirth, or another time-sensitive life threat."},{"t":"A full SAMPLE you finished on scene","ok":false,"why":"High priority if ANY: altered mental status, airway problems, breathing problems, major bleed, shock, serious chest pain (e.g. ACS), complicated childbirth, or another time-sensitive life threat."},{"t":"They are stable and you want more history first","ok":false,"why":"High priority if ANY: altered mental status, airway problems, breathing problems, major bleed, shock, serious chest pain (e.g. ACS), complicated childbirth, or another time-sensitive life threat."}]},{"ch":"low","q":"Stable ABCs and belly pain for a month. Priority mindset?","opts":[{"t":"Load and go — every belly pain is platinum 10","ok":false,"why":"Low priority if they are stable, ABCs look good, and the complaint is not time-critical. You can safely spend more time on scene. High priority = treat en route."},{"t":"Low priority / stay and play — you can gather more assessment and history on scene","ok":true,"why":"Low priority if they are stable, ABCs look good, and the complaint is not time-critical. You can safely spend more time on scene. High priority = treat en route."},{"t":"Skip history forever because they are low priority","ok":false,"why":"Low priority if they are stable, ABCs look good, and the complaint is not time-critical. You can safely spend more time on scene. High priority = treat en route."},{"t":"Fly them because L.A. traffic is always the rule","ok":false,"why":"Low priority if they are stable, ABCs look good, and the complaint is not time-critical. You can safely spend more time on scene. High priority = treat en route."}]},{"ch":"gold","q":"Golden hour — what clock is it?","opts":[{"t":"Only the time from dispatch to your arrival on scene","ok":false,"why":"For critical trauma, the golden hour is injury to arrival at definitive care (surgery). Under 1 hour improves survival. After about an hour of shock: kidney failure, hypothermia, acidosis, and more."},{"t":"Injury → arrival at definitive care (surgery), aim under 1 hour","ok":true,"why":"For critical trauma, the golden hour is injury to arrival at definitive care (surgery). Under 1 hour improves survival. After about an hour of shock: kidney failure, hypothermia, acidosis, and more."},{"t":"How long you may chat before you start OPQRST","ok":false,"why":"For critical trauma, the golden hour is injury to arrival at definitive care (surgery). Under 1 hour improves survival. After about an hour of shock: kidney failure, hypothermia, acidosis, and more."},{"t":"Platinum 10 plus a full secondary on scene","ok":false,"why":"For critical trauma, the golden hour is injury to arrival at definitive care (surgery). Under 1 hour improves survival. After about an hour of shock: kidney failure, hypothermia, acidosis, and more."}]},{"ch":"plat","q":"Platinum 10 minutes — what window, and what do you do in it?","opts":[{"t":"Hospital door to surgery, and you finish SAMPLE first","ok":false,"why":"From arrival on scene to driving away should be ≤ 10 minutes for critical trauma. Only the most critical ABC interventions, quick primary, rapid scan, package (backboard if needed), then go. Detail work is en route."},{"t":"Arrive on scene → start driving, ≤ 10 minutes — only critical ABC saves, then go","ok":true,"why":"From arrival on scene to driving away should be ≤ 10 minutes for critical trauma. Only the most critical ABC interventions, quick primary, rapid scan, package (backboard if needed), then go. Detail work is en route."},{"t":"A 10-minute pain scale only, no packaging","ok":false,"why":"From arrival on scene to driving away should be ≤ 10 minutes for critical trauma. Only the most critical ABC interventions, quick primary, rapid scan, package (backboard if needed), then go. Detail work is en route."},{"t":"You stay on scene for IVs and a full secondary before you drive","ok":false,"why":"From arrival on scene to driving away should be ≤ 10 minutes for critical trauma. Only the most critical ABC interventions, quick primary, rapid scan, package (backboard if needed), then go. Detail work is en route."}]},{"ch":"fly","q":"Why might you fly a critical trauma patient in this recap?","opts":[{"t":"Distance is the only number that matters","ok":false,"why":"Transport decisions use time, not just distance. L.A. often lands a helicopter because traffic makes the drive too slow. Fly if ground transport would blow the golden hour."},{"t":"Ground time (traffic, not just miles) would push them past the golden hour","ok":true,"why":"Transport decisions use time, not just distance. L.A. often lands a helicopter because traffic makes the drive too slow. Fly if ground transport would blow the golden hour."},{"t":"Always fly stable month-long belly pain","ok":false,"why":"Transport decisions use time, not just distance. L.A. often lands a helicopter because traffic makes the drive too slow. Fly if ground transport would blow the golden hour."},{"t":"Helicopters replace the need for bleeding control","ok":false,"why":"Transport decisions use time, not just distance. L.A. often lands a helicopter because traffic makes the drive too slow. Fly if ground transport would blow the golden hour."}]},{"ch":"hist","q":"When can you take a history?","opts":[{"t":"Only on scene, never in the truck","ok":false,"why":"History is flexible and depends on severity. It can be on scene, en route, or skipped if you are overwhelmed by life threats."},{"t":"On scene, en route, or not at all if life threats own the clock","ok":true,"why":"History is flexible and depends on severity. It can be on scene, en route, or skipped if you are overwhelmed by life threats."},{"t":"You must finish SAMPLE before you stop a massive bleed","ok":false,"why":"History is flexible and depends on severity. It can be on scene, en route, or skipped if you are overwhelmed by life threats."},{"t":"Only after the golden hour ends","ok":false,"why":"History is flexible and depends on severity. It can be on scene, en route, or skipped if you are overwhelmed by life threats."}]},{"ch":"talk","q":"How do you start talking to them here?","opts":[{"t":"Lead with “Is it crushing pain?” as the first words","ok":false,"why":"Use a professional tone and a formal / last name at first. Start open-ended. Use closed yes/no questions if they are uncooperative so you still get something."},{"t":"Formal name first, then an open-ended “What’s going on today?”","ok":true,"why":"Use a professional tone and a formal / last name at first. Start open-ended. Use closed yes/no questions if they are uncooperative so you still get something."},{"t":"Nicknames only — never a last name","ok":false,"why":"Use a professional tone and a formal / last name at first. Start open-ended. Use closed yes/no questions if they are uncooperative so you still get something."},{"t":"Closed questions only, never an open question","ok":false,"why":"Use a professional tone and a formal / last name at first. Start open-ended. Use closed yes/no questions if they are uncooperative so you still get something."}]},{"ch":"unr","q":"They are unresponsive and you have no history. Next?","opts":[{"t":"Invent a SAMPLE so the chart looks full","ok":false,"why":"Hunt family, bystanders, medical-alert jewelry, wallet/purse lists, phone emergency info. If there is truly no info, document no history and go to secondary. The hospital rules things out the same way."},{"t":"Document no history and move into secondary assessment","ok":true,"why":"Hunt family, bystanders, medical-alert jewelry, wallet/purse lists, phone emergency info. If there is truly no info, document no history and go to secondary. The hospital rules things out the same way."},{"t":"Stay on scene until family writes a novel","ok":false,"why":"Hunt family, bystanders, medical-alert jewelry, wallet/purse lists, phone emergency info. If there is truly no info, document no history and go to secondary. The hospital rules things out the same way."},{"t":"Skip secondary because there is nothing to document","ok":false,"why":"Hunt family, bystanders, medical-alert jewelry, wallet/purse lists, phone emergency info. If there is truly no info, document no history and go to secondary. The hospital rules things out the same way."}]},{"ch":"ot","q":"Onset versus timing in OPQRST?","opts":[{"t":"They are the same question asked twice","ok":false,"why":"Onset is activity at the start (rest vs exertion, after a cough). Timing is duration. Two weeks of pain is unlikely to be a heart attack or acute allergy; sudden pain 10 minutes ago is more concerning."},{"t":"Onset = what they were doing when it started; timing = how long it has lasted","ok":true,"why":"Onset is activity at the start (rest vs exertion, after a cough). Timing is duration. Two weeks of pain is unlikely to be a heart attack or acute allergy; sudden pain 10 minutes ago is more concerning."},{"t":"Timing is what they were doing; onset is the 0–10 number","ok":false,"why":"Onset is activity at the start (rest vs exertion, after a cough). Timing is duration. Two weeks of pain is unlikely to be a heart attack or acute allergy; sudden pain 10 minutes ago is more concerning."},{"t":"Onset is only radiation to the jaw","ok":false,"why":"Onset is activity at the start (rest vs exertion, after a cough). Timing is duration. Two weeks of pain is unlikely to be a heart attack or acute allergy; sudden pain 10 minutes ago is more concerning."}]},{"ch":"qual","q":"Quality of pain — what does this recap want you to do?","opts":[{"t":"Say “Is it a crushing pain?” so they pick your word","ok":false,"why":"Let them describe it. Crushing/squeezing pressure is classic for a heart attack. Sharp/stabbing/tearing can suggest lung, PE, or aorta. Do not lead. If they struggle, offer many descriptors at once."},{"t":"Let them choose words; offer many options at once if they stall","ok":true,"why":"Let them describe it. Crushing/squeezing pressure is classic for a heart attack. Sharp/stabbing/tearing can suggest lung, PE, or aorta. Do not lead. If they struggle, offer many descriptors at once."},{"t":"Skip quality if they have shortness of breath","ok":false,"why":"Let them describe it. Crushing/squeezing pressure is classic for a heart attack. Sharp/stabbing/tearing can suggest lung, PE, or aorta. Do not lead. If they struggle, offer many descriptors at once."},{"t":"Only write “pain” with no description","ok":false,"why":"Let them describe it. Crushing/squeezing pressure is classic for a heart attack. Sharp/stabbing/tearing can suggest lung, PE, or aorta. Do not lead. If they struggle, offer many descriptors at once."}]},{"ch":"rad","q":"Radiation patterns from this recap?","opts":[{"t":"Heart pain never leaves the chest; gallbladder only goes left","ok":false,"why":"Heart attack: pain can radiate to arm, neck, jaw, or upper back. Gallbladder: RUQ abdomen to right shoulder/blade. Pancreas: epigastric to the back."},{"t":"Heart can go to arm, neck, jaw, or upper back; gallbladder RUQ to right shoulder; pancreas epigastric to the back","ok":true,"why":"Heart attack: pain can radiate to arm, neck, jaw, or upper back. Gallbladder: RUQ abdomen to right shoulder/blade. Pancreas: epigastric to the back."},{"t":"Pancreas stays in the RLQ and never goes posterior","ok":false,"why":"Heart attack: pain can radiate to arm, neck, jaw, or upper back. Gallbladder: RUQ abdomen to right shoulder/blade. Pancreas: epigastric to the back."},{"t":"Radiation is the same as last oral intake","ok":false,"why":"Heart attack: pain can radiate to arm, neck, jaw, or upper back. Gallbladder: RUQ abdomen to right shoulder/blade. Pancreas: epigastric to the back."}]},{"ch":"sev","q":"They start at 10/10 pain and are 4/10 after treatment. What matters?","opts":[{"t":"Only the first number — 10 means you ignore the rest","ok":false,"why":"The absolute 0–10 number is less important than the trend. 10/10 that becomes 4/10 after treatment means improving."},{"t":"The change over time — they are improving","ok":true,"why":"The absolute 0–10 number is less important than the trend. 10/10 that becomes 4/10 after treatment means improving."},{"t":"Severity is the same as onset activity","ok":false,"why":"The absolute 0–10 number is less important than the trend. 10/10 that becomes 4/10 after treatment means improving."},{"t":"You never rescore pain after treatment","ok":false,"why":"The absolute 0–10 number is less important than the trend. 10/10 that becomes 4/10 after treatment means improving."}]},{"ch":"neg","q":"What is a pertinent negative here?","opts":[{"t":"A vital sign you forgot to take","ok":false,"why":"Pertinent negatives are symptoms you would expect that they deny. Examples: difficulty breathing but denies chest pain; abdominal pain but denies nausea/vomiting/diarrhea."},{"t":"An expected symptom they do not have — short of breath but no chest pain","ok":true,"why":"Pertinent negatives are symptoms you would expect that they deny. Examples: difficulty breathing but denies chest pain; abdominal pain but denies nausea/vomiting/diarrhea."},{"t":"A tourniquet you put on the neck","ok":false,"why":"Pertinent negatives are symptoms you would expect that they deny. Examples: difficulty breathing but denies chest pain; abdominal pain but denies nausea/vomiting/diarrhea."},{"t":"The platinum 10 clock by itself","ok":false,"why":"Pertinent negatives are symptoms you would expect that they deny. Examples: difficulty breathing but denies chest pain; abdominal pain but denies nausea/vomiting/diarrhea."}]},{"ch":"ssx","q":"SAMPLE “S” — signs versus symptoms?","opts":[{"t":"Signs are only what they report; symptoms are only your BP cuff","ok":false,"why":"Signs: what you observe (vitals, mental status, skin). Symptoms: what the patient reports (squeezing chest pain into the left arm). Ask if anything else is bothering them."},{"t":"Signs are what you observe; symptoms are what they report","ok":true,"why":"Signs: what you observe (vitals, mental status, skin). Symptoms: what the patient reports (squeezing chest pain into the left arm). Ask if anything else is bothering them."},{"t":"Both words mean the same as timing","ok":false,"why":"Signs: what you observe (vitals, mental status, skin). Symptoms: what the patient reports (squeezing chest pain in function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"bleed": "Massive bleed", "art": "Arterial / venous", "tk": "Tourniquet", "core": "Core bleed", "cap": "Cap refill", "pri": "Primary order", "scan": "Rapid scan", "high": "High priority", "low": "Low priority", "gold": "Golden hour", "plat": "Platinum 10", "fly": "Time vs distance", "hist": "When to history", "talk": "How you ask", "unr": "No history", "ot": "Onset vs timing", "qual": "Quality", "rad": "Radiation", "sev": "Severity", "neg": "Pertinent negatives", "ssx": "Signs / symptoms", "all": "Allergies", "med": "Medications", "past": "Past history", "loi": "Last intake", "evt": "Events", "mind": "EMT mindset"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sat 4:27 EMS patient assessment and history taking recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · assessment and history-taking recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
