ve oxygen?","opts":[{"t":"It measures residual volume; target 80%; give O₂ only if they are apneic","ok":false,"why":"SpO₂ is saturation percent. Target 94–99%. Reasons: sat under 94, trouble breathing, or shock."},{"t":"Percent of hemoglobin that is saturated; aim 94–99%; give O₂ if sat <94, distress, or shock","ok":true,"why":"SpO₂ is saturation percent. Target 94–99%. Reasons: sat under 94, trouble breathing, or shock."},{"t":"It proves the seats are full of oxygen even in a house fire","ok":false,"why":"SpO₂ is saturation percent. Target 94–99%. Reasons: sat under 94, trouble breathing, or shock."},{"t":"It replaces the need to watch chest rise","ok":false,"why":"SpO₂ is saturation percent. Target 94–99%. Reasons: sat under 94, trouble breathing, or shock."}]},{"ch":"co","q":"House-fire patient, sat reads 100%. What do you believe?","opts":[{"t":"They are fully oxygenated — 100% closes the case","ok":false,"why":"The probe sees occupied hemoglobin. Carbon monoxide occupies it. The number can look perfect while they are not carrying O₂."},{"t":"Do not trust it as proof of oxygen — CO can fill the seats","ok":true,"why":"The probe sees occupied hemoglobin. Carbon monoxide occupies it. The number can look perfect while they are not carrying O₂."},{"t":"This is a shark-fin problem only","ok":false,"why":"The probe sees occupied hemoglobin. Carbon monoxide occupies it. The number can look perfect while they are not carrying O₂."},{"t":"C3–5 must be injured","ok":false,"why":"The probe sees occupied hemoglobin. Carbon monoxide occupies it. The number can look perfect while they are not carrying O₂."}]},{"ch":"open","q":"Airway is not open. Which opening move matches this recap?","opts":[{"t":"Always tilt-chin, even with a wrecked neck","ok":false,"why":"Trauma worry → jaw thrust. No trauma → head-tilt chin-lift. Gurgling/fluids get suction. Talking clearly usually means the path is already open."},{"t":"Jaw thrust if you worry about trauma; tilt-chin if you do not; suction gurgling","ok":true,"why":"Trauma worry → jaw thrust. No trauma → head-tilt chin-lift. Gurgling/fluids get suction. Talking clearly usually means the path is already open."},{"t":"Bag first, open later","ok":false,"why":"Trauma worry → jaw thrust. No trauma → head-tilt chin-lift. Gurgling/fluids get suction. Talking clearly usually means the path is already open."},{"t":"Nasal tube through a smashed face","ok":false,"why":"Trauma worry → jaw thrust. No trauma → head-tilt chin-lift. Gurgling/fluids get suction. Talking clearly usually means the path is already open."}]},{"ch":"fork","q":"Not breathing, or only agonal. Breathing but tiny volume. Breathing well but sat 90% and shocked. Match the fork.","opts":[{"t":"All three get a nasal cannula only","ok":false,"why":"No air / agonal / no pulse → CPR + bag. Inadequate mechanics → BVM. Adequate mechanics but sick/hypoxic → supplemental oxygen, device per protocol."},{"t":"No breath/agonal: help/AED, CPR if no pulse, bag with O₂. Poor volume: assist with BVM. Adequate but hypoxic/shock: keep the airway and give supplemental O₂","ok":true,"why":"No air / agonal / no pulse → CPR + bag. Inadequate mechanics → BVM. Adequate mechanics but sick/hypoxic → supplemental oxygen, device per protocol."},{"t":"All three wait for ETCO₂ before you touch them","ok":false,"why":"No air / agonal / no pulse → CPR + bag. Inadequate mechanics → BVM. Adequate mechanics but sick/hypoxic → supplemental oxygen, device per protocol."},{"t":"Bag the hypoxic-but-adequate one and withhold O₂ from the apneic one","ok":false,"why":"No air / agonal / no pulse → CPR + bag. Inadequate mechanics → BVM. Adequate mechanics but sick/hypoxic → supplemental oxygen, device per protocol."}]},{"ch":"bag","q":"You bag an adult who still has a pulse. How, from this recap?","opts":[{"t":"Crush the bag as hard as you can at 30/min","ok":false,"why":"Just enough squeeze to see rise. Over-squeeze → stomach air and popped lung. Rate follows protocol; this talk’s function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"pri": "Primary", "words": "Three words", "resp": "Respiration", "ox": "Oxygenation", "deeper": "Looks sick", "upper": "Upper", "lower": "Lower", "c345": "C3–4–5", "neg": "Inhale", "pos": "Bag risk", "tv": "Tidal volume", "resv": "Residual", "drive": "Drive", "ok": "Adequate", "bad": "Inadequate", "agonal": "Agonal", "cs": "Cheyne–Stokes", "biot": "Biot’s", "kuss": "Kussmaul", "ptx": "Pneumothorax", "spo": "Pulse ox", "co": "CO trap", "etco": "ETCO₂", "aw": "Airway", "fork": "Arrest fork", "bvm": "How to bag", "o2ok": "Extra O₂", "red": "Red flags"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the 9:54 respiratory physiology recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · Respiratory physiology recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
</body>
</html>
