<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Ch 27 Face and Neck — practice</title>
<style>
:root {
  --bg: #f4efe6; --paper: #fffdf8; --ink: #1c2430; --muted: #5a6573;
  --navy: #1e3a5f; --navy-2: #16304d; --red: #b42318; --green: #1b7a46;
  --line: #d8d0c4; --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
input[type=text] {
  width: 100%; min-height: 48px; font-size: 1.05rem; font-family: inherit;
  padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
}
input[type=text]:focus { outline: 2px solid var(--navy); border-color: var(--navy); }
input[type=text]:disabled { background: #f3f1ec; }
.check {
  width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.check:active { background: var(--navy-2); }
.check:disabled { opacity: .55; cursor: default; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.links { display:flex; flex-wrap:wrap; gap:8px; margin: 12px 0 0; }
.links a { font-size:.82rem; color:#1e3a5f; background:#e8e1d4; border-radius:999px; padding:4px 10px; text-decoration:none; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>Ch 27 Face and Neck</h1>
  <div class="sub">Type-in · 21 from locked notes</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [{"ch":27,"q":"Face trauma — what two body areas do you also think about?","a":["brain and C-spine","brain and cervical spine","brain + C-spine","brain and neck/spine"],"why":"Face hit → think brain. Head snapped back → think C-spine."},{"ch":27,"q":"What comes before jaw, tooth, or eyeball care?","a":["XABCs","XABCs first","exsanguinating bleed / airway / breathing / circulation","XABCs (airway and big bleeding)"],"why":"XABCs first. Broken jaw, tooth, and eyeball are not next-minute killers."},{"ch":27,"q":"Trauma patient needs an airway opened. Which maneuver?","a":["jaw thrust","jaw-thrust","jaw thrust (possible C-spine)","jaw thrust for trauma"],"why":"Open the airway with a jaw thrust when there is trauma or possible C-spine injury."},{"ch":27,"q":"May you use an NPA on face or head trauma?","a":["no","no NPA","no — cracked skull risk","no (can go into brain)"],"why":"NPA is out. Cracked skull + NPA can go into the brain. BVM would blast air into the skull."},{"ch":27,"q":"When is an OPA still fine on a face-trauma patient?","a":["if no gag","no gag reflex","OPA OK if no gag","when there is no gag"],"why":"OPA is still fine if there is no gag."},{"ch":27,"q":"How tight do you wrap a bleeding scalp?","a":["loosely","loose wrap","wrap loosely","loose (not tight)"],"why":"Wrap a bleeding scalp loosely. Tight wrap adds pressure inside a skull that may already be swelling."},{"ch":27,"q":"Bruise on the mastoid behind the ear is which skull-fracture clue?","a":["Battle’s sign","Battles sign","Battle's sign","Battle’s sign (skull fracture)"],"why":"Bump behind the ear = mastoid. A bruise there is Battle’s sign — skull-fracture clue."},{"ch":27,"q":"Knocked-out tooth — hold which part?","a":["the crown","crown not root","hold by the crown","crown (not the root)"],"why":"Hold the tooth by the crown, not the root."},{"ch":27,"q":"Where do you store a knocked-out tooth?","a":["tooth solution / cold milk / sterile saline","cold milk or saline","tooth solution, milk, or sterile saline","milk or sterile saline"],"why":"Store in tooth solution, cold milk, or sterile saline. Replant window 20 minutes to 1 hour."},{"ch":27,"q":"One eye hurt. How many eyes do you cover?","a":["both","both eyes","cover both","both (eyes move together)"],"why":"Cover BOTH eyes even if only one is hurt. Eyes move together."},{"ch":27,"q":"Dangling eyeball — do you push it back in?","a":["no","no — moist gauze and tape","do not push it back in","no; moist gauze, tape so no swing"],"why":"Do not push a dangling globe back in. Moist gauze on it. Tape it so it does not swing."},{"ch":27,"q":"Chemical in the eye. Minimum flush time?","a":["20 minutes","at least 20 minutes","≥20 minutes","20 min inside to outside"],"why":"Contacts out. Force lids open. Flush inside → outside at least 20 minutes."},{"ch":27,"q":"Something loose on the eye — flush which direction?","a":["nose outward","from the nose outward","inside to outside / nose out","nose → outward"],"why":"Flush from the nose outward so it does not run into the other eye."},{"ch":27,"q":"Epistaxis care — pinch and lean which way?","a":["forward","lean forward","pinch and lean forward","forward (not back)"],"why":"Pinch the nose and lean FORWARD. Head back dumps blood into the throat."},{"ch":27,"q":"Halo test yellow ring around blood means what fluid?","a":["CSF","cerebrospinal fluid","CSF (skull cracked)","cerebrospinal fluid / CSF"],"why":"Halo test: blood in the middle, yellow ring = CSF. Skull is cracked."},{"ch":27,"q":"Torn-off ear packing — cool how?","a":["moist → plastic → cool (not bare ice)","moist wrap, plastic, cool","cool but not bare ice","moist then plastic then cool"],"why":"Avulsed ear: moist wrap → plastic → keep cool. Do not set it on bare ice."},{"ch":27,"q":"Penetrating neck bleed — pressure on how many sides?","a":["one side only","one side","bleeding side only","one side (never both)"],"why":"Pressure on the bleeding side only. Never wrap a full circle. Never squeeze both sides."},{"ch":27,"q":"How do you secure gauze on a neck hole without circling the neck?","a":["wrap under the opposite armpit","under opposite armpit","gauze then wrap under opposite armpit","under the other armpit"],"why":"Gauze on the wound, wrap under the opposite armpit. Plastic on top to keep air out."},{"ch":27,"q":"Rice Krispies feel under neck skin after blunt trauma means what?","a":["subcutaneous emphysema / cracked airway","air under the skin / cracked larynx or trachea","subcutaneous emphysema (crepitus)","leaked air from cracked airway"],"why":"Cracked larynx/trachea leaks air into soft tissue. Subcutaneous emphysema feels like Rice Krispies."},{"ch":27,"q":"Blunt neck with swelling and air under the skin — tight C-collar?","a":["no / skip it","skip the tight C-collar","no tight collar","skip tight C-collar (neck already swelling)"],"why":"Board them if the force was big. Skip the tight C-collar. The neck is already swelling."},{"ch":27,"q":"Unequal pupils name?","a":["anisocoria","anisocoria (unequal pupils)","anisocoria — treat as bad if unknown","unequal pupils / anisocoria"],"why":"Anisocoria = unequal pupils. Born that way in some people; if you do not know, treat as bad."}];

const LINKS = "<a href=\"emt-quiz-index.html\">Hub</a><a href=\"ch27-face-neck-key.html\">Key</a><a href=\"ch27-face-neck-detailed.html\">Detailed</a>";

function norm(s) { return String(s).trim().toLowerCase(); }
function acceptList(item) {
  if (Array.isArray(item.a)) return item.a.map(String);
  if (item.a == null) return [];
  return [String(item.a)];
}
function isRight(item, typed) {
  const n = norm(typed);
  if (!n) return false;
  return acceptList(item).some(function (a) { return norm(a) === n; });
}

let i = 0, correct = 0, answered = 0, locked = false;
const main = document.getElementById("main");
const nextBtn = document.getElementById("nextBtn");
const scoreEl = document.getElementById("score");
const progLabel = document.getElementById("progLabel");
const progBar = document.getElementById("progBar");

function setProg() {
  scoreEl.textContent = correct + " / " + answered;
  progLabel.textContent = i < BANK.length ? ("Question " + (i + 1) + " of " + BANK.length) : "Done";
  progBar.style.width = (Math.min(i, BANK.length) / BANK.length * 100) + "%";
}

function renderEnd() {
  nextBtn.classList.remove("visible");
  const pct = BANK.length ? Math.round(correct / BANK.length * 100) : 0;
  main.innerHTML = '<div class="card end"><h2>Done</h2><div class="big">' + correct + " / " + BANK.length + '</div><p class="pct">' + pct + '% first-check correct</p><div class="links">' + LINKS + '</div><button type="button" class="check restart" id="restart">Again</button></div>';
  document.getElementById("restart").onclick = function () {
    i = 0; correct = 0; answered = 0; locked = false; renderQ();
  };
}

function renderQ() {
  if (i >= BANK.length) { setProg(); renderEnd(); return; }
  locked = false;
  nextBtn.classList.remove("visible");
  const item = BANK[i];
  setProg();
  main.innerHTML = '<div class="card"><p class="qtext"></p><input type="text" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button type="button" class="check" id="check">Check</button><div class="why" id="why"></div></div>';
  main.querySelector(".qtext").textContent = item.q;
  const input = document.getElementById("ans");
  const check = document.getElementById("check");
  const why = document.getElementById("why");
  input.focus();

  function submit() {
    if (locked) return;
    const typed = input.value;
    if (!norm(typed)) { input.focus(); return; }
    locked = true;
    answered += 1;
    const ok = isRight(item, typed);
    if (ok) correct += 1;
    input.disabled = true;
    check.disabled = true;
    why.classList.add("visible");
    why.innerHTML = "";
    const v = document.createElement("div");
    v.className = "verdict " + (ok ? "ok" : "bad");
    v.textContent = ok ? "Correct" : "Not quite";
    const w = document.createElement("div");
    w.textContent = item.why;
    why.appendChild(v);
    why.appendChild(w);
    setProg();
    nextBtn.textContent = i === BANK.length - 1 ? "Finish" : "Next";
    nextBtn.classList.add("visible");
  }
  check.onclick = submit;
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
  });
}

nextBtn.onclick = function () {
  if (!locked) return;
  i += 1;
  renderQ();
};

renderQ();

</script>
</body>
</html>
