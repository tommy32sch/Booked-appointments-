<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Ch 22 Toxicology Part 2 — practice</title>
<style>
:root {
  --bg: #f4efe6; --paper: #fffdf8; --ink: #1c2430; --muted: #5a6573;
  --navy: #1e3a5f; --navy-2: #16304d; --red: #b42318; --green: #1b7a46;
  --line: #d8d0c4; --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
input[type=text] {
  width: 100%; min-height: 48px; font-size: 1.05rem; font-family: inherit;
  padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
}
input[type=text]:focus { outline: 2px solid var(--navy); border-color: var(--navy); }
input[type=text]:disabled { background: #f3f1ec; }
.check {
  width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.check:active { background: var(--navy-2); }
.check:disabled { opacity: .55; cursor: default; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.links { display:flex; flex-wrap:wrap; gap:8px; margin: 12px 0 0; }
.links a { font-size:.82rem; color:#1e3a5f; background:#e8e1d4; border-radius:999px; padding:4px 10px; text-decoration:none; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>Ch 22 Toxicology Part 2</h1>
  <div class="sub">Type-in · 21 from locked notes</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [{"ch":22,"q":"For most toxins in this half of the chapter, what is your field plan?","a":["scene safe, ABCs, hospital","ABCs and hospital","scene safe ABCs transport","no reversal; ABCs and hospital"],"why":"Most of these have no EMT reversal. Scene safe, ABCs, hospital. Opioids are still special because of Narcan."},{"ch":22,"q":"Who is safer for you on scene: an unconscious downer or an amped paranoid upper?","a":["unconscious downer","a downer who is out","unconscious depressant patient","the unconscious downer"],"why":"An unconscious downer is safer for you than an amped, paranoid upper."},{"ch":22,"q":"When may you restrain a toxicology patient?","a":["only if actively trying to hurt self or others","only for active danger to self or others","actively trying to hurt themselves or others","only when actively combative / active danger"],"why":"Restrain only if they are actively trying to hurt themselves or others. Not because they might."},{"ch":22,"q":"Narcan wakes an opioid patient who wants to leave. What should you do?","a":["push transport","encourage / push transport","push them to go to the hospital","default push transport"],"why":"Push transport. Narcan wears off faster than the opioid. They can go out again in about 30 minutes."},{"ch":22,"q":"About how soon can a patient go out again after Narcan wears off while opioid remains?","a":["about 30 minutes","30 minutes","~30 min","around 30 minutes"],"why":"Narcan wears off faster than the opioid. They can look fine and be unconscious again in about 30 minutes."},{"ch":22,"q":"Paint thinner, glue, or gasoline inhale: what heart risk comes from rough handling?","a":["VFib / ventricular fibrillation","ventricular fibrillation","VFib or arrest","irritable heart into VFib"],"why":"These solvents make the heart irritable. Jostling can throw them into VFib / arrest. Keep calm like severe hypothermia."},{"ch":22,"q":"What smell clue matches hydrogen sulfide?","a":["rotten egg","rotten eggs","rotten-egg smell","smells like rotten egg"],"why":"Hydrogen sulfide = rotten-egg smell. Hits the lungs."},{"ch":22,"q":"What smell clue matches cyanide?","a":["almond","almonds","almond smell","smells like almonds"],"why":"Cyanide = almond smell."},{"ch":22,"q":"A stimulant stroke is more likely what type because blood pressure is so high?","a":["bleed","bleeding stroke","hemorrhagic / bleed","a bleed"],"why":"Stimulant stroke is more likely a BLEED because blood pressure is so high."},{"ch":22,"q":"How can cocaine cause a heart attack even without plaque?","a":["vasospasm","squeezes heart vessels / vasospasm","coronary vasospasm","vessel spasm"],"why":"Cocaine and other stimulants squeeze heart vessels (vasospasm) → heart attack even without plaque."},{"ch":22,"q":"About how long can bath salts (synthetic cathinones) effects last?","a":["up to 48 hours","48 hours","as long as 48 hours","up to 48 h"],"why":"Bath salts: paranoia and hallucinations can last up to 48 hours. Safety + ABCs + hospital."},{"ch":22,"q":"Sedated marijuana patient — possible fentanyl mix. What should you try?","a":["Narcan","naloxone / Narcan","try Narcan","give Narcan"],"why":"Marijuana may be mixed with fentanyl. If they are sedated or out, try Narcan. Safe to try."},{"ch":22,"q":"Days of cannabinoid hyperemesis vomiting mainly risk what shock type?","a":["hypovolemic shock","hypovolemia","volume / hypovolemic shock","dehydration leading to hypovolemic shock"],"why":"Days of vomiting can cause hypovolemic shock. Watch the airway on heavy vomiting."},{"ch":22,"q":"What mnemonic describes anticholinergic toxicity?","a":["hot as a hare, blind as a bat, dry as a bone, red as a beet, mad as a hatter","hot blind dry red mad","hot/blind/dry/red/mad","hot as hare blind as bat dry as bone red as beet mad as hatter"],"why":"Anticholinergic = foot off the brake. Hot as a hare, blind as a bat, dry as a bone, red as a beet, mad as a hatter."},{"ch":22,"q":"How fast can anticholinergic toxicity go from normal to seizure and death?","a":["30 minutes","in 30 minutes","about 30 minutes","as fast as 30 minutes"],"why":"Anticholinergic can go from normal to seizure and death in 30 minutes. No EMT reversal."},{"ch":22,"q":"What two mnemonics describe cholinergic (nerve agent / insecticide) toxicity?","a":["SLUDGE and DUMBELS","SLUDGE / DUMBELS","SLUDGE or DUMBELS","SLUDGE and DUMBELS (fluid everywhere)"],"why":"Cholinergic stomps the brake. SLUDGE and DUMBELS: fluid from everywhere, slow heart, miosis."},{"ch":22,"q":"On a cholinergic exposure, what comes before ABCs?","a":["decontaminate","decontamination first","decontaminate first","decon first"],"why":"Decontaminate first. Then ABCs. Suction the airway."},{"ch":22,"q":"What two drugs are in a DuoDote auto-injector?","a":["atropine and 2-PAM / pralidoxime","atropine + pralidoxime (2-PAM)","atropine and pralidoxime","atropine + 2-PAM"],"why":"DuoDote = atropine + pralidoxime chloride (2-PAM). Not on every truck. Medics carry atropine."},{"ch":22,"q":"Within about how many hours does salmonella food poisoning usually start?","a":["72 hours","within 72 hours","≤72 hours","up to 72 hours"],"why":"Salmonella: within 72 hours. Left-out toxins hit faster, about 2–3 to 8–12 hours."},{"ch":22,"q":"Botulism paralysis pattern and the muscle group that kills?","a":["top-to-bottom; breathing muscles","top down paralysis hitting breathing muscles","descending paralysis; breathing muscles","top-to-bottom paralysis of breathing muscles"],"why":"Botulism: bad home-canned / swollen can. Top-to-bottom paralysis. Kills breathing muscles. No EMT antidote. ABCs / BVM."},{"ch":22,"q":"Plant poisoning: what should you do instead of memorizing plant names?","a":["call Poison Control; take plant or photo to ER","Poison Control and plant/photo to ER","call Poison Control and bring the plant or a photo","Poison Control + plant/photo to hospital"],"why":"Do not memorize plant names. Call Poison Control. Take the plant or a photo to the ER."}];
const LINKS = "<a href=\"emt-quiz-index.html\">Hub</a><a href=\"ch22-toxicology-part2-key.html\">Key</a><a href=\"ch22-toxicology-part2-detailed.html\">Detailed</a>";

function norm(s) { return String(s).trim().toLowerCase(); }
function acceptList(item) {
  if (Array.isArray(item.a)) return item.a.map(String);
  if (item.a == null) return [];
  return [String(item.a)];
}
function isRight(item, typed) {
  const n = norm(typed);
  if (!n) return false;
  return acceptList(item).some(function (a) { return norm(a) === n; });
}

let i = 0, correct = 0, answered = 0, locked = false;
const main = document.getElementById("main");
const nextBtn = document.getElementById("nextBtn");
const scoreEl = document.getElementById("score");
const progLabel = document.getElementById("progLabel");
const progBar = document.getElementById("progBar");

function setProg() {
  scoreEl.textContent = correct + " / " + answered;
  progLabel.textContent = i < BANK.length ? ("Question " + (i + 1) + " of " + BANK.length) : "Done";
  progBar.style.width = (Math.min(i, BANK.length) / BANK.length * 100) + "%";
}

function renderEnd() {
  nextBtn.classList.remove("visible");
  const pct = BANK.length ? Math.round(correct / BANK.length * 100) : 0;
  main.innerHTML = '<div class="card end"><h2>Done</h2><div class="big">' + correct + " / " + BANK.length + '</div><p class="pct">' + pct + '% first-check correct</p><div class="links">' + LINKS + '</div><button type="button" class="check restart" id="restart">Again</button></div>';
  document.getElementById("restart").onclick = function () {
    i = 0; correct = 0; answered = 0; locked = false; renderQ();
  };
}

function renderQ() {
  if (i >= BANK.length) { setProg(); renderEnd(); return; }
  locked = false;
  nextBtn.classList.remove("visible");
  const item = BANK[i];
  setProg();
  main.innerHTML = '<div class="card"><p class="qtext"></p><input type="text" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button type="button" class="check" id="check">Check</button><div class="why" id="why"></div></div>';
  main.querySelector(".qtext").textContent = item.q;
  const input = document.getElementById("ans");
  const check = document.getElementById("check");
  const why = document.getElementById("why");
  input.focus();

  function submit() {
    if (locked) return;
    const typed = input.value;
    if (!norm(typed)) { input.focus(); return; }
    locked = true;
    answered += 1;
    const ok = isRight(item, typed);
    if (ok) correct += 1;
    input.disabled = true;
    check.disabled = true;
    why.classList.add("visible");
    why.innerHTML = "";
    const v = document.createElement("div");
    v.className = "verdict " + (ok ? "ok" : "bad");
    v.textContent = ok ? "Correct" : "Not quite";
    const w = document.createElement("div");
    w.textContent = item.why;
    why.appendChild(v);
    why.appendChild(w);
    setProg();
    nextBtn.textContent = i === BANK.length - 1 ? "Finish" : "Next";
    nextBtn.classList.add("visible");
  }
  check.onclick = submit;
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
  });
}

nextBtn.onclick = function () {
  if (!locked) return;
  i += 1;
  renderQ();
};

renderQ();
</script>
</body>
</html>
