const BANK = [{"ch":"epi-ind","q":"You can justify epinephrine (Epi) on this recap when you can call what?","opts":[{"t":"A mild allergy or a simple asthma attack","ok":false,"why":"Epi is only for true anaphylaxis — airway compromise, shock with low BP, or multi-system. If you cannot call anaphylaxis, you do not chase Epi."},{"t":"True anaphylaxis — airway, low-BP shock, or multi-system","ok":true,"why":"Epi is only for true anaphylaxis — airway compromise, shock with low BP, or multi-system. If you cannot call anaphylaxis, you do not chase Epi."},{"t":"Any wheeze, because Epi is the asthma first-line","ok":false,"why":"Epi is only for true anaphylaxis — airway compromise, shock with low BP, or multi-system. If you cannot call anaphylaxis, you do not chase Epi."},{"t":"Chest pain you think is an MI","ok":false,"why":"Epi is only for true anaphylaxis — airway compromise, shock with low BP, or multi-system. If you cannot call anaphylaxis, you do not chase Epi."}]},{"ch":"epi-rx","q":"Epi receptors in this recap — which pairing is yours?","opts":[{"t":"Alpha opens lungs; beta-2 only raises BP","ok":false,"why":"Alpha: vasoconstriction → raise BP. Beta-1: raise heart rate and contractility. Beta-2: bronchodilation."},{"t":"Alpha raises BP; beta-1 raises rate/squeeze; beta-2 opens airways","ok":true,"why":"Alpha: vasoconstriction → raise BP. Beta-1: raise heart rate and contractility. Beta-2: bronchodilation."},{"t":"It only blocks opioid receptors like naloxone","ok":false,"why":"Alpha: vasoconstriction → raise BP. Beta-1: raise heart rate and contractility. Beta-2: bronchodilation."},{"t":"It is only a sugar gel in the mouth","ok":false,"why":"Alpha: vasoconstriction → raise BP. Beta-1: raise heart rate and contractility. Beta-2: bronchodilation."}]},{"ch":"epi-htn","q":"Your “allergy” patient is very hypertensive. Why does this recap tell you to hold Epi?","opts":[{"t":"Epi always drops BP, so high BP is the goal","ok":false,"why":"Epi raises BP. High-plus-higher can rder and can worsen the damage","ok":true,"why":"Epi makes the heart work harder (rate and workload up). Extra stress can worsen MI damage."},{"t":"MI is the first-line indication for Epi","ok":false,"why":"Epi makes the heart work harder (rate and workload up). Extra stress can worsen MI damage."},{"t":"You give Epi instead of aspirin for chest pain","ok":false,"why":"Epi makes the heart work harder (rate and workload up). Extra stress can worsen MI damage."}]},{"ch":"epi-asthma","q":"Straightforward asthma attack — your Epi move on this recap?","opts":[{"t":"Give Epi first; albuterol is only for anaphylaxis","ok":false,"why":"Do not use Epi for a simple asthma attack. Use albuterol / bronchodilators. Epi is reserved for severe anaphylaxis."},{"t":"Do not use Epi — use albuterol; Epi is for severe anaphylaxis","ok":true,"why":"Do not use Epi for a simple asthma attack. Use albuterol / bronchodilators. Epi is reserved for severe anaphylaxis."},{"t":"Spray naloxone into the inhaler","ok":false,"why":"Do not use Epi for a simple asthma attack. Use albuterol / bronchodilators. Epi is reserved for severe anaphylaxis."},{"t":"Give oral glucose because wheeze means low sugar","ok":false,"why":"Do not use Epi for a simple asthma attack. Use albuterol / bronchodilators. Epi is reserved for severe anaphylaxis."}]},{"ch":"nx-tox","q":"Naloxone (Narcan) reverses which toxin family in this recap?","opts":[{"t":"Alcohol, Valium, and Xanax equally well","ok":false,"why":"Naloxone works only on opioids (heroin, fentanyl, morphine, oxycodone, Vicodin). It will not reverse alcohol or benzodiazepines."},{"t":"Opioids only — heroin, fentanyl, morphine, oxycodone, Vicodin","ok":true,"why":"Naloxone works only on opioids (heroin, fentanyl, morphine, oxycodone, Vicodin). It will not reverse alcohol or benzodiazepines."},{"t":"Any sedative, including non-opioid sleep meds","ok":false,"why":"Naloxone works only on opioids (heroin, fentanyl, morphine, oxycodone, Vicodin). It will not reverse alcohol or benzodiazepines."},{"t":"Only anaphylaxis from bee sting","ok":false,"why":"Naloxone works only on opioids (heroin, fentanyl, morphine, oxycodone, Vicodin). It will not reverse alcohol or benzodiazepines."}]},{"ch":"nx-mech","q":"Naloxone mechanism this recap wants you to lock?","opts":[{"t":"Agonist that triggers a stronger opioid high","ok":false,"why":"It is an antagonist: similar shape, binds the same receptors, blocks instead of triggering, and reverses respiratory / CNS depression and opioid hypotension."},{"t":"Antagonist — same-shape bind, blocks the opioid effect","ok":true,"why":"It is an antagonist: similar shape, binds the same receptors, blocks instead of triggering, and reverses respiratory / CNS depression and opioid hypotension."},{"t":"Beta-2 mist that only opens bronchi","ok":false,"why":"It is an antagonist: similar shape, binds the same receptors, blocks instead of triggering, and reverses respiratory / CNS depression and opioid hypotension."},{"t":"Sugar gel that must be swallowed","ok":false,"why":"It is an antagonist: similar shape, binds the same receptors, blocks instead of triggering, and reverses respiratory / CNS depression and opioid hypotension."}]},{"ch":"nx-in","q":"Intranasal naloxone — why can it still work if they are not breathing?","opts":[{"t":"It is an inhaled lung drug like albuterol","ok":false,"why":"IN absorbs through nasal mucosa into blood. It is not a lung drug, so it works even if they are not breathing."},{"t":"It absorbs through nasal mucosa — not a lung drug","ok":true,"why":"IN absorbs through nasal mucosa into blood. It is not a lung drug, so it works even if they are not breathing."},{"t":"You must intubate before any IN spray","ok":false,"why":"IN absorbs through nasal mucosa into blood. It is not a lung drug, so it works even if they are not breathing."},{"t":"IN only works if they take a deep puff on command","ok":false,"why":"IN absorbs through nasal mucosa into blood. It is not a lung drug, so it works even if they are not breathing."}]},{"ch":"nx-route","q":"Naloxone routes this recap assigns — which map is yours?","opts":[{"t":"IV is the usual EMT route; IN is paramedic-only","ok":false,"why":"IN is most common. IM is lateral thigh like an EpiPen. IV is for paramedics in most systems, not EMT-B."},{"t":"IN most common; IM lateral thigh; IV usually paramedic","ok":true,"why":"IN is most common. IM is lateral thigh like an EpiPen. IV is for paramedics in most systems, not EMT-B."},{"t":"Only by mouth with a glass of water","ok":false,"why":"IN is most common. IM is lateral thigh like an EpiPen. IV is for paramedics in most systems, not EMT-B."},{"t":"Only through a 6 L/min nebulizer cup","ok":false,"why":"IN is most common. IM is lateral thigh like an EpiPen. IV is for paramedics in most systems, not EMT-B."}]},{"ch":"nx-dose","q":"EMT naloxone dose this recap wants you to memorize?","opts":[{"t":"Always 10 mg IV for every adult","ok":false,"why":"No single standard EMT dose to memorize. It varies by route and packaging — follow the auto-injector or prefilled IN and protocol."},{"t":"None — it varies by route and packaging / device","ok":true,"why":"No single standard EMT dose to memorize. It varies by route and packaging — follow the auto-injector or prefilled IN and protocol."},{"t":"One tube of gel between the cheek and gum","ok":false,"why":"No single standard EMT dose to memorize. It varies by route and packaging — follow the auto-injector or prefilled IN and protocol."},{"t":"Three MDI puffs timed to inhale","ok":false,"why":"No single standard EMT dose to memorize. It varies by route and packaging — follow the auto-injector or prefilled IN and protocol."}]},{"ch":"nx-fx","q":"After naloxone, what do you want to see — and what side effects does this recap warn?","opts":[{"t":"They stay apneic; side effect is only a headache","ok":false,"why":"You want better breathing rate/depth, then mental status. Side effects: nausea, vomiting, agitation or combative wake-up. Watch scene safety."},{"t":"Breathing then mental status improve; nausea, vomit, they can wake combative","ok":true,"why":"You want better breathing rate/depth, then mental status. Side effects: nausea, vomiting, agitation or combative wake-up. Watch scene safety."},{"t":"Immediate high-BP stroke from alpha squeeze","ok":false,"why":"You want better breathing rate/depth, then mental status. Side effects: nausea, vomiting, agitation or combative wake-up. Watch scene safety."},{"t":"They must stay pinpoint and silent or it failed","ok":false,"why":"You want better breathing rate/depth, then mental status. Side effects: nausea, vomiting, agitation or combative wake-up. Watch scene safety."}]},{"ch":"nx-safe","q":"Why prefer IN naloxone around IV drug users on this recap?","opts":[{"t":"IN is weaker so you avoid waking them","ok":false,"why":"Prefer IN to avoid needle sticks — HIV and hepatitis C risk. Scene safety as they wake."},{"t":"Avoid needle sticks (HIV, hepatitis C) and stay safer as they wake","ok":true,"why":"Prefer IN to avoid needle sticks — HIV and hepatitis C risk. Scene safety as they wake."},{"t":"IN only works if they are already combative","ok":false,"why":"Prefer IN to avoid needle sticks — HIV and hepatitis C risk. Scene safety as they wake."},{"t":"IM is forbidden even for paramedics","ok":false,"why":"Prefer IN to avoid needle sticks — HIV and hepatitis C risk. Scene safety as they wake."}]},{"ch":"nx-look","q":"Opioid-overdose look this recap wants you to hunt?","opts":[{"t":"High BP, fast rate, loud breathing, wide pupils only","ok":false,"why":"Depressed vitals: low BP, low HR, slow/shallow or absent breaths, decreased mental status. Pinpoints are classic but not always there."},{"t":"Low BP/HR, slow or absent breaths, down mental status (± pinpoints)","ok":true,"why":"Depressed vitals: low BP, low HR, slow/shallow or absent breaths, decreased mental status. Pinpoints are classic but not always there."},{"t":"Hives, tongue swell, and high BP","ok":false,"why":"Depressed vitals: low BP, low HR, slow/shallow or absent breaths, decreased mental status. Pinpoints are classic but not always there."},{"t":"Wheeze that needs 6 L/min albuterol first","ok":false,"why":"Depressed vitals: low BP, low HR, slow/shallow or absent breaths, decreased mental status. Pinpoints are classic but not always there."}]},{"ch":"nx-trial","q":"Naloxone as a “trial” — how does this recap read the result?","opts":[{"t":"If nothing happens, you proved they have no pulse","ok":false,"why":"If it works, opioid is likely. If nothing happens, think other causes or a heavy opioid load that may need another dose. It is very safe if no opioid is on board."},{"t":"Works → opioid likely; nothing → other cause or heavy load / repeat","ok":true,"why":"If it works, opioid is likely. If nothing happens, think other causes or a heavy opioid load that may need another dose. It is very safe if no opioid is on board."},{"t":"A failed trial means you now give Epi for asthma","ok":false,"why":"If it works, opioid is likely. If nothing happens, think other causes or a heavy opioid load that may need another dose. It is very safe if no opioid is on board."},{"t":"You never repeat; one spray is always enough","ok":false,"why":"If it works, opioid is likely. If nothing happens, think other causes or a heavy opioid load that may need another dose. It is very safe if no opioid is on board."}]},{"ch":"alb","q":"Albuterol in this recap — class and job?","opts":[{"t":"Opioid antagonist for apnea","ok":false,"why":"Albuterol is a beta-2 agonist → bronchodilation for asthma / bronchoconstriction / bronchospasm. Less systemic punch than Epi."},{"t":"Beta-2 agonist — bronchodilation for asthma / bronchospasm","ok":true,"why":"Albuterol is a beta-2 agonist → bronchodilation for asthma / bronchoconstriction / bronchospasm. Less systemic punch than Epi."},{"t":"Alpha pressor you use for high-BP anaphylaxis","ok":false,"why":"Albuterol is a beta-2 agonist → bronchodilation for asthma / bronchoconstriction / bronchospasm. Less systemic punch than Epi."},{"t":"The stand-alone drug for cardiac chest pain","ok":false,"why":"Albuterol is a beta-2 agonist → bronchodilation for asthma / bronchoconstriction / bronchospasm. Less systemic punch than Epi."}]},{"ch":"mdi","q":"MDI assist — the timing point this recap will fail you on?","opts":[{"t":"Spray first, then wait a minute, then have them inhale","ok":false,"why":"Spray as they inhale so it reaches the lungs. Off-timing just coats the mouth and does nothing. Spacers help kids by holding a cloud."},{"t":"Spray as they inhale — or it just coats the mouth","ok":true,"why":"Spray as they inhale so it reaches the lungs. Off-timing just coats the mouth and does nothing. Spacers help kids by holding a cloud."},{"t":"MDI is paramedic-only; you never assist","ok":false,"why":"Spray as they inhale so it reaches the lungs. Off-timing just coats the mouth and does nothing. Spacers help kids by holding a cloud."},{"t":"You must run the MDI at 6 L/min oxygen","ok":false,"why":"Spray as they inhale so it reaches the lungs. Off-timing just coats the mouth and does nothing. Spacers help kids by holding a cloud."}]},{"ch":"svn","q":"SVN setup this recap wants you to recite?","opts":[{"t":"Room air only, one puff, then stop","ok":false,"why":"Run 6 L/min oxygen through the nebulizer with liquid albuterol in the cup → continuous mist. They breathe over time for a higher, deeper dose than one MDI puff."},{"t":"6 L/min O2 through liquid albuterol → continuous mist, deeper dose","ok":true,"why":"Run 6 L/min oxygen through the nebulizer with liquid albuterol in the cup → continuous mist. They breathe over time for a higher, deeper dose than one MDI puff."},{"t":"15 L/min into the nose like IN naloxone","ok":false,"why":"Run 6 L/min oxygen through the nebulizer with liquid albuterol in the cup → continuous mist. They breathe over time for a higher, deeper dose than one MDI puff."},{"t":"IM into the lateral thigh","ok":false,"why":"Run 6 L/min oxygen through the nebulizer with liquid albuterol in the cup → continuous mist. They breathe over time for a higher, deeper dose than one MDI puff."}]},{"ch":"gluc","q":"Oral glucose — when do you hold it on this recap?","opts":[{"t":"Any time sugar might be low, even if they are out","ok":false,"why":"Do not give if they are unconscious or cannot protect the airway / follow commands / swallow. Thick gel can aspirate into the lungs."},{"t":"Unconscious or cannot protect the airway / swallow — aspiration risk","ok":true,"why":"Do not give if they are unconscious or cannot protect the airway / follow commands / swallow. Thick gel can aspirate into the lungs."},{"t":"Only if they already got Epi","ok":false,"why":"Do not give if they are unconscious or cannot protect the airway / follow commands / swallow. Thick gel can aspirate into the lungs."},{"t":"Hold it whenever they can still follow commands","ok":false,"why":"Do not give if they are unconscious or cannot protect the airway / follow commands / swallow. Thick gel can aspirate into the lungs."}]},{"ch":"list","q":"EMT medication list named in this recap?","opts":[{"t":"Tylenol, Benadryl, and any OTC on the shelf","ok":false,"why":"Aspirin, nitroglycerin, oral glucose, epinephrine, naloxone, albuterol / bronchodilator. OTC is not yours unless written into protocol."},{"t":"Aspirin, nitro, oral glucose, Epi, naloxone, albuterol","ok":true,"why":"Aspirin, nitroglycerin, oral glucose, epinephrine, naloxone, albuterol / bronchodilator. OTC is not yours unless written into protocol."},{"t":"Fentanyl and every hospital antibiotic","ok":false,"why":"Aspirin, nitroglycerin, oral glucose, epinephrine, naloxone, albuterol / bronchodilator. OTC is not yours unless written into protocol."},{"t":"Only Epi — nothing else is EMT","ok":false,"why":"Aspirin, nitroglycerin, oral glucose, epinephrine, naloxone, albuterol / bronchodilator. OTC is not yours unless written into protocol."}]},{"ch":"otc","q":"Tylenol or Benadryl on your truck — EMT default in this recap?","opts":[{"t":"Give them freely; OTC means no protocol needed","ok":false,"why":"Even OTC drugs are generally not EMT-administered unless they are explicitly in your protocols. You stay on the specific list."},{"t":"Not yours unless they are written into protocol","ok":true,"why":"Even OTC drugs are generally not EMT-administered unless they are explicitly in your protocols. You stay on the specific list."},{"t":"Required on every altered-mental-status call","ok":false,"why":"Even OTC drugs are generally not EMT-administered unless they are explicitly in your protocols. You stay on the specific list."},{"t":"They replace naloxone for opioid overdose","ok":false,"why":"Even OTC drugs are generally not EMT-administered unless they are explicitly in your protocols. You stay on the specific list."}]},{"ch":"scope","q":"Paramedic skills this recap contrasts with nurses in most settings?","opts":[{"t":"Nurses usually intubate; medics never start IVs","ok":false,"why":"Paramedics: larger but state-limited list, IV, more meds, intubation (nurses usually do not in most settings), and IO bone access."},{"t":"Medics: IV, more meds, intubation, IO — nurses usually do not intubate","ok":true,"why":"Paramedics: larger but state-limited list, IV, more meds, intubation (nurses usually do not in most settings), and IO bone access."},{"t":"EMTs drill IO; medics only give oral glucose","ok":false,"why":"Paramedics: larger but state-limited list, IV, more meds, intubation (nurses usually do not in most settings), and IO bone access."},{"t":"Scope is identical in every hospital hallway","ok":false,"why":"Paramedics: larger but state-limited list, IV, more meds, intubation (nurses usually do not in most settings), and IO bone access."}]},{"ch":"er","q":"Paramedics in the ER — what does this recap say, including the Tylenol example?","opts":[{"t":"Every ER medic automatically has full field scope plus every OTC","ok":false,"why":"Role varies by hospital — some keep near-full scope, some restrict to tech work. Example: a written list allowed fentanyl but not Tylenol until Tylenol was added."},{"t":"Hospital-dependent; a written list can allow fentanyl and still block Tylenol","ok":true,"why":"Role varies by hospital — some keep near-full scope, some restrict to tech work. Example: a written list allowed fentanyl but not Tylenol until Tylenol was added."},{"t":"Nurses lose all meds when a medic clocks in","ok":false,"why":"Role varies by hospital — some keep near-full scope, some restrict to tech work. Example: a written list allowed fentanyl but not Tylenol until Tylenol was added."},{"t":"EMTs give fentanyl in the ER by default","ok":false,"why":"Role varies by hospital — some keep near-full scope, some restrict to tech work. Example: a written list allowed fentanyl but not Tylenol until Tylenol was added."}]},{"ch":"err","q":"You gave the wrong med. First four moves this recap wants?","opts":[{"t":"Hide the chart, then wait for the family to call","ok":false,"why":"Patient first (monitor, manage, transport). Call medical control now — honest drug/dose/time. Document objectively. Expect agency/medical-director follow-up."},{"t":"Treat the patient, call medical control, document, then follow-up","ok":true,"why":"Patient first (monitor, manage, transport). Call medical control now — honest drug/dose/time. Document objectively. Expect agency/medical-director follow-up."},{"t":"Give a second mystery drug to cancel the first","ok":false,"why":"Patient first (monitor, manage, transport). Call medical control now — honest drug/dose/time. Document objectively. Expect agency/medical-director follow-up."},{"t":"Only tell your partner; skip medical control","ok":false,"why":"Patient first (monitor, manage, transport). Call medical control now — honest drug/dose/time. Document objectively. Expect agency/medical-director follow-up."}]},{"ch":"legal","q":"Big legal red line this function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"epi-ind": "Epi indication", "epi-rx": "Epi receptors", "epi-htn": "Epi + high BP", "epi-cold": "Epi + hypothermia", "epi-mi": "Epi + MI", "epi-asthma": "Epi vs asthma", "nx-tox": "Naloxone toxins", "nx-mech": "Naloxone mechanism", "nx-in": "IN route", "nx-route": "Naloxone routes", "nx-dose": "Naloxone dose", "nx-fx": "Naloxone effects", "nx-safe": "IN safety", "nx-look": "Overdose look", "nx-trial": "Naloxone trial", "alb": "Albuterol", "mdi": "MDI timing", "svn": "SVN setup", "gluc": "Oral glucose", "list": "EMT list", "otc": "OTC / protocol", "scope": "Medic vs nurse", "er": "ER paramedic", "err": "Med error", "legal": "Legal red line"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sun 4:46 EMT medication and protocols recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · meds and protocols recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
