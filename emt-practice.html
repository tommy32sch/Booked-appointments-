<style>

const BANK = [{"ch":1,"q":"A 1966 federal report is often treated as the start of modern EMS. Which statement is true?","opts":[{"t":"It publicized how many people were dying from trauma and pushed EMS toward a modern system","ok":true,"why":"Correct. The notes say: 1966 — White Paper exposed high trauma death rates and started modern EMS. The full title is not in the notes."},{"t":"It created NHTSA and placed that agency under the Department of Transportation","ok":false,"why":"Incorrect. NHTSA was created in 1970 under DOT. The 1966 White Paper exposed high trauma death rates and started modern EMS."},{"t":"It was the year AAOS first printed an EMT textbook","ok":false,"why":"Incorrect. The first EMT textbook from AAOS is 1971. 1966 is the White Paper that exposed high trauma deaths and started modern EMS."},{"t":"It required every state to license both EMR and AEMT","ok":false,"why":"Incorrect. The notes do not say that. 1966 is the White Paper on high trauma death rates that started modern EMS. Arizona historically recognized only EMT and Paramedic."}]},{"ch":1,"q":"Which year and parent agency match the creation of NHTSA?","opts":[{"t":"Created in 1970 and placed under the Department of Transportation","ok":true,"why":"Correct. The notes: 1970 — NHTSA created under the Department of Transportation."},{"t":"Created in 1966 and placed under the Department of Health","ok":false,"why":"Incorrect. 1966 is the White Paper year. NHTSA was created in 1970 under the Department of Transportation. The notes do not place it under Health."},{"t":"Created in 1971 and placed under AAOS","ok":false,"why":"Incorrect. 1971 is when AAOS published the first EMT textbook. NHTSA was created in 1970 under DOT."},{"t":"1970, as a stand-alone medical licensing board","ok":false,"why":"Incorrect. The notes say NHTSA was created in 1970 under the Department of Transportation, not as an independent medical board."}]},{"ch":1,"q":"A recruit asks who first put an EMT textbook in print, and when. Which answer is correct?","opts":[{"t":"AAOS, in 1971","ok":true,"why":"Correct. The notes: 1971 — AAOS published the first EMT textbook."},{"t":"NHTSA, in 1970","ok":false,"why":"Incorrect. 1970 is when NHTSA was created under DOT. The first EMT textbook was published by AAOS in 1971."},{"t":"The authors of the 1966 trauma report","ok":false,"why":"Incorrect. 1966 is the White Paper on trauma deaths. The first EMT textbook was AAOS in 1971. The White Paper’s full title/authors are not in the notes."},{"t":"A medical director writing independently in 1971","ok":false,"why":"Incorrect. The notes credit AAOS (1971) with the first EMT textbook, not a Medical Director."}]},{"ch":1,"q":"Over the decades, what happened to EMS as a system?","opts":[{"t":"It shifted from just moving patients to healthcare delivered under a physician’s oversight","ok":true,"why":"Correct. The notes: EMS moved from pure transportation to a healthcare system with medical oversight."},{"t":"It shifted from hospital-based treatment back to transport-only","ok":false,"why":"Incorrect. That is the opposite. The notes say EMS moved from pure transportation to a healthcare system with medical oversight."},{"t":"Crews moved from paramedic-only staffing to EMR-only staffing","ok":false,"why":"Incorrect. The notes do not describe that shift. The system shift is transportation → healthcare with medical oversight."},{"t":"Online radio orders replaced the medical director entirely","ok":false,"why":"Incorrect. Every EMT and paramedic still works under a Medical Director. The shift is transportation → healthcare with medical oversight."}]},{"ch":1,"q":"You are lining up certification levels by training time and role. Which pairing is correct?","opts":[{"t":"EMR is about 50 hours of CPR and first aid; EMT is about 130–150 hours of BLS with a limited medication list","ok":true,"why":"Correct. Notes: EMR ~50 hours — basic CPR and first aid. EMT ~130–150 hours — BLS foundation, limited meds. AEMT hours are not given."},{"t":"EMT is about 50 hours of CPR; EMR is about 130–150 hours of BLS","ok":false,"why":"Incorrect. Those hours are swapped. EMR is ~50 hours (CPR/first aid). EMT is ~130–150 hours (BLS, limited meds)."},{"t":"EMT training is at least 1,000 hours and covers 55–60 medications","ok":false,"why":"Incorrect. That is the paramedic line: ALS, ≥1,000 hours; advanced airways, EKG, 55–60 meds. EMT is ~130–150 hours, BLS, limited meds."},{"t":"AEMT is listed as about 50 hours and cannot start IVs","ok":false,"why":"Incorrect. EMR is ~50 hours. AEMT is intermediate: IVs + expanded medications. Exact AEMT hours are not in the notes."}]},{"ch":1,"q":"Which description fits the paramedic level?","opts":[{"t":"ALS training of at least 1,000 hours, including advanced airways, EKG, and 55–60 medications","ok":true,"why":"Correct. Notes: Paramedic — ALS, ≥1,000 hours; advanced airways, EKG, 55–60 meds."},{"t":"BLS foundation of about 130–150 hours with limited medications","ok":false,"why":"Incorrect. That is the EMT description. Paramedic is ALS, ≥1,000 hours, advanced airways, EKG, 55–60 meds."},{"t":"Intermediate IV access only, with hours given as about 50","ok":false,"why":"Incorrect. AEMT is intermediate (IVs + expanded meds; hours not given). EMR is ~50 hours. Paramedic is ALS ≥1,000 hours with advanced airways, EKG, 55–60 meds."},{"t":"Independent practice with no physician license involved","ok":false,"why":"Incorrect. Every EMT and paramedic works under the Medical Director’s license. Paramedic training in the notes is ALS, ≥1,000 hours, advanced airways, EKG, 55–60 meds."}]},{"ch":1,"q":"On a BLS call, who is legally responsible for the care you give?","opts":[{"t":"The Medical Director — you practice under that physician’s license","ok":true,"why":"Correct. Notes: every EMT and paramedic works under the license of a physician called the Medical Director, who is legally responsible for the care you provide."},{"t":"Only you as the EMT on scene; no physician is in the chain","ok":false,"why":"Incorrect. The notes say the Medical Director is legally responsible and you work under that physician’s license."},{"t":"NHTSA, citing its 1970 creation under DOT","ok":false,"why":"Incorrect. NHTSA’s 1970 creation is a history fact, not who is legally responsible for your care. That is the Medical Director."},{"t":"The charge nurse at the receiving hospital","ok":false,"why":"Incorrect. The notes name the Medical Director as legally responsible for the care you provide."}]},{"ch":1,"q":"In Arizona, which statement about recognized levels and jobs is true?","opts":[{"t":"For a long time only EMT and Paramedic were recognized; EMR and AEMT were added later and jobs for them are still scarce","ok":true,"why":"Correct. Notes: AZ historically recognized EMT and Paramedic only. EMR and AEMT were added recently, but job availability is limited."},{"t":"EMR, EMT, AEMT, and paramedic have always been recognized equally","ok":false,"why":"Incorrect. Historically only EMT and Paramedic were recognized. EMR and AEMT were added recently, with limited jobs."},{"t":"Paid urban jobs most often go to EMRs","ok":false,"why":"Incorrect. EMR/AEMT job availability is limited. Urban systems usually restrict advanced skills to paramedics."},{"t":"AEMT programs in Arizona are listed as 400 hours","ok":false,"why":"Incorrect. AEMT hours are not in the notes. AZ historically had EMT and Paramedic; EMR/AEMT were added recently with limited jobs."}]},{"ch":1,"q":"A rural service wants extra skills on the ambulance. Who may start IVs there?","opts":[{"t":"EMTs who have been trained for it, if the medical director approves","ok":true,"why":"Correct. Notes: some rural agencies allow trained EMTs to start IVs with medical director approval. Urban systems usually restrict advanced skills to paramedics."},{"t":"Any EMR, with no extra approval","ok":false,"why":"Incorrect. The notes say some rural trained EMTs may start IVs with medical director approval — not EMRs without approval. Urban advanced skills are usually paramedic-only."},{"t":"Only if the Medical Director is physically standing on scene","ok":false,"why":"Incorrect. Rural trained EMTs may start IVs with medical director approval. The Medical Director does not have to be on scene for that approval."},{"t":"Urban EMTs under a statewide standing rule","ok":false,"why":"Incorrect. Urban systems usually restrict advanced skills to paramedics. Rural IV starts for trained EMTs require medical director approval."}]},{"ch":1,"q":"You have a time-critical, routine emergency. Which care can you do from standing orders without calling a physician first?","opts":[{"t":"Start CPR/AED, give oxygen, and give epinephrine for anaphylaxis","ok":true,"why":"Correct. Offline standing orders are pre-approved protocols for time-critical, standard care. Examples in the notes: CPR/AED, oxygen, epinephrine for anaphylaxis. Used for most routine emergencies."},{"t":"Certain pain medications, advanced procedures, and leaving protocol","ok":false,"why":"Incorrect. Those are the notes’ examples of when you need online (radio/phone) orders. Offline examples are CPR/AED, oxygen, and epi for anaphylaxis."},{"t":"A rare overdose antidote you decide on yourself","ok":false,"why":"Incorrect. A rare overdose with the wrong antidote is the notes’ knowledge-based failure example. Unusual/unsure cases need online medical direction."},{"t":"Only treatments after you get a one-time radio order","ok":false,"why":"Incorrect. That describes online orders. Offline standing orders are pre-approved and followed without calling."}]},{"ch":1,"q":"Medical control gives you a radio order for this one call. Which statement is true?","opts":[{"t":"That order covers this situation only — call again if a new situation comes up","ok":true,"why":"Correct. Notes: an online order applies to that one situation only — make another call for each new situation. Use when unsure, unusual, or you need extra authorization."},{"t":"You may reuse it as a standing order for the rest of the shift","ok":false,"why":"Incorrect. Online orders apply to that one situation only. Standing orders are the offline, pre-approved protocols."},{"t":"It replaces the Medical Director for the patient’s entire hospital stay","ok":false,"why":"Incorrect. Online is real-time radio/phone direction for that one situation. You still work under the Medical Director’s license."},{"t":"You must also call online before every routine oxygen or CPR call","ok":false,"why":"Incorrect. CPR/AED, oxygen, and epi for anaphylaxis are offline standing-order examples. Online is for outside protocol, certain pain meds, advanced procedures, deviations, or when unsure."}]},{"ch":1,"q":"You know oxygen should run at 15 LPM, but you set the regulator to 2 LPM. What kind of failure is that?","opts":[{"t":"Skills-based (slip/lapse): you knew the right action and carried it out wrong","ok":true,"why":"Correct. Notes: skills-based failure — you know the correct action but execute it wrong. Example given: set O2 to 2 LPM instead of 15 LPM."},{"t":"Rules-based: you used a known protocol on the wrong problem","ok":false,"why":"Incorrect. Rules-based is applying a known rule to the wrong situation (example: treat stroke as low blood sugar). Setting O2 to 2 instead of 15 LPM is the notes’ skills-based example."},{"t":"Knowledge-based: a new situation plus an incomplete plan","ok":false,"why":"Incorrect. Knowledge-based is a new/unfamiliar situation plus incomplete knowledge (example: rare overdose → wrong antidote). This is the skills-based O2 2 vs 15 LPM example."},{"t":"A secondary-prevention miss (failed screening)","ok":false,"why":"Incorrect. Secondary prevention is early detection (screenings; early treatment of high blood pressure or cholesterol). This is a skills-based execution error."}]},{"ch":1,"q":"A patient is having a stroke, but the crew treats the person as if blood sugar is low. What kind of failure is that?","opts":[{"t":"Rules-based: a known protocol used on the wrong problem","ok":true,"why":"Correct. Notes: rules-based failure is applying a known rule/protocol that is wrong for this situation (misjudgment or misdiagnosis). Example: treat stroke as low blood sugar."},{"t":"Skills-based: they knew it was a stroke but turned a dial wrong","ok":false,"why":"Incorrect. Skills-based is knowing the right action and executing it wrong (O2 2 vs 15 LPM). Treating stroke as low sugar is the rules-based example."},{"t":"Knowledge-based: a rare overdose and the wrong antidote","ok":false,"why":"Incorrect. That is the notes’ knowledge-based example. Stroke treated as low blood sugar is rules-based."},{"t":"Primary prevention: stopping illness before it starts","ok":false,"why":"Incorrect. Primary prevention examples are vaccines, seatbelts, and public education. This is a rules-based error."}]},{"ch":1,"q":"An alert adult with a partial amputation says no to the hospital. They answer questions clearly. Which statement is true?","opts":[{"t":"They may refuse treatment and transport; check capacity carefully and document the encounter","ok":true,"why":"Correct. Notes: if the patient has decision-making capacity, they can refuse treatment and transport even if seriously injured (example: a partially amputated leg). Assess capacity carefully and document everything. If they later become unconscious or lose capacity, implied consent → treat and transport."},{"t":"You must force transport because the injury is too severe","ok":false,"why":"Incorrect. Capacity allows refusal even if seriously injured — the notes’ example is a partially amputated leg. Assess and document. Implied consent applies if they later lose capacity or become unconscious."},{"t":"Treat under implied consent because any true emergency overrides refusal","ok":false,"why":"Incorrect. Implied consent in Ch 1 is when they later become unconscious or lose capacity. With capacity they may refuse even a partial amputation."},{"t":"Only a DNR can stop transport; refusal is not allowed","ok":false,"why":"Incorrect. Advocacy includes honoring DNR/wishes, but consent is separate: capacity → may refuse treatment and transport. The amputation example is about refusal, not DNR."}]},{"ch":2,"q":"You arrive and see a patient down in the driveway. What is the first safety idea you apply?","opts":[{"t":"Protect yourself first so you can still help — if you become a patient, you help no one","ok":true,"why":"Correct. Notes: protect yourself first so you can help the patient. Includes scene safety, PPE, body substance isolation, safe lifting, and awareness. You cannot help anyone if you become a patient."},{"t":"Start hands-on care before gloves or a scene size-up","ok":false,"why":"Incorrect. Priority order is (1) your safety — gloves on every time (2) partner/crew (3) patient care. You cannot help if you become a patient."},{"t":"Wait to don PPE until the patient is already on the stretcher","ok":false,"why":"Incorrect. Personal safety includes PPE and BSI from the start. Protect yourself first."},{"t":"Skip situational awareness if dispatch said the call was calm","ok":false,"why":"Incorrect. Do a front-door survey, continuously scan, and re-check after tasks. Protect yourself first."}]},{"ch":2,"q":"You walk up to a residence. Before you go in, what is a front-door survey?","opts":[{"t":"Pause at the threshold: look, listen, smell, and read the mood","ok":true,"why":"Correct. Notes: do a quick front-door survey before entering — look, listen, smell, assess the mood. Then continuously scan the whole scene, not just the patient."},{"t":"Save it for after the call, when you restock and write the PCR","ok":false,"why":"Incorrect. Front-door survey is before entering: look, listen, smell, assess the mood. End-of-shift cleaning/restock is a separate infection-control habit."},{"t":"Check only the patient’s pupils from the doorway","ok":false,"why":"Incorrect. The survey is look, listen, smell, and assess the mood — then scan the whole scene, not just the patient."},{"t":"Request hazmat at every doorway even with no fumes","ok":false,"why":"Incorrect. Hazmat is for chemical spills, unknown substances, strong chemical odors/fumes, toxic exposure, or industrial hazardous materials. The survey itself is look, listen, smell, mood."}]},{"ch":2,"q":"Dispatch gives two possible scenes. When do you request police versus hazmat?","opts":[{"t":"Police for violence, weapons, threats, crime, aggression, or suspected abuse. Hazmat for spills, unknown substances, strong chemical fumes, toxic exposure, or industrial hazardous materials","ok":true,"why":"Correct. That is the notes’ split for when to call for help."},{"t":"Call police for chemical fumes and hazmat for suspected abuse","ok":false,"why":"Incorrect. Those are swapped. Police: violence, weapons, threats, crime, aggression, suspected abuse. Hazmat: chemicals, unknown substances, fumes, toxic exposure, industrial hazmat."},{"t":"Request both automatically on every medical call","ok":false,"why":"Incorrect. The notes list specific triggers, not a blanket both-every-time rule."},{"t":"Hazmat first for weapons; police only after you finish patient care","ok":false,"why":"Incorrect. Weapons/violence → police. Do not enter an unsafe scene until it is made safe."}]},{"ch":2,"q":"During a high-stress call, which body changes are fight-or-flight?","opts":[{"t":"Faster heart rate and blood pressure, faster breathing, dilated pupils, blood shifted to muscles/heart/lungs/brain, slower digestion, tense muscles, more sweat, less pain, sharper senses","ok":true,"why":"Correct. The notes list those sympathetic + stress-hormone reactions. Hormone names beyond “stress hormones” are not in the notes."},{"t":"Slower heart rate, pinpoint pupils, blood pooled in skin and gut","ok":false,"why":"Incorrect. Fight-or-flight increases HR/BP, dilates pupils, and redirects blood away from digestion and skin toward large muscles, heart, lungs, and brain."},{"t":"Nightmares and emotional numbness while you are still on scene","ok":false,"why":"Incorrect. Nightmares, flashbacks, and emotional numbness are delayed stress signs (days/weeks/months later), not the immediate fight-or-flight list."},{"t":"Burnout, cynicism, and poorer performance in the first minute","ok":false,"why":"Incorrect. Those are cumulative stress signs from repeated calls over time, not the acute fight-or-flight body list."}]},{"ch":2,"q":"A pale, sweaty, anxious patient has a fast pulse after a near-miss crash but no obvious injury. Why does fight-or-flight matter here?","opts":[{"t":"Those signs can come from stress rather than injury, can mimic shock, and your own stress can cloud decisions","ok":true,"why":"Correct. Notes: explains patient signs that may not be from injury; helps distinguish normal stress from true shock or critical illness; your own stress can impair decision-making."},{"t":"They prove true shock and the need for blood products right away","ok":false,"why":"Incorrect. The point is it can look like shock but may be a normal stress response — you must distinguish them. Blood products are not in these notes."},{"t":"Fight-or-flight happens only in EMTs, never in patients","ok":false,"why":"Incorrect. It is an automatic body reaction to perceived danger and is used to explain common patient signs as well as your own stress."},{"t":"Once you see it, you can stop reassessing the scene","ok":false,"why":"Incorrect. You still continuously reassess. Fight-or-flight explains signs and that your stress can impair decisions."}]},{"ch":2,"q":"A partner has nightmares weeks after a pediatric arrest, while another feels burned out after months of tough calls. Which timing is correct?","opts":[{"t":"Acute hits during or right after the call (anxiety, fast HR, shaking, nausea, feeling overwhelmed). Delayed shows days to months later (nightmares, flashbacks, irritability, numbness). Cumulative builds across many calls (burnout, fatigue, cynicism, worse performance)","ok":true,"why":"Correct. That is the notes’ three-row table. Recognizing them helps prevent long-term issues like PTSD and burnout."},{"t":"Delayed is only during the incident; acute shows up years later","ok":false,"why":"Incorrect. Acute is during or right after. Delayed is days, weeks, or months later."},{"t":"Cumulative is only the first 60 seconds of one call","ok":false,"why":"Incorrect. Cumulative builds from repeated stressful calls over time."},{"t":"All three are treated with a named defusing-team script spelled out in your materials","ok":false,"why":"Incorrect. Defusing-team procedures are flagged as not in the notes. The notes only define acute, delayed, and cumulative stress and that recognizing them helps prevent PTSD and burnout."}]},{"ch":2,"q":"Blood is on a stretcher rail. Nobody has been stuck yet. Which matching is correct?","opts":[{"t":"A pathogen is an organism that can cause disease; contamination means it is sitting on a person or object; exposure is contact that can infect you; transmission is the way it travels","ok":true,"why":"Correct. Examples in the notes: pathogen — HIV, MRSA, influenza (bacteria, virus, fungus, parasite). Contamination — blood on a stretcher, droplets on a doorknob. Exposure — needlestick, blood splash in the eye, inhaling droplets."},{"t":"Contamination means you are already infected","ok":false,"why":"Incorrect. Infection after contact is the exposure idea. Contamination is the pathogen present on a person, object, or surface."},{"t":"Exposure means the blood is only on the stretcher, not on you","ok":false,"why":"Incorrect. Blood on the stretcher is contamination. Exposure is when it enters or contacts your body in a way that can cause infection."},{"t":"A pathogen is just a chemical fume, not a living organism","ok":false,"why":"Incorrect. A pathogen is a disease-causing organism (bacteria, virus, fungus, parasite)."}]},{"ch":2,"q":"A coughing patient is later confirmed to have tuberculosis. Which route matches TB and measles?","opts":[{"t":"Airborne — tiny particles that linger in the air","ok":true,"why":"Correct. Notes: airborne — tiny particles that stay in the air (TB, measles). Droplet is large respiratory droplets, short distance. Vector-borne is mosquitoes/ticks."},{"t":"Droplet — large droplets that travel only a short distance","ok":false,"why":"Incorrect. TB and measles are the airborne examples (tiny particles that stay in the air). Droplet is a different listed route."},{"t":"Vector-borne spread by mosquitoes or ticks","ok":false,"why":"Incorrect. That is the vector-borne definition. TB and measles are airborne examples."},{"t":"Indirect contact from a contaminated object only","ok":false,"why":"Incorrect. Indirect contact is touching a contaminated object. TB/measles are listed under airborne."}]},{"ch":2,"q":"You have no known diagnosis yet. What do you use on every patient under standard (universal) precautions?","opts":[{"t":"Hand hygiene and gloves for contact — treat every patient as possibly infectious","ok":true,"why":"Correct. Notes: assume every patient may be infectious. Used every time: hand hygiene; gloves for patient contact. Add eyes/mask/gown/N95 as needed."},{"t":"An N95 on every medical call, even with no airborne concern","ok":false,"why":"Incorrect. N95 is added for known or suspected airborne disease (must be fit-tested). Every-time items are hand hygiene and gloves."},{"t":"Gown plus face shield as the every-call minimum","ok":false,"why":"Incorrect. Gowns when significant soiling is likely; eyes/face for splash, spray, or airway procedures. Minimum every time: hygiene + gloves."},{"t":"Mouth-to-mouth instead of a pocket mask","ok":false,"why":"Incorrect. Barrier devices (pocket mask or BVM with one-way valve) are always preferred over mouth-to-mouth."}]},{"ch":2,"q":"Your gloves just came off after a diarrhea call. When is soap and water required instead of alcohol sanitizer?","opts":[{"t":"Hands are soiled, or after norovirus or C. diff. Sanitizer ≥60% is fine if hands are not visibly dirty","ok":true,"why":"Correct. Hand hygiene: before and after every patient, after removing gloves, after touching contaminated items. Alcohol-based sanitizer (≥60%) when hands are not visibly dirty. Soap and water when soiled or after norovirus/C. diff."},{"t":"Sanitizer is required after C. diff; soap is only for already-clean hands","ok":false,"why":"Incorrect. Opposite. Soap and water after soiled hands or diarrhea cases (norovirus, C. diff). Sanitizer ≥60% when not visibly dirty."},{"t":"Once sanitizer is on the truck, never use soap","ok":false,"why":"Incorrect. Soap and water are required when soiled or after norovirus/C. diff."},{"t":"Pour bleach on your skin if soap is not nearby","ok":false,"why":"Incorrect. After exposure, do not squeeze, suck, or apply bleach. Soap and water (or flush mucous membranes)."}]},{"ch":2,"q":"You are putting PPE on before a messy airway. What is the donning order?","opts":[{"t":"Hand hygiene, then gown, then mask/respirator, then eye protection, then gloves","ok":true,"why":"Correct. That is the listed donning sequence."},{"t":"Gloves, then gown, then eyes, then mask, then hygiene","ok":false,"why":"Incorrect. That is closer to doffing (gloves, gown, eyes, mask, then hygiene). Donning is hygiene, gown, mask, eyes, gloves."},{"t":"Mask, then gloves, then gown, then hygiene, then eyes","ok":false,"why":"Incorrect. Donning is hand hygiene → gown → mask/respirator → eye protection → gloves."},{"t":"Gloves first, then the rest in any order","ok":false,"why":"Incorrect. Gloves are last when donning so they go over the gown cuffs. Order: hygiene, gown, mask, eyes, gloves."}]},{"ch":2,"q":"The call is over and you are taking PPE off. What is the doffing order?","opts":[{"t":"Gloves, then gown, then eye protection, then mask/respirator, then hand hygiene","ok":true,"why":"Correct. That is the listed doffing sequence — dirtiest items first, mask last, then hygiene."},{"t":"Hygiene, then gown, then mask, then eyes, then gloves","ok":false,"why":"Incorrect. That is donning. Doffing is gloves → gown → eyes → mask → hand hygiene."},{"t":"Mask, then gloves, then gown, then eyes, and skip hygiene","ok":false,"why":"Incorrect. Mask comes off after eyes, and hand hygiene is last. Order: gloves, gown, eyes, mask, hygiene."},{"t":"Yank the mask off first so you can breathe, then take off gloves","ok":false,"why":"Incorrect. Mask/respirator is step 4 of 5 (after gloves, gown, and eyes) so you do not contaminate your face; then hand hygiene."}]},{"ch":2,"q":"You just took a needlestick while starting care. What is the immediate sequence?","opts":[{"t":"Hand the patient to another provider; wash with soap and water; do not squeeze, suck, or use bleach; report right away; get evaluated, ideally within hours","ok":true,"why":"Correct. Immediate: (1) hand off care (2) wash soap and water for needlestick/skin (3) flush eyes/mucous membranes with water or saline (4) do not squeeze, suck, or apply bleach. Then report immediately; medical evaluation right away (ideally within hours). PEP is most effective when started quickly; exact PEP drugs/hour windows are not in the notes. Evaluation/treatment at no cost to you."},{"t":"Finish the call, then squeeze the wound and put bleach on it","ok":false,"why":"Incorrect. Hand off care immediately. Do not squeeze, suck, or apply bleach. Wash with soap and water and report immediately."},{"t":"Force the source patient to give you a new blood sample","ok":false,"why":"Incorrect. You cannot force a new blood sample in most cases. Some states allow testing existing blood or testing under specific legal conditions."},{"t":"Wait until end of shift to report; PEP can wait until next week","ok":false,"why":"Incorrect. Report immediately; evaluate ideally within hours. Time matters — PEP is most effective when started quickly."}]},{"ch":2,"q":"You are first-arriving at a crash with a leaking tanker nearby. Which parking and approach rule is correct?","opts":[{"t":"Stay at least 100 feet from fires, crashes, and hazmat. First unit parks upstream (before the crash); later units park downstream (past it). For hazmat, stay uphill and upwind. Use the ERG","ok":true,"why":"Correct. Those are the numbered scene-safety facts in the notes."},{"t":"Park 10 feet away, downhill and downwind","ok":false,"why":"Incorrect. Park at least 100 feet (or more for hazmat). Stay uphill and upwind."},{"t":"The first-arriving unit parks past the wreck (downstream) to leave room","ok":false,"why":"Incorrect. First on scene parks before the crash (upstream) to protect the scene. Second or later parks past (downstream)."},{"t":"Walk into the fire to find the patient before firefighters arrive","ok":false,"why":"Incorrect. Do not enter until fire personnel say it is safe. Stay clear of smoke and fire; watch collapse, explosion, toxic fumes."}]},{"ch":2,"q":"A badly hurt patient is awake. How should you talk to them?","opts":[{"t":"Give your name, orient them, be honest without being cruel, leave room for hope but not false hope, and notify family as soon as you reasonably can","ok":true,"why":"Correct. Notes also: avoid appearing sad or grim; address initial refusal calmly. Example tone: “You’re seriously hurt, but we’re doing everything we can and getting you to the hospital quickly.” Do not completely recommend an option."},{"t":"Look grim, promise they will be fine, and skip your name","ok":false,"why":"Incorrect. Avoid appearing sad or grim. Do not give false hope. Introduce yourself and explain what you are doing."},{"t":"Strip away all hope so they grasp how bad it is","ok":false,"why":"Incorrect. Allow for hope — do not take away all hope; do not give false hope."},{"t":"Hold off on notifying family until after they leave the hospital","ok":false,"why":"Incorrect. Locate and notify family as soon as practical."}]},{"ch":2,"q":"A family member bargains, then later seems to deny the injury. Which statement about the grief stages is true?","opts":[{"t":"The five stages are denial, anger, bargaining, depression, and acceptance — people may skip stages or move back and forth","ok":true,"why":"Correct. EMT role: respect and empathy; honest but compassionate; allow family with the patient when possible; avoid false hope or empty platitudes (“Everything will be fine”); support family even after care ends; stay professional."},{"t":"Acceptance always comes first, then only denial, in that fixed order","ok":false,"why":"Incorrect. Listed order is denial, anger, bargaining, depression, acceptance — and people do not always go through them in order."},{"t":"Bargaining is not one of the five stages","ok":false,"why":"Incorrect. Bargaining is stage 3 (“If I can just make it until…” or trying to make deals)."},{"t":"You should tell the family “Everything will be fine” as the required line","ok":false,"why":"Incorrect. Avoid false hope or empty platitudes (“Everything will be fine”)."}]},{"ch":3,"q":"Which practice usually keeps a provider out of legal trouble?","opts":[{"t":"Acting in good faith and matching an appropriate standard of care","ok":true,"why":"Correct. Opening line of the notes: a healthcare provider usually avoids legal exposure if they act in good faith and according to an appropriate standard of care."},{"t":"Never touching the patient at all","ok":false,"why":"Incorrect. The notes say good faith plus an appropriate standard of care — not refusing to treat."},{"t":"Following social-media tips instead of protocols","ok":false,"why":"Incorrect. Standard of care is what a reasonably prudent EMT with similar training would do. Breaking confidentiality on social media can mean legal action, loss of certification, and termination."},{"t":"Leaving after a verbal goodbye with no handoff","ok":false,"why":"Incorrect. That risks abandonment (unilateral termination without consent and without transfer to equal or higher level). Legal protection is good faith + appropriate standard of care."}]},{"ch":3,"q":"You ask to check a blood pressure. The patient is alert and holds out an arm. What kind of consent is that?","opts":[{"t":"Expressed: the person has capacity and agrees, verbally or by action, after being told the plan, risks, and benefits","ok":true,"why":"Correct. Example: ask to check BP and start an IV; patient says yes or holds out an arm."},{"t":"Implied: treat an unresponsive crash patient because a reasonable person would want care","ok":false,"why":"Incorrect. That is implied consent (unresponsive/severely altered, true emergency, reasonable-person assumption)."},{"t":"Involuntary: a court order or mental-health hold against their will","ok":false,"why":"Incorrect. That is involuntary consent."},{"t":"A living will that lists a ventilator preference","ok":false,"why":"Incorrect. A living will is an advanced directive. Expressed consent is an alert patient with capacity agreeing (verbal or non-verbal), and it must be informed."}]},{"ch":3,"q":"Which statement about informed and expressed consent is true?","opts":[{"t":"Informed consent is a fuller form of expressed consent (nature, risks, benefits, alternatives). All informed consent is expressed; not all expressed consent is fully informed","ok":true,"why":"Correct. Example of informed: explain risks of refusing transport for chest pain and they still agree to go."},{"t":"Every expressed agreement is already fully informed, and informed consent is never expressed","ok":false,"why":"Incorrect. Opposite. All informed consent is expressed; not all expressed consent is fully informed."},{"t":"Informed consent applies only when the patient is unresponsive","ok":false,"why":"Incorrect. Unresponsive patients fall under implied consent. Informed is a complete form of expressed consent."},{"t":"Informed consent means capacity is no longer required","ok":false,"why":"Incorrect. Expressed/informed require alert, oriented, decision-making capacity."}]},{"ch":3,"q":"You find an unconscious driver after a crash. Why may you treat and transport?","opts":[{"t":"Implied consent: they cannot consent, it is a true emergency, and a reasonable person would want emergency care","ok":true,"why":"Correct. Example: unconscious crash patient — treat and transport. Key: lack of capacity + emergency → implied consent and treat."},{"t":"They said “yes” or held out an arm","ok":false,"why":"Incorrect. That is expressed consent."},{"t":"A signed living will is already on the clipboard","ok":false,"why":"Incorrect. A living will alone is often not enough for EMS to withhold care. Implied consent is for patients who cannot consent in a true emergency."},{"t":"A family member said to treat even though an alert patient with capacity is refusing","ok":false,"why":"Incorrect. Capacity → can refuse. You may not share with family or treat on their say-so unless they are the legal decision-maker / have permission. Implied is for no capacity + emergency."}]},{"ch":3,"q":"A suicidal patient is severely altered and refuses to go. Law enforcement places a hold. What kind of consent is this?","opts":[{"t":"Involuntary: care against their will under legal authority","ok":true,"why":"Correct. Involuntary: against the patient’s will under legal authority (mental health hold, court order, or lacks capacity and is a danger to self/others)."},{"t":"A capacity refusal of a bandage by an alert adult","ok":false,"why":"Incorrect. Capacity → they can refuse. Involuntary needs legal authority (hold, court, danger to self/others)."},{"t":"Implied consent for an unconscious crash patient with no family","ok":false,"why":"Incorrect. That is the implied-consent example (unresponsive, true emergency)."},{"t":"Expressed non-verbal agreement — holding out an arm for a cuff","ok":false,"why":"Incorrect. That is the expressed-consent example (non-verbal agreement)."}]},{"ch":3,"q":"An adult with capacity does not want assessment or the hospital, even though they might die. What may they refuse?","opts":[{"t":"Assessment, treatment, or transport — even if refusal could cause serious harm or death","ok":true,"why":"Correct. A competent adult with capacity may refuse even if refusal may result in serious harm or death. If they lack capacity and it is an emergency, treat under implied consent."},{"t":"Nothing — a serious injury always forces transport","ok":false,"why":"Incorrect. Capacity allows refusal even if they may die. You explain risks, document, and cannot force treatment if they have capacity."},{"t":"Transport only; you may still force an assessment","ok":false,"why":"Incorrect. They may refuse assessment, treatment, or transport."},{"t":"Refusal is valid only after a POLST is signed on scene","ok":false,"why":"Incorrect. POLST/DNR is about withholding resuscitation if heart or breathing stops. Refusal is a capacity + informed + voluntary decision."}]},{"ch":3,"q":"You are deciding whether this adult can refuse. What four things should they be able to do?","opts":[{"t":"Understand the information, appreciate the consequences, reason through the choice, and communicate a clear decision","ok":true,"why":"Correct. Those are the four capacity bullets in the notes."},{"t":"Name all 33 vertebrae and every facial bone","ok":false,"why":"Incorrect. Capacity is understand, appreciate consequences, reason, and communicate a choice — not an anatomy quiz."},{"t":"Only say their name; they need not grasp consequences","ok":false,"why":"Incorrect. Appreciating consequences is required, along with understanding, reasoning, and communicating a choice."},{"t":"Let family decide even though they are alert and capable","ok":false,"why":"Incorrect. If they have capacity, they decide. Family is not a substitute unless they are the legal decision-maker / have permission."}]},{"ch":3,"q":"Before you accept a refusal, which requirements must all be met?","opts":[{"t":"Capacity; informed of the condition, recommended care, and risks of refusing; voluntary; a signed refusal form when possible","ok":true,"why":"Correct. You must also explain risks, offer alternatives when appropriate, contact medical control for high-risk refusals, and document what you told them, responses, capacity, witnesses, and signature."},{"t":"Skip the capacity check if they are angry","ok":false,"why":"Incorrect. Capacity is required for a valid refusal. Anger alone is not a substitute."},{"t":"Skip the risk talk if they already seem to know","ok":false,"why":"Incorrect. They must be informed of condition, recommended care, and risks of refusing."},{"t":"A coerced “yes” from a relative counts as the patient’s refusal","ok":false,"why":"Incorrect. Refusal must be voluntary (not forced or coerced) and from a patient with capacity (or the legal decision-maker)."}]},{"ch":3,"q":"They have signed a refusal. What do you still do before you leave?","opts":[{"t":"Reassess once more; confirm they still understand and are refusing; tell them to call 911 if they worsen; leave them with a responsible person if you can; keep the signed form or document a refusal to sign; notify medical control if protocol says so","ok":true,"why":"Correct. That is the “before leaving” list."},{"t":"Leave as soon as they shake their head, with no recheck","ok":false,"why":"Incorrect. Reassess one final time and confirm they still understand and are refusing."},{"t":"Load them anyway if they will not sign the form","ok":false,"why":"Incorrect. If they have capacity you cannot force treatment. Get a signed refusal or document refusal to sign."},{"t":"Tell them not to call 911 again","ok":false,"why":"Incorrect. Encourage them to call 911 again if their condition worsens."}]},{"ch":3,"q":"When is physical restraint allowed?","opts":[{"t":"They are a danger to self or others; it is needed to protect the patient, crew, or public; it is needed so you can assess or treat; less-restrictive options have already failed","ok":true,"why":"Correct. Restraint is a last resort. Safety, monitoring, and documentation are critical."},{"t":"They are annoying or refuse a non-emergency bandage","ok":false,"why":"Incorrect. Allowed only for danger, protection, to allow care, and after less-restrictive options failed — last resort."},{"t":"To punish them for yelling at the crew","ok":false,"why":"Incorrect. Not a listed reason. Least restrictive method; never for punishment."},{"t":"As the first step, before you talk to them","ok":false,"why":"Incorrect. Less restrictive options must have failed. Last resort."}]},{"ch":3,"q":"Which restraint practices are not allowed?","opts":[{"t":"Never prone (face-down); never hog-tie; do not block breathing or circulation","ok":true,"why":"Correct. Also: least restrictive method; consult medical control prior if possible; continuously monitor ABCs and mental status; document thoroughly; involve LE when possible."},{"t":"Face-down and hog-tie are the preferred EMS methods","ok":false,"why":"Incorrect. Never prone; never hog-tie. Soft restraints (padded/Velcro) are preferred for EMS."},{"t":"Once straps are on, you may ignore ABCs","ok":false,"why":"Incorrect. Continuously monitor ABCs and mental status."},{"t":"Skip documentation if law enforcement is there","ok":false,"why":"Incorrect. Document thoroughly; involve LE when possible — both, not a trade."}]},{"ch":3,"q":"Which statement about restraint types is true?","opts":[{"t":"Soft padded/Velcro restraints are preferred for EMS; handcuffs are usually law enforcement only; chemical sedation is an ALS/paramedic skill, not normal EMT scope","ok":true,"why":"Correct. That is the types/chemical section."},{"t":"Handcuffs are the first-line EMT restraint","ok":false,"why":"Incorrect. Hard restraints (handcuffs) are usually law enforcement only. Soft restraints are preferred for EMS."},{"t":"Chemical restraint is a routine EMT standing order","ok":false,"why":"Incorrect. Chemical restraint is an ALS/paramedic skill — not in normal EMT scope."},{"t":"Anyone may hog-tie if the patient is strong","ok":false,"why":"Incorrect. Never hog-tie. Use least restrictive; soft restraints preferred for EMS."}]},{"ch":3,"q":"Which patient information is protected?","opts":[{"t":"Identifiers such as name, address, and phone; history, findings, and vitals; what you did and how they responded; anything that ties the person to their condition","ok":true,"why":"Correct. Share only with those who have a legitimate need to know for care, or when required by law. The chapter does not name a federal privacy statute."},{"t":"Only the name; vitals are public","ok":false,"why":"Incorrect. Vitals, findings, history, treatment, and anything that identifies the patient and their condition are protected."},{"t":"Nothing is protected once they called 911","ok":false,"why":"Incorrect. Information is private. If in doubt, do not share."},{"t":"Social media is fine if you drop the last name","ok":false,"why":"Incorrect. You may not share on social media. Breaking confidentiality can mean legal action, loss of certification, and termination."}]},{"ch":3,"q":"A nurse, a reporter, and a cousin all want details. When is sharing allowed?","opts":[{"t":"With the care team (hospital, medical control, receiving facility); when the law requires it (certain crimes, GSW, abuse, public health); with a valid court order/subpoena; with the patient’s written permission","ok":true,"why":"Correct. Those are the “may share” bullets."},{"t":"Share with the media if the story would interest the public","ok":false,"why":"Incorrect. You may not share with the media."},{"t":"Share with friends or family on every call by default","ok":false,"why":"Incorrect. Not with friends/family unless permission or they are the legal decision-maker."},{"t":"Chat about it with bystanders who are not part of care","ok":false,"why":"Incorrect. Casual conversation with people not in care is listed under “may not.”"}]},{"ch":3,"q":"A reporter at the curb asks what happened. What do you do?","opts":[{"t":"Do not share with the media. If you are unsure, do not share","ok":true,"why":"Correct. May not: friends/family (unless permission or legal decision-maker), media, social media, casual talk. Breaking confidentiality can mean legal action, loss of certification, and termination."},{"t":"Read off the name and vitals so the public stays informed","ok":false,"why":"Incorrect. Name and vitals are protected. Media is a “may not share” example."},{"t":"Post a scene photo after cropping the face","ok":false,"why":"Incorrect. Social media is listed as not allowed."},{"t":"Tell sidewalk bystanders the diagnosis because they already saw the ambulance","ok":false,"why":"Incorrect. Casual talk with people not involved in care is not allowed."}]},{"ch":3,"q":"Which pairing of advanced directives is correct?","opts":[{"t":"A living will lists which life-sustaining treatments they do or do not want (ventilator, feeding tube). A DNR means no CPR/advanced resuscitation if the heart or breathing stops","ok":true,"why":"Correct. Durable power of attorney names a proxy/agent. POLST/MOLST is a medical order with specific EMS/hospital instructions, often more detailed than a basic DNR."},{"t":"A living will equals a DNR and always stops EMS care","ok":false,"why":"Incorrect. A living will alone is often not enough for EMS to withhold emergency care — usually need a specific DNR or POLST."},{"t":"A DNR is the paper that names a proxy to make all decisions","ok":false,"why":"Incorrect. Naming a proxy is the durable power of attorney for health care. DNR is no CPR/advanced resuscitation if heart or breathing stops."},{"t":"A POLST is only a diary of how the patient feels","ok":false,"why":"Incorrect. POLST/MOLST is a medical order with specific EMS/hospital instructions."}]},{"ch":3,"q":"You find a fridge living will but no DNR or POLST. The patient is in cardiac arrest. What do you do?","opts":[{"t":"A living will alone is often not enough to withhold emergency care — you usually need a specific DNR or POLST. When unsure, start treatment and call medical control","ok":true,"why":"Correct. Follow a valid DNR or POLST if present and appears legitimate. If any question, resuscitate and let the hospital sort it out."},{"t":"Stop CPR based on a living will by itself","ok":false,"why":"Incorrect. Living will alone is often not enough for EMS to withhold. Usually need a specific DNR or POLST."},{"t":"Wait for the durable power of attorney to arrive before you start care","ok":false,"why":"Incorrect. When in doubt, begin treatment and contact medical control. A POA names a proxy; it does not by itself tell you to wait."},{"t":"Throw the living will away; advanced directives never apply to EMS","ok":false,"why":"Incorrect. You must follow a valid DNR or POLST if present and legitimate. Living wills are weaker for EMS withholding decisions."}]},{"ch":3,"q":"The patient is awake, has capacity, and asks for care even though a DNR is in the chart. Whose wishes win?","opts":[{"t":"The patient’s current wishes override the written directive","ok":true,"why":"Correct. Notes: if conscious with capacity, current wishes override the written directive."},{"t":"The written DNR always wins, even if they ask for care now","ok":false,"why":"Incorrect. Current wishes of a conscious patient with capacity override the written directive."},{"t":"Whoever the media wants to interview","ok":false,"why":"Incorrect. Media is not a decision-maker. Conscious + capacity → current wishes override the paper."},{"t":"A bystander, if they talk louder","ok":false,"why":"Incorrect. Capacity patient’s current wishes override the written directive — not a bystander."}]},{"ch":3,"q":"Which signs suggest death but are not enough by themselves to withhold CPR?","opts":[{"t":"They do not respond, they are not breathing, they have no pulse, and the pupils are fixed and dilated","ok":true,"why":"Correct. Presumptive signs suggest death but are not enough by themselves to withhold resuscitation."},{"t":"Dependent lividity, rigidity, decomposition, or a decapitation injury","ok":false,"why":"Incorrect. Those are definitive signs (obvious death — do not resuscitate)."},{"t":"A signed living will sitting there with no DNR","ok":false,"why":"Incorrect. Living will alone is often not enough to withhold. Presumptive signs are unresponsiveness, apnea, pulselessness, fixed dilated pupils."},{"t":"Cynicism and burnout after a stretch of hard calls","ok":false,"why":"Incorrect. Those are cumulative stress signs from Chapter 2, not signs of death."}]},{"ch":3,"q":"Which findings are definitive signs of death — obvious death, do not resuscitate?","opts":[{"t":"Dependent lividity; rigor mortis; putrefaction/decomposition; injuries incompatible with life (decapitation, massive trauma)","ok":true,"why":"Correct. Need a definitive sign or a valid DNR/POLST before withholding. When in doubt, start CPR."},{"t":"Unresponsive and pulseless, with nothing else","ok":false,"why":"Incorrect. Those are presumptive and not enough alone."},{"t":"Fixed, dilated pupils with no other finding","ok":false,"why":"Incorrect. That is a presumptive sign, not definitive."},{"t":"Anger at the crew while they are bargaining","ok":false,"why":"Incorrect. Anger/bargaining are grief stages (Ch 2), not definitive signs of death."}]},{"ch":3,"q":"No pulse, no breathing, pupils fixed and dilated. No definitive signs, no valid DNR/POLST. What do you do?","opts":[{"t":"Those presumptive signs are not enough by themselves, so start CPR if you are unsure","ok":true,"why":"Correct. You need a definitive sign or a valid DNR/POLST before withholding resuscitation. When in doubt, start CPR / begin treatment and contact medical control."},{"t":"Hold CPR because four presumptive signs prove death","ok":false,"why":"Incorrect. Presumptive signs are not enough by themselves."},{"t":"Wait for the medical examiner before you start CPR","ok":false,"why":"Incorrect. ME/coroner rules apply after death (don’t move the body until cleared). When in doubt on a possible salvageable patient, start CPR."},{"t":"Call the media before you start care","ok":false,"why":"Incorrect. Do not share with the media. When in doubt, start CPR."}]},{"ch":3,"q":"When do you involve the medical examiner/coroner, and what is first?","opts":[{"t":"Unexpected death or previously good health; trauma, violence, accident, or suicide; suspicious/unusual; no recent attending physician. Notify law enforcement first. Do not move the body until the ME/coroner clears it","ok":true,"why":"Correct. That is the ME/coroner section."},{"t":"After you have already moved the body into the ambulance","ok":false,"why":"Incorrect. Do not move the body until the ME/coroner clears it. Notify law enforcement first."},{"t":"Every expected hospice death with a valid DNR, as the only listed trigger","ok":false,"why":"Incorrect. Listed triggers are unexpected/good health, trauma/violence/accident/suicide, suspicious, no recent attending physician."},{"t":"Call a reporter first so the scene is documented","ok":false,"why":"Incorrect. Notify law enforcement first. Do not share with the media."}]},{"ch":3,"q":"What is the standard of care?","opts":[{"t":"The actions a reasonably prudent EMT with similar training and experience would take in the same kind of situation","ok":true,"why":"Correct. That is the definition given."},{"t":"Whatever the loudest relative demands","ok":false,"why":"Incorrect. Standard of care is the reasonably prudent EMT with similar training/experience in the same or similar situation."},{"t":"Whatever you once saw on social media","ok":false,"why":"Incorrect. Social media is not the standard — and posting about patients is forbidden."},{"t":"The maximum ALS skill, even if it is outside your EMT scope","ok":false,"why":"Incorrect. Avoid negligence by following protocols and staying in scope. Standard is similar training and experience."}]},{"ch":3,"q":"A lawsuit claims negligence. Which four elements must all be present?","opts":[{"t":"A duty to act, a breach of that duty, actual harm, and a causal link","ok":true,"why":"Correct. Failure to meet the standard of care that results in harm. All four required."},{"t":"Duty and breach only — harm is not required","ok":false,"why":"Incorrect. Damages (harm) and causation are also required. All four."},{"t":"A causal link plus a news story, with no duty","ok":false,"why":"Incorrect. Duty to act is element 1. Media is irrelevant to the four elements."},{"t":"Abandonment together with a living will","ok":false,"why":"Incorrect. Abandonment is a separate concept. Negligence’s four elements are duty, breach, damages, causation."}]},{"ch":3,"q":"Which situation is abandonment?","opts":[{"t":"You stop care on your own, without consent and without handing off to equal or higher level, while the patient still needs care","ok":true,"why":"Correct. Avoid it: continuous care until proper handoff; never leave a patient who still requires care."},{"t":"A proper verbal handoff to someone of equal or higher level plus a finished PCR","ok":false,"why":"Incorrect. That is how you transfer care (also in Ch 4) — the opposite of abandonment."},{"t":"A valid informed refusal from a capable patient who signed","ok":false,"why":"Incorrect. Documented informed refusal is how you avoid abandonment when they decline care."},{"t":"Waiting for police on an unsafe scene before you enter","ok":false,"why":"Incorrect. If the scene is not safe, do not enter until made safe (Ch 2). Abandonment is leaving a patient who still needs care without consent or proper handoff."}]},{"ch":3,"q":"Which habits keep you clear of both negligence and abandonment?","opts":[{"t":"Follow protocols and stay in scope; keep care going until a proper handoff; document informed refusals; assess and document; never leave a patient who still needs care","ok":true,"why":"Correct. Key point: meet the standard of care, never leave a patient who still needs you, and document everything."},{"t":"Leave as soon as the ambulance doors close and finish the PCR later if you remember","ok":false,"why":"Incorrect. Transfer is official only after verbal handoff to equal or higher plus a completed PCR (Ch 4). Never leave someone who still needs care."},{"t":"Try out-of-scope skills if they look useful","ok":false,"why":"Incorrect. Stay within your scope and follow protocols."},{"t":"Skip the refusal paperwork if they seem sure","ok":false,"why":"Incorrect. Obtain and document informed refusals when appropriate (signature or refusal to sign)."}]},{"ch":3,"q":"You are unsure whether an advanced directive applies, or whether the patient is dead. What is the repeated rule?","opts":[{"t":"Begin treatment / start CPR and contact medical control; if any question remains, resuscitate and let the hospital sort it out","ok":true,"why":"Correct. Follow only a valid, present, applicable DNR/POLST. Presumptive signs are not enough. Doubt → treat."},{"t":"Hold care until the media interprets the living will","ok":false,"why":"Incorrect. Living will alone is often not enough; media must not get information. Doubt → resuscitate."},{"t":"Treat any unsigned fridge note as a valid DNR","ok":false,"why":"Incorrect. Follow a valid DNR or POLST if present and appears legitimate — not any scrap of paper."},{"t":"Wait for the ME before starting CPR when you have only presumptive signs","ok":false,"why":"Incorrect. Presumptive signs alone are not enough to withhold. When in doubt, start CPR."}]},{"ch":3,"q":"A high-risk refusal is unfolding. Besides explaining risks, what else should you do?","opts":[{"t":"Offer other options when they fit, call medical control on high-risk refusals, and write down what you said, how they answered, capacity, witnesses, and the signature","ok":true,"why":"Correct. Valid refusal still needs capacity, informed, voluntary, and a signature when possible."},{"t":"Load them against their will just because the refusal is high-risk","ok":false,"why":"Incorrect. If they have capacity you cannot force treatment. Contact medical control for high-risk refusals."},{"t":"Ask a reporter to help talk them into going","ok":false,"why":"Incorrect. Do not share with the media."},{"t":"Skip medical control because online orders are only for pain medications","ok":false,"why":"Incorrect. You must contact medical control for high-risk refusals (and Ch 1 says use online when unsure, unusual, or you need extra authorization)."}]},{"ch":4,"q":"You sit down to get the story. In what order should you ask questions?","opts":[{"t":"Start open-ended (“What happened?”), then use yes/no questions for details","ok":true,"why":"Correct. Build trust and encourage the patient to share. Also: eye contact, speak clearly, listen actively, show respect. Adjust for age, culture, hearing/vision impairment, or anxiety."},{"t":"Closed-ended only; never let them tell the story","ok":false,"why":"Incorrect. Open-ended first, then closed-ended for specifics."},{"t":"Lead with a question that already names chest pain","ok":false,"why":"Incorrect. Avoid leading questions (“The pain is in your chest, right?”). Open-ended first."},{"t":"Lead with medical jargon so you sound professional","ok":false,"why":"Incorrect. Avoid medical jargon (“You have tachycardia and dyspnea”). Use language they can understand."}]},{"ch":4,"q":"You say, “You said you don’t drink, but I smell alcohol.” What technique is that?","opts":[{"t":"Confrontation — calmly point out an inconsistency","ok":true,"why":"Correct. That is the notes’ confrontation example."},{"t":"Interpretation — putting their meaning into your words","ok":false,"why":"Incorrect. Interpretation example: “It sounds like you’re worried this is a heart attack.” Confrontation points out an inconsistency."},{"t":"Explanation — describing what is going on","ok":false,"why":"Incorrect. Explanation example: “I’m putting this oxygen mask on to help you breathe.”"},{"t":"Summary — repeat the main points","ok":false,"why":"Incorrect. Summary example: “Pain for two hours, started while walking, worse with deep breaths — correct?”"}]},{"ch":4,"q":"You say, “It sounds like you’re worried this is a heart attack.” What technique is that?","opts":[{"t":"Interpretation — putting their meaning into your words","ok":true,"why":"Correct. That is the notes’ interpretation example."},{"t":"Confrontation — calling out a mismatch","ok":false,"why":"Incorrect. Confrontation is “You said you don’t drink, but I smell alcohol.”"},{"t":"Explanation — describing your action","ok":false,"why":"Incorrect. Explanation is “I’m putting this oxygen mask on to help you breathe.”"},{"t":"Summary — walking back through the story","ok":false,"why":"Incorrect. Summary repeats main points back for confirmation."}]},{"ch":4,"q":"You say, “I’m putting this oxygen mask on to help you breathe.” What technique is that?","opts":[{"t":"Explanation — describing what is going on","ok":true,"why":"Correct. That is the notes’ explanation example."},{"t":"Summary — walking back through the history","ok":false,"why":"Incorrect. Summary is repeating main points of the story, not describing a treatment you are starting."},{"t":"Confrontation — calling out a mismatch","ok":false,"why":"Incorrect. Confrontation is calmly pointing out a mismatch (alcohol example)."},{"t":"False reassurance — one of the listed things to avoid","ok":false,"why":"Incorrect. False reassurance is “Don’t worry, you’re going to be completely fine.” This line is the explanation example."}]},{"ch":4,"q":"You say, “Pain for two hours, started while walking, worse with deep breaths — correct?” What technique is that?","opts":[{"t":"Summary — restating the main points in brief","ok":true,"why":"Correct. That is the notes’ summary example."},{"t":"A leading question, which you are supposed to avoid","ok":false,"why":"Incorrect. A leading question is “The pain is in your chest, right?” Summary confirms the story you already heard."},{"t":"Handing out advice","ok":false,"why":"Incorrect. Giving advice example is “You should really quit smoking.”"},{"t":"A judgmental remark","ok":false,"why":"Incorrect. Judgmental example is “Why did you wait so long to call us?”"}]},{"ch":4,"q":"Which group is a listed thing to avoid while talking with a patient?","opts":[{"t":"Reassuring them they will be fine, leading questions, unsolicited advice, cutting them off, jargon, judgmental remarks, and talking over them with your partner","ok":true,"why":"Correct. Examples in the notes: “Don’t worry, you’re going to be completely fine”; “The pain is in your chest, right?”; “You should really quit smoking”; “You have tachycardia and dyspnea”; “Why did you wait so long to call us?”"},{"t":"Open-ended prompts such as “What happened?”","ok":false,"why":"Incorrect. Open-ended first is recommended."},{"t":"Eye contact and using the name they go by","ok":false,"why":"Incorrect. Those are golden rules 1 and 2."},{"t":"Facing a hearing-impaired patient so they can see your lips","ok":false,"why":"Incorrect. That is golden rule 8."}]},{"ch":4,"q":"Which set matches the 10 golden rules for calming a patient?","opts":[{"t":"Make eye contact; give your name and use theirs; be truthful; use words they understand; be careful when you talk about them; watch body language; speak slowly and clearly; face patients who cannot hear well; give time to answer; stay calm and confident","ok":true,"why":"Correct. Those are the 10 golden rules for calming and reassuring patients."},{"t":"Talk across them with your partner and lean on jargon","ok":false,"why":"Incorrect. Those are listed as things to avoid, not golden rules."},{"t":"Lead with advice and leading questions","ok":false,"why":"Incorrect. Avoid giving advice and leading questions."},{"t":"Say their full name on the radio as a courtesy","ok":false,"why":"Incorrect. Do not say the patient’s name over the radio. Golden rule 2 is provide your name and use their proper name when talking with them."}]},{"ch":4,"q":"Which radio and verbal-report practice is correct?","opts":[{"t":"Keep it brief, clear, and professional; use plain English (avoid codes unless required); do not say the patient’s name on the radio; repeat orders back to confirm","ok":true,"why":"Correct. 10-codes and local radio templates are not in the notes."},{"t":"Always use 10-codes; a full list is provided","ok":false,"why":"Incorrect. Use plain English (avoid codes unless required). 10-codes are flagged as not in the notes."},{"t":"Repeat the patient’s name on the air so the hospital can chart it","ok":false,"why":"Incorrect. Do not say the patient’s name over the radio."},{"t":"Never repeat a physician order — guess if you missed it","ok":false,"why":"Incorrect. Repeat orders back to confirm."}]},{"ch":4,"q":"You are notifying the hospital. What does SBAR stand for?","opts":[{"t":"Situation, Background, Assessment, then Recommendation / ETA","ok":true,"why":"Correct. That is the format given. CHART/SOAP are noted as not the format given."},{"t":"Subjective, Breath sounds, Allergies, then Rx","ok":false,"why":"Incorrect. SBAR is Situation, Background, Assessment, Recommendation/ETA."},{"t":"Scene, Blood pressure, Airway, then Response","ok":false,"why":"Incorrect. SBAR is Situation, Background, Assessment, Recommendation/ETA."},{"t":"SOAP only — SBAR is not used","ok":false,"why":"Incorrect. SBAR is the format given. Full CHART/SOAP formats are flagged as not in the notes."}]},{"ch":4,"q":"You are finishing the run report. What belongs on a PCR, and what kind of record is it?","opts":[{"t":"A legal document / permanent medical record. Include demographics, chief complaint, history, vital signs, assessment findings, treatments, response to treatment, and times. Facts only","ok":true,"why":"Correct. Write objectively — no opinions or judgments. If it isn’t documented, it didn’t happen."},{"t":"A throwaway scratch pad","ok":false,"why":"Incorrect. It is a legal document that becomes part of the permanent medical record."},{"t":"Opinions and judgments instead of facts","ok":false,"why":"Incorrect. Write objectively — facts only, no opinions or judgments."},{"t":"Treatments and times left off if you are busy","ok":false,"why":"Incorrect. Treatments, response to treatment, and times are required items."}]},{"ch":4,"q":"“If it isn’t documented, it didn’t happen.” What does that apply to?","opts":[{"t":"The PCR — accurate documentation protects the patient, protects you legally, and keeps care continuous","ok":true,"why":"Correct. That phrase is in the PCR section. Key point of the chapter: clear communication and accurate documentation protect the patient, protect you legally, and ensure continuity of care."},{"t":"Skip the PCR if the verbal handoff felt friendly","ok":false,"why":"Incorrect. Leave a completed PCR. Transfer is official only after verbal handoff to equal or higher plus that PCR."},{"t":"Let radio names stand in for written facts","ok":false,"why":"Incorrect. Do not say the name on the radio, and the PCR still must document the care."},{"t":"Write only if something went wrong","ok":false,"why":"Incorrect. Must include demographics, CC, history, vitals, findings, treatments, response, and times — the whole call."}]},{"ch":4,"q":"You rolled into the ED bay. At what point is transfer of care official?","opts":[{"t":"After you give a verbal handoff to someone of equal or higher level, deliver a clear oral report, and leave a completed PCR","ok":true,"why":"Correct. That is the transfer-of-care section. Leaving without that is abandonment territory (Ch 3)."},{"t":"As soon as you park at the dock, even if nobody takes report","ok":false,"why":"Incorrect. Official only after verbal handoff to equal or higher and a completed PCR."},{"t":"After you wave at a lower-trained receptionist and walk out","ok":false,"why":"Incorrect. Must be equal or higher level."},{"t":"After you talk, with the PCR left for next shift","ok":false,"why":"Incorrect. Leave a completed PCR with the oral report."}]},{"ch":4,"q":"You wrote the wrong blood pressure on the PCR. How do you fix it?","opts":[{"t":"Draw a single line through the error, initial, date, and write the correct information. Never erase or cover it up","ok":true,"why":"Correct. That is the PCR-errors rule."},{"t":"Erase the wrong number so nobody sees it","ok":false,"why":"Incorrect. Never erase or cover up."},{"t":"Cover the line with a black marker","ok":false,"why":"Incorrect. Single line through, initial, date, write the correct information."},{"t":"Start a fresh PCR and quietly shred the old one","ok":false,"why":"Incorrect. Correct the error in place with a single line, initial, and date. It is a legal/permanent record."}]},{"ch":4,"q":"A refusal is going on the PCR. What must that documentation include?","opts":[{"t":"That they had capacity, that you explained the risks, that they understood, and a signature or a note that they refused to sign","ok":true,"why":"Correct. Same theme as Ch 3’s refusal documentation. For children/special needs: speak at their level, involve caregivers, use simple language."},{"t":"Just the nickname they used","ok":false,"why":"Incorrect. Need capacity, risks explained, understanding, and signature or refusal to sign."},{"t":"A social-media recap for the family","ok":false,"why":"Incorrect. Protect all patient information. Share only with those involved in care or when required by law."},{"t":"Your opinion that refusing was “stupid”","ok":false,"why":"Incorrect. Facts only, no opinions or judgments."}]},{"ch":5,"q":"You break down a new word on a chart. Which parts does a medical term have?","opts":[{"t":"A prefix at the beginning, a word root for the core meaning, a combining vowel (usually “o”) for pronunciation only, and a suffix at the end","ok":true,"why":"Correct. Break the word into prefix – root – suffix."},{"t":"The suffix comes first, and the combining vowel changes the meaning","ok":false,"why":"Incorrect. The combining vowel is usually “o” for pronunciation only. Prefix beginning, root core, suffix ending."},{"t":"Only a root — prefixes and suffixes are not used","ok":false,"why":"Incorrect. All four parts are listed: prefix, root, combining vowel, suffix."},{"t":"The only allowed piece is a number prefix","ok":false,"why":"Incorrect. Numbers are special word parts, but terms still use prefix/root/suffix."}]},{"ch":5,"q":"A patient is hyperglycemic on one call and hypoglycemic on the next. What do those prefixes mean?","opts":[{"t":"hyper- means high/excessive; hypo- means low/under","ok":true,"why":"Correct. Those are the listed speed/level prefixes."},{"t":"hyper- means low; hypo- means high","ok":false,"why":"Incorrect. Those are swapped."},{"t":"hyper- means fast; hypo- means slow","ok":false,"why":"Incorrect. Fast is tachy-; slow is brady-."},{"t":"hyper- means without; hypo- means after","ok":false,"why":"Incorrect. Without is a-/an-; after is post-."}]},{"ch":5,"q":"The monitor shows tachycardia on one patient and bradycardia on another. What do those prefixes mean?","opts":[{"t":"tachy- means fast; brady- means slow","ok":true,"why":"Correct. Listed prefixes."},{"t":"tachy- means slow; brady- means fast","ok":false,"why":"Incorrect. Swapped."},{"t":"tachy- means high amount; brady- means low amount","ok":false,"why":"Incorrect. High/excessive is hyper-; low/under is hypo-."},{"t":"tachy- means before; brady- means after","ok":false,"why":"Incorrect. Before is pre-; after is post-."}]},{"ch":5,"q":"You see apnea on one chart and dyspnea on another. What do a-/an- and dys- mean?","opts":[{"t":"a-/an- means without; dys- means difficult, painful, or abnormal","ok":true,"why":"Correct. Listed prefixes."},{"t":"a-/an- means many; dys- means none","ok":false,"why":"Incorrect. Many is multi-/poly-; none is nulli-."},{"t":"a-/an- means around; dys- means across","ok":false,"why":"Incorrect. Around is peri- or circum-; across/through is trans-."},{"t":"a-/an- means same; dys- means opposite","ok":false,"why":"Incorrect. Same is ipsi-; against/opposite is contra-."}]},{"ch":5,"q":"A note says preoperative, then later postoperative. What do those prefixes mean?","opts":[{"t":"pre- means before; post- means after","ok":true,"why":"Correct. Listed prefixes. Ante- is also before/in front in the position list."},{"t":"pre- means after; post- means before","ok":false,"why":"Incorrect. Swapped."},{"t":"pre- means under; post- means above","ok":false,"why":"Incorrect. Under/below is sub-/infra-; above is supra-/super-."},{"t":"pre- means within; post- means outside","ok":false,"why":"Incorrect. Within is endo- or intra-; outside is ecto-/exo- or extra-."}]},{"ch":5,"q":"A chart lists cardiac, hepatic, and nephric findings. What do those roots mean?","opts":[{"t":"cardi points to the heart, hepat to the liver, nephr to the kidney","ok":true,"why":"Correct. Only these roots appear in the notes — do not invent others."},{"t":"cardi points to the liver, hepat to the kidney, nephr to the heart","ok":false,"why":"Incorrect. cardi heart, hepat liver, nephr kidney."},{"t":"cardi points to the chest, hepat to the mind, nephr to a nerve","ok":false,"why":"Incorrect. Chest is thorac; mind is psych; nerve is neur."},{"t":"cardi points to the kidney, hepat to the heart, nephr to the liver","ok":false,"why":"Incorrect. cardi heart, hepat liver, nephr kidney."}]},{"ch":5,"q":"You see neurologic, psychiatric, and thoracic on three charts. What do those roots mean?","opts":[{"t":"neur points to a nerve, psych to the mind, thorac to the chest","ok":true,"why":"Correct. The six roots in the notes are cardi, hepat, nephr, neur, psych, thorac."},{"t":"neur points to the mind, psych to the chest, thorac to a nerve","ok":false,"why":"Incorrect. neur nerve, psych mind, thorac chest."},{"t":"neur points to the kidney, psych to the liver, thorac to the heart","ok":false,"why":"Incorrect. Those are nephr, hepat, cardi."},{"t":"neur points to blue, psych to red, thorac to white","ok":false,"why":"Incorrect. Colors are cyan/o, erythr/o, leuk/o — not these roots."}]},{"ch":5,"q":"A patient has hepatitis, neuropathy, and neuralgia listed. What do those suffixes mean?","opts":[{"t":"-itis = inflammation; -pathy = disease; -algia = pain","ok":true,"why":"Correct. Listed suffixes."},{"t":"-itis = pain; -pathy = removal; -algia = inflammation","ok":false,"why":"Incorrect. Pain is -algia; removal is -ectomy; inflammation is -itis."},{"t":"-itis = blood; -pathy = breathing; -algia = swallow","ok":false,"why":"Incorrect. Blood condition is -emia; breathing is -pnea; eating/swallowing is -phagia."},{"t":"-itis = study of; -pathy = enlargement; -algia = abnormal condition","ok":false,"why":"Incorrect. Study of is -ology; enlargement is -megaly; abnormal condition is -osis."}]},{"ch":5,"q":"The hospital note mentions appendectomy, cardiomegaly, and cardiology. What do those suffixes mean?","opts":[{"t":"-ectomy = surgical removal; -megaly = enlargement; -ology = study of","ok":true,"why":"Correct. Listed suffixes."},{"t":"-ectomy = enlargement; -megaly = study of; -ology = removal","ok":false,"why":"Incorrect. Rotated. -ectomy removal, -megaly enlargement, -ology study of."},{"t":"-ectomy = inflammation; -megaly = pain; -ology = disease","ok":false,"why":"Incorrect. Those are -itis, -algia, -pathy."},{"t":"-ectomy = breathing; -megaly = blood; -ology = swallow","ok":false,"why":"Incorrect. Those are -pnea, -emia, -phagia."}]},{"ch":5,"q":"You see cyanosis, anemia, apnea, and dysphagia. What do those suffixes mean?","opts":[{"t":"-osis = abnormal condition; -emia = blood condition; -pnea = breathing; -phagia = eating/swallowing","ok":true,"why":"Correct. Listed suffixes."},{"t":"-osis = removal; -emia = study of; -pnea = pain; -phagia = heart","ok":false,"why":"Incorrect. Removal -ectomy; study of -ology; pain -algia; heart is the root cardi."},{"t":"-osis = high; -emia = low; -pnea = fast; -phagia = slow","ok":false,"why":"Incorrect. Those ideas are prefixes (hyper/hypo/tachy/brady), not these suffixes."},{"t":"-osis = blue; -emia = red; -pnea = white; -phagia = black","ok":false,"why":"Incorrect. Colors are cyan/o, erythr/o, leuk/o, melan/o."}]},{"ch":5,"q":"The monitor reads tachycardia. Using only the listed word parts, what does that word mean?","opts":[{"t":"Fast heart","ok":true,"why":"Correct. Study-guide build: tachycardia = tachy- (fast) + cardi (heart)."},{"t":"Slow breathing","ok":false,"why":"Incorrect. That is bradypnea (brady- + -pnea). Tachycardia is fast heart."},{"t":"Liver inflammation","ok":false,"why":"Incorrect. That is hepatitis (hepat + -itis)."},{"t":"Low blood condition","ok":false,"why":"Incorrect. Hypo- + -emia is a low blood condition (study guide: hypoglycemia). Tachycardia is fast heart."}]},{"ch":5,"q":"You document bradypnea. Using only the listed word parts, what does that word mean?","opts":[{"t":"Slow breathing","ok":true,"why":"Correct. Study-guide build: bradypnea = brady- (slow) + -pnea (breathing)."},{"t":"Fast heart","ok":false,"why":"Incorrect. That is tachycardia."},{"t":"Without eating/swallowing","ok":false,"why":"Incorrect. a-/an- + -phagia would be without eating/swallowing. Bradypnea is slow breathing."},{"t":"Difficult heart","ok":false,"why":"Incorrect. dys- is difficult/painful/abnormal; cardi is heart. Bradypnea is slow breathing."}]},{"ch":5,"q":"The hospital says hepatitis. Using only the listed word parts, what does that word mean?","opts":[{"t":"Liver inflammation","ok":true,"why":"Correct. Study-guide build: hepatitis = hepat (liver) + -itis (inflammation)."},{"t":"Kidney disease","ok":false,"why":"Incorrect. nephr + -pathy would be kidney disease. Hepatitis is liver inflammation."},{"t":"Nerve pain","ok":false,"why":"Incorrect. neur + -algia would be nerve pain. Hepatitis is liver inflammation."},{"t":"Heart enlargement","ok":false,"why":"Incorrect. cardi + -megaly would be heart enlargement. Hepatitis is liver inflammation."}]},{"ch":5,"q":"A glucometer is low and someone says hypoglycemia. Using only the listed word parts, how is that word built?","opts":[{"t":"Low plus a blood-sugar condition (the -emia piece is a blood condition)","ok":true,"why":"Correct. Study guide: hypoglycemia = low + blood sugar condition (glycemia as blood condition is -emia)."},{"t":"High plus breathing","ok":false,"why":"Incorrect. High is hyper-; breathing is -pnea. Hypoglycemia is low + blood condition."},{"t":"Blue plus an abnormal condition","ok":false,"why":"Incorrect. That is cyanosis (cyan/o + -osis)."},{"t":"Two plus sides, with no blood-condition piece","ok":false,"why":"Incorrect. Bilateral = two sides (bi-). Hypoglycemia uses hypo- and -emia."}]},{"ch":5,"q":"The patient’s lips look blue and you hear cyanosis. Using only the listed word parts, what does that word mean?","opts":[{"t":"Blue plus an abnormal condition","ok":true,"why":"Correct. Study-guide build: cyanosis = cyan/o (blue) + -osis (abnormal condition)."},{"t":"White plus a blood condition","ok":false,"why":"Incorrect. leuk/o is white; -emia is blood condition. Cyanosis is blue + -osis."},{"t":"Red plus inflammation","ok":false,"why":"Incorrect. erythr/o is red; -itis is inflammation."},{"t":"Gray plus enlargement","ok":false,"why":"Incorrect. poli/o is gray; -megaly is enlargement."}]},{"ch":5,"q":"Breath sounds are bilateral. Using the listed word parts, what does that mean?","opts":[{"t":"Both sides, because bi- means two","ok":true,"why":"Correct. Study-guide build: bilateral = two sides. bi- = two."},{"t":"One side, as if it used uni-","ok":false,"why":"Incorrect. uni- = one. bi- = two."},{"t":"Four, as if it used quadri-","ok":false,"why":"Incorrect. quadri- = four."},{"t":"None, as if it used nulli-","ok":false,"why":"Incorrect. nulli- = none. bi- = two."}]},{"ch":5,"q":"You see unilateral, bilateral, tricuspid, and quadriplegia. What do those number prefixes mean?","opts":[{"t":"uni- = one; bi- = two; tri- = three; quadri- = four","ok":true,"why":"Correct. Listed number parts."},{"t":"uni- = four; bi- =
