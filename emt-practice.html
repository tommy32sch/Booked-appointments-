three; tri- = two; quadri- = one","ok":false,"why":"Incorrect. Reversed."},{"t":"uni- = many; bi- = none; tri- = half; quadri- = same","ok":false,"why":"Incorrect. Many is multi-/poly-; none is nulli-; half is hemi-/semi-; same is ipsi-."},{"t":"uni- = around; bi- = through; tri- = behind; quadri- = within","ok":false,"why":"Incorrect. Those are position parts (peri/circum, trans, retro, endo/intra)."}]},{"ch":5,"q":"Which matching of number prefixes is correct?","opts":[{"t":"multi-/poly- = many; nulli- = none; hemi-/semi- = half","ok":true,"why":"Correct. Listed number parts."},{"t":"multi-/poly- = none; nulli- = many; hemi-/semi- = four","ok":false,"why":"Incorrect. multi-/poly- many; nulli- none; hemi-/semi- half; quadri- is four."},{"t":"multi-/poly- = one; nulli- = two; hemi-/semi- = three","ok":false,"why":"Incorrect. Those are uni-, bi-, tri-."},{"t":"multi-/poly- = yellow; nulli- = black; hemi-/semi- = gray","ok":false,"why":"Incorrect. Colors are cirrh/jaund/xanth yellow, melan/o black, poli/o gray."}]},{"ch":5,"q":"A note mentions cyanosis, erythrocyte, and leukocyte. What colors are those combining forms?","opts":[{"t":"cyan/o = blue; erythr/o = red; leuk/o = white","ok":true,"why":"Correct. Listed color parts."},{"t":"cyan/o = red; erythr/o = white; leuk/o = blue","ok":false,"why":"Incorrect. cyan/o blue, erythr/o red, leuk/o white."},{"t":"cyan/o = black; erythr/o = gray; leuk/o = yellow","ok":false,"why":"Incorrect. melan/o black; poli/o gray; cirrh/o, jaund/o, xanth/o yellow."},{"t":"cyan/o = heart; erythr/o = liver; leuk/o = kidney","ok":false,"why":"Incorrect. Those are roots cardi, hepat, nephr."}]},{"ch":5,"q":"Which color matching is correct?","opts":[{"t":"melan/o = black; poli/o = gray; cirrh/o, jaund/o, and xanth/o = yellow","ok":true,"why":"Correct. All three yellow combining forms are listed."},{"t":"melan/o = white; poli/o = blue; yellow is only leuk/o","ok":false,"why":"Incorrect. leuk/o is white; cyan/o is blue; yellow is cirrh/jaund/xanth. melan/o is black; poli/o is gray."},{"t":"melan/o = gray; poli/o = black; no yellow forms are listed","ok":false,"why":"Incorrect. Swapped black/gray, and yellow is listed three ways."},{"t":"melan/o = red; poli/o = yellow; cyan/o = black","ok":false,"why":"Incorrect. Red is erythr/o; black is melan/o; gray is poli/o; yellow is cirrh/jaund/xanth."}]},{"ch":5,"q":"A note says abduct the arm, then adduct it. What do ab- and ad- mean?","opts":[{"t":"ab- = away from; ad- = toward","ok":true,"why":"Correct. Same idea as movement: abduction away from midline; adduction toward midline."},{"t":"ab- = toward; ad- = away","ok":false,"why":"Incorrect. Swapped."},{"t":"ab- = within; ad- = outside","ok":false,"why":"Incorrect. Within is endo- or intra-; outside is ecto-/exo- or extra-."},{"t":"ab- = same; ad- = opposite","ok":false,"why":"Incorrect. ipsi- same; contra- against/opposite."}]},{"ch":5,"q":"You see intramuscular, intercostal, endoscopy, and ectopic. Which matching is correct?","opts":[{"t":"intra- = within; inter- = between; endo- = within; ecto-/exo- = outside","ok":true,"why":"Correct. extra- is also outside. The study guide flags these pairs to drill."},{"t":"intra- = between; inter- = within; endo- = outside; ecto- = within","ok":false,"why":"Incorrect. All swapped."},{"t":"intra- = against; inter- = same; endo- = half; ecto- = many","ok":false,"why":"Incorrect. contra- against; ipsi- same; hemi-/semi- half; multi-/poly- many."},{"t":"intra- = before; inter- = after; endo- = above; ecto- = below","ok":false,"why":"Incorrect. pre-/ante- before; post- after; supra-/super- above; sub-/infra- below."}]},{"ch":5,"q":"A finding is ipsilateral, a drug is contraindicated, and you also see peri- and circum-. Which matching is correct?","opts":[{"t":"ipsi- = same; contra- = against/opposite; peri- = around; circum- = around (outside/full circle)","ok":true,"why":"Correct. Study guide highlights peri vs circum as both “around,” with circum specified as outside/full circle."},{"t":"ipsi- = opposite; contra- = same; peri- = through; circum- = behind","ok":false,"why":"Incorrect. ipsi- same; contra- opposite; trans- across/through; retro- behind/backward."},{"t":"ipsi- = under; contra- = upon; peri- = beside; circum- = within","ok":false,"why":"Incorrect. sub-/infra- under; epi- upon/on top; para- beside/near; endo-/intra- within."},{"t":"ipsi- = one; contra- = two; peri- = three; circum- = four","ok":false,"why":"Incorrect. Those are uni-, bi-, tri-, quadri-."}]},{"ch":5,"q":"The wound is on the patient’s anterior chest, superior to the umbilicus. Which matching is correct? (Right and left are always the patient’s.)","opts":[{"t":"Superior is toward the head / above; inferior is toward the feet / below; anterior (ventral) is the front; posterior (dorsal) is the back","ok":true,"why":"Correct. Referenced to anatomical position: standing facing you, arms at sides, palms forward."},{"t":"Superior is the feet, inferior is the head, anterior is the back, posterior is the front","ok":false,"why":"Incorrect. All swapped."},{"t":"Anterior is only the patient’s left","ok":false,"why":"Incorrect. Anterior/ventral is the front. Right and left are always the patient’s, not yours."},{"t":"Dorsal names the front surface of the body","ok":false,"why":"Incorrect. Posterior (dorsal) = back; anterior (ventral) = front."}]},{"ch":5,"q":"A forearm laceration is distal to the elbow and lateral to the midline. Which matching is correct?","opts":[{"t":"Medial = toward midline; lateral = away; proximal = closer to trunk/attachment; distal = farther; superficial = closer to surface; deep = farther from surface","ok":true,"why":"Correct. Always on the patient’s body in anatomical position."},{"t":"Medial = away from midline; distal = closer to the trunk","ok":false,"why":"Incorrect. Medial is toward midline; distal is farther from trunk/attachment."},{"t":"Proximal means nearer the skin surface","ok":false,"why":"Incorrect. Closer to the surface is superficial. Proximal is closer to the trunk or point of attachment."},{"t":"Lateral means the midline of the patient","ok":false,"why":"Incorrect. Lateral is away from the midline."}]},{"ch":5,"q":"The patient cannot bend the elbow or lift the arm out to the side. Which matching is correct?","opts":[{"t":"Flexion bends and shrinks the angle (elbow or knee); extension straightens and opens the angle; abduction takes a part away from midline (arm out); adduction brings it back toward midline (arm to the side)","ok":true,"why":"Correct. Movement terms from the notes."},{"t":"Flexion straightens the joint, and abduction moves toward the midline","ok":false,"why":"Incorrect. Flexion bends/decreases the angle; abduction is away from midline."},{"t":"Adduction is circling the arm, and extension is pointing the toes down","ok":false,"why":"Incorrect. Arm circles are circumduction; toes down is plantar flexion."},{"t":"Abduction is turning the palm up, and flexion is turning the head","ok":false,"why":"Incorrect. Palm up is supination; head left/right is rotation."}]},{"ch":5,"q":"You ask the patient to turn the palm up, then point the toes down. Which matching is correct?","opts":[{"t":"Supination turns the palm up; pronation turns it down; plantar flexion points the toes down; dorsiflexion pulls the toes up toward the shin","ok":true,"why":"Correct. Also in the notes: rotation = turn around an axis (head left/right); circumduction = circular (arm circles)."},{"t":"Supination turns the palm down, and dorsiflexion points the toes down","ok":false,"why":"Incorrect. Supination is palm up; toes down is plantar flexion; dorsiflexion is toes up toward the shin."},{"t":"Pronation pulls the toes up, and plantar flexion turns the palm up","ok":false,"why":"Incorrect. Pronation is palm down; plantar flexion is toes down."},{"t":"These four terms are not used","ok":false,"why":"Incorrect. All four are listed under movement."}]},{"ch":5,"q":"You find the patient on their back, then later sit them up about 60°. Which matching is correct?","opts":[{"t":"Supine is on the back facing up. Prone is on the stomach facing down. Lateral recumbent (recovery) is on the side. Fowler is sitting up about 45–90°. Semi-Fowler is about 30–45°","ok":true,"why":"Correct. Document the position clearly (“found supine,” “transported semi-Fowler”). Anatomical position: standing upright, facing forward, arms at sides, palms forward."},{"t":"Supine is face down and prone is face up","ok":false,"why":"Incorrect. Supine is back/face up; prone is stomach/face down."},{"t":"Fowler sits at 30–45° while semi-Fowler sits at 45–90°","ok":false,"why":"Incorrect. Those degree ranges are swapped. Fowler ~45–90°; semi-Fowler ~30–45°."},{"t":"Recovery is Trendelenburg, with the feet higher than the head","ok":false,"why":"Incorrect. Recovery is lateral recumbent (on the side). Trendelenburg is supine, feet higher than head (rarely used now). Shock position is supine with legs elevated (older term; use caution)."}]},{"ch":6,"q":"Which statement correctly separates anatomy, physiology, and topographic anatomy?","opts":[{"t":"Anatomy is structure (what it looks like and where); physiology is function (how it works); topographic anatomy is external landmarks used to locate deeper structures","ok":true,"why":"Correct. Always referenced to anatomical position: standing upright, facing forward, arms at sides, palms forward. Learn directional terms and surface landmarks first. Later body systems after the skeleton are not in these notes."},{"t":"Anatomy is how it works, and physiology is only the surface landmarks","ok":false,"why":"Incorrect. Anatomy is structure; physiology is function; topographic anatomy is surface landmarks."},{"t":"Topographic anatomy means listing skull bones beyond the four named","ok":false,"why":"Incorrect. Extra skull bones beyond the listed four are flagged as not in the notes. Cranium in the notes is 4 bones: frontal, parietal (2), occipital. Topographic anatomy is external landmarks/surface features."},{"t":"Physiology is only the 206-bone count","ok":false,"why":"Incorrect. 206 is an anatomy fact about the adult skeleton. Physiology is function."}]},{"ch":6,"q":"All directional terms are referenced to anatomical position. What is that position?","opts":[{"t":"Stand upright, face forward, arms at the sides, palms facing forward","ok":true,"why":"Correct. Topographic anatomy and directional terms are always referenced to that position."},{"t":"Lie prone, palms down, facing the stretcher","ok":false,"why":"Incorrect. Prone is a patient position (stomach, face down) from Ch 5. Anatomical position is standing, face forward, arms at sides, palms forward."},{"t":"Sit semi-Fowler at 30–45°","ok":false,"why":"Incorrect. That is a transport/found position (Ch 5), not the reference anatomical position."},{"t":"Lie supine with the feet higher than the head","ok":false,"why":"Incorrect. That is Trendelenburg (rarely used now)."}]},{"ch":6,"q":"A CT is cut in the sagittal and midsagittal planes. How do those planes divide the body?","opts":[{"t":"Sagittal splits left from right. Midsagittal (median) makes equal left and right halves","ok":true,"why":"Correct. Notes: sagittal divides left and right; midsagittal (median) = equal halves."},{"t":"Sagittal splits front from back","ok":false,"why":"Incorrect. Front and back is coronal (frontal)."},{"t":"Sagittal splits upper from lower as a cross-section","ok":false,"why":"Incorrect. That is transverse (horizontal/axial)."},{"t":"Midsagittal cuts unequal left and right pieces","ok":false,"why":"Incorrect. Midsagittal is equal halves."}]},{"ch":6,"q":"Another cut is coronal, then transverse. Which matching is correct?","opts":[{"t":"Coronal splits front (anterior) from back (posterior). Transverse splits upper (superior) from lower (inferior) and is also called a cross-section","ok":true,"why":"Correct. Those are the other two planes in the notes."},{"t":"Coronal splits left from right, and transverse splits front from back","ok":false,"why":"Incorrect. Left/right is sagittal. Coronal is anterior/posterior. Transverse is superior/inferior."},{"t":"Both words mean only equal left and right halves","ok":false,"why":"Incorrect. Equal left/right halves is midsagittal."},{"t":"Transverse is another name for midsagittal","ok":false,"why":"Incorrect. Transverse is a cross-section into upper and lower."}]},{"ch":6,"q":"Which order goes from smallest living unit to the whole person?","opts":[{"t":"Cells (basic unit of life) → tissues (similar cells) → organs (different tissues, specific function) → organ systems → organism (complete human body)","ok":true,"why":"Correct. That is the five-level list."},{"t":"Organs first, then cells, then tissues","ok":false,"why":"Incorrect. Cells → tissues → organs → organ systems → organism."},{"t":"The whole organism first, and a single cell last","ok":false,"why":"Incorrect. Cells are first (basic unit of life); organism is last."},{"t":"Tissues skip cells and jump straight to systems","ok":false,"why":"Incorrect. Tissues are groups of similar cells; organs come next."}]},{"ch":6,"q":"What do cells need, and how do they make energy?","opts":[{"t":"They need oxygen, glucose (sugar), water, and nutrients. Oxygen + glucose → energy (ATP) + waste (CO₂ and water) + heat","ok":true,"why":"Correct. That is the energy equation given."},{"t":"They need only calcium from bone; no glucose","ok":false,"why":"Incorrect. Cells need oxygen, glucose, water and nutrients. Calcium storage is a skeletal function, not the cell-energy list."},{"t":"Glucose plus heat making only oxygen","ok":false,"why":"Incorrect. The equation is oxygen + glucose → ATP + CO₂ + water + heat."},{"t":"ATP listed as something cells do not use","ok":false,"why":"Incorrect. Energy is listed as ATP in that equation."}]},{"ch":6,"q":"Why are airway, breathing, and circulation the first priorities?","opts":[{"t":"Brain cells burn energy fast and die quickly without oxygen or glucose; skin cells last longer. Without that supply, cells fail and die","ok":true,"why":"Correct. Key point: cells need a constant supply of oxygen and glucose to make energy. Without it they fail and die — that is why ABC is first. Do not add later chapters’ organ-system details; they are not in these notes."},{"t":"Skin fails first, so the brain can wait","ok":false,"why":"Incorrect. Brain (high-energy) dies quickly; skin survives longer."},{"t":"Because the full respiratory and circulatory chapters are already covered","ok":false,"why":"Incorrect. This chapter is incomplete and stops after the skeletal system. Respiratory and circulatory systems are flagged as not in the notes."},{"t":"Because a later, unlisted body-system chapter requires it","ok":false,"why":"Incorrect. Later body systems are not in these notes. ABC is first because brain cells die quickly without oxygen or glucose."}]},{"ch":6,"q":"Which set lists the functions of the skeletal system?","opts":[{"t":"Give the body shape and support, shield vital organs, let muscles move the body, store minerals (especially calcium), and make blood cells in marrow","ok":true,"why":"Correct. Those five functions are listed. Joints and muscle-system details are not in the notes."},{"t":"Store fat only, with no role in making blood cells","ok":false,"why":"Incorrect. It produces blood cells in bone marrow and stores minerals (especially calcium)."},{"t":"Think and pump blood as primary functions","ok":false,"why":"Incorrect. Nervous and circulatory systems are not in these notes. Skeleton: shape/support, protect, move with muscles, store calcium, make blood."},{"t":"Turn glucose into ATP inside marrow as its only job","ok":false,"why":"Incorrect. The ATP equation is for cells generally. Marrow’s listed job is producing blood cells."}]},{"ch":6,"q":"How many bones are in the adult skeleton?","opts":[{"t":"206 bones in the adult","ok":true,"why":"Correct. Adult skeleton = 206 bones."},{"t":"33, treating the vertebra count as the whole skeleton","ok":false,"why":"Incorrect. 33 is the number of vertebrae, not the whole skeleton (206)."},{"t":"14, treating the face-bone count as the cranial count","ok":false,"why":"Incorrect. Face is 14 bones. Cranium is listed as 4 bones (frontal, 2 parietal, occipital). Adult skeleton is 206."},{"t":"12, counting one bone per rib pair","ok":false,"why":"Incorrect. 12 pairs of ribs (24 ribs) plus 1 sternum are the thorax count. Adult total is 206."}]},{"ch":6,"q":"Which spine count is correct?","opts":[{"t":"33 vertebrae: 7 cervical, 12 thoracic, 5 lumbar, 5 fused sacral, 4 fused coccygeal","ok":true,"why":"Correct. Memorize 7 / 12 / 5 / 5 fused / 4 fused."},{"t":"26 vertebrae: 12 cervical and 7 lumbar","ok":false,"why":"Incorrect. Cervical 7, thoracic 12, lumbar 5, sacrum 5 fused, coccyx 4 fused = 33."},{"t":"Four fused sacral pieces and five fused coccygeal pieces","ok":false,"why":"Incorrect. Sacrum 5 fused; coccyx 4 fused."},{"t":"Five thoracic and twelve lumbar vertebrae","ok":false,"why":"Incorrect. Thoracic 12; lumbar 5."}]},{"ch":6,"q":"Which cranial and facial bones are actually named?","opts":[{"t":"Cranium (4): frontal, two parietal, occipital. Face (14): nasal, zygomatic (cheek), maxilla (upper jaw), mandible (lower jaw), plus others not named","ok":true,"why":"Correct. Temporal and other extra skull bones are flagged as not in the notes. Do not invent them."},{"t":"More than four cranial bones are named","ok":false,"why":"Incorrect. Extra skull bones beyond the listed four are explicitly not in the notes. Listed cranium: frontal, 2 parietal, occipital."},{"t":"The mandible is the upper jaw and the maxilla is the lower jaw","ok":false,"why":"Incorrect. Maxilla is upper jaw; mandible is lower jaw."},{"t":"Zygomatic is a neck vertebra","ok":false,"why":"Incorrect. Zygomatic is the cheek bone of the face. Neck vertebrae are cervical (7)."}]},{"ch":6,"q":"Which region has the highest potential to bleed, and which bones are listed there?","opts":[{"t":"Pelvis — ilium, ischium, and pubis (fused on each side) — highest bleed potential","ok":true,"why":"Correct. Appendicular also lists shoulder girdle (clavicle, scapula); upper: humerus, radius, ulna, carpals, metacarpals, phalanges; lower: femur, patella, tibia, fibula, tarsals, metatarsals, phalanges. Thorax: 12 rib pairs (24) and sternum 1."},{"t":"Cranium — frontal and occipital listed as the most blood","ok":false,"why":"Incorrect. The notes give highest bleed potential to the pelvis."},{"t":"The patella alone, called the highest-bleed bone","ok":false,"why":"Incorrect. Patella is listed in the lower extremity, not as highest bleed. Pelvis is highest."},{"t":"Clavicle and scapula — the shoulder called the highest bleed","ok":false,"why":"Incorrect. Shoulder girdle is clavicle and scapula, but highest bleed potential is the pelvis."}]}];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

const CH_NAME = {
  1: "Ch 1 · EMS Systems",
  2: "Ch 2 · Workplace Safety & Wellness",
  3: "Ch 3 · Medical, Legal & Ethical",
  4: "Ch 4 · Communication & Documentation",
  5: "Ch 5 · Medical Terminology",
  6: "Ch 6 · The Human Body"
};

let queue = [];
let i = 0;
let correct = 0;
let answered = 0;
let locked = false;
let missed = [];

function $(id) { return document.getElementById(id); }

function start() {
  queue = shuffle(BANK).map(function(q) {
    return { ch: q.ch, q: q.q, opts: shuffle(q.opts) };
  });
  i = 0; correct = 0; answered = 0; locked = false; missed = [];
  $("nextBtn").textContent = "Next";
  render();
}

function updateScore() {
  $("score").textContent = correct + " / " + answered;
  const n = queue.length;
  $("progLabel").textContent = (i < n) ? ("Question " + (i + 1) + " of " + n) : ("Done · " + n + " questions");
  $("progBar").style.width = (n ? Math.round(((i + (locked ? 1 : 0)) / n) * 100) : 0) + "%";
}

function render() {
  locked = false;
  $("nextBtn").classList.remove("visible");
  if (i >= queue.length) { return endScreen(); }
  const q = queue[i];
  const letters = ["A", "B", "C", "D"];
  let optsHtml = "";
  q.opts.forEach(function(o, idx) {
    optsHtml += '<button type="button" class="opt" data-idx="' + idx + '">'
      + '<span class="letter">' + letters[idx] + '</span>'
      + '<span class="ot"></span></button>';
  });
  $("main").innerHTML =
    '<div class="card">'
    + '<div class="ch-tag">' + (CH_NAME[q.ch] || ("Chapter " + q.ch)) + '</div>'
    + '<p class="qtext"></p>'
    + '<div class="opts">' + optsHtml + '</div>'
    + '<div class="why" id="whyBox"></div>'
    + '</div>'
    + '<p id="start-note">Answers lock on the first tap. Explanations come from your chapter notes.</p>';
  $("main").querySelector(".qtext").textContent = q.q;
  const buttons = $("main").querySelectorAll(".opt");
  buttons.forEach(function(btn, idx) {
    btn.querySelector(".ot").textContent = q.opts[idx].t;
    btn.addEventListener("click", function() { pick(idx); });
  });
  updateScore();
  window.scrollTo(0, 0);
}

function pick(idx) {
  if (locked) return;
  locked = true;
  const q = queue[i];
  const chosen = q.opts[idx];
  const correctOpt = q.opts.find(function(o) { return o.ok; });
  answered += 1;
  if (chosen.ok) correct += 1;
  else {
    missed.push({
      ch: q.ch,
      q: q.q,
      chosen: chosen.t,
      why: chosen.why,
      right: correctOpt.t
    });
  }
  const buttons = $("main").querySelectorAll(".opt");
  buttons.forEach(function(btn, j) {
    btn.classList.add("locked");
    btn.disabled = true;
    const o = q.opts[j];
    if (j === idx && o.ok) btn.classList.add("chosen", "right");
    else if (j === idx && !o.ok) btn.classList.add("chosen", "wrong");
    else if (o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box = $("whyBox");
  const verdict = chosen.ok
    ? '<div class="verdict ok">Correct</div>'
    : '<div class="verdict bad">Incorrect</div>';
  const extra = chosen.ok ? "" :
    '<div class="correct-line">Correct answer: ' + escapeHtml(correctOpt.t) + '</div>';
  box.innerHTML = verdict + '<div class="why-body"></div>' + extra;
  box.querySelector(".why-body").textContent = chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent = (i + 1 >= queue.length) ? "See results" : "Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function endScreen() {
  locked = true;
  $("nextBtn").classList.remove("visible");
  const n = queue.length;
  const pct = n ? Math.round((correct / n) * 100) : 0;
  let missHtml = "";
  if (missed.length === 0) {
    missHtml = '<p>No missed questions. Nice work.</p>';
  } else {
    missHtml = '<div class="miss"><h3>Missed questions (' + missed.length + ')</h3>';
    missed.forEach(function(m, nidx) {
      missHtml += '<div class="miss-item">'
        + '<div class="ch-tag">' + (CH_NAME[m.ch] || ("Chapter " + m.ch)) + '</div>'
        + '<div class="mq"></div>'
        + '<div class="mwhy"></div>'
        + '</div>';
    });
    missHtml += '</div>';
  }
  $("main").innerHTML =
    '<div class="card end">'
    + '<h2>Quiz complete</h2>'
    + '<div class="big">' + correct + ' / ' + n + '</div>'
    + '<div class="pct">' + pct + '% · from your Ch 1–6 notes</div>'
    + missHtml
    + '<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button>'
    + '</div>';
  if (missed.length) {
    const items = $("main").querySelectorAll(".miss-item");
    missed.forEach(function(m, idx) {
      items[idx].querySelector(".mq").textContent = m.q;
      items[idx].querySelector(".mwhy").textContent =
        "You chose: " + m.chosen + " — " + m.why + "  Correct: " + m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore();
  window.scrollTo(0, 0);
}

$("nextBtn").addEventListener("click", function() {
  if (!locked) return;
  i += 1;
  render();
});

start();
</script>
</body>
</html>
