<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Ch 29 Chest — practice</title>
<style>
:root {
  --bg: #f4efe6; --paper: #fffdf8; --ink: #1c2430; --muted: #5a6573;
  --navy: #1e3a5f; --navy-2: #16304d; --red: #b42318; --green: #1b7a46;
  --line: #d8d0c4; --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
input[type=text] {
  width: 100%; min-height: 48px; font-size: 1.05rem; font-family: inherit;
  padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
}
input[type=text]:focus { outline: 2px solid var(--navy); border-color: var(--navy); }
input[type=text]:disabled { background: #f3f1ec; }
.check {
  width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.check:active { background: var(--navy-2); }
.check:disabled { opacity: .55; cursor: default; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.links { display:flex; flex-wrap:wrap; gap:8px; margin: 12px 0 0; }
.links a { font-size:.82rem; color:#1e3a5f; background:#e8e1d4; border-radius:999px; padding:4px 10px; text-decoration:none; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>Ch 29 Chest</h1>
  <div class="sub">Type-in · 22 from locked notes</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [
  {

    "a": [

  {
    "ch": 29,

      "box = ribs + spine + diaphragm; yes still seal upper-belly stab",
      "ribs, spine, diaphragm; yes chest seal (don’t know where diaphragm was)",

  },
  {
    "ch": 29,

    "a": [
      "adults diaphragm + intercostals; kids almost all diaphragm; under rib nerve/vein/artery",
      "adults both; kids almost all diaphragm; nerve, vein, artery under each rib",

    ],
    "why": "Adults breathe with diaphragm + intercostals. Kids are almost all diaphragm. Under each rib: nerve, vein, artery."
  },
  {
    "ch": 29,
    "q": "Parietal vs visceral pleura; pneumothorax vs hemothorax; what is the mediastinum?",
    "a": [
      "parietal=chest wall lining; visceral=on lung; pneumo=air; hemo=blood; mediastinum=middle space heart/aorta/vena cava/trachea/esophagus",
      "parietal chest wall, visceral on lung; air vs blood in gap; middle space with heart aorta vena cava trachea esophagus",

  },
  {
    "ch": 29,
    "q": "Phrenic levels; cord cut above C5 vs below C5 — breathing?",
    "a": [
      "C3-4-5; above C5 no breathe; below C5 diaphragm works intercostals don’t",
      "phrenic C3-4-5; above C5 they do not breathe; below C5 diaphragm still works, intercostals do not",

    "a": [
      "vent=air in/out; resp=gas exchange; ox=O2 onto red cells; crackles=fluid in alveoli",
      "ventilation air in/out; respiration alveoli gas exchange; oxygenation onto red cells; crackles fluid in alveoli",

    "a": [

      "coughing blood=lung; vomiting blood=gut; pink frothy=pulmonary edema",

    "a": [

  },

    "q": "Tension signs: shock + JVD + quiet side — trachea which way? Do we needle?",
    "a": [

      "trachea pushed away from bad side; we don’t needle",
      "away from bad side; paramedic needle closed tension only — we do not needle",
      "trachea away; we do not needle"

    "why": "Trachea pushed AWAY from the bad side. Paramedic needle is for a CLOSED tension pneumo. We do not needle."
  },
  {
    "ch": 29,
    "q": "Quiet one lung: fat neck veins vs flat neck veins — which injury each?",
    "a": [
      "fat/JVD = tension; flat = hemothorax",

      "fat veins tension; flat veins hemothorax",

    "why": "Neck veins fat / JVD → tension pneumo. Neck veins flat / collapsed → hemothorax."
  },
  {
    "ch": 29,
    "q": "Beck’s triad for tamponade; how do lungs compare to tension?",
    "a": [

      "JVD, muffled/quiet heart sounds, narrow PP; two good lungs → heart not lung",
      "Beck’s: JVD, muffled sounds, narrow pulse pressure; tamponade has two good lungs",
      "JVD muffled narrow PP; two good lungs unlike tension"
    ],
    "why": "Beck’s triad: JVD; muffled / quiet heart sounds; narrow pulse pressure. Tamponade does not have a quiet lung. Two good lungs → think heart, not lung."
  },
  {
    "ch": 29,
    "q": "Flail chest care — bulky dressing / sandbags?",
    "a": [
      "no bulky dress or sandbags (old answer); ABCs O2 shock go",
      "do not bulky-dress or sandbags; ABCs, oxygen, shock care, go",
      "refuse bulky dressing/sandbags; ABCs oxygen shock go",
      "no bulky dress/sandbags; ABCs O2 shock go; watch bruised lung"

    "why": "Do not tape a bulky dressing over it. Do not use sandbags. That is the old answer. ABCs, oxygen, shock care, go."
  },
  {
    "ch": 29,
    "q": "Pulmonary contusion: crackles timing, CPAP, BVM rule?",
    "a": [
      "crackles hours/days; no CPAP trauma; BVM only if not breathing well",
      "crackles can take hours may kill days later; no CPAP; BVM if not breathing well",
      "hours to days; refuse CPAP in trauma; BVM only if not breathing well",
      "crackles hours/days later; no CPAP; BVM if needed"
    ],
    "why": "Pulmonary contusion: crackles; can take hours; may kill days later. No CPAP in trauma. BVM only if they are not breathing well."
  },
  {
    "ch": 29,
    "q": "Steering-wheel hit + shock + irregular pulse; sternal and clavicle worry?",
    "a": [
      "cardiac contusion; heart 2 inches behind sternum; clavicle can poke lung",
      "bruised heart / cardiac contusion; sternal = heart behind it; clavicle can poke top of lung",
      "cardiac/myocardial contusion; heart behind sternum; clavicle can poke lung",
      "cardiac contusion; sternal→heart; clavicle can poke lung"
    ],
    "why": "Steering wheel + shock + irregular pulse = cardiac contusion. Sternal fracture: the heart is two inches behind it. Clavicle can poke the top of the lung."
  },
  {
    "ch": 29,
    "q": "Traumatic asphyxia look — face/neck, eyes, veins?",
    "a": [
      "purple/bruised face and neck; bloodshot eyes; JVD",
      "purple bruised face/neck, bloodshot whites of eyes, JVD",
      "purple face and neck; bloodshot eyes; JVD",
      "purple/bruised face neck + bloodshot eyes + JVD"
    ],
    "why": "Purple / bruised face and neck. Bloodshot whites of the eyes. JVD."
  },
  {
    "ch": 29,
    "q": "Kid drops after a ball to the chest — what happened and what do you do?",
    "a": [
      "commotio cordis → V-fib; CPR + AED",
      "commotio cordis (blow during recharge); CPR and AED",
      "commotio → V-fib; start CPR + AED fast",
      "commotio cordis; CPR + AED"

    "why": "Kid drops after a ball to the chest = commotio cordis. They drop in V-fib. CPR + AED."
  },
  {
    "ch": 29,
    "q": "Commotio on the EKG: normal beat order, and which wave is the hit?",
    "a": [
      "P → QRS → T; hit during T wave (repolarization / recharge)",
      "P QRS T; hit on T wave recharge/repolarization → V-fib",
      "normal P→QRS→T; blow during T wave while recharging → V-fib",
      "P→QRS→T; T-wave hit (repolarization)"
    ],
    "why": "Normal beat: P wave → QRS → T wave. The hit is during the T wave — recharge / repolarization. Force fire while recharging → V-fib."
  },

    "ch": 29,
    "q": "Pulse pressure: Cushing/ICP vs tamponade — example numbers?",
    "a": [
      "Cushing high WIDE (e.g. 200/90); tamponade NARROW and low",
      "ICP/Cushing wide 200/90; tamponade narrow and low",
      "Cushing wide high; tamponade narrow low (numbers squeeze)",
      "wide Cushing 200/90; narrow tamponade"
    ],
    "why": "Head / Cushing / ICP: high and WIDE. Example 200/90. Cardiac tamponade: NARROW and low."
  },
  {
    "ch": 29,
    "q": "Can you pinch the chest aorta like a limb? Torn aorta / aneurysm / mesh sleeve?",
    "a": [
      "no access unless chest open; torn often dead on scene; aneurysm tearing pain; mesh sleeve ≠ bypass graft",
      "limb yes chest aorta no; torn often dead on scene; medical aneurysm tearing chest pain; sleeve ≠ graft",
      "cannot pinch chest aorta; trauma tear often dead on scene; aneurysm tearing pain; mesh ≠ bypass",
      "no chest aorta pinch; often dead on scene; tearing chest pain; mesh sleeve not bypass graft"
    ],
    "why": "We have no access to the chest aorta unless already wide open. Torn aorta often dead on scene. Medical aneurysm: tearing chest pain. Mesh sleeve / sock is not a bypass graft."
  },
  {
    "ch": 29,
    "q": "Crepitus means what? One-sided rise or quiet lung means what?",
    "a": [
      "crepitus = broken-rib grind; one-sided/quiet = that lung not filling",
      "broken-rib grind; that lung is not filling",
      "crepitus broken-rib grind; quiet one side = lung not filling",
      "rib grind; lung on that side not filling"
    ],
    "why": "Crepitus = broken-rib grind. One-sided chest rise or quiet lung = that lung is not filling."
  }
]
;

const LINKS = "<a href=\"emt-quiz-index.html\">Hub</a><a href=\"ch29-chest-key.html\">Key</a><a href=\"ch29-chest-detailed.html\">Detailed</a>";

function norm(s) { return String(s).trim().toLowerCase(); }
function acceptList(item) {
  if (Array.isArray(item.a)) return item.a.map(String);
  if (item.a == null) return [];
  return [String(item.a)];
}
function isRight(item, typed) {
  const n = norm(typed);
  if (!n) return false;
  return acceptList(item).some(function (a) { return norm(a) === n; });
}

let i = 0, correct = 0, answered = 0, locked = false;
const main = document.getElementById("main");
const nextBtn = document.getElementById("nextBtn");
const scoreEl = document.getElementById("score");
const progLabel = document.getElementById("progLabel");
const progBar = document.getElementById("progBar");

function setProg() {
  scoreEl.textContent = correct + " / " + answered;
  progLabel.textContent = i < BANK.length ? ("Question " + (i + 1) + " of " + BANK.length) : "Done";
  progBar.style.width = (Math.min(i, BANK.length) / BANK.length * 100) + "%";
}

function renderEnd() {
  nextBtn.classList.remove("visible");
  const pct = BANK.length ? Math.round(correct / BANK.length * 100) : 0;
  main.innerHTML = '<div class="card end"><h2>Done</h2><div class="big">' + correct + " / " + BANK.length + '</div><p class="pct">' + pct + '% first-check correct</p><div class="links">' + LINKS + '</div><button type="button" class="check restart" id="restart">Again</button></div>';
  document.getElementById("restart").onclick = function () {
    i = 0; correct = 0; answered = 0; locked = false; renderQ();
  };
}

function renderQ() {
  if (i >= BANK.length) { setProg(); renderEnd(); return; }
  locked = false;
  nextBtn.classList.remove("visible");
  const item = BANK[i];
  setProg();
  main.innerHTML = '<div class="card"><p class="qtext"></p><input type="text" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button type="button" class="check" id="check">Check</button><div class="why" id="why"></div></div>';
  main.querySelector(".qtext").textContent = item.q;
  const input = document.getElementById("ans");
  const check = document.getElementById("check");
  const why = document.getElementById("why");
  input.focus();

  function submit() {
    if (locked) return;
    const typed = input.value;
    if (!norm(typed)) { input.focus(); return; }
    locked = true;
    answered += 1;
    const ok = isRight(item, typed);
    if (ok) correct += 1;
    input.disabled = true;
    check.disabled = true;
    why.classList.add("visible");
    why.innerHTML = "";
    const v = document.createElement("div");
    v.className = "verdict " + (ok ? "ok" : "bad");
    v.textContent = ok ? "Correct" : "Not quite";
    const w = document.createElement("div");
    w.textContent = item.why;
    why.appendChild(v);
    why.appendChild(w);
    setProg();
    nextBtn.textContent = i === BANK.length - 1 ? "Finish" : "Next";
    nextBtn.classList.add("visible");
  }
  check.onclick = submit;
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
  });
}

nextBtn.onclick = function () {
  if (!locked) return;
  i += 1;
  renderQ();
};

renderQ();

</script>
</body>
</html>
