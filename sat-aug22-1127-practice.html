,"opts":[{"t":"Lets cells use that circulating sugar","ok":true,"why":"Glucose is the simple sugar in blood. Metabolism = the body’s ability to use it. Insulin gives cells that ability."},{"t":"Lets cells store that circulating bile","ok":false,"why":"Glucose is the simple sugar in blood. Metabolism = the body’s ability to use it. Insulin gives cells that ability."},{"t":"Lets kidneys dump that circulating water","ok":false,"why":"Glucose is the simple sugar in blood. Metabolism = the body’s ability to use it. Insulin gives cells that ability."},{"t":"Lets liver make that circulating factor","ok":false,"why":"Glucose is the simple sugar in blood. Metabolism = the body’s ability to use it. Insulin gives cells that ability."}]},{"ch":"endo","q":"Neck thyroid versus the four parathyroid nodules — which split is his?","opts":[{"t":"Thyroid sets overall metabolism; parathyroids manage calcium for muscle, especially heart","ok":true,"why":"Thyroid: overall metabolism; hypo = low thyroid / low metabolism. Parathyroids: calcium. Extra calcium → bones or urine; low → pull from bone. Calcium matters for muscle contraction, especially the heart."},{"t":"Thyroid sets overall calcium; parathyroids manage metabolism for muscle, especially heart","ok":false,"why":"Thyroid: overall metabolism; hypo = low thyroid / low metabolism. Parathyroids: calcium. Extra calcium → bones or urine; low → pull from bone. Calcium matters for muscle contraction, especially the heart."},{"t":"Thyroid sets overall metabolism; parathyroids manage insulin for muscle, especially heart","ok":false,"why":"Thyroid: overall metabolism; hypo = low thyroid / low metabolism. Parathyroids: calcium. Extra calcium → bones or urine; low → pull from bone. Calcium matters for muscle contraction, especially the heart."},{"t":"Thyroid sets overall clotting; parathyroids manage calcium for muscle, especially heart","ok":false,"why":"Thyroid: overall metabolism; hypo = low thyroid / low metabolism. Parathyroids: calcium. function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {liver:"Liver / clotting",gi:"GI / gallbladder / abdomen",lymph:"Lymph",endo:"Endocrine",renal:"Kidney / pH",gu:"GU / life-altering",shock:"Life-support / shock preview"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">11:27 talk only. Otter capped ~30 min; last ~6 min of the 33-min recording is not in the notes.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · 11:27 review only</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
