<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Ch 22 Toxicology Part 1 — practice</title>
<style>
:root {
  --bg: #f4efe6; --paper: #fffdf8; --ink: #1c2430; --muted: #5a6573;
  --navy: #1e3a5f; --navy-2: #16304d; --red: #b42318; --green: #1b7a46;
  --line: #d8d0c4; --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
input[type=text] {
  width: 100%; min-height: 48px; font-size: 1.05rem; font-family: inherit;
  padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
}
input[type=text]:focus { outline: 2px solid var(--navy); border-color: var(--navy); }
input[type=text]:disabled { background: #f3f1ec; }
.check {
  width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.check:active { background: var(--navy-2); }
.check:disabled { opacity: .55; cursor: default; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.links { display:flex; flex-wrap:wrap; gap:8px; margin: 12px 0 0; }
.links a { font-size:.82rem; color:#1e3a5f; background:#e8e1d4; border-radius:999px; padding:4px 10px; text-decoration:none; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>Ch 22 Toxicology Part 1</h1>
  <div class="sub">Type-in · 20 from locked notes</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [{"ch":22,"q":"What is the most important first step on a possible poison call?","a":["recognize it is a toxicology event","recognize toxicology","recognize a toxicology event","recognize this is toxicology"],"why":"Most important first step: recognize this is a toxicology event. Then try to name the substance."},{"ch":22,"q":"For most poisons, what is your field plan?","a":["ABCs and hospital","ABCs and transport","ABCs + hospital","support ABCs and go to the hospital"],"why":"Most poisons cannot be pulled out. Do ABCs and go to the hospital. Opioids are the special one with Narcan."},{"ch":22,"q":"What does miosis mean?","a":["pinpoint pupils","very small pupils","pinpoint / small pupils","pinpoint pupils (opioid clue)"],"why":"Miosis is pinpoint / very small pupils. Classic opioid clue."},{"ch":22,"q":"What does potentiate mean?","a":["one drug makes another stronger","makes another drug stronger","one drug strengthens another","makes another drug stronger (alcohol + sleeping pill)"],"why":"Potentiate: one drug makes another drug stronger, like alcohol plus a sleeping pill."},{"ch":22,"q":"For depressant overdoses, what going down is the life threat?","a":["breathing","breathing going down","respirations","respiratory drive"],"why":"Breathing going down is the life threat for depressants."},{"ch":22,"q":"Which senses are safe on a hazmat-style poison scene?","a":["sight and sound","sight/sound","see and hear"],"why":"Safe: sight and sound. Not safe: smell, touch, and never taste."},{"ch":22,"q":"Which of the four poison routes is usually the fastest life threat?","a":["inject","injection","injected","IV / inject"],"why":"Injection is the fastest life threat. It goes straight into the blood."},{"ch":22,"q":"About what percent of poisonings are swallowed?","a":["80%","80","about 80%","80 percent"],"why":"About 80% of poisonings are by mouth."},{"ch":22,"q":"Inhaled poison: after fresh air, what oxygen flow do you give?","a":["10-15 L/min","10–15 L/min","10 to 15","high-flow 10-15"],"why":"High-flow oxygen = 10–15 L/min on a non-rebreather or bag-valve mask. Device still depends on rate, rhythm, and quality."},{"ch":22,"q":"Dry chemical powder on skin. What do you do first?","a":["brush it off","brush first","brush off then flush","brush powder first"],"why":"Powder: brush off first, then flush what is left. Liquid: go straight to flush."},{"ch":22,"q":"How long do you flush a chemical off the skin?","a":["15-20 minutes","15–20 minutes","15 to 20 minutes","15-20 min"],"why":"Flush 15–20 minutes. Five minutes is wrong."},{"ch":22,"q":"What is the Poison Control phone number?","a":["1-800-222-1222","800-222-1222","1 800 222 1222"],"why":"Poison Control: 1-800-222-1222. They are not medical control."},{"ch":22,"q":"Poison Control tells you to do something outside your scope. What do you do?","a":["hang up and call medical control","call medical control","hang up, call med control","hang up and call the doctor"],"why":"If they tell you to do something you are not already allowed to do: hang up, call medical control, tell the doctor what they said."},{"ch":22,"q":"Activated charcoal is what kind of drug for poison in the gut?","a":["adsorbent","an adsorbent"],"why":"Charcoal is an adsorbent. It binds poison in the gut so the body does not absorb it."},{"ch":22,"q":"Charcoal dose concept is 1 gram per what?","a":["kilogram","kg","1 g/kg","kilogram (1 g/kg)"],"why":"Dose: 1 gram per kilogram. They must be awake and able to protect the airway. Not Arizona EMT scope."},{"ch":22,"q":"Should you make a poisoned patient vomit on purpose?","a":["no","do not","no / do not force vomit","no ipecac"],"why":"Do not make people vomit on purpose. Syrup of ipecac is the old vomit drug. Extra vomit raises lung risk."},{"ch":22,"q":"Alcohol is what kind of drug for the brain and breathing?","a":["CNS depressant","depressant","central nervous system depressant"],"why":"Alcohol is a CNS depressant. Everything down. Breathing down is the life threat. It also potentiates other drugs."},{"ch":22,"q":"What are delirium tremens (DTs)?","a":["heavy drinker stops cold turkey","heavy drinker who stops suddenly","alcohol withdrawal after stopping cold turkey","heavy long-time drinker stops suddenly"],"why":"DTs: heavy long-time drinker who stops cold turkey. Treat symptoms. ABCs first."},{"ch":22,"q":"What finding kills opioid overdose patients?","a":["slow shallow breathing","breathing stops","respiratory failure","slow/shallow breathing"],"why":"Slow and shallow breathing can stop. That is what kills them. Oxygen / BVM before Narcan."},{"ch":22,"q":"Does naloxone (Narcan) reverse barbiturates or benzodiazepines?","a":["no","no it does not","does nothing","Narcan does nothing"],"why":"Narcan only works on opioids. Barbs have 'barb' in the name. Benzos end in -pam or -lam. Different receptors."}];
const LINKS = "<a href=\"emt-quiz-index.html\">Hub</a><a href=\"ch22-toxicology-part1-key.html\">Key</a><a href=\"ch22-toxicology-part1-detailed.html\">Detailed</a>";

function norm(s) { return String(s).trim().toLowerCase(); }
function acceptList(item) {
  if (Array.isArray(item.a)) return item.a.map(String);
  if (item.a == null) return [];
  return [String(item.a)];
}
function isRight(item, typed) {
  const n = norm(typed);
  if (!n) return false;
  return acceptList(item).some(function (a) { return norm(a) === n; });
}

let i = 0, correct = 0, answered = 0, locked = false;
const main = document.getElementById("main");
const nextBtn = document.getElementById("nextBtn");
const scoreEl = document.getElementById("score");
const progLabel = document.getElementById("progLabel");
const progBar = document.getElementById("progBar");

function setProg() {
  scoreEl.textContent = correct + " / " + answered;
  progLabel.textContent = i < BANK.length ? ("Question " + (i + 1) + " of " + BANK.length) : "Done";
  progBar.style.width = (Math.min(i, BANK.length) / BANK.length * 100) + "%";
}

function renderEnd() {
  nextBtn.classList.remove("visible");
  const pct = BANK.length ? Math.round(correct / BANK.length * 100) : 0;
  main.innerHTML = '<div class="card end"><h2>Done</h2><div class="big">' + correct + " / " + BANK.length + '</div><p class="pct">' + pct + '% first-check correct</p><div class="links">' + LINKS + '</div><button type="button" class="check restart" id="restart">Again</button></div>';
  document.getElementById("restart").onclick = function () {
    i = 0; correct = 0; answered = 0; locked = false; renderQ();
  };
}

function renderQ() {
  if (i >= BANK.length) { setProg(); renderEnd(); return; }
  locked = false;
  nextBtn.classList.remove("visible");
  const item = BANK[i];
  setProg();
  main.innerHTML = '<div class="card"><p class="qtext"></p><input type="text" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button type="button" class="check" id="check">Check</button><div class="why" id="why"></div></div>';
  main.querySelector(".qtext").textContent = item.q;
  const input = document.getElementById("ans");
  const check = document.getElementById("check");
  const why = document.getElementById("why");
  input.focus();

  function submit() {
    if (locked) return;
    const typed = input.value;
    if (!norm(typed)) { input.focus(); return; }
    locked = true;
    answered += 1;
    const ok = isRight(item, typed);
    if (ok) correct += 1;
    input.disabled = true;
    check.disabled = true;
    why.classList.add("visible");
    why.innerHTML = "";
    const v = document.createElement("div");
    v.className = "verdict " + (ok ? "ok" : "bad");
    v.textContent = ok ? "Correct" : "Not quite";
    const w = document.createElement("div");
    w.textContent = item.why;
    why.appendChild(v);
    why.appendChild(w);
    setProg();
    nextBtn.textContent = i === BANK.length - 1 ? "Finish" : "Next";
    nextBtn.classList.add("visible");
  }
  check.onclick = submit;
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
  });
}

nextBtn.onclick = function () {
  if (!locked) return;
  i += 1;
  renderQ();
};

renderQ();
</script>
</body>
</html>
