<style>

<script>
const BANK = [{"ch":"endo","q":"Where do the adrenals sit, and what do the word parts mean?","opts":[{"t":"On the kidneys; ad- = above, renal = kidney","ok":true,"why":"Adrenal glands sit as a triangle/pyramid on top of the kidneys. Ad- = above; renal = kidney."},{"t":"Behind the stomach; ad- = around, renal = vessel","ok":false,"why":"Adrenal glands sit as a triangle/pyramid on top of the kidneys. Ad- = above; renal = kidney."},{"t":"In the brainstem; ad- = after, renal = nerve","ok":false,"why":"Adrenal glands sit as a triangle/pyramid on top of the kidneys. Ad- = above; renal = kidney."},{"t":"Inside the liver; ad- = beside, renal = filter","ok":false,"why":"Adrenal glands sit as a triangle/pyramid on top of the kidneys. Ad- = above; renal = kidney."}]},{"ch":"endo","q":"Adrenaline and norepinephrine show up on a test. How did he want EMTs to treat the names?","opts":[{"t":"Smash the pair; keep saying epinephrine as the working name","ok":true,"why":"Adrenaline = epinephrine; norepinephrine/noradrenaline also exist, but they smash together at EMT level. He said they will keep using epinephrine."},{"t":"Split the pair; keep saying noradrenaline as the only name","ok":false,"why":"Adrenaline = epinephrine; norepinephrine/noradrenaline also exist, but they smash together at EMT level. He said they will keep using epinephrine."},{"t":"Move both names to the pancreas and drop epinephrine entirely","ok":false,"why":"Adrenaline = epinephrine; norepinephrine/noradrenaline also exist, but they smash together at EMT level. He said they will keep using epinephrine."},{"t":"Treat them as opposite hormones, like insulin versus glucagon","ok":false,"why":"Adrenaline = epinephrine; norepinephrine/noradrenaline also exist, but they smash together at EMT level. He said they will keep using epinephrine."}]},{"ch":"endo","q":"Epinephrine hits alpha receptors. What happens to the vessels?","opts":[{"t":"Vessels clamp down (vasoconstriction)","ok":true,"why":"Alpha (1+2 lumped) hooks vessels and causes vasoconstriction."},{"t":"Bronchi open wide (bronchodilation)","ok":false,"why":"Alpha (1+2 lumped) hooks vessels and causes vasoconstriction."},{"t":"Occipital lobe processes extra vision","ok":false,"why":"Alpha (1+2 lumped) hooks vessels and causes vasoconstriction."},{"t":"Gut motility speeds up after a meal","ok":false,"why":"Alpha (1+2 lumped) hooks vessels and causes vasoconstriction."}]},{"ch":"endo","q":"Which hook and heart effects belong to beta-1?","opts":[{"t":"1 heart: faster rate and a stronger squeeze","ok":true,"why":"Beta-1 = 1 heart. Increases HR and contractility."},{"t":"2 lungs: open tubes and easier air flow","ok":false,"why":"Beta-1 = 1 heart. Increases HR and contractility."},{"t":"Many vessels: pipes clamp and pressure jumps","ok":false,"why":"Beta-1 = 1 heart. Increases HR and contractility."},{"t":"1 gut: rest-and-digest motility speeds up","ok":false,"why":"Beta-1 = 1 heart. Increases HR and contractility."}]},{"ch":"endo","q":"Beta-2 is the ‘2’ in his table. What does it do?","opts":[{"t":"Opens bronchi / bronchioles toward the alveoli","ok":true,"why":"Beta-2 = 2 lungs = bronchodilation."},{"t":"Speeds the heart and strengthens the squeeze","ok":false,"why":"Beta-2 = 2 lungs = bronchodilation."},{"t":"Clamps the aorta and raises vessel pressure","ok":false,"why":"Beta-2 = 2 lungs = bronchodilation."},{"t":"Starts speech in Broca’s on the left side","ok":false,"why":"Beta-2 = 2 lungs = bronchodilation."}]},{"ch":"endo","q":"A registry-style line: epinephrine binds to which receptor families?","opts":[{"t":"Alpha and beta — not just one family","ok":true,"why":"He said epinephrine binds to alpha and beta, not one family only."},{"t":"Beta-2 only — not the vessel family","ok":false,"why":"He said epinephrine binds to alpha and beta, not one family only."},{"t":"Alpha only — not the heart or lung family","ok":false,"why":"He said epinephrine binds to alpha and beta, not one family only."},{"t":"Chemoreceptors only — not alpha or beta","ok":false,"why":"He said epinephrine binds to alpha and beta, not one family only."}]},{"ch":"endo","q":"Why did he point albuterol at an asthma patient?","opts":[{"t":"It aims at beta-2; asthma is the tubes clamping shut","ok":true,"why":"Albuterol → beta-2. Asthma = bronchoconstriction."},{"t":"It aims at beta-1; asthma is the heart rate falling","ok":false,"why":"Albuterol → beta-2. Asthma = bronchoconstriction."},{"t":"It aims at alpha; asthma is the vessels opening wide","ok":false,"why":"Albuterol → beta-2. Asthma = bronchoconstriction."},{"t":"It aims at baroreceptors; asthma is a pressure drop only","ok":false,"why":"Albuterol → beta-2. Asthma = bronchoconstriction."}]},{"ch":"endo","q":"A patient is on a beta blocker for long-term high BP. What did he say that drug does?","opts":[{"t":"Occupies beta-1 and blocks it, so the heart stays slower","ok":true,"why":"Beta blockers block beta-1 for chronic high BP; they bind but block."},{"t":"Occupies beta-2 and opens it, so the lungs stay dilated","ok":false,"why":"Beta blockers block beta-1 for chronic high BP; they bind but block."},{"t":"Replaces the EpiPen dose so the vessels stay clamped","ok":false,"why":"Beta blockers block beta-1 for chronic high BP; they bind but block."},{"t":"Stimulates alpha immediately so the pressure jumps now","ok":false,"why":"Beta blockers block beta-1 for chronic high BP; they bind but block."}]},{"ch":"endo","q":"Pressure sensors: which two homes did he name for baroreceptors?","opts":[{"t":"Aorta leaving the left ventricle, and the carotids","ok":true,"why":"Baroreceptors in exactly two places: aorta and carotids."},{"t":"Jugulars in the neck, and the foramen magnum","ok":false,"why":"Baroreceptors in exactly two places: aorta and carotids."},{"t":"Small-bowel loops, and the deep dermal layer","ok":false,"why":"Baroreceptors in exactly two places: aorta and carotids."},{"t":"Pulmonary veins, and the solid spleen capsule","ok":false,"why":"Baroreceptors in exactly two places: aorta and carotids."}]},{"ch":"endo","q":"He called the epi fight-or-flight dump non-specific. Which group did he lump?","opts":[{"t":"Bleed, heart-pump failure, and anaphylactic vessel opening","ok":true,"why":"BP drop → adrenals → epi. Same package whether bleed, pump fail, or anaphylactic vasodilation."},{"t":"Only a spinal cord cut, and nothing about blood pressure","ok":false,"why":"BP drop → adrenals → epi. Same package whether bleed, pump fail, or anaphylactic vasodilation."},{"t":"Only an asthma attack, and nothing about vessel tone","ok":false,"why":"BP drop → adrenals → epi. Same package whether bleed, pump fail, or anaphylactic vasodilation."},{"t":"Only a high sugar, and nothing about a falling pressure","ok":false,"why":"BP drop → adrenals → epi. Same package whether bleed, pump fail, or anaphylactic vasodilation."}]},{"ch":"endo","q":"Chemoreceptors watch the chemistry. Which set did he list?","opts":[{"t":"Oxygen, carbon dioxide, sugar, and pH","ok":true,"why":"Chemoreceptors: chemistry of blood and fluid around brain/cord — O2, CO2, sugar, pH."},{"t":"Sodium, potassium, calcium, and bile","ok":false,"why":"Chemoreceptors: chemistry of blood and fluid around brain/cord — O2, CO2, sugar, pH."},{"t":"CSF pressure only, and not the blood gases","ok":false,"why":"Chemoreceptors: chemistry of blood and fluid around brain/cord — O2, CO2, sugar, pH."},{"t":"Skin temperature only, not the blood sugar","ok":false,"why":"Chemoreceptors: chemistry of blood and fluid around brain/cord — O2, CO2, sugar, pH."}]},{"ch":"endo","q":"Sympathetic vs parasympathetic — which pairing is his?","opts":[{"t":"Fight or flight versus rest-and-digest (feed and breed)","ok":true,"why":"Sympathetic = fight or flight. Parasympathetic = feed and breed / rest and digest."},{"t":"Superficial burn versus full-thickness of all layers","ok":false,"why":"Sympathetic = fight or flight. Parasympathetic = feed and breed / rest and digest."},{"t":"Brain-plus-cord versus all the leftover peripheral nerves","ok":false,"why":"Sympathetic = fight or flight. Parasympathetic = feed and breed / rest and digest."},{"t":"Motor going down versus sensory coming back up","ok":false,"why":"Sympathetic = fight or flight. Parasympathetic = feed and breed / rest and digest."}]},{"ch":"neuro","q":"CNS versus PNS in his split?","opts":[{"t":"CNS: brain plus cord. PNS: every other nerve","ok":true,"why":"CNS = brain + spinal cord. PNS = all other nerves."},{"t":"CNS: adrenals plus kidneys. PNS: liver plus spleen","ok":false,"why":"CNS = brain + spinal cord. PNS = all other nerves."},{"t":"CNS: motor only. PNS: sensory only, never motor","ok":false,"why":"CNS = brain + spinal cord. PNS = all other nerves."},{"t":"CNS: cerebrum only. PNS: skin layers only","ok":false,"why":"CNS = brain + spinal cord. PNS = all other nerves."}]},{"ch":"neuro","q":"Somatic vs autonomic — which hook matches his?","opts":[{"t":"Somatic: voluntary skeletal (Soma hook). Autonomic: involuntary","ok":true,"why":"Somatic = voluntary skeletal. Autonomic = involuntary (HR, asleep breathing, gut)."},{"t":"Somatic: same as alpha. Autonomic: same as beta-2 only","ok":false,"why":"Somatic = voluntary skeletal. Autonomic = involuntary (HR, asleep breathing, gut)."},{"t":"Somatic: the liver. Autonomic: the spleen in the LUQ","ok":false,"why":"Somatic = voluntary skeletal. Autonomic = involuntary (HR, asleep breathing, gut)."},{"t":"Somatic: vision only. Autonomic: hearing in the temporal","ok":false,"why":"Somatic = voluntary skeletal. Autonomic = involuntary (HR, asleep breathing, gut)."}]},{"ch":"neuro","q":"Brainstem (midbrain, pons, medulla — do not split). What jobs?","opts":[{"t":"Blood pressure and breathing — leave the three names lumped","ok":true,"why":"Brainstem (midbrain, pons, medulla — don’t split): BP + breathing. Most protected, deepest."},{"t":"Nutrient absorption — split duodenum, jejunum, and ileum","ok":false,"why":"Brainstem (midbrain, pons, medulla — don’t split): BP + breathing. Most protected, deepest."},{"t":"Speech and vision — split Broca’s from the occipital lobe","ok":false,"why":"Brainstem (midbrain, pons, medulla — don’t split): BP + breathing. Most protected, deepest."},{"t":"Skin burn depth — split epidermis from the full thickness","ok":false,"why":"Brainstem (midbrain, pons, medulla — don’t split): BP + breathing. Most protected, deepest."}]},{"ch":"neuro","q":"Shoe-tying again. Which cerebrum / cerebellum map is true?","opts":[{"t":"Kid learning = cerebrum; adult no-look tying = cerebellum","ok":true,"why":"Learning the task is conscious cerebrum. Adult muscle-memory coordination is cerebellum. Recall of past events is still cerebrum."},{"t":"Kid learning = cerebellum; adult no-look tying = cerebrum","ok":false,"why":"Learning the task is conscious cerebrum. Adult muscle-memory coordination is cerebellum. Recall of past events is still cerebrum."},{"t":"Both jobs are brainstem only; neither is cerebrum work","ok":false,"why":"Learning the task is conscious cerebrum. Adult muscle-memory coordination is cerebellum. Recall of past events is still cerebrum."},{"t":"Both jobs are skin layers only; neither is cerebellum work","ok":false,"why":"Learning the task is conscious cerebrum. Adult muscle-memory coordination is cerebellum. Recall of past events is still cerebrum."}]},{"ch":"neuro","q":"Broca’s and making speech — which lobe did he attach them to?","opts":[{"t":"Left frontal (speech production)","ok":true,"why":"Frontal: personality, judgment, concentration; Broca’s, left frontal, speech production."},{"t":"Right occipital (vision processing)","ok":false,"why":"Frontal: personality, judgment, concentration; Broca’s, left frontal, speech production."},{"t":"Left temporal (vision only, he said)","ok":false,"why":"Frontal: personality, judgment, concentration; Broca’s, left frontal, speech production."},{"t":"Right cerebellum (coordination only)","ok":false,"why":"Frontal: personality, judgment, concentration; Broca’s, left frontal, speech production."}]},{"ch":"neuro","q":"A blow to the back of the head worries vision. Why, in his telling?","opts":[{"t":"Occipital = vision; eyes in front, processing in back","ok":true,"why":"Occipital = vision. Eyes front, processing back."},{"t":"Occipital = diaphragm; C3–5 keep that muscle alive","ok":false,"why":"Occipital = vision. Eyes front, processing back."},{"t":"Occipital = spatial map only; vision lives in the frontal","ok":false,"why":"Occipital = vision. Eyes front, processing back."},{"t":"Occipital = taste and hearing; vision lives in the cerebellum","ok":false,"why":"Occipital = vision. Eyes front, processing back."}]},{"ch":"neuro","q":"Suspected stroke. What was his EMT-level takeaway?","opts":[{"t":"Recognize it; do not treat the type until a CT is done","ok":true,"why":"Recognize stroke, not which lobe. No treatment until CT. Ch 18."},{"t":"Name the exact lobe on scene before you ever move them","ok":false,"why":"Recognize stroke, not which lobe. No treatment until CT. Ch 18."},{"t":"Intubate every stroke before you ever check a pulse","ok":false,"why":"Recognize stroke, not which lobe. No treatment until CT. Ch 18."},{"t":"Give a clot-busting drug on scene before any hospital CT","ok":false,"why":"Recognize stroke, not which lobe. No treatment until CT. Ch 18."}]},{"ch":"neuro","q":"Hypothalamus vs RAS — which job pair did he give?","opts":[{"t":"Hypothalamus: temperature. RAS: consciousness gatekeeper","ok":true,"why":"Hypothalamus: temperature. Reticular activating system: consciousness gatekeeper that filters sensory noise."},{"t":"Hypothalamus: urine output. RAS: how deep a burn goes","ok":false,"why":"Hypothalamus: temperature. Reticular activating system: consciousness gatekeeper that filters sensory noise."},{"t":"Hypothalamus: vision map. RAS: how wide bronchi open","ok":false,"why":"Hypothalamus: temperature. Reticular activating system: consciousness gatekeeper that filters sensory noise."},{"t":"Both sit as baroreceptors in the aorta and both carotids","ok":false,"why":"Hypothalamus: temperature. Reticular activating system: consciousness gatekeeper that filters sensory noise."}]},{"ch":"neuro","q":"CSF around brain and cord. What job did his analogy give it?","opts":[{"t":"Spreads out energy, like amniotic fluid or freeway barrels","ok":true,"why":"CSF washes brain and cord and dissipates energy. Same idea as amniotic fluid and water barrels. Spinal tap samples it."},{"t":"Carries motor commands down the cord to the muscles","ok":false,"why":"CSF washes brain and cord and dissipates energy. Same idea as amniotic fluid and water barrels. Spinal tap samples it."},{"t":"Measures blood sugar the way insulin unlocks a cell","ok":false,"why":"CSF washes brain and cord and dissipates energy. Same idea as amniotic fluid and water barrels. Spinal tap samples it."},{"t":"Makes epinephrine in the adrenal caps on the kidneys","ok":false,"why":"CSF washes brain and cord and dissipates energy. Same idea as amniotic fluid and water barrels. Spinal tap samples it."}]},{"ch":"neuro","q":"Neck veins: fat vs a flat groove. Which reading is his?","opts":[{"t":"Fat: backup, right side cannot take inflow. Flat: empty tank","ok":true,"why":"Distended EJ = blood backing up, too much pressure, right side can’t accept inflow. Flat/groove = empty tank. He did not name the two book conditions."},{"t":"Fat: empty tank after a big bleed. Flat: too much pressure","ok":false,"why":"Distended EJ = blood backing up, too much pressure, right side can’t accept inflow. Flat/groove = empty tank. He did not name the two book conditions."},{"t":"Fat: left-lobe stroke only. Flat: an asthma attack only","ok":false,"why":"Distended EJ = blood backing up, too much pressure, right side can’t accept inflow. Flat/groove = empty tank. He did not name the two book conditions."},{"t":"Fat: same as bronchodilation. Flat: same as beta-1 speed","ok":false,"why":"Distended EJ = blood backing up, too much pressure, right side can’t accept inflow. Flat/groove = empty tank. He did not name the two book conditions."}]},{"ch":"neuro","q":"Cord traffic plus the phrenic memory — which line is his?","opts":[{"t":"Motor down, sensory up; below = limp + numb; C3–4–5 = diaphragm","ok":true,"why":"Cord exits foramen magnum. Motor down, sensory up. Injury: paralysis below + numbness. Phrenic C3, 4, 5 keep the diaphragm alive."},{"t":"Motor up, sensory down; injury = headache only; C1 = the liver","ok":false,"why":"Cord exits foramen magnum. Motor down, sensory up. Injury: paralysis below + numbness. Phrenic C3, 4, 5 keep the diaphragm alive."},{"t":"Both travel only in the jugulars; injury never causes numbness","ok":false,"why":"Cord exits foramen magnum. Motor down, sensory up. Injury: paralysis below + numbness. Phrenic C3, 4, 5 keep the diaphragm alive."},{"t":"Signals stop at the adrenals; C3–4–5 keep the spleen alive","ok":false,"why":"Cord exits foramen magnum. Motor down, sensory up. Injury: paralysis below + numbness. Phrenic C3, 4, 5 keep the diaphragm alive."}]},{"ch":"skin","q":"Which set is the homeostasis four-pack he actually said?","opts":[{"t":"HR 60–100, adult RR 12–20, BGL 80–120, SpO2 94–99","ok":true,"why":"He listed HR 60–100, adult RR 12–20, BGL 80–120, SpO2% 94–99."},{"t":"HR 40–60, adult RR 6–10, BGL 40–60, SpO2 80–85","ok":false,"why":"He listed HR 60–100, adult RR 12–20, BGL 80–120, SpO2% 94–99."},{"t":"HR 50–70, adult RR 8–12, BGL 60–80, SpO2 88–92","ok":false,"why":"He listed HR 60–100, adult RR 12–20, BGL 80–120, SpO2% 94–99."},{"t":"HR 100–140, adult RR 30–40, BGL 200–300, SpO2 70–80","ok":false,"why":"He listed HR 60–100, adult RR 12–20, BGL 80–120, SpO2% 94–99."}]},{"ch":"skin","q":"Match the public burn numbers to the class names he used.","opts":[{"t":"1st superficial (epidermis), 2nd partial (into dermis), 3rd full (all layers)","ok":true,"why":"1st = superficial = epidermis. 2nd = partial thickness = into dermis. 3rd = full thickness = all skin layers. Rule of nines not in these notes."},{"t":"1st full (all layers), 2nd superficial (epidermis), 3rd partial (dermis)","ok":false,"why":"1st = superficial = epidermis. 2nd = partial thickness = into dermis. 3rd = full thickness = all skin layers. Rule of nines not in these notes."},{"t":"1st partial (dermis), 2nd full (all layers), 3rd superficial (epidermis)","ok":false,"why":"1st = superficial = epidermis. 2nd = partial thickness = into dermis. 3rd = full thickness = all skin layers. Rule of nines not in these notes."},{"t":"All three stay epidermis-only; he never used thickness names","ok":false,"why":"1st = superficial = epidermis. 2nd = partial thickness = into dermis. 3rd = full thickness = all skin layers. Rule of nines not in these notes."}]},{"ch":"gi","q":"Small intestine: job, plus the three names he said not to keep splitting?","opts":[{"t":"Nutrient uptake; duodenum, jejunum, ileum","ok":true,"why":"Small intestine = nutrient absorption. Three segments they won’t keep splitting: duodenum, jejunum, ileum."},{"t":"CSF cushion; frontal, parietal, occipital","ok":false,"why":"Small intestine = nutrient absorption. Three segments they won’t keep splitting: duodenum, jejunum, ileum."},{"t":"Epi making; cerebrum, cerebellum, brainstem","ok":false,"why":"Small intestine = nutrient absorption. Three segments they won’t keep splitting: duodenum, jejunum, ileum."},{"t":"Urine filter; cortex, medulla, and pelvis","ok":false,"why":"Small intestine = nutrient absorption. Three segments they won’t keep splitting: duodenum, jejunum, ileum."}]},{"ch":"gi","q":"Peristalsis, as he defined it?","opts":[{"t":"Smooth-muscle waves that move contents; there is no pump","ok":true,"why":"Peristalsis = smooth-muscle waves. No pump. Abdominal leak can paralyze peristalsis."},{"t":"Left-ventricle squeeze that makes the pulse you feel","ok":false,"why":"Peristalsis = smooth-muscle waves. No pump. Abdominal leak can paralyze peristalsis."},{"t":"A needle in the back that samples spinal fluid","ok": F","ok":false,"why":"They put a tube down the nose into the stomach to suction the green-brown backup, and used antibiotics and anti-inflammatories until motion returned."},{"t":"Epinephrine aimed at alpha only, plus a clot-busting drug given on scene","ok":false,"why":"They put a tube down the nose into the stomach to suction the green-brown backup, and used antibiotics and anti-inflammatories until motion returned."},{"t":"Insulin to drop the sugar, plus a surgical mask used for airborne droplets","ok":false,"why":"They put a tube down the nose into the stomach to suction the green-brown backup, and used antibiotics and anti-inflammatories until motion returned."}]},{"ch":"gi","q":"Pancreas geography: where, and why can the pain travel?","opts":[{"t":"Upper mid belly on the RUQ/LUQ line, far back — mid-upper pain can hit the back","ok":true,"why":"Not on their chart. Upper middle abdomen, spans the RUQ/LUQ border, sits far back — so mid-upper pain often also hits the back."},{"t":"Triangle caps on the kidneys (ad- = above) — flank pain can hit the neck","ok":false,"why":"Not on their chart. Upper middle abdomen, spans the RUQ/LUQ border, sits far back — so mid-upper pain often also hits the back."},{"t":"Under the epidermis with the hair follicles — skin pain can hit the feet","ok":false,"why":"Not on their chart. Upper middle abdomen, spans the RUQ/LUQ border, sits far back — so mid-upper pain often also hits the back."},{"t":"Left frontal next to Broca’s area — belly pain can hit speech first","ok":false,"why":"Not on their chart. Upper middle abdomen, spans the RUQ/LUQ border, sits far back — so mid-upper pain often also hits the back."}]},{"ch":"gi","q":"On the GI side, what job did he give the pancreatic enzymes?","opts":[{"t":"Help break down starches and proteins after food leaves the stomach","ok":true,"why":"Pancreas GI job: enzymes that help break down starches and proteins. Extra liver and pancreas enzymes enter the first small-intestine segment."},{"t" iabetes treatment was not in the notes."},{"t":"Somatostatin is the main EMT asthma drug; diabetes is a full-thickness dermis burn","ok":false,"why":"A third hormone, somatostatin, referees insulin and glucagon — they do not talk about it at EMT level. Diabetes = problems on the pancreas endocrine / blood-sugar side. Specific diabetes treatment was not in the notes."},{"t":"Somatostatin is how CSF dumps energy; diabetes is a left-frontal speech stroke","ok":false,"why":"A third hormone, somatostatin, referees insulin and glucagon — they do not talk about it at EMT level. Diabetes = problems on the pancreas endocrine / blood-sugar side. Specific diabetes treatment was not in the notes."},{"t":"Somatostatin clamps the aorta; diabetes is only a hollow-appendix leak job","ok":false,"why":"A third hormone, somatostatin, referees insulin and glucagon — they do not talk about it at EMT level. Diabetes = problems on the pancreas endocrine / blood-sugar side. Specific diabetes treatment was not in the notes."}]},{"ch":"gi","q":"Liver: location and the solid-organ point he actually made?","opts":[{"t":"RUQ; solid and blood-soaked, so trauma can make it a big bleeder","ok":true,"why":"Big solid organ in the RUQ. Solid = blood-saturated = big bleeder if traumatized."},{"t":"LLQ; hollow and air-filled, so trauma can make it only leak air","ok":false,"why":"Big solid organ in the RUQ. Solid = blood-saturated = big bleeder if traumatized."},{"t":"Behind the carotids; it is where epinephrine is made and stored","ok":false,"why":"Big solid organ in the RUQ. Solid = blood-saturated = big bleeder if traumatized."},{"t":"In the cerebellum; it is where automatic shoe-tying is stored","ok":false,"why":"Big solid organ in the RUQ. Solid = blood-saturated = big bleeder if traumatized."}]},{"ch":"gi","q":"Besides detox, which two liver products did he name before the line cut?","opts":[{"t":"Bile to break down fat, and clotting factors (line ends there)","ok":true,"why":"Jobs he named: detoxifies the blood; produces bile (breaks down fat); produces clotting factors — the spoken line ends at clotting factors."},{"t":"Albuterol for beta-2 work, and beta blockers for a slow heart","ok":false,"why":"Jobs he named: detoxifies the blood; produces bile (breaks down fat); produces clotting factors — the spoken line ends at clotting factors."},{"t":"Insulin and glucagon only, with no bile and no clotting pieces","ok":false,"why":"Jobs he named: detoxifies the blood; produces bile (breaks down fat); produces clotting factors — the spoken line ends at clotting factors."},{"t":"CSF and amniotic fluid only, with no bile and no clotting pieces","ok":false,"why":"Jobs he named: detoxifies the blood; produces bile (breaks down fat); produces clotting factors — the spoken line ends at clotting factors."}]},{"ch":"gi","q":"Pain complaint: whose “right,” and what else did he want asked?","opts":[{"t":"Patient’s right, not yours; onset, better/worse, describe, where, does it move","ok":true,"why":"Right/left = the patient’s right/left. Pain questions he listed: what were you doing when it started, anything better or worse, how would you describe it, where do you feel it, and does it move anywhere else."},{"t":"Your right facing the stretcher; skip radiation and skip the description","ok":false,"why":"Right/left = the patient’s right/left. Pain questions he listed: what were you doing when it started, anything better or worse, how would you describe it, where do you feel it, and does it move anywhere else."},{"t":"Only the hypothalamus temperature; skip where the pain sits entirely","ok":false,"why":"Right/left = the patient’s right/left. Pain questions he listed: what were you doing when it started, anything better or worse, how would you describe it, where do you feel it, and does it move anywhere else."},{"t":"Only whether the neck veins are fat; skip onset and skip movement","ok":false,"why":"Right/left = the patient’s right/left. Pain questions he listed: what were y function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {endo:"Endocrine / receptors",neuro:"Nervous / CSF / JVD",skin:"Homeostasis / skin",gi:"GI / abdomen"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">From later Saturday lecture only. 10:48 talk ended at 30:54; last line cuts on clotting factors.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · later talks only</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
