<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Sat 9:39 Pulmonary Embolism and Obstructive Shock</title>
<style>
:root {
  --bg: #f4efe6;
  --paper: #fffdf8;
  --ink: #1c2430;
  --muted: #5a6573;
  --navy: #1e3a5f;
  --navy-2: #16304d;
  --red: #b42318;
  --red-soft: #fde8e6;
  --green: #1b7a46;
  --green-soft: #e5f6ec;
  --line: #d8d0c4;
  --chosen-wrong: #f8d7d4;
  --chosen-right: #c8edd4;
  --correct-outline: #1b7a46;
  --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; font-weight: 400; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.ch-tag {
  display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: #e8eef6; color: var(--navy); padding: 4px 8px; border-radius: 6px; margin-bottom: 10px;
}
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: block; width: 100%; text-align: left;
  min-height: 48px; padding: 12px 14px;
  font-size: 1rem; line-height: 1.35;
  border: 2px solid var(--line); border-radius: 12px;
  background: #fff; color: var(--ink);
  cursor: pointer; appearance: none;
  font-family: inherit;
}
.opt:active { transform: scale(.995); }
.opt .letter {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: #eef2f6; font-weight: 700; font-size: .85rem; margin-right: 8px; flex-shrink: 0;
}
.opt .ot { display: inline; }
.opt.locked { cursor: default; }
.opt.chosen.wrong { background: var(--chosen-wrong); border-color: var(--red); }
.opt.chosen.right, .opt.show-correct { background: var(--chosen-right); border-color: var(--correct-outline); }
.opt.dim { opacity: .55; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.why .correct-line { margin-top: 8px; font-weight: 650; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.btn:active { background: var(--navy-2); }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
.miss { margin-top: 18px; }
.miss h3 { margin: 0 0 10px; font-size: 1.05rem; }
.miss-item { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.miss-item .mq { font-weight: 650; margin-bottom: 6px; }
.miss-item .mwhy { font-size: .92rem; color: #333; }
.restart { margin-top: 8px; }
#start-note { font-size: .86rem; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Sat 9:39 Pulmonary Embolism and Obstructive Shock</h1>
  <div class="sub">Recap only · you/your · 12 questions</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [{"ch": "pipe", "q": "A pulmonary embolism blocks which pipe?", "opts": [{"t": "Pulmonary blood flow", "ok": true, "why": "PE blocks the blood-flow pipe (pulmonary circulation). Airway pipes can still be open."}, {"t": "Airway airflow pipes", "ok": false, "why": "Airflow pipes stay intact. Breath sounds can still be clear."}, {"t": "Tracheal air movement", "ok": false, "why": "The trachea can still move air. The blocked pipe is pulmonary blood flow."}, {"t": "Bronchial air movement", "ok": false, "why": "Bronchi can still move air. The blocked pipe is pulmonary blood flow."}]}, {"ch": "sounds", "q": "Why can breath sounds stay clear and equal in a PE?", "opts": [{"t": "They track the air moving", "ok": true, "why": "Breath sounds reflect air moving, not blood flow. The airway can still be open."}, {"t": "They track blood movement", "ok": false, "why": "Sounds do not tell you blood is reaching the alveoli."}, {"t": "They mean air has stopped", "ok": false, "why": "Clear equal sounds mean air is still moving, not that it stopped."}, {"t": "They mean airway is closed", "ok": false, "why": "If the airway were closed, sounds would not stay clear and equal."}]}, {"ch": "split", "q": "Ventilation looks good. Saturation keeps falling. What split is this?", "opts": [{"t": "Gas exchange is failing", "ok": true, "why": "Ventilation is air in and out. Respiration is gas exchange. PE breaks gas exchange."}, {"t": "Ventilation is failing", "ok": false, "why": "Ventilation looking good means air is still moving. Gas exchange is the failure."}, {"t": "Air in and out failing", "ok": false, "why": "Air in and out is ventilation, and that still looks good."}, {"t": "Breathing quality failing", "ok": false, "why": "Quality is part of ventilation. This split is gas exchange failing."}]}, {"ch": "pattern", "q": "Sudden dyspnea, clear lungs, non-rebreather, sat still dropping. What is this?", "opts": [{"t": "Pulmonary embolism", "ok": true, "why": "Normal ventilation signs plus hypoxia that high-flow oxygen does not fix. Think PE."}, {"t": "Tension pneumothorax", "ok": false, "why": "Tension takes sounds away on one side. PE keeps them."}, {"t": "Cardiac tamponade", "ok": false, "why": "Tamponade is JVD, hypotension, and muffled tones, not this lung pattern."}, {"t": "Asthma with wheezes", "ok": false, "why": "Asthma/COPD usually bring wheezes. PE keeps clear lungs."}]}, {"ch": "o2fail", "q": "Breathing looks like it should fix the hypoxia. High-flow oxygen does not. What is going on?", "opts": [{"t": "Oxygenation is failing", "ok": true, "why": "Ventilation can look fine while oxygenation fails. High-flow oxygen does not fix it."}, {"t": "Ventilation has stopped", "ok": false, "why": "Breathing looking like it should work means ventilation is still going."}, {"t": "Airway just closed off", "ok": false, "why": "A closed airway would not look like breathing that should fix hypoxia."}, {"t": "Chest rise has stopped", "ok": false, "why": "Good-looking breathing includes chest rise. The failure is oxygenation."}]}, {"ch": "emt", "q": "What can you do in the field for a PE obstruction?", "opts": [{"t": "Treat shock and transport", "ok": true, "why": "You cannot pull the clot. Treat for shock and get to the hospital fast."}, {"t": "Needle decompress as ALS", "ok": false, "why": "Needle decompression is a paramedic move for tension, not an EMT PE fix."}, {"t": "Drain the pericardial sac", "ok": false, "why": "You cannot drain tamponade. Treat shock and transport."}, {"t": "Pull the clot in the field", "ok": false, "why": "You cannot remove the clot in the field."}]}, {"ch": "needle", "q": "Who may needle-decompress a tension pneumothorax in this recap?", "opts": [{"t": "Paramedics if in scope", "ok": true, "why": "Paramedics may needle decompress. This recap does not give that to EMTs."}, {"t": "EMTs on every protocol", "ok": false, "why": "EMTs usually cannot perform this here."}, {"t": "Hospital staff only here", "ok": false, "why": "Paramedics may do it in the field if it is in scope."}, {"t": "EMT skill on this recap", "ok": false, "why": "This recap does not give needle decompression to EMTs."}]}, {"ch": "tens", "q": "Severe dyspnea, absent sounds on one side, JVD, tracheal deviation late. What is this?", "opts": [{"t": "Tension pneumo (one side)", "ok": true, "why": "One silent side plus those shock extras is tension, not a PE with clear lungs."}, {"t": "Pulmonary PE (clear lung)", "ok": false, "why": "PE keeps clear, equal breath sounds."}, {"t": "Tamponade (muffled tones)", "ok": false, "why": "Tamponade keeps equal sounds and adds muffled heart tones."}, {"t": "Asthma/COPD (wheeze set)", "ok": false, "why": "Asthma/COPD usually bring wheezes, not a silent hemithorax."}]}, {"ch": "tamp", "q": "JVD, hypotension, muffled heart sounds. What is this?", "opts": [{"t": "Tamponade (muffled tones)", "ok": true, "why": "Those three are tamponade (Beck’s triad). Fluid in the sac restricts filling."}, {"t": "Tension pneumo (one side)", "ok": false, "why": "Tension is a silent lung, not muffled heart tones as the triad."}, {"t": "Pulmonary PE (clear lung)", "ok": false, "why": "PE is sudden dyspnea and oxygen that does not help, not this triad."}, {"t": "Tension (muffled tones)", "ok": false, "why": "Muffled tones go with tamponade, not tension."}]}, {"ch": "nrb", "q": "Breathing is adequate. What oxygen does this recap want?", "opts": [{"t": "Non-rebreather, adequate", "ok": true, "why": "High-flow oxygen on a non-rebreather about 15 L/min if breathing is adequate. Bag them if it is not."}, {"t": "Bag-valve mask, still ok", "ok": false, "why": "BVM is for inadequate breathing, not adequate rate and volume."}, {"t": "Non-rebreather after tire", "ok": false, "why": "Give the non-rebreather now if they are in distress and breathing is adequate. Prepare a BVM if they tire."}, {"t": "Bag-valve mask, inadequate", "ok": false, "why": "Breathing is adequate on this stem. BVM is for when breathing is not."}]}, {"ch": "reassess", "q": "They are unstable. How often does this recap want a reassess?", "opts": [{"t": "Every 5 mins (unstable)", "ok": true, "why": "Unstable: reassess every 5 minutes (LOC, ABCs, vitals, sat, skin)."}, {"t": "Every 15 min (unstable)", "ok": false, "why": "15 minutes is not the unstable interval in this recap."}, {"t": "Every 5 min (if stable)", "ok": false, "why": "This stem is unstable. The recap’s 5-minute check is for unstable patients."}, {"t": "Once on hospital arrival", "ok": false, "why": "Reassess on the way, not once you arrive."}]}, {"ch": "warm", "q": "Besides oxygen and rapid transport, how do you treat them for shock here?", "opts": [{"t": "Keep them warm, blankets", "ok": true, "why": "Treat for shock: high-flow oxygen, keep warm with blankets, rapid transport, hospital alert."}, {"t": "Needle the PE yourself", "ok": false, "why": "You cannot pull the clot. Keep them warm and transport."}, {"t": "Drain tamponade on scene", "ok": false, "why": "You cannot drain the sac. Keep them warm and transport."}, {"t": "Wait for the sat to rise", "ok": false, "why": "Do not wait. Keep them warm, give high-flow oxygen, and load and go."}]}];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"pipe": "Blood-flow pipe", "sounds": "Breath sounds", "split": "Ventilation vs gas exchange", "pattern": "PE pattern", "o2fail": "Refractory hypoxia", "emt": "EMT care", "needle": "Needle decomp", "tens": "Tension", "tamp": "Tamponade", "nrb": "Oxygen", "reassess": "Reassess", "warm": "Shock care"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sat 9:39 Pulmonary Embolism and Obstructive Shock recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · PE and obstructive shock recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
</body>
</html>
