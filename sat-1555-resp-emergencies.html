<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Sat 3:55 Respiratory Emergencies Overview</title>
<style>
:root {
  --bg: #f4efe6;
  --paper: #fffdf8;
  --ink: #1c2430;
  --muted: #5a6573;
  --navy: #1e3a5f;
  --navy-2: #16304d;
  --red: #b42318;
  --red-soft: #fde8e6;
  --green: #1b7a46;
  --green-soft: #e5f6ec;
  --line: #d8d0c4;
  --chosen-wrong: #f8d7d4;
  --chosen-right: #c8edd4;
  --correct-outline: #1b7a46;
  --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; font-weight: 400; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.ch-tag {
  display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: #e8eef6; color: var(--navy); padding: 4px 8px; border-radius: 6px; margin-bottom: 10px;
}
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: block; width: 100%; text-align: left;
  min-height: 48px; padding: 12px 14px;
  font-size: 1rem; line-height: 1.35;
  border: 2px solid var(--line); border-radius: 12px;
  background: #fff; color: var(--ink);
  cursor: pointer; appearance: none;
  font-family: inherit;
}
.opt:active { transform: scale(.995); }
.opt .letter {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: #eef2f6; font-weight: 700; font-size: .85rem; margin-right: 8px; flex-shrink: 0;
}
.opt .ot { display: inline; }
.opt.locked { cursor: default; }
.opt.chosen.wrong { background: var(--chosen-wrong); border-color: var(--red); }
.opt.chosen.right, .opt.show-correct { background: var(--chosen-right); border-color: var(--correct-outline); }
.opt.dim { opacity: .55; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.why .correct-line { margin-top: 8px; font-weight: 650; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.btn:active { background: var(--navy-2); }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
.miss { margin-top: 18px; }
.miss h3 { margin: 0 0 10px; font-size: 1.05rem; }
.miss-item { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.miss-item .mq { font-weight: 650; margin-bottom: 6px; }
.miss-item .mwhy { font-size: .92rem; color: #333; }
.restart { margin-top: 8px; }
#start-note { font-size: .86rem; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Sat 3:55 Respiratory Emergencies Overview</h1>
  <div class="sub">Recap only · you/your · 12 questions</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [{"ch": "cpapbp", "q": "Which finding is a CPAP contraindication in this recap?", "opts": [{"t": "Low pressure or shock", "ok": true, "why": "CPAP drops blood pressure more. Skip it in hypotension or shock."}, {"t": "High pressure only now", "ok": false, "why": "High pressure is not the CPAP no in this recap. Low pressure is."}, {"t": "Crackles in both lungs", "ok": false, "why": "Crackles from pulmonary edema are a CPAP picture, not a contraindication."}, {"t": "History of CHF alone", "ok": false, "why": "CHF with edema is why you consider CPAP, if pressure is adequate."}]}, {"ch": "cpaphow", "q": "How does CPAP move fluid in pulmonary edema in this recap?", "opts": [{"t": "Back into the bloodstream", "ok": true, "why": "They exhale against pressure. That back pressure pushes fluid from the alveoli back into the bloodstream."}, {"t": "Deeper into the alveoli", "ok": false, "why": "CPAP is meant to push fluid out of the alveoli, not deeper in."}, {"t": "Out through the mouth only", "ok": false, "why": "The fluid goes back into the blood, not out the mouth."}, {"t": "Into the pleural space now", "ok": false, "why": "Pleural fluid is effusion, not what CPAP does to alveolar fluid."}]}, {"ch": "pnd", "q": "Paroxysmal nocturnal dyspnea in this recap. How do you position them?", "opts": [{"t": "Keep them sitting upright", "ok": true, "why": "PND is dyspnea lying down at night. They sleep upright. Keep them sitting up."}, {"t": "Force them onto their back", "ok": false, "why": "Lying flat spreads fluid over more lung. Do not force them flat."}, {"t": "Prone for every PND case", "ok": false, "why": "This recap wants them sitting upright, not prone."}, {"t": "Head-down to shift fluid", "ok": false, "why": "Head-down is not the PND position. Sit them up."}]}, {"ch": "copdo2", "q": "Hypoxic COPD patient, short EMS transport. Oxygen in this recap?", "opts": [{"t": "Give oxygen for hypoxia", "ok": true, "why": "Short transports: still treat hypoxia. Do not withhold oxygen for hypoxic drive."}, {"t": "Hold oxygen for drive", "ok": false, "why": "Do not withhold oxygen from a hypoxic COPD patient on a short run."}, {"t": "Cannula first, short run", "ok": false, "why": "A cannula instead of a non-rebreather is the long-transport option, not a short run."}, {"t": "Med control before any O2", "ok": false, "why": "Medical direction is for long or borderline cases. On a short hypoxic run, give oxygen."}]}, {"ch": "ana", "q": "When does this recap want epinephrine for an allergic reaction?", "opts": [{"t": "Two or more body systems", "ok": true, "why": "Anaphylaxis is two or more systems. Then epinephrine IM. One system only: no epi."}, {"t": "Skin findings only, hives", "ok": false, "why": "One system (often skin) is a mild reaction. Monitor and transport. No epi."}, {"t": "Itching with no other sign", "ok": false, "why": "Itch alone is one system. No epinephrine."}, {"t": "Any sneeze after a sting", "ok": false, "why": "You need two or more systems, not any sneeze."}]}, {"ch": "stinger", "q": "Bee stinger still in the skin. How does this recap want it out?", "opts": [{"t": "Scrape it with straight edge", "ok": true, "why": "Scrape it out with a straight edge. Tweezers can squeeze more venom. The sac can inject for about 20 minutes."}, {"t": "Pull it out with tweezers now", "ok": false, "why": "Avoid tweezers. They can squeeze more venom from the sac."}, {"t": "Leave the stinger in the skin", "ok": false, "why": "Scrape it out. The sac can keep injecting."}, {"t": "Squeeze the venom sac harder", "ok": false, "why": "Do not squeeze the sac. Scrape with a straight edge."}]}, {"ch": "pe", "q": "Suspected PE. Why can a non-rebreather leave the saturation low in this recap?", "opts": [{"t": "Blood can't reach alveoli", "ok": true, "why": "Air reaches the alveoli, but the clot blocks blood from getting there, so gas exchange fails."}, {"t": "Air cannot reach alveoli", "ok": false, "why": "Air does reach the alveoli. Blood does not."}, {"t": "Not breathing deep enough", "ok": false, "why": "This recap’s PE has adequate rate and depth. The clot is the problem, not shallow breaths."}, {"t": "Fluid in the alveoli now", "ok": false, "why": "Alveolar fluid is pulmonary edema. PE often has normal sounds."}]}, {"ch": "co", "q": "Carbon monoxide poisoning. What does this recap say about the pulse ox?", "opts": [{"t": "Pulse ox can lie here", "ok": true, "why": "The probe sees hemoglobin occupied and cannot tell carbon monoxide from oxygen. SpO₂ can look normal. Still give high-flow oxygen."}, {"t": "Pulse ox is always right", "ok": false, "why": "Pulse ox can read normal or high in carbon monoxide. It lies."}, {"t": "Reads low, so skip O2", "ok": false, "why": "The recap’s lie is a normal or high reading, not a low one, and you still give high-flow oxygen."}, {"t": "Can tell CO from oxygen", "ok": false, "why": "The probe cannot tell carbon monoxide from oxygen."}]}, {"ch": "bag", "q": "Panic hyperventilation. What does this recap say not to do?", "opts": [{"t": "Do not use a paper bag", "ok": true, "why": "Do not have them breathe into a paper bag. It restricts oxygen. Coach slow breathing after a full assessment."}, {"t": "Coach slow breathing now", "ok": false, "why": "Coaching slow breathing is what you do. The recap’s don’t is the paper bag."}, {"t": "Box breathing 4-4-4-4", "ok": false, "why": "Box breathing is the recap’s coaching tool. The don’t is the paper bag."}, {"t": "Oxygen if you are unsure", "ok": false, "why": "Oxygen is okay if you are not sure. The recap’s don’t is the paper bag."}]}, {"ch": "crack", "q": "Crackles in this recap mean fluid where?", "opts": [{"t": "Inside the alveoli only", "ok": true, "why": "Crackles are popping from fluid in the alveoli (pulmonary edema). Pleural effusion is fluid around the lung, so no crackles."}, {"t": "Around the lung only now", "ok": false, "why": "Fluid around the lung is pleural effusion and does not make crackles."}, {"t": "In the upper airway now", "ok": false, "why": "Upper fluid is gurgling, not crackles."}, {"t": "In the larger airways now", "ok": false, "why": "Mucus in larger airways is rhonchi. Crackles are fluid in the alveoli."}]}, {"ch": "albut", "q": "After albuterol, heart rate goes up. What does this recap want you to call that?", "opts": [{"t": "Expected beta-1 signs", "ok": true, "why": "Albuterol is a beta-2 agonist that also hits beta-1, so heart rate, palpitations, and shakiness go up. That is not shock."}, {"t": "New cardiogenic shock", "ok": false, "why": "Do not over-call shock when the pulse rises after albuterol."}, {"t": "Toxic albuterol dosing", "ok": false, "why": "Jitter and a faster pulse are expected side effects, not a toxic-dose name."}, {"t": "New hypovolemic shock", "ok": false, "why": "A faster pulse after albuterol is a drug effect, not hypovolemic shock."}]}, {"ch": "spont", "q": "Who is the classic spontaneous pneumothorax patient in this recap?", "opts": [{"t": "Tall thin male, a smoker", "ok": true, "why": "Air leak without trauma. Often a tall, thin male smoker, sometimes after a hard cough. Sudden sharp pleuritic pain."}, {"t": "Short heavy older adult", "ok": false, "why": "The recap’s classic is tall, thin, male, and a smoker."}, {"t": "Young child after trauma", "ok": false, "why": "This recap’s spontaneous pneumothorax is without trauma."}, {"t": "Pink puffer, barrel chest", "ok": false, "why": "Barrel chest and pursed lips are emphysema in this recap, not the spontaneous pneumothorax classic."}]}];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"cpapbp": "CPAP", "cpaphow": "CPAP fluid", "pnd": "PND", "copdo2": "COPD oxygen", "ana": "Anaphylaxis", "stinger": "Stinger", "pe": "PE", "co": "Carbon monoxide", "bag": "Hyperventilation", "crack": "Crackles", "albut": "Albuterol", "spont": "Pneumothorax"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sat 3:55 Respiratory Emergencies Overview recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · respiratory emergencies recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
</body>
</html>
