<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Sun 9:41 Cardiovascular Emergencies and Devices</title>
<style>
:root {
  --bg: #f4efe6;
  --paper: #fffdf8;
  --ink: #1c2430;
  --muted: #5a6573;
  --navy: #1e3a5f;
  --navy-2: #16304d;
  --red: #b42318;
  --red-soft: #fde8e6;
  --green: #1b7a46;
  --green-soft: #e5f6ec;
  --line: #d8d0c4;
  --chosen-wrong: #f8d7d4;
  --chosen-right: #c8edd4;
  --correct-outline: #1b7a46;
  --shadow: 0 2px 10px rgba(28,36,48,.08);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; overflow-x: hidden; }
body { min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b)); }
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(10px + var(--safe-t)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
header .sub { margin: 2px 0 0; font-size: .78rem; opacity: .85; font-weight: 400; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem;
  background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px;
}
.prog-wrap { flex: 1; min-width: 120px; }
.prog-label { font-size: .75rem; opacity: .85; margin-bottom: 4px; }
.prog { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.prog > span { display: block; height: 100%; width: 0; background: #f0c14b; border-radius: 99px; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.ch-tag {
  display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: #e8eef6; color: var(--navy); padding: 4px 8px; border-radius: 6px; margin-bottom: 10px;
}
.qtext { font-size: 1.12rem; font-weight: 650; margin: 0 0 14px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: block; width: 100%; text-align: left;
  min-height: 48px; padding: 12px 14px;
  font-size: 1rem; line-height: 1.35;
  border: 2px solid var(--line); border-radius: 12px;
  background: #fff; color: var(--ink);
  cursor: pointer; appearance: none;
  font-family: inherit;
}
.opt:active { transform: scale(.995); }
.opt .letter {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: #eef2f6; font-weight: 700; font-size: .85rem; margin-right: 8px; flex-shrink: 0;
}
.opt .ot { display: inline; }
.opt.locked { cursor: default; }
.opt.chosen.wrong { background: var(--chosen-wrong); border-color: var(--red); }
.opt.chosen.right, .opt.show-correct { background: var(--chosen-right); border-color: var(--correct-outline); }
.opt.dim { opacity: .55; }
.why {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  background: #f6f1e6; border-left: 4px solid var(--navy); font-size: .95rem;
}
.why.visible { display: block; }
.why .verdict { font-weight: 800; margin-bottom: 6px; }
.why .verdict.ok { color: var(--green); }
.why .verdict.bad { color: var(--red); }
.why .correct-line { margin-top: 8px; font-weight: 650; }
footer.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-b));
}
.btn {
  display: none; width: 100%; max-width: 720px; margin: 0 auto;
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--navy); color: #fff; font-size: 1.05rem; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.btn.visible { display: block; }
.btn:active { background: var(--navy-2); }
.end h2 { margin: 0 0 8px; font-size: 1.4rem; }
.end .big { font-size: 2.2rem; font-weight: 800; color: var(--navy); margin: 8px 0; }
.end .pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; }
.miss { margin-top: 18px; }
.miss h3 { margin: 0 0 10px; font-size: 1.05rem; }
.miss-item { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.miss-item .mq { font-weight: 650; margin-bottom: 6px; }
.miss-item .mwhy { font-size: .92rem; color: #333; }
.restart { margin-top: 8px; }
#start-note { font-size: .86rem; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Sun 9:41 Cardiovascular Emergencies and Devices</h1>
  <div class="sub">Recap only · you/your · 12 questions</div>
  <div class="bar">
    <div class="score" id="score">0 / 0</div>
    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Question 1</div>
      <div class="prog"><span id="progBar"></span></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer class="act"><button type="button" class="btn" id="nextBtn">Next</button></footer>
<script>
const BANK = [{"ch": "htn", "q": "Hypertensive emergency in this recap. Systolic is typically above what, with end-organ signs?", "opts": [{"t": "180 mmHg with signs", "ok": true, "why": "Hypertensive emergency is typically a systolic over 180 with end-organ signs (headache, bounding pulse, ringing ears, nosebleed, nausea, dizziness, altered)."}, {"t": "120 mmHg with signs", "ok": false, "why": "90 to 120 is a normal systolic in this recap, not the emergency cut."}, {"t": "90 mmHg with signs", "ok": false, "why": "90 is the low end of normal systolic here, not the hypertensive-emergency number."}, {"t": "130 mmHg with signs", "ok": false, "why": "Some texts call 130 the top of normal. Emergency here is over 180 with signs."}]}, {"ch": "nitrohtn", "q": "High blood pressure only. Nitroglycerin in this recap?", "opts": [{"t": "Do not give it just for BP", "ok": true, "why": "Do not give nitroglycerin solely to treat hypertension. It drops, then rebounds, and the rebound is when rupture risk is highest."}, {"t": "Give it for a nosebleed too", "ok": false, "why": "A nosebleed is an end-organ sign of high pressure. It is not a reason to give nitro for the pressure."}, {"t": "Give extra after rebound", "ok": false, "why": "Rebound is the danger. Do not chase it with more nitro for pressure alone."}, {"t": "Hold it only if they hurt", "ok": false, "why": "Chest-pain nitro is a different protocol question. Pressure-only is a no."}]}, {"ch": "dissect", "q": "Classic aortic dissection pain in this recap?", "opts": [{"t": "Sudden tearing to the back", "ok": true, "why": "Sudden, 10 out of 10 from the start, tearing chest pain radiating to the back between the shoulder blades."}, {"t": "Crushing pain that builds", "ok": false, "why": "Crushing, squeezing pressure that builds is the MI wording in this recap, not dissection."}, {"t": "Slow mild ache in the chest", "ok": false, "why": "Dissection is maximal at onset, not a slow mild ache."}, {"t": "Sudden tearing down the arm", "ok": false, "why": "Classic radiation in this recap is to the back between the shoulder blades, not down the arm."}]}, {"ch": "icd", "q": "An implanted defibrillator fires. Can you touch them in this recap?", "opts": [{"t": "Yes, internal jolt is safe", "ok": true, "why": "ICD electricity is low and internal. You may feel a tiny jolt at most. Safe to touch when it fires."}, {"t": "No, clear them like an AED", "ok": false, "why": "Clearing is for an AED or a vest. An ICD shock is internal and low."}, {"t": "Hands off like the vest", "ok": false, "why": "Hands off is the vest and AED rule. An ICD shock is safe to touch."}, {"t": "Only if they still have pulse", "ok": false, "why": "Touch is safe either way. Arrest still gets standard CPR and AED."}]}, {"ch": "vest", "q": "External defibrillator vest is counting down. What does this recap want?", "opts": [{"t": "Hands off while it shocks", "ok": true, "why": "The vest warns out loud, then delivers a high-energy external shock. Do not touch while it is shocking, like an AED."}, {"t": "Hold them through the shock", "ok": false, "why": "Holding through the shock is not the vest rule. Hands off like an AED."}, {"t": "Touch them like an ICD", "ok": false, "why": "ICD touch is safe because that shock is internal. The vest is an external shock. Hands off."}, {"t": "Ignore the voice prompts", "ok": false, "why": "The vest talks. Follow the voice. Then standard resuscitation as needed."}]}, {"ch": "vadpulse", "q": "VAD patient, no pulse, talking. What does this recap say?", "opts": [{"t": "Talking means they perfuse", "ok": true, "why": "Many VADs are continuous flow, so there is no palpable pulse. If they are conscious and talking, they are perfusing."}, {"t": "No pulse means start CPR", "ok": false, "why": "Do not start CPR just because there is no pulse. Talking means they are perfusing."}, {"t": "No pulse means they are dead", "ok": false, "why": "No pulse is expected on many continuous-flow VADs. Talking is the perfusion check."}, {"t": "No pulse means the VAD failed", "ok": false, "why": "A missing pulse on a talking VAD patient is expected with continuous flow, not proof the pump failed."}]}, {"ch": "vadcall", "q": "Unconscious VAD patient. Who does this recap want you to call?", "opts": [{"t": "Team number on controller", "ok": true, "why": "Find and call the phone number on the controller. The VAD team talks you through CPR, troubleshooting, and destination."}, {"t": "Only the closest hospital", "ok": false, "why": "The extra step is the VAD team number on the controller, not a guess at the closest hospital."}, {"t": "Only online medical control", "ok": false, "why": "This recap wants the number on the controller so the VAD team can talk you through it."}, {"t": "Nobody until family calls", "ok": false, "why": "Do not wait on family. Call the number on the controller."}]}, {"ch": "noshock", "q": "AED says no shock advised. What does this recap want next?", "opts": [{"t": "Check pulse after no shock", "ok": true, "why": "No shock advised only means it is not VF or pulseless VT. Check a pulse. No pulse: keep CPR. Pulse: ROSC."}, {"t": "Resume CPR, skip the pulse", "ok": false, "why": "You still check a pulse after no-shock-advised. Then CPR or ROSC."}, {"t": "Call it asystole for sure", "ok": false, "why": "No shock only means not VF or pulseless VT. It can be asystole or PEA. Check a pulse."}, {"t": "They have ROSC for sure", "ok": false, "why": "No shock is not proof of a pulse. You still check."}]}, {"ch": "kids", "q": "Pediatric arrest in this recap. What is the usual path?", "opts": [{"t": "Hypoxia, then a slow heart", "ok": true, "why": "Kids usually do not arrest from primary VF. Respiratory failure, hypoxia, bradycardia, then PEA or asystole. Still use the AED. Expect no shock more often."}, {"t": "Primary VF like most adults", "ok": false, "why": "Primary VF is the adult pattern. Kids usually start with a breathing problem."}, {"t": "PEA first, then hypoxia", "ok": false, "why": "PEA is later in the kid path, after hypoxia and a slow heart, not first."}, {"t": "Asystole first, then hypoxia", "ok": false, "why": "Asystole is later in the kid path. The usual start is respiratory failure and hypoxia."}]}, {"ch": "hair", "q": "AED says check pads on a hairy chest. What does this recap want?", "opts": [{"t": "Shave or rip the first pads", "ok": true, "why": "Shave with the included razor, or stick one pad set on and rip it off to wax hair, then apply a second set."}, {"t": "Skip the AED for the hair", "ok": false, "why": "Do not skip the AED. Get the pads to stick."}, {"t": "Just press the pads harder", "ok": false, "why": "The AED may say push firmly. The fix in this recap is still shave or wax, then a second set."}, {"t": "Wait until they shave later", "ok": false, "why": "Fix the pads now. The AED will keep saying check pads until they stick."}]}, {"ch": "stopamb", "q": "AED shock during transport in this recap?", "opts": [{"t": "Stop the vehicle to shock", "ok": true, "why": "Stop the vehicle briefly for defibrillation. Movement affects analysis and safety."}, {"t": "Shock while still rolling", "ok": false, "why": "Do not shock while rolling. Stop first."}, {"t": "Never stop for a shock", "ok": false, "why": "This recap wants you to stop for the shock."}, {"t": "Wait for the hospital shock", "ok": false, "why": "Do not wait until the hospital. Stop briefly and shock now."}]}, {"ch": "pacer", "q": "Pacemaker fails in this recap. What can you do in the field?", "opts": [{"t": "Treat the slow rhythm", "ok": true, "why": "The heart reverts to the old slow rhythm. Treat bradycardia and shock. Rapid transport. You cannot fix the pacemaker."}, {"t": "Fix the pacemaker now", "ok": false, "why": "You cannot fix the pacemaker in the field."}, {"t": "Wait it out on scene now", "ok": false, "why": "Do not wait. Treat the slow rate and shock, then rapid transport."}, {"t": "Put pads over the lump", "ok": false, "why": "Treat the slow-perfusion problem. Pads go on, not directly over the device."}]}];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const CH_NAME = {"htn": "Hypertensive emergency", "nitrohtn": "Nitro and pressure", "dissect": "Aortic dissection", "icd": "ICD", "vest": "Defib vest", "vadpulse": "VAD pulse", "vadcall": "VAD team", "noshock": "No shock advised", "kids": "Pediatric arrest", "hair": "Hairy chest", "stopamb": "Ambulance", "pacer": "Pacemaker"};
let queue=[], i=0, correct=0, answered=0, locked=false, missed=[];
function $(id){return document.getElementById(id);}
function start(){
  queue = shuffle(BANK).map(function(q){return {ch:q.ch,q:q.q,opts:shuffle(q.opts)};});
  i=0; correct=0; answered=0; locked=false; missed=[];
  $("nextBtn").textContent="Next";
  render();
}
function updateScore(){
  $("score").textContent = correct+" / "+answered;
  const n=queue.length;
  $("progLabel").textContent = (i<n)?("Question "+(i+1)+" of "+n):("Done · "+n+" questions");
  $("progBar").style.width = (n?Math.round(((i+(locked?1:0))/n)*100):0)+"%";
}
function render(){
  locked=false; $("nextBtn").classList.remove("visible");
  if(i>=queue.length) return endScreen();
  const q=queue[i], letters=["A","B","C","D"];
  let optsHtml="";
  q.opts.forEach(function(o,idx){
    optsHtml += '<button type="button" class="opt" data-idx="'+idx+'"><span class="letter">'+letters[idx]+'</span><span class="ot"></span></button>';
  });
  $("main").innerHTML='<div class="card"><div class="ch-tag">'+(CH_NAME[q.ch]||q.ch)+'</div><p class="qtext"></p><div class="opts">'+optsHtml+'</div><div class="why" id="whyBox"></div></div><p id="start-note">Facts from the Sun 9:41 Cardiovascular Emergencies and Devices recap only.</p>';
  $("main").querySelector(".qtext").textContent=q.q;
  $("main").querySelectorAll(".opt").forEach(function(btn,idx){
    btn.querySelector(".ot").textContent=q.opts[idx].t;
    btn.addEventListener("click", function(){ pick(idx); });
  });
  updateScore(); window.scrollTo(0,0);
}
function pick(idx){
  if(locked) return; locked=true;
  const q=queue[i], chosen=q.opts[idx], correctOpt=q.opts.find(function(o){return o.ok;});
  answered+=1;
  if(chosen.ok) correct+=1;
  else missed.push({ch:q.ch,q:q.q,chosen:chosen.t,why:chosen.why,right:correctOpt.t});
  $("main").querySelectorAll(".opt").forEach(function(btn,j){
    btn.classList.add("locked"); btn.disabled=true;
    const o=q.opts[j];
    if(j===idx && o.ok) btn.classList.add("chosen","right");
    else if(j===idx && !o.ok) btn.classList.add("chosen","wrong");
    else if(o.ok) btn.classList.add("show-correct");
    else btn.classList.add("dim");
  });
  const box=$("whyBox");
  box.innerHTML=(chosen.ok?'<div class="verdict ok">Correct</div>':'<div class="verdict bad">Incorrect</div>')+'<div class="why-body"></div>'+(chosen.ok?"":'<div class="correct-line">Correct answer: '+escapeHtml(correctOpt.t)+'</div>');
  box.querySelector(".why-body").textContent=chosen.why;
  box.classList.add("visible");
  $("nextBtn").textContent=(i+1>=queue.length)?"See results":"Next";
  $("nextBtn").classList.add("visible");
  updateScore();
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function endScreen(){
  locked=true; $("nextBtn").classList.remove("visible");
  const n=queue.length, pct=n?Math.round((correct/n)*100):0;
  let missHtml = missed.length? '<div class="miss"><h3>Missed questions ('+missed.length+')</h3>' : '<p>No missed questions. Nice work.</p>';
  missed.forEach(function(){ missHtml += '<div class="miss-item"><div class="ch-tag"></div><div class="mq"></div><div class="mwhy"></div></div>'; });
  if(missed.length) missHtml += '</div>';
  $("main").innerHTML='<div class="card end"><h2>Quiz complete</h2><div class="big">'+correct+' / '+n+'</div><div class="pct">'+pct+'% · cardio devices recap</div>'+missHtml+'<button type="button" class="btn visible restart" id="again">Shuffle &amp; retry</button></div>';
  if(missed.length){
    const items=$("main").querySelectorAll(".miss-item");
    missed.forEach(function(m,idx){
      items[idx].querySelector(".ch-tag").textContent=CH_NAME[m.ch]||m.ch;
      items[idx].querySelector(".mq").textContent=m.q;
      items[idx].querySelector(".mwhy").textContent="You chose: "+m.chosen+" — "+m.why+"  Correct: "+m.right;
    });
  }
  $("again").addEventListener("click", start);
  updateScore(); window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ if(!locked) return; i+=1; render(); });
start();
</script>
</body>
</html>
